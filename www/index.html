{n:85,t:"Utlwang tlhe potso ya Matlhale",c:"Difela tsa Ponatshego",v:["Utlwang tlhe potso ya Matlhale / e reng: O kae yo o tsetsweng? / Matlhale a a botsang jalo / a kae kajeno lefatsheng? / Botlhale jo bo batlegang / ke jwa Matlhale a tsileng.","Ga nkitla ke ikhutsa, go ya / ke mmone tota tumelong, / a bua le nna ka Lefoko / a impha mo Sakramenteng. / Ke gona fa ke tlhoafalang, / go batla Jesu yo o nthatang.","Lefatshe, sala ka lethabo / la gago le le nyelelang! / Matlhale a ne a le nyatsa, / a batla yo o le gaisang. / Ke gona le nna ke ratang, / go bona Jesu yo o nthatang.","Barena, lo mo roromele / ba lo sa mo ikobeleng! / Tshabang bokgopo jwa Herote, / lo batle thuso mo Jesung, / a lo nonotshe mo pusong, / lo nne lesego merafeng.","Rona phuthego ba re fano, / re baka wena lethabong, / Morena Jesu, o gaisa / tse dintle tsotlhe lefatsheng. / Ke se re se lemogileng. / Ka moo re ba ba go tlotlang."]},
{n:86,t:"Lona bana ba Modimo",c:"Difela tsa Ponatshego",v:["Lona bana ba Modimo, / tlaang, mme lo itumeleng! / Lo ne lo le balatlhegi, / mme lo bana Modimong / mo go Jesu yo o tsileng; / o bakeng, o lebogeng! / Itumeleleng Morena / lo le bana ba bogosi.","Dilo tsotlhe oa di busa, / lefatsheng le 'godimong, / mme o sireletsa tsotlhe / tse di bopilweng 'fatsheng. / 'Foko le a le buang / le tsenella mo pelong; / le ka tshosa jaaka tladi, / le gomotsa jaaka pula.","Baleofi ba lefatshe, / kana lo lebile kae? / A lo rata go nna bana / ba Modimo 'godimong? / Gona tlaang lo fetogeng, / lo boele Modimong! / Ona o tla lo nonotsha, / go ya go nna le botshelo.","Thuso ya baheiten botlhe, / Jesu yo o re thabisang / o fitlhile kwa go rona, / ene yo o re bolokang. / Ene yo o ikanyegang / ga se yo o fetogang. / Lo mmakeng, o lo tlamela / gompieno le kwa pele."]},
{n:87,t:"Re fa pele ga gago",c:"Difela tsa Ponatshego",v:["Re fa pele ga gago / Morena o bonatla. / Re kopa 'sego la 'go / ka merapelo e. / Re utlwa kgoeletso / ya ba o latlhegileng. / Re a ba rapelela / ba bonebophelo.","Merafe ke e mentsi / e thuma mo 'fifing / e tsamaya ka tsela / e e yang mo losong. / E utlwele botlhoko / e fe 'Foko la go / tlosa 'fifi go yona / ka 'sedi la gago.","Roma baruti ba 'go / ba ba nang le thata / ba bolelele batho / molaetsa wa 'go. / A puso ya 'go e tle / mo lefatsheng lotlhe. / Atisa batho ba 'go / mo merafeng yotlhe.","Gorosa nako eno / e e botlhokwa thata, / fa batho botlhe ba 'go / ba tla utlwa lentswe, / ba tla itse Morena; / ke Mmopi wa bona. / Ba rate Jesu Kriste / Mogolodi wa bo."]},
{n:88,t:"Kriste, Kwana ya Modimo",c:"Difela tsa Dipogiso tsa Morena",v:["Kriste, Kwana ya Modimo, / yo o ntshang lefatshe dibeng, / re tlhomogele pelo.","Kriste, Kwana ya Modimo, / yo o ntshang lefatshe dibeng, / re tlhomogele pelo.","Kriste, Kwana ya Modimo, / yo o ntshang lefatshe dibeng, / o re fe kagiso. / Amen."]},
{n:89,t:"Ao, Kwana ya Modimo",c:"Difela tsa Dipogiso tsa Morena",v:["Ao, Kwana ya Modimo, / yo o se nang molato; / o itshokile gotlhe, / mme o tlhabetswe batho. / O rwele dibe tsotlhe, / re tle re phele rotlhe. / O re tlhomogele pelo!","Ao, Kwana ya Modimo, / yo o se nang molato; / o itshokile gotlhe, / mme o tlhabetswe batho. / O rwele dibe tsotlhe, / re tle re phele rotlhe. / O re tlhomogele pelo!","Ao, Kwana ya Modimo, / yo o se nang molato; / o itshokile gotlhe, / mme o tlhabetswe batho. / O rwele dibe tsotlhe, / re tle re phele rotlhe. / O re fe kagiso, ao Jesu."]},
{n:90,t:"Pogo ya ga Jesu, Mong",c:"Difela tsa Dipogiso tsa Morena",v:["Pogo ya ga Jesu, Mong, / le loso lwa gagwe / di tlositse mo mothong / dibe tsotlhe tsa 'gwe. / Batho, tswang mo maleong, / nnang tlhe badumedi! / Ka lo dule mo bontshong, / lo nne ba lesedi.","Jesu gona kwa tshimong / o ne a rapela, / a nna mo khutsafalong, / a ba a tlalelwa. / A kuela kwa Rareng / go ya go fitlhella / mofufutso mo phatleng / wa nna jaaka madi.","A ba a tla barutweng / a re: Disang le nna! / Lo se nneng ba ba fenngwang, / nama e bokoa. / Mme fa lo le thapelong, / Satan oa palelwa; / mme fa lo le borokong, / lo tla raelega.","Ya re a le thapelong, / moengele a tla, / go mo tiisa tlhabanong, / go mo lapolosa. / Le nna ke yo o kopang: / Roma moengele, / gore e nne yo o ntiisang, / fa ke tloga ke swa.","Jesu, ka a le tlalelong, / a tswa mofufutso. / Ke yo o kgonang jaanong / go mpha boikhutso. / Botlhe ba ba selelong / a ba gomotsege: / go lefile Modimong / Kwana ya Modimo.","Jesu Kriste yo o suleng / jaanong o a tshela! / Go ya kwa bosakhutleng / loso lo fedile. / Fa ke swela lefatsheng, / ke ya koo go wena, / ka o le yo o ntshwetseng, / Jesu Krist', Morena."]},
{n:91,t:"Ke mang yo o tlhatlogelang",c:"Difela tsa Dipogiso tsa Morena",v:["Ke mang yo o tlhatlogelang / thabeng, e le yo o imelwang, / yo batho ba mmogisitseng, / yo Rara o mo tlogetseng?","Ke Kwana e e romilweng, / ke tsala ya ba ba dibeng, / ke Kgosi e e agisang, / ke Jesu yo o re pholosang.","Tapiso yotlhe bosigong / le madi a o duleng tlhogong / le sefapaano magetleng, / di mo digetse mo tseleng.","O n' a itewa thata jang / ka 'thupa 'dintsi mo mmeleng, / a b' a gogelwa polaong / go tlhajwa mo sefapaanong.","O jaaka kwana mo tlhabong, / o kokotetswe s'fapaanong / ka 'mapo tse di mo phuntseng / dinao le diatla teng.","O ne a boga mo moweng / ka ba ba mo itatotseng, / go se na yo o mo dumelang, / mme puo e le e e sotlang.","Bogale jo bo tshwanetseng / ba botlhe ba ba mo dibeng, / ke jo bo mo tsentseng petsong, / mo pogisong le tlalelong.","Molao o o sekisang / le tsotlhe tse di bolayang, / ka a di lwantsha s'fapaanong, / tsa mo digela mo losong.","Letsatsi la nna phifalong, / lefatshe la nna thoromong; / gobane yo o di tlhodileng / a swetse teng mo legonyeng.","Ao, Kwana e e bogileng, / o tsala ya ba ba dibeng, / o Kgosi e e agisang, / o Jesu yo o re gololang."]},
{n:92,t:"Tsoga, mowa, mo metlheng",c:"Difela tsa Dipogiso tsa Morena",v:["Tsoga, mowa, mo metlheng / eno, o gopole Jesu, / yo o go ineeletseng / mo losong, a go golola. / Bona 'rato lwa Morena, / mo itumelele thata!","Bona mo sefapaanong / Jesu Krist', Morwa Modimo, / o rwesitswe mo tlhogong / ka serwalo sa mebitlwa. / Ba mmeditse ka lotlhaka, / mme jaanong ba mo rogaka.","Tse o di re bogetseng / di tshwanetse wena motho, / go nna yo o bediwang / le go latlhwa ke Modimo. / Mme Morena o go swetse, / e le go go itshwarela.","Ka botlhoko s'fapaanong / re ruantswe le Modimo; / a ineela molaong, / go re naya legodimo. / Loso, Satan le boleo, / o di fentse gotlhe gotlhe.","Mowa wa me, o a reng / ka lorato lwa ga Jesu, / ka tse a di bogileng / le ka tsona dikweneso? / Ee, ke tla di lebogela / le go mmaka ka difela.","Jesu yo o go ratileng / mo pelong ka go go swela; / ene yo o go golotseng, / ao, a o ka mo duela? / Nyaya, ke a mo ineela, / ke tla nna ke mo direla!","Ee, se ke se dirileng, / jaanong ke tla se tlogela; / yo ke mo itatotseng, / jaanong ke tla mo latela. / Ke tla rata Jesu jaana: / Nna le dibe re ilana.","Jesu, se o se ratang, / sona le nna kea se rata; / fa o le yo o mpetsang, / ke ineela go rutega. / Mowa wa 'go o ntiisitse, / ke le ngwana, moja-boswa."]},
{n:93,t:"Motho, tla kwa Golgoteng",c:"Difela tsa Dipogiso tsa Morena",v:["Motho, tla kwa Golgoteng, / kwa go bapotsweng Morena. / Tlhotlhomisa se o kgonang / go ikwatlhaisa pelo. / Fa o sa re sepe teng, / foo o kgopo mo moweng.","Leba Jesu s'fapaanong, / ruri o tlhomola pelo! / Madi a tswa mo dinthong, / thata e fedile gotlhe. / Pogo e e kana kang! / Jesu ke yo o suleng.","Jesu, Kwana e se nang / dibe le e seng molato, / o pelotlhomogi jang / ka go swela rona batho / gona mo sefapaanong, / go re golla tatlhegong!","Kwana e e itshekileng, / ke godisa 'rato lwa 'go! / Ntebe, nna yo ke emeng / fa sefapaanong sa gago. / Pelo ke e e llelang / Madi a 'go a o elang.","Ke tla go duela kang / tiro ya 'go ya pholoso? / Ga go se se tshwanetseng, / se se lekanyeng matlhoko. / Tefo e e lebanyeng / ga e teng mo lefatsheng.","Sona se o se batlang, / ruri, Mong, se sengwe fela: / Pelo e e go ratang, / e utlwang, e utlwisisa / go nna ya 'go, Jesu Mong, / bophelong go ya losong.","Satan yo o ntshekisang, / ke tla mmontsha dintho tsa 'go / e le tse di nkgolotseng, / gone Satan o tla tshaba. / Fa ke tshoga letswalong, / ke tshabela phemelong.","A ke fenye bofelong / ditlalelo thateng ya 'go! / Ke nne yo o fitlhelwang / kgomotsong ka dintho tsa 'go. / Yo o iphitlhang mo teng / o tla swela Moreneng."]},
{n:94,t:"Ao, Jesu Mong, sefapaanong",c:"Difela tsa Dipogiso tsa Morena",v:["Ao, Jesu Mong, / sefapaanong / o re bogiseditswe; / mo tlalelong / le mo losong / o re ntsheditswe dintho.","Mo dipetsong / le tshololong / ya madi o utlwile / botlhoko teng / ka fa mmeleng, / o itshokile ruri.","O rwele teng / mo legetleng / s'fapaano ka boitshoko, / wa koafala mo tseleng, / mme ga oa nyema moko.","Kwa Golgoteng / mo legonyeng / ba go kokoteletse; / yo o siameng / ke yo ba reng: / Go swa go mo tshwanetse.","Mo tlalelong / sefapaanong / lenyora la go tshwara, / mme bofelong, / e bong losong, / o neetse Rara mowa.","Ao, Jesu Mong, / mo phuthegong / re go leboga thata; / mo dipelong / le maikutlong / re tla nna re go rata."]},
{n:95,t:"Morena Jesu, Kgosi ya lorato",c:"Difela tsa Dipogiso tsa Morena",v:["Morena Jesu, Kgosi ya lorato, / o dirileng? A o na le molato? / O sentse eng, fa ba go betsa jalo / ka tse di kalo?","O kgwelwa mathe, ba ntse ba go roga, / e bile ba go nosa bogalaka, / mme ba go rwesa kgare ya mebitlwa, / ba sotla jalo.","Melato ya me e go bolaile, / nna ke mosenyi, wena o siame. / Mme loso le tatlhegong di ntshwanetse, / ee, le kgolego.","Dikotlo tseo di nkgakgamaditse; / ka tsona loso o lo nyeleditse. / Dinku tsa gago di ne di timetse, / mme o di swetse.","Yo o siameng, go sekisiwa ene; / ba ba sentseng ba itshwarelwa fela. / Go swa Mophedi, mme baswi ba tsoga, / ba pholosiwa.","Ke ne ke tletse maswe le maleo, / o ntlhapisitse mo mading a gago. / Petso ya mollo e ne e ntshwanetse, / o e thibetse.","Lorato lwa 'go lo logolo jang ne, / lo o lo supileng ka pelonolo! / Ke ne ke itumella tsa lefatshe, / wena wa boga.","Ga ke na sepe sa go go duela, / ke reteletswe ke go go direla. / Dikhumo tsotlhe ga di go lekana, / di a tlhaela.","O batla pelo ya ka le dithata, / pelo e e sa khutleng go go rata. / Fa nka tlogela dibe, ka di latlha, / go tla go kgatlha.","Morena Jesu, nna ga ke na thata; / tlaa, wena, go nna, ke se go timelle; / o ntshware ka seatla le go mpusa / ka Mowa wa 'go."]},
{n:96,t:"Jesu, o dumele thata",c:"Difela tsa Dipogiso tsa Morena",v:["Jesu, o dumele thata, / wena yo o nthatileng! / Pelo ya me ea go rata, / wena yo o re swetseng. / Mo go ntapolosa jang / go nna fa o re swelang, / fa sefapaanong sa gago, / le go tshwara 'nao tsa 'go.","Mme ke atla ka tebogo / dintho tse o di ntshitsweng, / letlhakore le mabogo / a a mphuthololetsweng; / nao tse, tse di phuntsweng, / tlhogo e e iteilweng; / tsotlhe tsotlhe di a mphedisa. / Kgosi, ke a go tumisa.","Ngaka ya me, o mphodise, / o nkalafe botlhokong. / Tatlhegelo ya me yotlhe / e e tswang mo go Atam', / e ke e itiretseng, / e e tswang mo maleong, / o e tlose, Ngaka ya me, / madi a 'go a ntlhapise.","O nkwalele dikweneso / mo moweng le mo pelong, / ke se di lebale, Jesu, / metlheng yotlhe botshelong; / khumo ya me lefatsheng / e nne wena yo o ntshwetseng. / A ke bone 'rato lwa 'go / tota mo losong lwa gago!","Mme dinao tse tsa gago / ke di tshwere tumelong! / A ko o ntebe, ngwana wa 'go, / yo o fa sefapaanong. / Nkutlwe mo merapelong, / ke akopa, Jesu Mong, / o re: O se ka wa lela, / gonne kea go itshwarela."]},
{n:97,t:"Lefatshe, leba Jesu",c:"Difela tsa Dipogiso tsa Morena",v:["Lefatshe, leba Jesu, / botshelo jo jwa rona / jo bo tsenang losong! / Ke Kgosi ya tlotlego, / e rwala ka nyatsego / petso le kgobo mo bathong.","Lebang ka tlhoafalo, / lo bone Jesu jalo, / yo o ntseng mo dipogong. / Go tswa pelong ya gagwe, / mme go ya kwa go Rraagwe / 'phegelo tse di sa balweng.","Ka o se moikepi, / mme o le Moitshepi, / ba go bolaelang? / O rwele dibe tsotlhe / tsa batho ba 'go botlhe. / Ke sona o se iteelwang.","Ke nna ka dibe tsa me, / di kana ka motlhaba / dintshing fa lewatleng: / Ee, di go tsiseditse / tlalelo, di go ntshitse / dintho tse dintsi mo mmeleng.","Ka nnete, ke tshwanetswe / ke thupa le dipetso / tse di go bolayang. / Dipogo le kgolego / le ona matshwenyego, / ke tsona tse di ntshwanetseng.","Ao, o itapisitse, / wa ba wa ipelesa / maleo magetleng! / Go hutsegile wena, / mme nna ke tshegofala; / ka wena ke mo bophelong.","Morena, Monkemedi, / ke wena Montefedi / wa dibe s'fapaanong. / Ya re ba go bolaya, / mme mitlwa e go tlhaba, / wa boga tsotlhe boitshokong.","Ke na le go leboga / ka metlha le ka metlha / wena yo o ntshwetseng. / Ke tlotle, ke direle / ka 'thata tsotlhe tsa me / wena yo o nthekolotseng.","Mme nna ga ke na sepe, / fa e se yona pelo / e nka e go nayang. / A e nne e go kgatlhe, / Morena, se e gane, / ke pelo e e go ratang.","Tse o neng wa di boga / di tla nna di nkgomotsa, / le fa ke le kwa kae. / Yo o se nang molato, / wa ntshwela ka lorato, / ke sona se nkgakgamatsang.","Ke tla ikokotella / le wena, go tlogela / maleo lefatsheng. / Keletso ya me e swe, / ke bone bontšhafalo, / ke tle mo go tshwanetseng.","'Keledi le selelo, / matlhoko le 'phegelo / tsa gago lefatsheng, / Morena, a di nkise / go wena, di mphitlhise / legodimong mo bosasweng."]},
{n:98,t:"Bonang Kwanyana e e rweleng",c:"Difela tsa Dipogiso tsa Morena",v:["Bonang Kwanyana e e rweleng / dibe tsa bathobotlhe! / E di sikere magetleng, / go re golola rotlhe. / E tsena mo khumanegong, / mo botlhokong le pogisong, / ga e na boitumelo. / E itshoketse lefatsheng / ditshotlo le dipetso teng, / le loso le tlalelo.","Kwanyana yona e tsileng / ke tsala ya me ruri. / Ke Jesu yo o romilweng / ke Rraagwe mono gore / a agisanye lefatsheng / basenyi le Modimo teng. / O mo reile a re: / \"Morwaaka, ya teng kwa bathong, / ba ba losong le thogakong, / o ba bogele petso.\"","\"Ee, Rra, ka pelo yotlhe, ee, / bokete kea bo rwala, / mme tsotlhe tse o di ratang, / ke tla di dirafatsa.\" / Lorato loo lo kana kang, / ee, ke lo lo gakgamatsang, / lo lo fenyang Modimo. / Lo isa ruri thogakong / le mo losong le mo phupung / Morena Jesu Kriste.","Ba mo iteetse legonyeng / ba ntse ba mo keteka, / a tlhajwa mo sefapaanong, / Kwanyana ya Paseka. / Mme madi a tswa mo pelong, / ke ona a a lefetseng / merafe ka botlalo. / Ao, Kwana e e rategang, / nna ke ka go leboga kang, / ka o nthatile jalo?!","Jaanong le ka bosakhutleng / ke tla gopola wena. / Ke wena yo ke go ratang / kajeno le ka gale. / O 'sedi la me mo pelong, / mme fa e ema mo losong, / foo o nne pelo ya me. / Ke go ineela, Jesu Mong, / mo bophelong le mo losong. / Tsaa maikano a me!","Ke tla tumisa mo bathong / lorato lwa 'go lotlhe: / Motshegareng le bosigong / ke tla nna ke go baka / ka ntlha ya tse o di ntiretseng / ka 'rato lo lo sa feleng / le ka boitshwarelo. / Mo mafokong le mo tirong / ke tla phelela wena, Mong, / ka thata ya tumelo.","Bulega, pelo ka mo teng, / o tshole tshegofatso; / o be o tsee mo Moreneng / kabelo ya ntšhafatso. / Ke khumo e e gaisang / tse motho a ka di bonang / 'fatsheng le kwa godimo! / Ke madi a tshologileng / dinthong tse dintsi mo mmeleng / wa Kwana ya Modimo.","Ke ikanya ona mo moweng, / ke a a mphang kagiso. / Ke thebe ya me mo dintweng, / thabiso, fa ke lela. / Ke 'fela sa me lethabong, / a tla nna Mmana mo 'ganong, / fa thata e fedile. / Ke one dijo tshepelong; / ka ona ke tla nna phenyong, / fa pelo e raelwa.","Mme loso lo ka ntira eng, / le fa lo le botlhoko? / Ka madi a a tsholotsweng / ke tla nna le phologo; / gobane foo mo boketeng / o tla nketella pele teng / go mpaakanyetsa tsela. / Le fa ke tsena ditekong, / ke itshwarella tumelong / ka wena Jesu fela.","Mogang o tla nthebolelang / go tsena legodimo, / ke tla nna yo o phatsimang / ka madi a bodimo; / ke ona a ntlhapisitseng, / e bile ke a ntshwesitseng / serwalo sa bogosi. / Mme ke tla ema fa troneng, / monyalwi yo o kgabileng / wa gago, Kgosi ya me."]},
{n:99,t:"Ao, tlhogo ya Morwadi",c:"Difela tsa Dipogiso tsa Morena",v:["Ao, tlhogo ya Morwadi / wa dibe e ntse jang! / Ka kgare ya mebitlwa / le madi a elang! / Ao, o no o le montle / mo go eletsegang, / jaanong o nyatsegile! / Nna ke go rata jang!","Le fa o le Morena / 'fatsheng le 'godimong, / o ne wa kgwelwa mathe / teng mo sefatlhegong. / Jaanong o setlhafetse / phatleng le mo matlhong, / mme o re dueletse / maleo Modimong.","Morena, o nthwaletse / tse o di rwesitsweng; / matlhoko a ntshwanetse / a a go bolaileng! / Nna ke mohumanegi, / ke wetse maleong; / bogale bo ntshwanetse, / o ntebe loratong.","Mmoloki, a ko o ntshole, / Modisa yo o nkitseng; / motswedi wa bophelo, / o yo o mphedisang; / tse dintsi o di mphile: / Kgomotso Lefokong, / le jona boitumelo / ka Mowa o o nthusang.","Ke eme fa go wena / yo o mpapoletsweng. / Morena, o se nyatse / yo o sa go tlogeleng! / E tla re la bofelo / o tsena mo losong, / ke tshole ka mabogo / wena yo o ntshwetseng.","Ke go leboga thata, / Jesu yo o nthatang; / ke go itumelela, / wena yo o mpogetseng. / A ke go kgomarele / ka gale tumelong; / ke swele mo go wena, / fa ke ya phelelong.","Mme e re fa o ntlosa, / o ntiise tumelong. / O eme mo ntlheng ya ka, / ke nne mo kagisong. / Fa ke tlaletswe thata, / ke tshoga mo pelong, / o ntshware ka seatla, / o nkise bophelong!","Mme o nne thebe ya me, / kgomotso mo losong; / ke lebe wena fela, / o le sefapaanong. / Ke tla go leba jalo, / yo o ikanyegang; / ke tla swa sentle jalo, / ke le mo tumelong."]},
{n:100,t:"Go weditswe! Utlwang Jesu",c:"Difela tsa Dipogiso tsa Morena",v:["Go weditswe! Utlwang Jesu / yo o kuang sefapaanong. / Ke Mofenyi, mme o tletse / go ntsha batho kgolegong. / O ba swetse, o ba swetse, / botlhe ba ba maleong.","Go weditswe! Go utlwala / lentswe leo tlhabanong. / 'Tsatsi le ne la fifala, / 'fatshe la nna thoromong / ka lefoko, ka lefoko / la Mofenyi mo losong.","Go weditswe! Go fedile / mekgwa e e sa thuseng. / Go ntšhafala dilo tsotlhe / ka lefoko le le reng: / Go weditswe, go weditswe / kgolagano Golgoteng!","Go weditswe! Bonang Kwana / e re e bolaetsweng! / Mme ka yona re ruanngwa / le Modimo lefatsheng. / E lefetse, e lefetse / batho ba ba mo dibeng.","Go weditswe! Bonang madi / a a tswang letlhakoreng / la Mofenyi le Morwadi / wa maleo lefatsheng! / A lekanye, a lekanye / dibe ka bosakhutleng.","A basenyi ba dumele, / ba thusege tumelong! / A bakriste ba ipele: / Go weditswe Modimong! / A go tume, a go tume / phenyo e gakgamatsang!","Reetsang lentswe le legolo / le le tswang kwa Golgoteng! / Bonang 'rato lo logolo / lwa Morena yo o fentseng! / A go bakwe, a go bakwe / Jesu ka bosakhutleng!"]},
{n:101,t:"Didimala, legodimo!",c:"Difela tsa Dipogiso tsa Morena",v:["Didimala, legodimo! / Batho, tlaang iteleleng! / Gonne Kwana ya Modimo / e ineela botlhokong.","Mo lebeng, Mohutsafadi / yo o leng Getsemaneng, / jaaka a fufula madi / ka kampano mo moweng.","Joo! Jutase a mo atla, / go mo eka mo bathong; / a golegwa ka dikgole, / a isiwa tshekisong.","Teng ba mo logela maano, / ene yo o siameng, / ba mo rwesa sefapaano, / ba mo isa kwa thabeng.","Mme mo felong ga dikgata, / foo ba tshwana le manong, / ba mo kokotella thata / ka dimapo s'fapaanong.","Ba mmapola le basenyi / legonyeng le rogilweng; / mme ga kwalwa ga Moitshepi / se o bolaetsweng.","Jesu o n' a rapelela / dira tse di mmapotseng / a re: \"Rra, ba itshwarele, / ka e le ba ba sa itseng.\"","Joo! Lefifi le lenyora / le molete le dikgang! / Tsotlhe di ne tsa mo tlhora, / ya nna tse di mmolayang.","Mme dikgalo tsa oketsa / dintho tse di sa balweng. / Thekololo a e fetsa / ka go boga Golgoteng.","Mme a kua a re: \"Rara, / ke go neela diatleng / mowa wa me go o tshola.\" / Mme a swela s'fapaanong."]},
{n:102,t:"Motswedi wa lorato",c:"Difela tsa Dipogiso tsa Morena",v:["Motswedi wa lorato, / o lateletse batho / ka nosi tatlhegong; / o tsile go ba swela / le go nna setlhabelo, / go ba golola mo losong.","O rata baphuthego, / o ba tlhapisa dibe, / ba ba go ineelang; / o ba itshepisitse / le go ba duelela / ka madi a a tsholotsweng.","Re boka 'pogo tsa 'go, / o re apese tsona, / re nne ba ba kgabileng. / A Mowa o re bontshe / dipogo tsa 'go, Jesu, / re nne bagale tumelong.","Keletso ya boleo / re thuse go e fenya, / rona ba ba golotsweng. / Ka o re itshwaretse, / re nee le yona thata, / go go direla bophelong."]},
{n:103,t:"Jesu, o lorato lwa me",c:"Difela tsa Dipogiso tsa Morena",v:["Jesu, o lorato lwa me, / wena yo o nkgolotseng; / o dirilwe ke lorato / go ineela pogisong; / go nna Kwana ya Paseka / e e isiwang tlhabong, / e e lefelang melato / yotlhe e e teng 'fatsheng.","Jesu o ne a rothisa / mofufutso kwa thabeng; / a tsholola dikeledi, / a tswa madi mo dinthong. / Jesu o ne a belega / petso e re tshwanetseng / ya bogale jwa Modimo, / go se yo ka bo timang.","A itshoka ka lorato, / fa a sotlwa dikgobong; / lo ne lo sa tsidifale / poifong le botlhokong; / lo ne lo ntse lo tiile, / kwa dithata di nyemang; / lo ipontsha lo le thata, / kwa bophelo bo khutlang.","Ke ka dintho di le dintsi / 'rato loo, lo itshupang, / gore ke nne wa ga Jesu / jaanong le bosakhutleng. / A go alafiwe sentle / ke Morena yo ntshwetseng / matshwenyego le matlhoko / a a ntshwenyang botshelong!","Jesu Krist' o ne a ntshwela, / a mpatlela s'fapaanong / khumo e e leng botshelo, / jona jo bo sa feleng. / Mme jaanong ke lebogela / madi a a tswang dinthong. / Fa ke boga, ke tshabela / kwa go ona boikhutsong.","Jesu o ne a mpogela, / a lokelwa lebitleng, / gore ke se tshabe phupu, / ka ke tla nna yo tsogang. / Jesu, ke a go leboga, / ka o ntshwetse s'fapaanong, / gore o tle o mphedise. / A ko o ntshole loratong!"]},
{n:104,t:"Jesu, o bophelo jwa me, o nkgolotse mo losong",c:"Difela tsa Dipogiso tsa Morena",v:["Jesu, o bophelo jwa me, / o nkgolotse mo losong; / o ineetse ka ntlha ya me / mo pogong e e tshabegang, / mo losong lo lo botlhoko, / gore ke tswe mo go lone. / Ke gantsintsi ke buang: / Ao, ke go leboga jang!","Wena o n' o itshokela / kgalo, tshotlo di tlhabang, / le dikgole le dipetso, / o ne o se molatong, / e le gore o nkgolole / dikgoleng tsa Satan, mmaba. / Ke gantsintsi ke buang: / Ao, ke go leboga jang!","O ineetse go sotlega, / go itewa mo mmeleng; / go alafa dintho tsa me / le go nkisa boikhutsong. / Wena o bogile khutso, / gore nna ke tshegofale. / Ke gantsintsi ke buang: / Ao, ke go leboga jang!","Ba ne ba go kgoba thata, / wa nyatsega mo bathong; / ba ne ba go rwesa mitlwa. / O ne o ineelelang? / E le gore o nkgabise / ka serwalo sa botshelo. / Ke gantsintsi ke buang: / Ao, ke go leboga jang!","O ineetse go bediwa, / gore ke tswe mo petsong; / wena wa patelediwa, / nna ka nna katlholelong. / O ne o se na kgomotso, / gore nna ke gomodiwe. / Ke gantsintsi ke buang: / Ao, ke go leboga jang!","O bogile ka boitshoko, / wa itsenya tlalelong; / wa lefela ka botlhoko / dibe tsa me mo losong. / O ineetse go golegwa, / gore nna ke gololege. / Ke gantsintsi ke buang: / Ao, ke go leboga jang!","O mpogetse ka bonolo / ke le yo o ikgodisang. / Loso lwa 'go lo tlositse / 'tlhabi tse di mo losong. / Ditshotlego tsa 'go tsotlhe / di ntsisetsa tlotlo yotlhe. / Ke gantsintsi ke buang: / Ao, ke go leboga jang!","Jesu, 'pogo tsotlhe tsa 'go / le botlhoko mo losong, / ke go lebogela tsotlhe / jaanong le bosakhutleng: / Mono ke tla go phelela, / mo losong ke tla go swela. / Jesu yo o rategang, / ao, ke go leboga jang!"]},
{n:105,t:"Ke tsalana le Morena",c:"Difela tsa Dipogiso tsa Morena",v:["Ke tsalana le Morena, / Jesu yo sefapaanong; / gonne ke ineetse ena, / ga ke tsene kopanong / ya lefatshe le le kgang / le ya Satan yo nkekang. / Ke tsalana le Morena, / ke dumetse mo go ena.","Ke tsalana le Morena, / moikepi, o a reng? / Jesu wa me o n' a tsena / mo losong lo tshabegang. / A ineela pogisong, / gore ke nne kagisong. / Ke tsalana le Morena, / ke dumetse mo go ena.","Ke tsalana le Morena, / go ka boitshega jang, / fa ka dibe ke ka tena / Jesu wa me yo nthatang! / Foo ke yo o mmapolang, / ke le yo ikatlholang. / Ke tsalana le Morena, / ke dumetse mo go ena.","Ke tsalana le Morena; / dibe, lo ntebela eng? / Jesu o itshwarela ena / yo mmitsang, yo tlaletsweng. / Mang yo ka ntatofatsang? / Kriste ke yo ntshiamisang. / Ke tsalana le Morena, / ke dumetse mo go ena.","Ke tsalana le Morena, / ga go se se ka ntlosang / mo go Jesu, fa ke tsena / mo go tse di bogisang. / Le fa ke le poifong, / le fa ke le mo tlaleng, / ke tsalana le Morena, / ke dumetse mo go ena.","Ke tsalana le Morena, / loso ke lo boifelang? / Jesu ke tla nna le ena, / fa ke fella leroleng. / Gona kwa legodimong / ke tla mmona phatsimong. / Ke tsalana le Morena, / ke dumetse mo go ena."]},
{n:106,t:"Jesu, o kgomotso ya me",c:"Difela tsa Dipogiso tsa Morena",v:["Jesu, o kgomotso ya me / yo o leng / dipogong / ka lebaka la me. / Mme ga nka ke ka tlhoboga / yo ke leng / molatong, / ka o o nthwaletse.","Madi a 'go a n' a ela / mo dinthong / s'fapaanong, / a a nang le thata / ya go re fa boitshwarelo, / ka jaanong / wena Mong / o le botshabelo.","Madi a, a re gogela / 'godimong / kagisong, / go tshelela wena. / Mme lefatshe kea le ila, / ke ya teng, / kwa go leng / wena le botshelo.","Madi a 'go aa nthabisa, / mme jaanong / kagisong / ke ikhutsa sentle. / Ke tshabela dinthong tsa 'go; / gonne teng / mo mading / go na le kalafo.","Ke bobola ka maleo / a ntshwenyang / letswalong, / ga ke phele sentle. / Ke tshabela kwa go wena, / yo ke leng / bokoeng. / Wena a ko o nkgoge!","Baba o ba rapeletse / mo Rareng, / Golgoteng, / nna a o ntebetse? / Nnyaa, o tshotse le mosenyi / yo o neng / a le teng / tlhakoreng la gago.","Bona, ke a itelela / yo ke leng / botlhokong, / ke tla kwa go wena! / Jesu, ke a go rapela, / nkise teng, / kwa go leng / boitumelo fela.","Fa ke tsena la bofelo / tlalelong / le losong, / foo o nkatamele! / Madi a 'go a nnametse / poifong, / ke tswe teng, / ke swe ka kagiso."]},
{n:107,t:"Ao Jesu, madi a a tswang",c:"Difela tsa Dipogiso tsa Morena",v:["Ao Jesu, madi a a tswang / dinthong tsa gago ke a mphang / nonofo ruri mo pelong, / aa ntlhatswa, ke tswe mo dibeng.","Ke madi a a kgabisang, / ke ona a siamisang / bophelo go ya Modimong, / a bula kgoro 'godimong.","Morwa Modimo, Jesu Krist', / ke wena yo o nkgolotseng; / ke bona thata botshelong / ka madi a 'go a a ntiisang.","Ao Jesu, mo ditlalelong, / tsa loso, gona bofelong, / a madi a a ntlhapisang, / a e nne a a nkgomotsang!"]},
{n:108,t:"Mopholosi wa batho",c:"Difela tsa Dipogiso tsa Morena",v:["Mopholosi wa batho, / o bogisetswa eng? / O utlwile botlhoko, / jwa loso gobaneng? / Ke ka molato wa me, / o o boitshegang, / le dibe tsotlhe tsa me, / o sule ka tsotlhe.","Ke golotswe ke wena, / molato o tlogile, / maleo a latlhilwe, / letswalo le dibe. / Ka moo ke go leboga, / ke yo go dumelang. / Mme ke tla fela jalo, / ke le wa 'go jalo.","Le loso ga se sepe, / le botlhoko jwa lo, / bo tlositswe ke wena, / yo neng a re swela. / Go bulegile phatlha, / e e re e beetsweng, / re ka tswa kgatlamping e, / re tsene godimong.","Teng gona kwa godimo, / re tla bonana teng. / Mogolodi le Rara, / yo o tla re nayang / ditsholofetso tsotlhe, / re ise 'di bone. / Teng re tla bona tsotlhe, / teng kwa legodimong.","Le ba Morena botlhe, / re tla kopana teng, / ra tla anegelana / ka pelo ya gagwe. / O re thusitse thata, / o re golotse teng / mo maleong a otlhe / le mo losong tota.","Ao Morena wa rona / yo o re bogetseng, / naya pelotlhomogi, / re tlogele ruri / tse tsotlhe di ilegang / mo matlhong a gago. / Re ngaparele wena / ka mowa le pelo."]},
{n:109,t:"Morena, ke itigela",c:"Difela tsa Dipogiso tsa Morena",v:["Morena, ke itigela / teng fa sefapaanong / sa gago, go rapela / go wena tebogong,","ka o tsholotse madi / a gago mo losong, / go nna Moitshwaredi / ka gale mo bathong.","Ke go bolaisitse / matlhoko tlalelong / a gago a lorato / le loso s'fapaanong.","Ga nkitla ke nyelela / dibeng le molatong! / Kea itse, o nkemela / ka loso s'fapaanong.","E bile o nkalafa / ka madi a tshollwang. / Ke tla thusega tota, / ke tswa mo maleong.","Nkgomotse ka Lefoko / yo ke hutsafetseng, / o bo o nnee botshelo / teng kwa Paradiseng."]},
{n:110,t:"Ao motho, bona jaaka o imelwa",c:"Difela tsa Dipogiso tsa Morena",v:["Ao motho, bona jaaka o imelwa / ke dibe dintsi tse di go senyang! / Ga o na maano a go iphemela, / mme o boifa yo o sekisang. / O se tshabele Sinaing, / ga go na thuso teng, mme tlaa kwa Golgoteng.","O tla fitlhela sefapaano gona / le Kwana ya Modimo mo thabeng, / e go se nang molato mo go yona, / mme ke e e rweleng mo magetleng / maleo a ba tshekisong. / E boitshepo, e ineetse mo petsong.","Tse Atam o neng a di senya pele / le dibe tsotlhe tse di lefatsheng, / Modimo wa di rwesa Kwana ele; / ke yona e e di re lefetseng, / ya di sikara magetleng, / jaaka e kete ke yone e e sentseng.","Ka a ithwesa dibe tse tsa botlhe, / tsa 'sika lwa ga Atam lefatsheng, / molao wa mo tshwara mo 'ntlheng tsotlhe, / mme wa mo hutsa, a le mo dibeng; / a bona petso e e tletseng, / bogale jwa Modimo jwa mo wela teng.","Ka e le ene Kgosi ya bophelo, / a fenya khutso gona legonyeng; / jaanong o dule thata le phemelo / ya bona ba o ba tlhabanetseng. / Re batho ba itshwarelwang, / ga go na ope yo o ka re bolayang.","Ao motho, fa o ka dumela jalo, / o bofolotswe ruri melatong; / mme Moše ga na thata e e kalo, / go go sekisa, o mo tshiamong. / Modimo Rara 'godimong / ga a go latlhe, o go tshola mo Jesung.","Se belaele, motho, mme dumela / mo go Krisete yo go emelang. / Se mo tlogele gope, mme latela / Mogogi wa 'go yo go bolokang. / Yo o go tshegofaditseng, / o mo ineele gotlhe ka bosakhutleng."]},
{n:111,t:"Motswedi o mogolo",c:"Difela tsa Dipogiso tsa Morena",v:["Motswedi o mogolo / ke ona o o nang / le madi a kgololo, / a a re tlhapisang.","Motswedi o ke ona / o o itshepisang / basenyi ba ba gona, / ba ba o ikanyang.","Le sone senokwane, / se le sefapaanong, / sa ikina mo go ona, / sa itsheka mo pelong,","Le nna, ke le mosenyi, / ke itatlhela teng / mading a Mogolodi / a a ntshologetseng.","Ke tla siama jalo, / ke tlhapisitswe teng / mading a Jesu Kriste, / ke ya kwa bophelong."]},
{n:112,t:"A re batleng selo sengwe fela",c:"Difela tsa Dipogiso tsa Morena",v:["A re batleng selo sengwe fela, / e nne mhago mo tseleng; / re tlhogonno, fa se re patile, / le fa re le selelong: / Seo ke go leba Jesu fela, / a khubama, a fufula madi; / a ineela senwelong / sa ga Rraagwe kwa tshimong.","A ka gale ke nne ke mo lebe, / Kwana e didimetseng, / a tswa madi, mme a koafala, / a pegilwe s'fapaanong; / teng a ntlhabanela, a nnyoretswe, / ke nne mongwe wa tuelo ya 'gwe, / yo le nna a nkgopotseng, / fa a re: \"Go weditswe\" teng.","Ee, Morena, a ke se lebale / le melato e e ntshwereng; / ya re 'fifi le ntse le ntaola, / wa nna yo o ntetileng. / Kana o mpatlile ke timetse, / lentswe la 'go ke ise ke le utlwe; / wa ntsha tefo mo losong, / wa nkgolola tatlhegong.","Nna ke wa 'go, bua o re: Amen, / Jesu wa me loratong; / kwala leina la 'go pelong ya me, / ke go tshware tumelong. / Ke tlogele maswe, ke direle / wena Jesu le go go phelela; / re nne mmogo tsamaong / yotlhe go ya kwa losong."]},
{n:113,t:"Re go leboga, Jesu Krist'",c:"Difela tsa Dipogiso tsa Morena",v:["Re go leboga, Jesu Krist', / ka o ineetse mo losong, / go swela ba ba mo dibeng, / go ba golola molatong.","Ke wena yo re tlhapisang, / o yo o re siamisang / ka madi a a tsholotsweng, / go amogelwa Modimong.","Ke wena yo nonofileng / go re golola mo dibeng, / ka o no o tswa Modimong, / mme wa nna motho botsalong.","Ka moo re ba ba rapelang: / o re golole mo losong, / re raya lo lo sa feleng; / ke lone lo lo re tshosang.","Fa la bofelo mo losong / re tshwenyegile letswalong, / o re gomotse mo pelong / le go re tsenya kagisong.","O re femele thaelong / gore re fenye tumelong, / mme fa re le mo dipogong, / foo re nne ba ba itshokang.","Dipogo o di bogileng / ke tsona tse di gomotsang; / ka tsona re ba ba itseng, / fa o se yo re tlogelang.","O tla re thusa mo losong, / re tswele ruri boleong; / re ye go fitlha botshelong, / re nnele ruri tshiamong."]},
{n:114,t:"Kriste wena, Mopholosi",c:"Difela tsa Dipogiso tsa Morena",v:["Kriste wena, Mopholosi / yo o neng a re swela / utlwa sello se sa rona. / Re tlhomogele pelo.","Rea go rata Moratiwa / yo o neng a re rata, / mme re go leboga thata / yo o re pholositseng.","O ne wa swa go duela / gore re tswe mo 'fifing. / O ne wa re namolela / wa re isa godimong."]},
{n:115,t:"Madi le tshiamo tsa Krist'",c:"Difela tsa Dipogiso tsa Morena",v:["Madi le tshiamo tsa Krist' / ke kobo ya me e yona / ke tla ema fa pele ga / ona ke tsena 'godimong.","Ke ikanya Jesu yo reng / Ga ke latlhe yo dumelang. / Ke itshwaretswe ka nnete / Se be same se tlositswe.","Ao Kwana ya Modimo Mong / yo rweleng dibe tsa batho / yo o ntshwetseng ka lorato / yo o mpholositseng jalo.","Ke sa le ke le mo 'fatsheng / ke ikaelela tsona tse! / Ke supa ka pelokgale / pholoso mo mading a Krist'.","Fa ke ya kwa legodimong / ke mo leba ke re Rara. / Mohumanegi ke yona / yo kopang boitshwarelo.","Ke dumela madi a yo, / a lekane maleo otlhe, / ke khumo ya Rradithata / a botlhokwa le phemelo.","Morena Rara wa rona / a ko utlwe merapelo. / Thusa bone ba gago, Mong, / ka madi a Morwa-esi.","Ke go tumisa, Jesu Krist', / ka o tsetswe o le motho / go duela tekololo / ya me le batho babotlhe.","Re thuse go ba rerela / dikgang tse di molemo tse, / gore botlhe ba ba utlwang / ba tshabele kwa go Kriste.","Kgosi ya tlotlo Jesu Krist', / Morwa Modimo wa rona, / tlhomogela pelo 'fatshe! / Tshegofatsa ba go rata!"]},
{n:116,t:"Jesu yo o mmonang mo dipogong",c:"Difela tsa Dipogiso tsa Morena",v:["Jesu yo o mmonang mo dipogong, / ena yo o tsenang le mo losong. / Chorus: Pelo, o gopolang, / nka mo leboga jang? / Mme nka duela kang, / yo nthatileng?","Jesu, yo o beditsweng, yo o rwesitsweng / mebitlwa mo tlhogong, yo o sotlilweng. / Chorus: Pelo, o gopolang ...","Yo o bapoletsweng sefapaanong, / a nthapelela teng mo Modimong. / Chorus: Pelo, o gopolang ...","Jesu, yo ntshol'letseng madi Golgoteng, / thabeng e rogilweng, a ntshwela teng. / Chorus: Pelo, o gopolang ...","Ke mo leboga jang mo botshelong? / Ke mo duela kang, ka go dirang? / Chorus: Ke wa 'gwe botshelong / le gona mo losong / le mo legodimong, / ke wa 'gwe teng."]},
{n:117,t:"Gona kwa Golgota",c:"Difela tsa Dipogiso tsa Morena",v:["Gona kwa Golgota, / thabeng ya dikgata, / foo re bona Jesu, / Kwana ya Modimo, / fa a swela batho, / e le ka lorato, / go emela gotlhe / dibe tsa ba botlhe.","Jesu o bapotswe, / rona re golotswe, / re tla itshwarelwa, / mme re tla tsholelwa, / go nna le Modimo / gona kwa godimo, / ka ntlha 'dintho tsa 'gwe, / le go swa ga gagwe.","Jesu o re swetse, / mme o re lefetse / ka dipogo tsa 'gwe / le ka madi a 'gwe. / Jalo re tla phela, / re ikantse fela / lona loso lwa 'gwe / le tirelo ya 'gwe."]},
{n:118,t:"Morena Jesu, fa ke se na nao",c:"Difela tsa Dipogiso tsa Morena",v:["Morena Jesu, fa ke se na nao, / legodimong, nna nka se ke ka tsena. / Ka madi a go a boitshepo fela / nna ke tla phela.","O wa lorato, Jesu, mme o ntshwetse / ke moleofi, mme o intshwaretse. / Ke go ikanya tlalelong tse tsotlhe, / ka pelo yotlhe.","Kea go leboga, wena Jesu wa me, / ka pelo yotlhe, wena Tsala ya me, / ka ke le mongwe wa phuthego ya go / ka madi a go."]},
{n:119,t:"Kwa Golgota sefapaanong",c:"Difela tsa Dipogiso tsa Morena",v:["Kwa Golgota sefapaanong / ka bona Jesu yo o swelang / ba botlhe ba ba maleong / go thusa ba ba dumelang.","Mme madi a a tswang dinthong, / mo diatleng le dinaong, / ke ona a a ntlhapisang, / a nkisa kwa legodimong.","Mebitlwa e mo tlhabileng / ka kgare e e mo tlhogong; / e tla mpatlela 'godimong; / kerone e e phatsimang.","Ke se segolo thata jang / se se dirilweng sefapaanong; / ke Jesu, yo o re ratang, / yo o re isang kwa pholosong.","Morena yo o rategang, / jaanong nka go leboga jang? / Ke tla nna yo o go ratang / jaanong le ka bosakhutleng. / Amen."]},
{n:120,t:"Jaanong a re itumelleng",c:"Difela tsa Tsogo ya Morena",v:["Jaanong a re itumelleng / Modimo, o o baakantseng / pholoso e e sa khutleng. / Haleluya, Haleluya, Haleluya, Haleluya! / Re baka Krist' yo o tsogileng.","Ke Jesu Krist' yo o tsogileng, / yo o re swetseng sefapaanong; / a re mmakeng, re mo tlotleng! / Haleluya, Haleluya, Haleluya, Haleluya! / Re baka Krist' yo o tsogileng.","O re golotse boleong, / o fentse Satan mo losong, / a mphalodisa tatlhegong. / Haleluya, Haleluya, Haleluya, Haleluya! / Re baka Krist' yo o tsogileng.","Ka moo a re itumeleng, / a rotlhe re mo lebogeng, / yo o re isang Paradiseng. / Haleluya, Haleluya, Haleluya, Haleluya! / Re baka Krist' yo o tsogileng."]},
{n:121,t:"Go bakwe Rara mo troneng",c:"Difela tsa Tsogo ya Morena",v:["Go bakwe Rara mo troneng / mmogo le Morwa yo o tsileng / go re rekolla mo dibeng. / Haleluya! Haleluya! Haleluya!","Mme ka phakela mo mosong / go sa le lentswe fa phupung, / Jesu a tsoga mo losong. / Haleluya! Haleluya! Haleluya!","Ee, o tsogile mo phupung, / a fenya loso mo tsogong. / A re mmakeng mo moletlong. / Haleluya! Haleluya! Haleluya!","Re go rapela, Kriste Mong: / Ka o tsogile mo losong, / re amogele 'godimong! / Haleluya! Haleluya! Haleluya!"]},
{n:122,t:"Go tsogile mo losong",c:"Difela tsa Tsogo ya Morena",v:["Go tsogile mo losong / Jesu Kriste mo mosong! / Tlaang, a re opeleleng / ene yo o tsogileng!","Tiro e e gololang, / tiro e e pholosang / e feditswe mo losong, / e tiisitswe mo tsogong.","Batho botlhe, tumisang / tiro e gakgamatsang; / e feditswe s'fapaanong, / e kanetswe 'godimong.","Go tsogile mo losong / Jesu Kriste mo mosong! / O re swetse legonyeng / go re isa legaeng."]},
{n:123,t:"Lona lotlhe badumedi",c:"Difela tsa Tsogo ya Morena",v:["Lona lotlhe badumedi, / tlaang lo lebe lebitleng: / Jesu Kriste ke Mophedi, / o tsogile, ga 'yo teng! / Lo dumele, lo opele, / Jesu ke yo o fentseng.","Tlaang lo bone felo gona, / fa o n' a laditswe teng! / Loso ga lo a mo kgona, / ke lo lo nyeleditsweng. / Lobolela ga lo kgone / go re tlhaba mo losong.","Jesu, Kgosi ya bophelo, / o tsogile mo phupung. / O itsise badumedi, / fa ba tla tswa diphupung / jaaka Jesu Krist' Morena, / yo o tsogileng losong.","Lo ipele, lona lotlhe, / lo mo tlotle dipakong! / O lo swetse le ba botlhe, / mme o dule mo losong / go lo tsosa, go lo tsosa, / go lo isa 'godimong."]},
{n:124,t:"Ba lo leofileng, thabang!",c:"Difela tsa Tsogo ya Morena",v:["Ba lo leofileng, thabang! / Se lleng jaanong, mme ipeleng, / ka Jesu yo o lo swetseng, / e le yo o lo tsogetseng.","Lefatshe le roromelang? / Badisa-phupu ba tshabang? / Ke ka go dule mo phupung / Morena yo o phedileng!","Ke Kwana e e tlhabetsweng / go tlosa dibe lefatsheng. / Mme Satan yo o re bofileng / o tla latlhelwa moleteng.","O fentse loso mo losong, / mme a re isa bophelong. / Kagiso e re e batlang / e mo go ene yo o phelang.","Go phela Jesu! Ke boifang, / ka e le ene yo o nthusang? / Ka Jesu ke tla tswa phupung, / mogang a tlang a le marung."]},
{n:125,t:"Go tsoga Jesu mo losong",c:"Difela tsa Tsogo ya Morena",v:["Go tsoga Jesu mo losong, / ke yo o phedileng. / Le nna ke tsoga maleong / a ke a dirileng.","Ka tsogo, Satan yo o loleng / o wetse tshenyegong. / Jaanong ba o ba gapileng / ke ba ga Jesu Mong.","Satan ke yo o senyegetsweng / ke maano tlhabanong. / Ga a na thata e e setseng, / mme o mo kgolegong.","Bakriste ba ya kwa kerkeng / go buisa Lokwalong / ba utlwa lentswe le le reng: / Tlaang, tlaang kwa phologong!","Le nna ke tsile moletlong / go baka yo o fentseng; / o nkutlwe, Rra, legodimong, / nna ngwana yo ke reng:","\"O ntshelle Mowa mo pelong / go phela Moreneng, / go tsena nae mo losong / le go tswa nae teng.\""]},
{n:126,t:"Yo o suleng, Jesu Morena",c:"Difela tsa Tsogo ya Morena",v:["Yo o suleng, Jesu Morena, / ke ene yo o tsogileng. / Nna ke tla tsoga jaaka ene / go phela ka bosakhutleng. / Ka moo ke yo o itumellang / Morena yo o tla ntsosang.","Loso ga lo na thata epe, / ke Jesu yo o lo fentseng. / Jaanong ga re boife sepe, / re batho ba ba golotsweng. / Morena yo o tsogileng / o re swatotse mo dibeng.","Morena wa me o n' a fenya / le tsotlhe tse di ka ntshwenyang. / Le loso ga lo na go senya / bakriste ba ba dumelang. / Re utlwa lentswe le le reng: / Go fentse yo o re swetseng.","Morena wa me o a tshela, / tlaang fa, lo lebe mo phupung! / A ga lo bone? O tsogile, / yo batho ba mmolaileng! / Ke tla boifa eng jaanong, / le fa ke tsena mo losong?","Jaanong ke na le tsholofelo, / le fa ke fitlhwa teng mo mmung. / Ka Jesu yo e leng bophelo / ke tla tsosiwa mo phupung. / Morena Jesu yo o phelang / ke ene yo o re phedisang.","Ee ruri, Jesu oa mphedisa, / o ntse mo go nna mo pelong; / mme le fa batho ba mpogisa, / nka itumela dipogong. / O tla ntsholela 'godimong, / ka a tsogile mo losong."]},
{n:127,t:"Lobolla lo lo re tlhabang",c:"Difela tsa Tsogo ya Morena",v:["Lobolla lo lo re tlhabang / lwa loso lo fa kae? / Mme Satan o ka tshwenya kang, / le fa a le setlhogo? / Jaanong re baka phuthegong: / Go fentswe loso tlhabanong / ke Jesu Krist' Morena.","Mme noga e gaketse jang, / fa Kriste a e gata! / Mme ya nna e e tlhabanang / ka maano le ka thata. / E mo lomile seretheng, / mme ene yo o re swetseng / o e kgobile tlhogo.","Mme ya re a tswa mo phupung, / a bofa Satan, mmaba. / A bula kgoro bobipong, / a ba a thopa thopo. / Ga go na sepe lefatsheng, / se Jesu o sa se fenyeng, / nnyaa, o laola tsotlhe.","Letsogo la ga Jesu Mong / le thata, mme le fentse! / Letsogo le le nonofileng / la 'Krisete le sentse / molete, loso le Satan, / le botlhe ba ba mo nyatsang, / gobane o tsogile."]},
{n:128,t:"Go bolailwe Jesu Krist'",c:"Difela tsa Tsogo ya Morena",v:["Go bolailwe Jesu Krist', / o bile o a phela; / fa tlhogo e tswa mo losong, / le rona re tla tsoga. / Mokriste yo o dumelang / se Kriste a se boletseng / oa phela, le fa a swa.","Mokriste yo o tsogileng / le Jesu ka tumelo, / ke ene yo o sa boneng / tshenyego le nyelelo. / Go fentswe loso mo losong / lwa 'Kriste mme jaanong tsogong / re bonye tshiamiso.","Jaanong re filwe mo tsogong / dineo tsa Morena: / masego a a thabisang / le phenyo lekgololo. / Re lebeletse Jesu Mong, / mme re tla fitlha 'godimong / go tshwana nae ruri.","Mme Satan yo o mo kgolegong / le ba ba nang le ene / ba tshwerwe ruri theregong / ka tsogo ya Morena. / Re bonye phenyo mo Jesung, / yo o re tsogetseng losong, / Satan o tla nyelela.","Jaanong lobolla lo tlhabang / lwa loso lo fa kae? / Mme Satan yo o ganelang / o tshwerwe ke serai! / Re itumela Modimong / go bona phenyo tlhabanong / ka Jesu Krist', Morena."]},
{n:129,t:"Modimo a re o bakeng!",c:"Difela tsa Tsogo ya Morena",v:["Modimo a re o bakeng! / Letsatsi le le siameng / le a re itumedisa. / Le phirimile mo losong, / le re tlhabetse mo tsogong / go thusa, go bonisa. / Wena le nna, / rona rotlhe, / batho botlhe, / re tla phela. / Jalo re a obamela.","Letsatsi le le tlhabileng / ke Jesu yo o tsogileng, / Mong yo o neng a fenya. / Ke yo o re fenyeditseng / loso le Satan lefatsheng, / ga ba na go re kgona. / Kriste Jesu / o tsogile, / o a phela, / a tswa gona / mo losong ka ntlha ya rona.","Mme ya re a tswa mo losong, / a thopa thopo tlhabanong, / a supa phenyo jalo. / Tshiamo o e bonye teng / le 'phelo jo bo sa khutleng / go di abela rona. / 'Neo tseo / tsotlhe tsotlhe / o di naya / batho ba 'gwe, / ba e leng ba puso ya 'gwe.","Ka moo ke yo go busetsang / mowa le mmele tse di tswang / go wena, Rra-bophelo. / Mogang ke tswang mo lefatsheng, / ntsholele, Jesu, mo motseng / o leng wa kgalalelo. / Jesu, Jesu, / o nne le nna, / o nnonotshe / ka dithata / go go utlwa, go go rata.","Mpoloke mono bophelong, / mme o nne le nna mo losong, / kwa ke tla lalang gona; / o be o ntsose bofelong, / ke kubugele bophelong, / ka wena ke tla kgona. / Amen, Amen, / ee, Morena, / ke tla tsena / ka tumelo / legaeng la boitumelo."]},
{n:130,t:"Ao tsoga, pelo, tsena",c:"Difela tsa Tsogo ya Morena",v:["Ao tsoga, pelo, tsena / ka thabo moletlong! / Ka Jesu Krist' Morena / a dule mo losong! / O ne a letse teng, / kwa rona re bewang, / fa re tswa lefatsheng / le go ya Modimong.","Pilato le Bajuta / ba ba mmolaileng, / ba sotla le go ruta / ba re, ke yo o fentsweng. / Jaanong tlaang lo boneng, / ba lo itsiweditseng: / Jesu yo o re swetseng / o dule mo phupung.","Mofenyi o bonetse, / o dule mo losong. / Mme Satan o tlhaetse, / o setse ka ditlhong. / O wetse dinaong / tsa 'Jesu kgolegong; / mme moo o tla nna teng / le ka bosakhutleng.","Mme nna ke itumella / go bona phenyo e; / ke tla nna ke dumela / Morena Krisete. / Jaanong e ka nna mang / yo o ka nthukhuthang / tse ke di batletsweng, / ke yona Kgosi e?","Ga ke boife sepe, / le fa e ka nna eng! / Ga go na thata epe / e e nthibellang phupung. / Lefatshe le ka reng? / Le loso lone ke eng? / Ka yo o re swetseng / e le yo o phelang.","Ke tshwere ka tumelo / Morena yo ke leng / tokollo mo go ene; / ke tla nna kwa o teng. / Ke yo o ntshang dipogong; / dibeng le mo losong; / ke yo o ntshang tatlhegong. / A re mo lateleng.","Mme Jesu o mphitlhisa / bontleng kwa legaeng. / Kwa teng o tla nkutlwisa / mafoko a a reng: / Yo o tswang le nna losong, / o nna le nna tlotlong; / yo o tswang le nna losong, / o nna le nna troneng."]},
{n:131,t:"Triumf! Go tswa kwa tlhabanong",c:"Difela tsa Tsogo ya Morena",v:["Triumf! Go tswa kwa tlhabanong / Mofenyi yo o fentseng losong! / Yo o leng wa gagwe tumelong / a a bonale moletlong! / Triumf, Triumf, / Triumf, Triumf, Viktoria! / Haleluya, Haleluya, Haleluya!","Mme Kwana e e didimetseng / jaanong ke Tau e e fentseng. / Lefika le le thibileng / ke lone le le tlositsweng. / Triumf ...","Atam yo mongwe yo o tsileng / ke Kriste yo o tsogileng; / o re ratile thata jang! / O fentse loso le Satan. / Triumf ...","Mme kgalalelo e e teng / e tswa le Kriste mo phupung. / Bogale jo bo tukileng / o bo timile mo losong. / Triumf ...","Jaanong a re itumeleng, / ka Jesu e le yo o fentseng / maleo, loso le Satan / le tsotlhe tse di re senyang. / Triumf ...","Ee, Jesu Kriste yo o fentseng, / Morena yo o tsogileng, / o re fe phenyo lefatsheng, / kagiso e e sa khutleng! / Triumf ...","Triumf! Re baka phuthegong, / ka re tla fenya tlhabanong / ka leina la 'go bokhutlong / go tsena mo kgalalelong. / Triumf ... (Triumf ke go re: Moletlo wa phenyo. Viktoria ke go re: Phenyo. Haleluya ke go re: Bakang Morena.)"]},
{n:132,t:"Banna ba le ba babedi",c:"Difela tsa Tsogo ya Morena",v:["Banna ba le ba babedi / ba ya Emao motseng. / Ba sepela ba ntse ba lla, / ba tshwenyega mo moweng. / Mo pelong ba hutsafala, / ka go sule ene Tsala / Jesu yo o ba reetsang / a ba botsa: Lo llelang?","Batho bantsi ba imelwa / jaaka bone mo pelong, / ba lla, ka ba tshwenyegile, / ba le tsholofologong. / Bangwe ba itsamaela, / ka kgomotso ba e tlhoka. / Jesu yo o ba patang / o ba botsa: Lo llelang?","Le fa go le ba babedi, / fa ba tsena thapelong, / Jesu foo ke wa boraro, / ka fa a solofetsang. / O ba utlwa ba rapela, / o ba tlhomogela pelo, / o bonisa dipelong, / o ntsha mo matshwenyegong.","Jesu o ntatetse gona, / kwa ke timeletseng teng, / o mpusitse, ka a mpona / ke le yo o latlhegileng. / O ne a tla go nntšhafatsa / ka go tsalwa ke Modimo. / Jaanong ke letsomaneng / la Modisa yo o nthatang.","Mme e tla re ke tlalelwa, / Jesu e nne yo o mponang, / e nne yo o tlang ka nako / e le yo o nkemang nokeng. / Fa ke hutsafala ke re: / Ga ke mmone, o kgakala — / a tle yo o ntsisetsang / thuso e e tlhokegang.","Jesu, Tsala ya boikanyo, / mpate gona bophelong. / Fa lefatshe le ntlhasela, / o mphenyise tlhabanong. / Mme fa Satan a nthaela, / mo go wena go phemelo. / Tlaa o tsene mo pelong, / ke go utlwe Lefokong.","Fa ke se na boitumelo, / ke le mo khutsafalong, / o nte ke lemoge gore / kana o yo o nthatang! / O tukise pelo ya me, / le nna ke tle ke go rate, / ke tlhomame tumelong / le go huma botshelong."]},
{n:133,t:"Morena wa bophelo",c:"Difela tsa Tsogo ya Morena",v:["Morena wa bophelo / o dule mo phupung! / Kajeno ka dipelo / a re mo godiseng! / Morena o tsogile, / ke ene yo o phelang, / mme loso lo fedile, / le ka bosakhutleng.","Lefika le tlositswe / le le mo thibetseng; / ee, le pitikolotswe, / ga a yo mo phupung. / Batlhanka ba tshabile / ba ba mo disitseng. / Morena o a phela, / a re itumeleng.","Morena, o Mofenyi, / o thata tlhabanong, / mme Satan ke mosenyi, / o isa tshenyegong. / Morena, mo kganele / motlhang o re tla swang! / Mothusi, o re lwele, / o Tau e kgolo jang!","Morena, la bofelo / re tsose mo losong; / le gona re gorose / teng kwa legodimong; / o re tsholele gona, / kwa wena o ntseng teng, / re tle re go phelele / le ka bosakhutleng."]},
{n:134,t:"Dinao tsa 'go 'dintle jang",c:"Difela tsa Tsogo ya Morena",v:["Dinao tsa 'go 'dintle jang: / O yo o thabisang! / Molomo wa 'go o buang / ke o re gomotsang: / Ke wena yo o romilweng, / motsisi wa kagiso.","Go diragetse tsotlhe tse, / tse di mo Beibeleng. / Bogale jwa Modimo Mong / ke jo bo timilweng / ke Jesu yo o re swetseng; / re bonye boitshwarelo.","Morena yo o mpatletseng / kagiso mo pelong. / Ke ene yo o mpuletseng / mojako 'godimong. / Ke boifa eng? Ke Moreneng, / ka ene go kagiso.","Lefatshe ke le le ntshwenyang, / le ntsenya ditekong. / Ga ke na kwa ke tshabelang, / fa e se kwa Jesung, / ka e le ene yo o rileng: / Mo go nna go kagiso.","Fa ke le mo ditlalelong, / mme go se tsala teng, / go teng yo o nnamolelang, / yo o ntapolosang. / Ke ene Jesu yo o rileng: / Kagiso e nne nao!","Fa dikeletso mo nameng / di ntsenya thaelong, / ke bona thata Moreneng / ka go nna thapelong. / Go Jesu teng yo o rileng: / Kagiso e nne nao!","Fa loso lo lo tshabegang / lo re: O wa me, tlaa! / foo Jesu yo o rategang / ke yo o nkemang nokeng. / E sa le ene yo o rileng: / Kagiso e nne nao!","Ke go leboga thata jang, / Morena yo o ntshwetseng! / Ke wena yo o mpolokelang / tse o di mpatletseng. / Mogang ke swang, ke tla boifang? / Ke tla swa ka kagiso."]},
{n:135,t:"Bosigo ke jo bo seleng",c:"Difela tsa Tsogo ya Morena",v:["Bosigo ke jo bo seleng, / letsatsi le tlhabile; / o thanye, pelo ya me, tlhe / go tshola Jesu Kriste, / yo o tsogileng, a tswa phupung, / ke ene yo o e thubileng. / Go itumela botlhe!","Le wena motho, tswaa phupung / ya dibe le molato; / o tsee bophelo mo Jesung, / go phela ka lorato; / o mo latele kwa a teng, / o tswelle fela mo tseleng / ya gagwe ya bophelo!","Lebala tse di lefatsheng, / o senke tsa 'godimo. / Lebisa pelo Moreneng, / e bong Morwa Modimo. / Lefatshe le le go sotlang, / le fenye! O nne yo o batlang / legae kwa go Jesu.","Dingongorego tse di teng, / Morena oa di tlosa. / Mme ruri le mo boketeng / o tla ba lapolosa, / bakriste ba ba dumelang, / e bile ba le thapelong; / gobane o tsogile.","Ya le basadi kwa phupung, / morongwi o fitlhile, / yo o reng: \"Bonang, yo o bapotsweng / ga a yo, o tsogile!\" / Mme itse, ene yo o fentseng / ke Tau e kgolo mo Juteng, / Morwa Modimo ruri.","Mme ka a sentse s'fapaanong / dithata tsa ga Satan, / le wena, tsena tlhabanong, / o tle o fenye nae. / Se tshabe ope mo babeng; / ka Jesu e le yo o fentseng, / le wena o tla fenya.","Lefatshe le le tshabegang / le Satan, mong wa lone, / le loso lo lo boitshegang / le mollo wa molete, / ga di na thata bakristeng; / Morena ke yo o di sentseng, / ka ene o tla fenya.","Ao Jesu yo o tsogileng, / re thuse tlhe, go gata / Satan yo o re bofileng / ka dibe tse di thata, / re tle re tsene godimong, / go rua boswa Modimong, / jo bo tsileng ka wena."]},
{n:136,t:"Phakela 'tsatsi le tlhaba",c:"Difela tsa Tsogo ya Morena",v:["Phakela 'tsatsi le tlhaba / Magdalena a tsamaya, / a ya lebitleng a tshotse / ditlolo go tlotsa Jesu. / Haleluya, ...","O n' a fitlhela lebitla / le butswe lo le lolea, / mme go ne go setse kobo. / Mme Morena a tsogile. / Haleluya, ...","O ne a lelela Jesu / ka a ne a sa fitlhelwa. / O ne a ema a leba, / a tshoswa ke baengele. / Haleluya, ...","Ba apere kobo tse tshweu, / tse tshweu di galalela, / mme ba makala a lela / gore ke eng fa a lela. / Haleluya, ...","A ba re: \"Ruri ga ke itse / koo ba beileng Morena. / Ke ka moo ke lelang jaana / ka ke tshwenyegile thata.\" / Haleluya, ...","Fa 'retologa a bona / motho a eme fa gaufi, / mme a sa mo tlhaloganye / a re ke modisa fela. / Haleluya, ...","Ke fa a bitsa \"Maria\", / mme a tlhaloganya lentswe / a itse gore ke Jesu, / mme a re: \"Morena wa me!\" / Haleluya, ...","Ke fa a re wa mo ama, / mme Jesu ke fa agana / a re: \"O se ka wa nkama / ga ke ise ke ye go Rara.\" / Haleluya, ...","\"Jaanong ya go bomorwa-rre, / e bile ba bolelele / gore ke ya kwa go Rara, / ke Rara wa rona rotlhe.\" / Haleluya, ...","Magdalena a taboga / a rera ka boitumelo / a re: \"Ke bone Morena, / e bile re buisanye.\" / Haleluya, ..."]},
{n:137,t:"Loso, ga o na thata jang",c:"Difela tsa Tsogo ya Morena",v:["Loso, ga o na thata jang / le Baengele ba 'go. / Mme Satan a ka dira eng / le fa a gaketse thata. / Re baka wena Jesu Mong / yo o ntshwetseng mo ntweng ya 'gwe / ka thata ya Modimo.","Satan a leka thata jang, / mme Kriste a lwa nae, / mme Morena a mo fenya / o sule gotlhe gotlhe. / Le fa a loma direthe / ga a ka a phela sebaka / o ne a thujwa tlhogo.","Mme Kriste o ne a phela / a fenya 'tiro tsa 'gwe / a tima molelo gotlhe. / A tsaa bogosi jwa 'gwe. / Ga go na sepe mo 'fatsheng / se se thibetseng phenyo e / go weditswe go gotlhe.","Morena Mogolodi yo / fenyeditse ba gagwe. / Le fa Satan yo leng tau a re setse morago, / a ka se ka a re kgona. / A ka re tshwenya thata jang / ka go re baa molato.","Yo o tsogileng le Jesu, / ke yo o bonang pholoso / ka go ipolela dibe / ka boikokobetso. / Ke yo o sa boneng loso, / o tla phela bo sa khutleng. / Go weditswe go gotlhe."]},
{n:138,t:"Viktoria, Viktoria!",c:"Difela tsa Tsogo ya Morena",v:["Viktoria, Viktoria! / Jesu Morena ga 'yo fa! / Semi-Chorus: Jesu Kriste mo mosong, / o tsogile mo losong! / Jaana a re opeleng: / Kwa go neng go lelwa teng. / Full Chorus: Ee, o dule mo phupung, / o tsogile mo losong! / Jesu o tsogile mo losong!","Viktoria! Viktoria! / Jesu Morena ga 'yo fa! / Semi-Chorus: 'Fika le le thibileng, / ruri, le tlositswe teng; / ke moengele, mo lebeng, / o ntse gona fa lentsweng! / Full Chorus: Ee, o dule mo phupung, ...","Viktoria! Viktoria! / Jesu Morena ga 'yo fa! / Semi-Chorus: Jesu o fentse mo losong / Satan, loso, mme jaanong / ke Morena yo o busang, / lo dumele yo o phelang! / Full Chorus: Ee, o dule mo phupung, ...","Viktoria! Viktoria! / Jesu, Morena ga 'yo fa! / Semi-Chorus: O tla tsosa bofelong / baswi botlhe diphupung. / Re tla phela 'godimong / fa re dule mo losong! / Full Chorus: Ee, o dule mo phupung, ..."]},
{n:139,t:"Jaanong a re itumeleng! Haleluya",c:"Difela tsa Tsogo ya Morena",v:["Jaanong a re itumeleng! Haleluya! / Ka Jesu yo o tsogileng! Haleluya! / O fentse loso mo losong! Haleluya! / O dule ruri mo phupung! Haleluya! / Haleluya! Haleluya! Haleluya!","Bakreste botlhe, opelang! Haleluya! / Ga tiro e e gakgamatsang! Haleluya! / Ka gonne yo o bapotsweng, Haleluya, / a fitlhwa, a ba a tsoga! Haleluya! / Haleluya! Haleluya! Haleluya!","Ee, Jesu yo o tsogileng, Haleluya, / o phela ka bosakhutleng! Haleluya! / Mme Jesu Kreste yo o tshelang, Haleluya, / ke ene yo o re phedisang! Haleluya! / Haleluya! Haleluya! Haleluya!","Jaanong re mo boitumelong! Haleluya! / Ga re boife mo pelong, Haleluya, / molete, loso le Satan! Haleluya! / Di fentswe ruri, opelang! Haleluya! / Haleluya! Haleluya! Haleluya!","Ao Jesu yo o rategang, Haleluya, / re go leboge thata jang! Haleluya! / Ka o re swetse s'fapaanong, Haleluya, / wa ba wa tsoga mo losong! Haleluya! / Haleluya! Haleluya! Haleluya!"]},
{n:140,t:"Jesu o dule mo losong, Haleluya",c:"Difela tsa Tsogo ya Morena",v:["Jesu o dule mo losong, Haleluya, / Jesu ga a yo mo phupung! Haleluya! / Magodimo opelang! Haleluya! / Mme mafatshe arabang! Haleluya.","Moengele o ntse teng, Haleluya, / letlapeng le tlositsweng, Haleluya. / Jesu ga a yo mo phupung, Haleluya, / o boetse bophelong. Haleluya!","Jesu yo o re golotseng, Haleluya, / ke Morena yo o fentseng, Haleluya! / Dibe, loso le Satan, Haleluya, / o re isitse polokong! Haleluya.","Batho betsho latelang, Haleluya, / tlhogo e e tlotlegang! Haleluya! / Re swe mme re tsoge nae! Haleluya! / Re nne ba 'gwe bophelong! Haleluya!"]},
{n:141,t:"Jesu a re mo lebogeng",c:"Difela tsa Tlhatlogo ya Morena",v:["Jesu a re mo lebogeng, / ka e le yo o tlhatlogileng! / Ke yo o re pholositseng, / yo o ileng legodimong.","Lona bakriste, opellang / Morena yo o godisitsweng! / O ile kwa legodimong, / go aga mo kgalalelong.","Mme ka a ile 'godimong, / o kgona go nna phuthegong, / le fa e ka nna kae le kae, / go ikgogela batho teng.","Jesu ke yo o nonofileng, / o tla nna ka bosakhutleng / Modimo-Motho 'godimong, / yo o re ratang mo pelong.","O busa mo kgalalelong / baengele kwa legodimong, / le batho mono lefatsheng / le dilo tsotlhe tse di teng.","O dutse ka fa letsogong / la moja la ga Rara, Mong; / ka moo re ba ba tshwanetseng / go obamela Kgosi e.","Boleo, loso le Satan / le tsotlhe tse di ka senyang / di fenyegile dinaong / tsa Kgosi e e mo phenyong.","Go tshegofala yo e leng / wa 'Jesu yo o tlhatlogileng, / a mo ikanya mo pelong, / a mo ineela botshelong.","Modisa yo o tlhatlogileng, / o nne le rona mo Kerkeng, / o re boloke mo thutong, / o re fe phenyo tlhabanong.","Morena yo o mo pusong, / akofa o tle katlholong, / o re ntshe rotlhe lefatsheng, / o re gorose legaeng!"]},
{n:142,t:"Tlhoafala go ipatlela",c:"Difela tsa Tlhatlogo ya Morena",v:["Tlhoafala go ipatlela / tse di mo legodimong. / Jesu Kriste, ena fela / o humisa bophelong. / Nna ke tla go kgomarela, / wena Jesu yo o nthatang, / wena yo o rategang. / Ke a go tlhologelelwa, / ke nna yo ke go kopang: / Nkise kwa legodimong!","Ao! Lefatshe, oa nkimela / le go phela mo nameng, / ka o rata go ntshenyetsa / tlhoafalo mo moweng. / Tsotlhe tse di mo go wena / ke tse di leng kgatlhanong / le tsa Mowa. Mme jaanong / ke tla ngaparela Jesu; / ena yo o tlhatlogetseng / kwa godimo kwa bontleng.","Lebellang, bakriste botlhe, / tse di tswang legodimong; / gonne dilo tsa lefatshe / ke tse di lo tsietsang. / Tsela ke e, e bulegile / e e yang legodimong, / kwa Morena a leng teng. / Sianang lo latlhe tsotlhe / tse di ka lo thibelang, / go ya kwa lo tla mmonang."]},
{n:143,t:"Dikgoro tsa godimodimo",c:"Difela tsa Tlhatlogo ya Morena",v:["Dikgoro tsa godimodimo, / lo bulegeng legodimong! / Go tsena teng Morwa Modimo, / ka e le yo o fentseng losong! / Mo tsholeleng mo maagong / a mantle a legodimong.","Ke ene wa masomosomo, / ke Kgosi e e a busang. / Ke ene Kgosi ya masego / a a batlegang mo lefatsheng. / Tlaang, batho, mo dumediseng, / ka a tlhatlogela legaeng!","Hosiana! Kgosi e ya rona / e tlhatlogetse 'godimong. / Ke Kgosi ya dikgosi tsotlhe, / e e busang kgalalelong, / mme trone ya 'gwe e ntse teng / jaanong le ka bosakhutleng.","Ke Mopresiti yo mogolo, / yo re etseng magodimong; / o re ruantse le Modimo, / ka moo re phela kagisong. / Ke ene yo re emelang, / a re rapella Modimong.","Ke Kwana ya Modimo ruri, / re e tlhabetswe Golgoteng; / ka madi a 'gwe a botlhokwa / re itshwarelwa mo Rareng. / Modimo ke o re ratang / ka ntlha ya yo o re swetseng.","Mothusi wa me wa lorato, / nna ke khubama dinaong / tsa gago, ka ke le molato, / mphetole, yo ke inyatsang, / ke tle ke tsene botshelong, / ke itumele legaeng."]},
{n:144,t:"Go tlhatlogetse 'godimong",c:"Difela tsa Tlhatlogo ya Morena",v:["Go tlhatlogetse 'godimong, Haleluya, / Morena yo o tlotlegang. Haleluya!","O ntse le Rara mo troneng, Haleluya, / go busa ka bosakhutleng. Haleluya!","Mme tsotlhe tse di kwadilweng, Haleluya, / ke tse di dirafaditsweng. Haleluya!","Jaanong go dutse mo troneng, Haleluya, / Morena wa ga Dafit teng. Haleluya!","Ka moo re ba mo tumisang, Haleluya, / ka pako e mo tshwanetseng. Haleluya!","Boraro jo bo mo bongweng, Haleluya, / bo bakwe ka bosakhutleng. Haleluya!"]},
{n:145,t:"Jesu Krisete ke Kgosi",c:"Difela tsa Tlhatlogo ya Morena",v:["Jesu Krisete ke Kgosi, / Mmusi yo o busang magosi / 'godimong le lefatsheng! / 'Teme tsotlhe di ipolele: / Jesu Kriste ke Morena, / Kgosi ka bosakhutleng.","Baengele le barena, / botlhe ba ba nang le ena / gona kwa legodimong, / baa mo tlotla, baa direla, / ba ntse ba mo opelela / ba le mo kgalalelong.","Bone ba bagolo bao, / le fa ba na le phatsimo, / Jesu ke yo o ba fetang; / le barena ba lefatshe / mmogo le batlhanka botlhe, / Jesu ke yo o ba busang.","Lona baitshepi botlhe, / tlaang lo obamele lotlhe / yona Kgosi e e busang! / Le nna yo o mmotlana thata / ke tla baka, ke tla rata / Jesu yo o tlotlegang."]},
{n:146,t:"Moruanyi yo mogolo",c:"Difela tsa Tlhatlogo ya Morena",v:["Moruanyi yo mogolo / wa ba gago lefatsheng, / o nna gona kwa go Rrago / fa letsogong le le jang; / o kgabile ka serwalo, / o le mo troneng ya gago; / baengele 'godimong / ba go obamela teng.","O itirile setlhabelo / sa maleo lefatsheng, / e le ka go swela batho / gona mo sefapaanong. / Mme o re batletse jalo / boitshwarelo le kgololo; / ka go tsoga mo losong / wa re tsenya botshelong.","Tiro e o mo go yona, / o le kwa legodimong, / ke go tshegofatsa batho / ba ba go atamelang; / o ba naya boitshwarelo / le lesego le kagiso, / gore e nne ba ba tshelang / ka tse o di ba fileng.","Mme maina a ba gago / a kwadilwe s'aparong / sa bopresiti jwa gago, / fa o tsena Tempeleng; / o ntse o emela jalo / ba ba utlwanang le wena; / o ba baakanyetsa teng / manno gona legaeng.","Mme le batho ba lefatshe, / bone ba ba timetseng, / ga o ba lebale gope, / o yo o ba lelelang; / o rapela gore Rrago / a tle a ba rekegele; / e nne ba ba sokologang, / ba se swele maleong.","E rile bogologolo, / fa o n' o le yo o rweleng / dibe tsa lefatshe lotlhe, / wa bo o ya Modimong, / o re rapelela thata / ka selelo le phegelo / mo boikokobetsong, / o le motho mo bathong.","Jaanong o Modimo-Motho, / o le kwa legodimong. / Ka moo o na le nonofo / ya go diga yo o tshwenyang, / ene Satan, mong wa maaka, / yo o re tebang kwa go Rara; / o tla nna yo o tshabang / madi a o a tsholotseng.","Moruanyi yo mogolo / wa ba gago lefatsheng, / o nna gona kwa go Rrago / fa letsogong le le jang; / re leboga thata thata, / gonne o a ikanyega; / re emele tlalelong, / fa re tsena mo losong."]},
{n:147,t:"Modimo Mowa, tlaa jaanong",c:"Difela tsa Pentekoste",v:["Modimo Mowa, tlaa jaanong, / re tlatse rotlhe phuthegong / ka 'neo tsa 'go tse e leng / tsa 'rato lo lo mo Kristeng! / O iphuthela lefatsheng / ka 'Foko la 'go Beibeleng / merafe ya diteme tsotlhe, / go opelelwa 'fatsheng lotlhe: / Haleluya, Haleluya!","Tlaa, Mowa o o galalelang, / o 'sedi le le phatsimang, / o nne yo o re bonegelang, / re itse Rara tumelong. / O re boloke mo Kerkeng / e re sa e itirelang, / re batle Jesu ka tumelo, / re mo ikanye ka dipelo. / Haleluya, Haleluya!","Ao, Mowa o o tukisang / lorato teng mo dipelong, / re tlhomamise tirelong, / re se itlhoboge tlalelong. / Ka re le ba ba raelwang, / re thatafatse tumelong, / re nne bagale go tlhabana, / re fenye, re ye kwa go Jesu. / Haleluya, Haleluya!"]},
{n:148,t:"Tlaa, Mowa, re rapela jaanong",c:"Difela tsa Pentekoste",v:["Tlaa, Mowa, re rapela jaanong, / o re fe tumelo mo Jesung. / O re tiise mo losong go kgona. / Thusa, re tswe 'tlalelong tsa rona. / Haleluya!","Lesedi le le budulolang, / o re bontshe yo o rategang, / Jesu, gore re mo kgomarele, / mme legodimong a re gogele. / Haleluya!","Morena, re go kopa jaanong, / re tshelele 'rato dipelong, / gore re ithute go ratana / le go phela ka go itshwarelana. / Haleluya!","Moregomotsi mo tlalelong, / re gomotse gona mo losong, / gore le fa Satan a re teba, / re se tshoge, mme re go ikanye. / Haleluya!"]},
{n:149,t:"Ao Mowa o tlang",c:"Difela tsa Pentekoste",v:["Ao Mowa o tlang, / o itshepileng, / Moregomotsi tlalelong, / o romilweng legodimong, / o tswang go Jesu Modimong. / Ao Mowa o tlang, / o tsene pelong.","Ao Mowa o tlang, / o itshepileng, / gorosa Jesu dipelong; / re tlhagafatse mo meweng / go utlwa ene Lefokong. / Ao Mowa o tlang, / o tsene pelong.","Ao Mowa o tlang, / o itshepileng, / o re nonotshe tumelong; / fa o se teng mo dipelong, / ga re dumele mo Kristeng. / Ao Mowa o tlang, / o tsene pelong.","Ao Mowa o tlang, / o itshepileng, / re bontshe Rara Lefokong / le Morwaa-ona Jesu Krist' / le tse a di re diretseng. / Ao Mowa o tlang, / o tsene pelong.","Ao Mowa o tlang, / o itshepileng, / o re supetsa kwa re yang, / o re nonotsha mo tseleng, / o re fitlhisa legaeng. / Ao Mowa o tlang, / o tsene pelong.","Ao Mowa o tlang, / o itshepileng, / se re tlogele mo losong. / Re go leboga tshepelong / le gona kwa bosakhutleng. / Ao Mowa o tlang, / o tsene pelong."]},
{n:150,t:"Tlaa, Mowa o o tswang Modimong",c:"Difela tsa Pentekoste",v:["Tlaa, Mowa o o tswang Modimong, / ke wena yo o romelwang / ke Jesu Krist' Morena. / Re sedifatse dipelong, / re bontshe Jesu tumelong, / re tle re mo ineele. / Re tsisetse / thata ya 'go / le lesedi, / rea di tlhoka; / o re tlhabolose jalo.","O jaaka phefo e e fokang, / o kile wa tla barutweng, / wa tsena mo go bone. / O ba tiisitse dipelong, / wa ba golola poifong, / ba be ba ema senna. / Ba supile / pelokgale / ka go ipolela / ba re: / Re laolwa ke Modimo.","O jaaka mollo o o tukang, / o itshupile ditlhogong / tsa bone barutwana. / O 'sedi le le bonisang, / o mollo o o tukisetsang / go dira 'tiro tsa 'go: / Tsona tseo / ke ikwatlhao / le tumelo / le lorato / le kagiso le ipelo.","O tsile ka fa mafokong / a baprofeti Beibeleng, / wa tshelwa mo go rona. / O pula e e nosetsang / dipeo tse di jwadilweng / mo dipelong tsa rona. / Nosa peo / gore rona / re dumele / mo go Jesu; / re tle re fetoge tota."]},
{n:151,t:"Tlaa, Mowa, tlaa mo phuthegong",c:"Difela tsa Pentekoste",v:["Tlaa, Mowa, tlaa mo phuthegong, / o re ntshe rotlhe boleong, / re dirwe go nna bašwa. / Re bana ba ba phapogong, / re itsietsa mo pelong, / mme re tshwanetse go swa. / Mowa, boa / o re thuse, o re buse, / ao Morena, / gore re latele wena.","Tlaa, Mowa, tsena mo pelong, / le fa re sa le maleong, / re phepafatse gotlhe. / Re tiise gape dipelong, / re fenye ruri tlhabanong / ka tšhaka ya Lefoko. / Mowa, boa / o bonise, o phedise / rona batho, / re tlosetse tlhe / melato.","Tlaa, Mowa o o itshepileng, / re itshepise mo moweng, / o age mo go rona! / Re tiise rotlhe tumelong, / re okeletse dipelong / maatla a magolo. / Mowa boa, / re itseele, / re itshwarele / dibe tsotlhe; / re go naya tlotlo yotlhe!"]},
{n:152,t:"Ao Mowa o o phedisang",c:"Difela tsa Pentekoste",v:["Ao Mowa o o phedisang, / o o tswang kwa Modimong, / ke wena yo o gotetsang / lorato mo pelong.","Re bonegele mo meweng / ka 'sedi Lefokong, / o bitse ba ba mo dibeng / go tsena phologong.","Ao Mowa o o phedisang, / o foke dipelong; / re dire lonko lo lo nkgang / monate Modimong.","Re tlhagafatse mo tirong / ka lentswe Beibeleng, / re nne masedi bophelong / a a bonegang 'fatsheng."]},
{n:153,t:"Bakriste, lo thabele",c:"Difela tsa Pentekoste",v:["Bakriste, lo thabele / Modimo dipelong! / Tlaang lo o opelele / o o legodimong! / Ke Mowa wa bophelo / o re o romelwang, / re dirwe badumedi / ba ba itshwarelwang.","O tla go bonegela / ba ba mo lefifing. / Ka ona re sepela / monate leseding. / O tla go re begela / yo o re pholosang, / le go re tshabisetsa / go yo o re ratang.","Tlaa, Mowa wa Morena, / o o re phedisang, / o kgatlhwe ke go tsena / ba re go batlang. / Morena, re gomotse, / fa re le matlhokong; / fa re swa, re gorose / go Jesu 'godimong."]},
{n:154,t:"Mowa o o bonisang",c:"Difela tsa Pentekoste",v:["Mowa o o bonisang, / Mowa o o kgothatsang, / o re lebe loratong / re le mmogo phuthegong.","Re kaele mo tseleng / e e yang bosakhutleng; / o nne yo o femelang / rotlhe ba re tlhaselwang.","Wena yo o re rutang, / wena yo o itshepisang, / re tlhapise mo mading / a o duleng kwa Golgoteng.","Sedifatsa lefatsheng / botlhe ba ba mo dibeng, / o ba ise phuthegong, / ba tle ba ye bophelong."]},
{n:155,t:"Wena Mowa wa Modimo",c:"Difela tsa Pentekoste",v:["Wena Mowa wa Modimo / yo o re bonegelang, / tsena dipelong, Morena, / tse di go dumedisang! / Fa re na le wena, Mong, / re mo boitumelong. / O lohumo lo logolo, / o motswedi wa bophelo.","Mowa, o re tshegofatse, / ba re go lebeletseng. / Tshuba mollo wa lorato, / re nne ba ba sa lapeng. / Tlaa o re ntshe lefifing, / o re ise leseding. / Dipelong re tlhalefise, / re itshupe ka maungo.","Re tlosetse ditshokamo, / thusa, re tswe mo dibeng; / o re goge ka Lefoko, / re sepele tshiamong. / Tse di sa re tshwanelang, / tse di sa go thabiseng, / di busetse kwa morago, / gore re tle re nne ba 'go.","Re emise, fa re ole, / re gomotse matlhokong. / Mme ka 'tsatsi la bofelo / o re tsose mo losong; / o re ise 'godimong, / re nne teng Selalelong, / kwa re tla bonang Morena / le go itumela nae."]},
{n:156,t:"Mowa o o Boitshepo, fologela phuthegong",c:"Difela tsa Pentekoste",v:["Mowa o o Boitshepo, / fologela phuthegong. / O se gane baikepi, / tsosa botlhe thobalong. / Bofolola, bofolola / pelo tse di bofilweng.","O re rute ka Lokwalo, / re bonise dipelong; / o re thibolole tsebe, / re utlwe tsotlhe Lefokong. / Re phedise, re phedise, / re ise re ye kwa losong.","Re abele tlhaloganyo / le nonofo mo meweng, / gore re nne boikanyo, / go ya kwa bosakhutleng / ka go leba, ka go leba / Jesu yo o re swetseng.","Itshepise rona bana / mo mading a a elang, / a tswa mo dinthong tsa Kwana, / madi a re tlhapisang, / gore re nne, gore re nne / batho ba o ba ratang."]},
{n:157,t:"Moletlo o o thabisang",c:"Difela tsa Pentekoste",v:["Moletlo o o thabisang / kajeno o fitlhile! / Mme Mowa o o batlegang, / bonang, jaanong o tsile! / Ke o o tsenyeng mo barutweng / ka thata ya Morena. / Itumeleng lo o tsholeng! / Lo se ka lwa o gana.","Mme batho betsho, nanogang, / reetsang ka pelo yotlhe! / Go lentswe le le utlwalang: / Kgololo e weditswe! / Itumeleng lo kgaoleng / dikgole tsa kgolego! / Nametsegang lo dumeleng / Morena wa tlotlego!","Barongwi ba ba akofang / ba rera Efangele, / mafoko a a pholosang / ga Jesu Krist' Morena. / Yo o dumelang ke yo o bonang / lesego le legolo. / Mme yo o ganang, yo o mo nyatsang, / o ka se ke a tsholwa.","Ka 'tsatsi le, Morena yo, / o roma dintlheng tsotlhe, / go isa Efangele e / gareng ga batho botlhe. / Mo mebileng le ditseleng / ba ba laletsa ba re: / Tlhabologang lo dumeleng, / tlaang lo je Selalelo!"]},
{n:158,t:"Mowa wa Modimo wa me",c:"Difela tsa Pentekoste",v:["Mowa wa Modimo wa me, / tlaa mo go nna phuthegong! / Pelo ya me e serame, / e ntigela tenegong. / Mowa, tsena mo pelong / le go ntiisa tumelong.","Tlaa mo go nna, ntapolose / ka Lefoko Lokwalong! / O bonatla, tlaa o ntsenye / tumelong le tirelong! / Tsosa gona mo pelong / tlhoafalo thapelong.","Mowa, o ntshupetsa gore / nna ke ngwana Modimong, / mo pusong ya Kgosi ya me, / le fa ke le pogisong; / gonne yo o mo tumelong / o lekiwa tlalelong.","Moemedi wa ga Jesu, / o nkgolole mo dibeng; / ke go kopa 'tlhogonolo / le le natefang moweng / le kagiso mo pelong / e e tswang mo Moreneng.","Mme fa ke tshwanetse go swa, / o nkgomotse mo moweng, / o b' o nnee go rua boswa / mo go Jesu legaeng. / Gona re tla aga teng / ruri ka bosakhutleng."]},
{n:159,t:"Modimo Rara 'godimong",c:"Difela tsa Trinitate",v:["Modimo Rara 'godimong, / o re ratile mo pelong. / Lorato lwa 'go lo ntse jang! / Ke lo lo re gakgamatsang.","Modimo Morwa 'godimong, / o re golotse mo losong. / Jaanong re ba ba tla bonang / Modimo o o galalelang.","Modimo Mowa 'godimong, / o re gogela phologong. / Ke wena yo o re gomotsang, / ke wena yo o re phedisang.","Boraro jo re bo bakang / ke Rara yo o re ratang / le Morwa yo o re swetseng / le Mowa o o re itshepisang."]},
{n:160,t:"Jehofa o mogolo jang",c:"Difela tsa Trinitate",v:["Jehofa o mogolo jang, / o mongwe borarong! / Ke ene yo o laolang / 'fatsheng le 'godimong.","Jehofa, Rara 'godimong / ke yo o re tlhodileng / tshwanong ya gagwe lefatsheng, / re le mo tshiamong.","Jehofa, Morwa 'godimong / o n' a tla lefatsheng, / go swela rona s'fapaanong, / go re ntsha mo dibeng.","Jehofa, Mowa 'godimong / o o itshepisang, / o re gomotsa dipelong / ka tse di thabisang.","Itseng Modimo ditirong / tsa ona lefatsheng, / lo o tlotleng mo phuthegong / le ka bosakhutleng."]},
{n:161,t:"Bakang Jehofa phuthegong",c:"Difela tsa Trinitate",v:["Bakang Jehofa phuthegong, / Modimo boreneng! / O busa kwa magodimong / le mono lefatsheng.","Le mewa kwa legodimong / ke e e laolwang / ke Kgosi e e tla busang / le ka bosakhutleng.","Re baka Rara kopelong, / ke yo o re ratang. / O re rometse lefatsheng / Morwawe yo o tlotlwang,","Ke Rara yo o re tlamelang / ka tsotlhe botshelong; / ke ene yo o re femelang, / fa re le mathateng.","Re baka Morwa phuthegong, / yo o tsileng 'fatsheng; / re mo tsaletswe setaleng / kwa Betlehem motseng.","Ke Kwana e re e tlhabetsweng, / e swetse s'fapaanong; / e re tsogetse lebitleng, / ya ya legodimong.","Re baka Mowa o o phelang, / o o tswang mo Rareng; / ke ona o o romelwang / ke Morwa lefatsheng.","O itshepisa phuthegong / ba o ba biditseng; / o ba boloka tumelong, / go tshela mo Kristeng.","Tlotlang Jehofa phuthegong, / Modimo boreneng! / Ke ona o sa fetogeng, / ke o o sa khutleng.","Boraro a re bo tlotleng: / Ke Rra yo o re ratang, / le Morwa yo o re swetseng, / Mowa o o phedisang."]},
{n:162,t:"Ka Haleluya godisang",c:"Difela tsa Trinitate",v:["Ka Haleluya godisang / Modimo Rara yo o busang / ka 'rato le bogale! / Ditiro di dikgolo jang / tsa Mmopi yo o gakgamatsang, / Modimo o botlhale! / 'Neo tsotlhe / tsa bophelo / le tsa pelo / o di naya / batho ka lorato fela.","Ka Haleluya mo tlotleng, / Morwa Modimo yo o tsileng / 'fatsheng go nna bophelo! / O ntshitse ba ba dumelang / mo maleong a a isang / kwa moleteng wa mollo. / Wena le nna / o re tletse, / o re swetse / ka lorato, / go re isa kwa go Rara.","Ka Haleluya lo bakeng / le Mowa o o rometsweng / 'fatsheng go re itshepisa. / Ke ona o re biditseng, / ke ona o re isitseng / go Jesu Krist', Modisa. / Ruri, ruri, / re tla tsena / kwa go ena / ka lethabo, / go nna nae ka kagiso.","Ka Haleluya tumisang / Modimo o o tlotlegang, / ke ona wa mannete. / Opang diatla lethabong, / lo ikopanye mo pakong / le bone baengele. / Amen, Amen, / go boitshepo, / go boitshepo, / go boitshepo / yo o busang masomosomo!"]},
{n:163,t:"Modimo wa me ke wa lorato",c:"Difela tsa Trinitate",v:["Modimo wa me ke wa lorato, / o a mpholosa, ke o nthatang. / Ke gona ke buang: Modimo wa me / ke wa lorato, ke o nthatang.","Ke ne ke sule loso lwa dibe, / Jesu a rongwa, mme a nntsha teng. / Ke gona ke buang: Modimo wa me / ke wa lorato, ke o nthatang.","Jesu Morena, Monamoledi, / a tlosa dibe sefapaanong. / Ke gona ke buang: Modimo wa me / ke wa lorato, ke o nthatang.","O nnaya boswa jwa legodimo, / o tla nkgorosa kwa boikhutsong. / Ke gona ke buang: Modimo wa me / ke wa lorato, ke o nthatang.","Ke a go baka, Modimo wa me, / ke a go tlotla bosakhutleng. / Ke gona ke buang: Modimo wa me / ke wa lorato, ke o nthatang."]},
{n:164,t:"Ditaolo tse di Lokwalong",c:"Difela tsa Boikwatlhao",v:["Ditaolo tse di Lokwalong / ke tsa Modimo 'godimong, / ke tse o di re neileng / ka Moše teng kwa Sinaing.","\"Ke nna Morena yo ke leng / Modimo osi medimong. / Lo mpoifeng, lo inkanyeng, / se fapogeleng medimong!","Lo se bitseng metshamekong / leina la Modimo, Rra! / Lo le bitseng mo thapelong, / lo o bakeng, o lebogeng!","Sontaga mo itshepiseng, / lo ikhutse, lo ye kwa kerkeng; / Lefoko lo le bolokeng, / dirang tse di tswang loratong!","Tlotlang bagolo lefatsheng! / Ba direleng, lo ba utlweng! / Lo tla nna ba ba tshegofalang / malatsi a lo a phelang.","Lo se bolaye bogaleng, / lo se ipusolosetseng, / mme lotlhe lo direlaneng, / ratang ba ba lo tlhoileng!","Tlotlang lenyalo magaeng, / lo ikanyege loratong; / ilang bonyatsi malapeng, / boaka a bo se nne teng.","Lo se utsweng, se tsietseng, / lo se patike mo thekong! / Mme rapelang, lo nneng tirong, / lo thuse motho yo o tlhokang!","Mme fa lo bua, se akeng, / lo supe nnete mo puong; / fa motho a se molatong, / lo mo atlholeleng tshekong!","Lo se nne ba ba eletsang / tse motho o di ruileng / gongwe mosadi wa yo mongwe / le batho ba o mo direlang!\"","Ditaolo tse re di neilweng / di re senola maleong. / Ga se tse di re phedisang, / di re lebisa Jesu Mong.","Ka moo he a re tshabeleng / go Jesu Kriste yo e leng / Morekolodi molatong, / mme re se wele tshenyegong."]},
{n:165,t:"Ke motho wa maleo fela",c:"Difela tsa Boikwatlhao",v:["Ke motho wa maleo fela, / nka leba jang legodimong! / Modimo wa me, o nkutlwele / botlhoko, yo ke maleong. / O se nkatlhole bogaleng, / o intshwarele mo Kristeng.","Ke yo ke boifang gagolo, / ke wetse gotlhe mo dibeng. / Molato wa me o mogolo, / o nkgateletse leroleng. / O se nkatlhole bogaleng, / o intshwarele mo Kristeng.","Modimo Rara, a ko o nkutlwe, / fa ke go bitsa thapelong; / tatlhego ya me a e khutle, / o nthuse, ke tswe maleong! / O se nkatlhole bogaleng, / o intshwarele mo Kristeng.","Ke go biditse ka boleele, / a ga o nkutlwe botlhokong? / O nthuse, ke se tlhaeletse / lefela kwa legodimong! / O se nkatlhole bogaleng, / o intshwarele mo Kristeng.","Ka nnete, ke mofosatsela, / ga go na yo o ka nthusang, / fa e se wena, wena fela, / ke ka moo ke go rapelang: / O se nkatlhole bogaleng, / o intshwarele mo Kristeng.","Modimo wa me, se mpusetse / ka fa ke dirileng ka teng. / Modimo Rara, nthekegele, / o ntsenye gape bongwaneng. / O se nkatlhole bogaleng, / o intshwarele mo Kristeng.","O bue ka molomo fela / lefoko la 'go le le reng: / Ngwanaka, kea go itshwarela, / se wele gape mo dibeng! / O se nkatlhole bogaleng, / o intshwarele mo Kristeng!","Jaanong ke a go galaletsa, / ka o le yo o nkutlwileng. / Tumelo ya me e tlhomame, / ke gomotsega mo pelong: / Ga o ma nkatlhola bogaleng, / o intshwaretse mo Kristeng."]},
{n:166,t:"Rara, Rara, intshwarele",c:"Difela tsa Boikwatlhao",v:["Rara, Rara, intshwarele, / dibe o se di mpeletse; / fa o rata go ntirela / ka tshiamo, ke tla nyella.","Ga go bonwe motho ope, / yo se nang boleo bope; / rotlhe re basenyi fela, / re tshwanetse go nyelela.","Ka ke tsetswe ka makoa, / ke paletswe ke go boa. / Ke molato, kea rapela, / Rara, a ko o intshwarele!","Rara, kea go obamela, / ke llisiwa ke maleo / jaaka Petrus, ke rapela / gore o se ka wa ntatlha.","Ke itigela fa go wena / jaaka ene Magtalena. / Dikeledi dia tshologa, / Rra, o se ka wa ntlhoboga!","Ee, jaanong oa intshwarela, / mme ka Jesu ke tla phela. / Khutsafalo e ntlogetse. / Jaanong ke a itumela!"]},
{n:167,t:"Morena, o se mpetse",c:"Difela tsa Boikwatlhao",v:["Morena, o se mpetse, / yo ke leofileng! / Fa nka ikanya batho, / ke yo o latlhegileng. / Morena, intshwarele / tse ke di dirileng! / O nthuse, ke se swele / dibeng, yo ke sentseng.","Morena, o mphodise / bolwetse marapong; / ka gonne bo nkutlwisa / botlhoko mo pelong. / Marapo aa remega, / ke yo o boifang, / mme pelo e nyemile: / O tla intshwarela leng?","Ee, ke nyemile moko / ka ntlha ya phegelo e. / Ke tlhoka le boroko, / ke lora dibe tse. / Ke tshela 'kobo tsa me / 'keledi bosigong; / le mmele otlhe wa me / o mo khutsafalong.","Hee! basiamolodi, / tlogang fa, lo nteseng! / Ke bonye Mogolodi, / o nthusa mo moweng. / Jehofa o utlwile / dilelo thapelong; / 'keledi di kgadile, / ke boitumelong.","A go tlotliwe gona / kwa godimodimong / Rara le Morwaa-ona / le Mowa boitshepong! / Jaanong ka ke sa phela, / le ka bosakhutleng / ke tla nna ke opela / dipako difeleng."]},
{n:168,t:"Modimo Rra, go imetswe nna",c:"Difela tsa Boikwatlhao",v:["Modimo Rra, / go imetswe nna / ke dibe tsa me tsotlhe! / Yo o nkimollang / ke mmona kae / lefatsheng leno lotlhe?","Ke tshabelang / 'felafeleng / dintlheng tsa 'fatshe lotlhe? / Nka bona mang / yo o ka nthusang / gore ke itshwarelwe?","Ke leba mang, / ke ka dirang, / fa e se go rapela? / Ke tla ya kae / le kwa go mang? / Ke tla ya kwa go Ntate.","Mono 'fatsheng / o mpetse teng, / fa go batlega jalo. / Mme bofelong, / teng mo tshekong / a ko o nthekegele!","Mo lefatsheng / ntirele teng / ka fa thatong ya gago; / mme bofelong, / bosakhutleng / se kgaogane le nna!","Mo tlalelong / le sefakong / 'nonyane di tshabela / kwa ditlhareng / le dikgageng, / di batla tshireletso.","Le nna ke yo / o tshabelang / go Jesu go femelwa; / yo o ntshwetseng, / yo o ntsogetseng / o tla mpha boitshwarelo."]},
