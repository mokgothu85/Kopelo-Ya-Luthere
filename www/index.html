 ya kolobetso."]]}, {"t": "Dithapelo: Thapelo ya mo Mosong le ya Mantsiboa", "b": [["r", "Thapelo ya mo Mosong. A go thuse Modimo Rara le Morwa le Mowa o o Boitshepo. Amen. Go latele Tumelo ya Bokeresete le Thapelo ya Morena (bona Tirelo-Modimo), mme:"], ["M", "Rara wa legodimo, ke a go leboga ka Jesu Keresete, Morwao yo o rategang, ka gonne mo bosigong jo bo fetileng o mphemetse mo ditlalelong le mo ditsietsing tsotlhe. Mme ke go rapela gore, le mo letsatsing leno o mphemele mo maleong le mo masuleng otlhe, gore o kgatlhwe ke ditiro tsotlhe tsa me le bophelo jwa me. Ke ineela ka mmele le ka mowa le ka tsotlhe tsa me mo diatleng tsa gago; a moengele yo o boitshepo wa gago a nne le nna gore mmaba yo o bosula a se nne le thata epe mo go nna. Amen."], ["r", "Thapelo ya Mantsiboa. A go thuse Modimo Rara le Morwa le Mowa o o Boitshepo. Amen. Re tswelele ka Tumelo ya Bokeresete le Thapelo ya Morena."], ["M", "Rara wa legodimo, ke a go leboga ka Jesu Keresete, Morwao yo o rategang, ka gonne o mphemetse mo letsatsing le le fetileng ka bopelotlhomogi jwa gago. Mme ke go rapela gore o intshwarele dibe tsotlhe tsa me tse ke go leofetseng ka tsona. O mphemele mo bosigong jono ka bopelotlhomogi jwa gago. Ke ineela mo diatleng tsa gago ka mmele le mowa le tsotlhe tsa me. A moengele wa gago o o boitshepo a nne le nna, gore mmaba yo o bosula a se nne le thata epe mo go nna. Amen."]]}, {"t": "Dithapelo: Tshipi le Mosupologo", "b": [["r", "Tshipi, mo Mosong"], ["M", "Tlaang, a re obameleng, re iname, re khubame fa pele ga Morena, Mmopi wa rona. Gonne ke ene Modimo wa rona; rona re batho ba bofulo jwa gagwe. Morena, ke rata boago jwa Ntlo ya gago, ebong felo fa kgalalelo ya gago e agileng teng. A re atameleng sefatlhego sa gagwe ka boitumelo, a re mo ipeleleng ka dikopelo tsa pako. Morena, utlwa lentswe la me mogang ke bitsang, o nkutlwele botlhoko. Morena a re: Batlang sefatlhego sa me. E kete lo ka bo lo utlwa lentswe la me kajeno! Se thatafatseng dipelo tsa lona. Morena, nthute tsela ya gago, o nkgogele mo tseleng ya tshiamo ka ntlha ya leina la gago. Dinku tsa gago di utlwa lentswe la gago, o a di itse, mme di go sala morago. Go sego bogolo ba ba utlwang Lefoko la Modimo, ba le boloke. Amen."], ["r", "Tshipi, Mantsiboa"], ["M", "Morena ke Modisa wa me, ga nkitla ke tlhoka sepe. O mphudisa mo mafulong a matalana, o nkgogela kwa metsing a tapoloso. O lapolosa mowa wa me, o ntsamaisa mo ditseleng tsa tshiamo ka ntlha ya leina la gagwe. Le fa ke tsamaya mo mogorogorong wa moriti wa loso, ga nkitla ke boifa bosula bope; gonne o na le nna. Tsamma ya gago le seikokotlelo sa gago di a nkgomotsa. O baakanya bojelo fa pele ga me go lebagana le baba ba me; o ntlotsa tlhogo ka lookwane; senwelo sa me se tletse, se a tshologa. Ruri molemo le boitshwarelo di tla ntshala morago ka malatsi otlhe a bophelo jwa me; ke tla nna mo Tlung ya Morena go ya bosakhutleng. Amen."], ["r", "Mosupologo, mo Mosong"], ["M", "Rara wa legodimo, ke go lebogela phemelo yotlhe e o mphemetseng ka yona mo ditsietsing tsotlhe tsa bosigo jo bo fetileng le mo dibolaing tsa jona ka Jesu Keresete Morwao yo o rategang. Jaanong ke go rapela gore o ntiise kajeno ke se leofe, ke se raelwe ke bosula, mme o kgatlhwe ke ditiro tsa me le botshelo jotlhe jwa me. Ke ineela mo diatleng tsa gago ka mmele le mowa le ka tsotlhe tsa me. A moengele yo o boitshepo wa gago a nne le nna gore mmaba yo o bosula a se bone lobaka lwa go ntshwenya. Amen."], ["r", "Mosupologo, Mantsiboa"], ["M", "Rara wa legodimo, ke go leboga ka Jesu Keresete Morwao yo o rategang, ka o mphemetse mo letsatsing leno ka bopelotlhomogi jwa gago. Mme ke go rapela gore o intshwarele dibe tsotlhe tsa me tse ke go siamololetseng ka tsona. O mphemele le mo bosigong jono ka kutlwelobotlhoko jwa gago. Ke ineela mo diatleng tsa gago ka mmele le mowa le ka tsotlhe tsa me. A moengele wa gago yo o boitshepo a nne le nna gore mmaba yo o bosula a se nne le thata epe mo go nna. Amen."]]}, {"t": "Dithapelo: Labobedi go ya Laboraro", "b": [["r", "Labobedi, mo Mosong"], ["M", "Modimo, o Modimo wa me, ke go batla mo phepafalong ya moso (mo mosong ono), mowa wa me o go nyoretswe, nama ya me e go tlhologeletswe mo lefatsheng la komelelo le le nyorilweng, le le se nang metsi. Ke go lebile kwa Felong ga Boitshepo ka maikutlo a a ntseng jalo, go bona thata ya gago le kgalalelo ya gago, gonne bopelotlhomogi jwa gago bo molemo go gaisa bophelo. Molomo wa me o tla go baka. Ke tla go tumisa jalo mo botshelong jotlhe jwa me, ke tsholetsa mabogo mo leineng la gago. Ke ne ka go gopola mo bolaong jwa me, ka akanya ka ga gago ka dinako tsa tebelelo ya bosigo; gonne o ne o le thuso ya me. Ke tla duduetsa mo moriting wa diphuka tsa gago. Mowa wa me o go setse morago, o go kgomaretse, letsogo le le jang la gago le ntshegeditse. Ntiise, o mphemele ka ntlha ya ga Jesu Keresete, Morena wa me. Amen."], ["r", "Labobedi, Mantsiboa"], ["M", "Morena, o thata ya me, ke go rata ka pelo yotlhe. O lefika la me le botshabelo jwa me le Mogolodi wa me. Modimo wa me, o lefika la me, ke a go ikanya. O thebe ya me le kago ya me ya phemelo. Morena, ke go ikanya ke re: O Modimo wa me, sebaka sa me sa botshelo se mo diatleng tsa gago. Mphatsimisetse sefatlhego sa gago, ke le motlhanka wa gago, o mpoloke ka ntlha ya boitshwarelo jwa gago. Ke tla rapama, ke robala mo kagisong, gonne wena wesi o a ntiisa. Ke neela mmele le mowa le tsotlhe tsa me mo diatleng tsa gago. Mpoloke, Morena wa me, gore Satane le batlhanka ba gagwe ba se ka ba bona sebaka sa go ka mpolaya. Amen."], ["r", "Laboraro, mo Mosong"], ["M", "Modimo, o nne boitshwarelo le rona, o re tshegofatse, o re phatsimisetse sefatlhego sa gago, gore tsela ya gago e lemogiwe mo lefatsheng, le pholoso ya gago mo ditšhabeng tsotlhe. Merafe e tla go baka, Modimo, ditšhaba tsotlhe di tla go baka. Merafe e tla itumela, e ipela, ka gonne o atlhola ditšhaba ka tshiamo, o goga merafe mo lefatsheng. Ke a go leboga, Morena Modimo, ka o mphemetse mo bosigong jo bo fetileng. Mme ke go rapela gore o nkutlwele botlhoko ka ntlha ya ga Jesu Keresete, Mopholosi wa me, o ntise, o mphemele ka moengele yo o boitshepo wa gago, gore ditiro tse ke tla di dirang gompieno di go kgatlhe. Amen."], ["r", "Laboraro, Mantsiboa"], ["M", "Lebogang Morena, gonne o molemo, mme bopelotlhomogi jwa gagwe ke jo bo sa khutleng. Modimo, matlho a gago a mpone ke simolola go utlwelelwa, mme malatsi a me a a sa leng a rulaganngwa go ise go nne lepe la ona, a kwadilwe otlhe mo lokwalong lwa gago. Jesu Morena, le nna ke tla ema fa pele ga setulo sa katlholo sa gago, gore ditiro tsa me di senoge fa pele ga gago, tse di molemo gongwe tse di bosula. Ke ka moo ke go rapelang gore o nthuse, ke kgone go tshaba boleo, ke go direle, ke batle pholoso ya me ka poifo le thoromo. O mpoloke, o mphemele mo bosuleng mo bosigong jono. Amen."]]}, {"t": "Dithapelo: Labone go ya Lamatlhatso", "b": [["r", "Labone, mo Mosong"], ["M", "Baka Morena, mowa wa me, le tsotlhe tse di mo teng ga me, bakang leina la gagwe le le boitshepo! Baka Morena, mowa wa me, se lebale sepe sa ditiro tse di molemo tsa gagwe! Morena o kutlwelo-botlhoko le boitshwarelo; o bopelotelele, o bopelontle jo bogolo. Ga a nke a nna bogale ka metlha, le e seng go galefela ruri. Morena o utlwela ba ba mmoifang botlhoko, jaaka rra-bana a utlwela bana ba gagwe botlhoko. Morena, tshegetsa metsamao ya me mo metlhaleng ya gago kajeno gore dikgato tsa me di se ntimetse. Mpoloke jaaka thaka ya leitlho, o mphemele mo moriting wa diphuka tsa gago. Ke kopa jalo ka ntlha ya ga Jesu Keresete, Morena wa me. Amen."], ["r", "Labone, Mantsiboa"], ["M", "Ke tsholeletsa matlho a me kwa dithabeng; thuso ya me e tla tswa kae? Thuso ya me e tswa Moreneng yo o dirileng legodimo le lefatshe. Ga a ka ke a leseletsa lonao lwa gago go relela. Motlamedi wa gago ga a kake a otsela, e bile ga a robale. Morena ke Mmabaledi wa gago, Morena ke moriti wa gago fa letsogong la gago le le jang. Letsatsi ga le kitla le go tlhaba motshegare, le fa e le ngwedi bosigo. Morena o tla go sireletsa mo masuleng otlhe, o tla boloka mowa wa gago. Morena o tla femela go bolola ga gago le go goroga ga gago go tloga jaanong go fitlha bosakhutleng. Jesu, Morena le Mmoloki wa me, nkutlwele botlhoko, o nthobatse ka kagiso ka ntlha ya lorato lo logolo lwa gago. Amen."], ["r", "Labotlhano, mo Mosong"], ["M", "Jesu Keresete, Kwana ya Modimo, yo o ntshang lefatshe dibeng, re tlhomogele pelo, o re fe kagiso. Morena, ke wena yo o re swetseng ka loso lwa sefapaano, wa swela melato yotlhe ya rona. O ne wa rwala malwetse a rona, wa phololediwa ka ntlha ya maleo a rona, wa ketekelwa melato ya rona. Petso e ne ya go wela gore rona re bone kagiso. Re fodisitswe ka dintho tsa gago. Ke go lebogela tsotlhe tse o di re diretseng gore re bone pholoso le boitshwarelo le botshelo jo bo sa khutleng. Nthuse, Jesu Morena, gore le nna ke pholosiwe ka madi a a boitshepo a gago le ka loso lwa gago. Amen."], ["r", "Labotlhano, Mantsiboa"], ["M", "Morena Jesu, Mopholosi yo o rategang wa rona, ke go leboga ka pelo yotlhe ka gonne o nkgolotse, ke le motho wa timelo le tatlhego, wa nkgolola mo maleong otlhe le mo losong le mo thateng ya ga Satane, e seng ka gouta gongwe selefera; o nthuantse le Modimo ka madi a a boitshepotshepo a botlhokwa a gago le ka go boga le go swa ga gago. O dirile jalo gore ke nne wa gago, ke phele nao mo pusong ya gago, ke go direle, ke le mo tshiamong le mo boitshepong, ke phologile ka bosakhutleng; jaaka wena o tsogile mo losong, wa phela, wa busa ka bosena-bokhutlo. Le nna o tla ntsosa gore ke tshele le wena ka bosafeleng. Amen."], ["r", "Lamatlhatso, mo Mosong"], ["M", "Ke tsholeletsa mowa wa me koo go wena, Morena. Modimo wa me, ke a go ikanya; a ke se tlhajwe ke ditlhong. Morena, nkitsise ditsela tsa gago, o nthute ditselana tsa gago. Ntsamaise mo boammaaruring jwa gago, o nthute, gonne ke wena Modimo wa pholoso ya me. Ke tla go lebelela ka gale. Morena, gopola mautlwelo-botlhoko a gago le maitshwarelo a gago. O se ka wa gopola maleo a boša jwa me le ditlolo tsa me. Nkgopole ka fa boitshwarelong jwa gago ka ntlha ya molemo wa gago. Leba tlalelo ya me le thekisego ya me, mme maleo a me o a intshwarele otlhe ka ntlha ya madi a ga Jesu, Morena wa me. Amen."], ["r", "Lamatlhatso, Mantsiboa"], ["M", "Morena, o ntse o le botshabelo jwa rona mo ditshikatshikeng. Pele dithaba di ise di tsalwe, o ise o tlhole lefatshe le lobopo, wena o ntse o le Modimo go tswa bosenang-tshimologo go ya bosakhutleng. O busetsa batho loroleng lwa mmu wa re: Boang, bana ba batho. O ba gogotse jaaka ka morwalela; ba ntse jaaka ba robetse. Nthute go bala malatsi a me gore ke tle ke tlhalefe mo pelong. Nkutlwele botlhoko, Morena wa me, o intshwarele. Ke go lebogela molemo otlhe o o o mphileng beke yotlhe e e felang. A ko o mpoloke mo bosigong le botlhe ba gaetsho. Tshegofatsa Kereke e e boitshepo ya gago. A puso ya gago e tle mo go nna le mo phuthegong ya ga etsho le mo bathong botlhe. Modimo wa me, nkutlwe ka ntlha ya ga Jesu, Morena wa me. Amen."]]}, {"t": "Dithapelo: Thapelo ya go kopa boitshwarelo le ya ba ba jeleng Selalelo", "b": [["r", "Thapelo ya go kopa boitshwarelo"], ["M", "Modimo, intshwarele ka fa bopelotlhomoging jwa gago, o phimole ditlolo tsa me ka fa boutlwelong-botlhoko jo bogolo jwa gago. Ntlhapise sentle, o tlose tshiamololo ya me, o intshekise boleo. Gonne ditlolo tsa me ke a di itse, boleo jwa me bo fa pele ga me ka gale. Ke wena o le nosi fela yo ke go leofetseng, ka dira se mo matlhong a gago se leng bosula. Bona, ke tsaletswe mo tshiamololong, mme o nkamogetse mo boleong. Fitlhela maleo a me sefatlhego sa gago, o phimole ditshiamololo tsa me tsotlhe. Modimo, mpopele pelo e e itshekileng, o ntšhafatse mowa o o tlhomameng mo teng ga me. O se ka wa ntatlha fa pele ga sefatlhego sa gago, o se tlose Mowa o o Boitshepo wa gago mo go nna. Nkgolola mo melatong yotlhe, Modimo wa pholoso ya me, mme loleme lwa me lo tla dudueletsa tshiamo ya gago. Ditlhabelo tsa Modimo ke mowa o o kgobegileng. Wena Modimo ga o kitla o nyatsa pelo e e kgobegileng, e e phatlogileng. Jesu Morena yo o tsileng go batla le go pholosa ba ba latlhegileng, nkutlwele botlhoko. Amen."], ["r", "Thapelo ya ba ba jeleng Selalelo"], ["M", "Jesu, Morena yo o rategang, ke go leboga ka pelo yotlhe, ka o ntapolositse gompieno ka dineo tse dikgolo, e bong ka mmele wa gago le madi a gago. Ke go lebogela dipogo tsa gago le loso lo o ntshwetseng ka lone mo sefapaanong gore ke gololwe mo maleong otlhe a me le mo losong lo lo sa khutleng. Ke go lebogela tsogo ya gago le tsholofetso ya gago ya gore le nna ke tla tsoga, gonne ke jele dijo tsa botshelo. Morena Jesu, ke go rapela gore o ntshware, ke tle ke nne le wena. Nthuse gore ke tshabe boleo le tenego. Wena o setlhare sa moweine, nna ke le kala fela. Mpolokele mo go sona gore ke nne kala e e ungwang maungo a a go kgatlhang. Mopholosi wa me, o nne le nna ka letsatsi la loso lwa me gore ke tle ke swe ka kagiso. Ke kopa jalo ka ntlha ya lorato lo logolo lwa gago. Amen."]]}, {"t": "Dithapelo: Tlalelo ya Bolwetse le ya Loso", "b": [["r", "Thapelo ya tlalelo ya bolwetse"], ["M", "Morena Modimo, Rara yo o rategang, Lefoko la gago ke le le reng: Mpitse ka letsatsi la tlalelo; ke tla go namolela, mme o tla nkgalaletsa. Morena, ke go rapela gore o nkutlwele botlhoko, ke le mo tlalelong ya bolwetse. Ke itse gore ke bonye tefo ya maleo a me, a ke go leofetseng ka ona. Mme leba Jesu, Morena wa me yo o ntiretseng pholoso e e sa khutleng ka madi a a boitshepo a gagwe, a o a ntshololetseng go intshwarela dibe. Jesu Morena, mphodise o nthuse, fa e le go rata ga gago. Ke baya botshelo jwa me mo diatleng tsa gago. A go dirafale go rata ga gago. Ntapolose ka gonne ke lapile; o nkgomotse, ke le yo o tshogileng. Mme fa o rata go mpitsa, o mphe botshelo jo bo sa khutleng. Ke kopa jalo ka ntlha ya madi a a boitshepo a gago. Amen."], ["r", "Thapelo ya tlalelo ya loso"], ["M", "Morena Modimo, Rraarona yo o rategang, o re file Morwao Jesu Keresete gore mongwe le mongwe yo o dumelang mo go ene a se ka a latlhega, mme a nne le botshelo jo bo sa khutleng. A ko o ntlhomogele pelo. Amen."], ["M", "Keresete, Morwa Modimo, Morena wa me yo o rategang, yo o ntshitseng lefatshe mo dibeng, intshwarele ka ntlha ya madi a a boitshepo a gago. Amen."], ["M", "Morena, nkgolole mo ditirong tsotlhe tse di bosula tsa me, o mpolokele pusong ya gago ya legodimo. Amen."], ["M", "Ke neela mowa wa me mo diatleng tsa gago, ka gonne o nkgolotse, Modimo wa me wa boammaaruri. Amen."], ["M", "Jesu Morena, ke wa gago mo botshelong le mo losong, tshola mowa wa me. Amen."]]}, {"t": "Dithapelo: Maru le Dikgadima, le Marumo a Lefoko", "b": [["r", "Thapelo ya fa go le tumo ya maru le dikgadima"], ["M", "Morena Modimo, Mong-wa-thata-yotlhe, Motlhodi wa legodimo le lefatshe, Rra yo o rategang, o botshabelo jwa me le lorako lwa me lo lo femelang, o Modimo wa me o ke o ikanyang. Ammaaruri o tla nkgolola mo tlalelong e e tlileng mo go nna. O tla mpipa ka diphuka tsa gago, boammaaruri jwa gago ke thebe ya me. Nkutlwele botlhoko ka ntlha ya ga Jesu Morena, o intshwarele dibe tsa me tsotlhe. O mphemele gore bosula bo se ka jwa nkwela, le petso e se ka ya atamela ntlo ya me. Laola baengele ba gago gore ba re sireletse mo gae le mo ditseleng. O se mpetse o le mo bogaleng jwa gago. O beye seatla sa gago godimo ga ntlo le masimo le tsotlhe tse re nang natso. Ke kopa jalo ka Jesu, Morena wa me yo o rategang. Amen."], ["r", "Marumo a Lefoko la Modimo go fenya dithaelo ka ona"], ["M", "Morena Jesu a re: Disang lo rapele gore lo se tsene mo thaelong; mowa ona o tlhaga, mme na ma e bokoa. [Math. 26:41]"], ["M", "Nnang tekano lo itise; gonne Diabolo, moganetsi wa lona, o kgarakgatshega jaaka tau e e dumang, a batla yo a ka mo metsang. [1 Pet. 5:8]"], ["M", "A ga lo itse gore mebele ya lona ke Tempele ya Mowa o o Boitshepo o o mo teng ga lona, o lo o amogetseng mo Modimong, e bile ga lo ba lona? Lo rekilwe ka tlhwatlhwa e kgolo; galaletsang he Modimo ka mebele ya lona e e leng ya Modimo! [1 Bakor. 6:19-20]"], ["M", "Nka dira jang bosula jo bogolo jo, ka leofela Modimo? [Gen. 39:9]"], ["M", "Ntlogela, Satane! Gonne go kwadilwe ga twe: O tshwanetse go obamela Morena, Modimo wa gago, le go direla ene a le esi fela. [Math. 4:10]"]]}, {"t": "Dithapelo: Dijo le Kereke", "b": [["r", "Dithapelo tsa Dijo. Pele ga dijo:"], ["M", "Matlho a botlhe a go lebile, Morena, mme o ba fa dijo tsa bone mo motlheng o o lebanyeng o huporolola seatla sa gago, o kgorisa diphedi tsotlhe ka natefo. Amen."], ["M", "Morena Modimo, Rraarona wa legodimo, re tshegofatse le dineo tse tsa gago, tse re di amogelang, di tswa loratong lwa gago, ka Jesu Keresete, Morena wa rona. Amen."], ["r", "Morago ga dijo:"], ["M", "Lebogang Morena, gonne o molemo, mme boutlwelo-botlhoko jwa gagwe bo nnetse ruri. Yo o nayang ditshedi tsotlhe dijo, o fa dikgomo mafulo a tsona, le magakajane a a lelang o a fa dijo. Re a go leboga, Morena, gonne o molemo, mme boutlwelo-botlhoko jwa gago bo nnetse ruri. Amen."], ["M", "Morena Modimo, Rraarona wa legodimo, re go leboga ka Jesu Keresete, Morena wa rona, ka ntlha ya masego otlhe a gago, wena yo o phelang, yo o busang ka bosena-bokhutlo. Amen."], ["r", "Dithapelo tsa mo Kerekeng. E re o tsenye mo kerekeng, o rapele jaana o re:"], ["M", "Modimo, Rra-batho botlhe ba khumanego le tlalelo, re tshegofatse rotlhe, o bonese dipelo tsa rona ka boammaaruri jwa Lefoko la gago. A pako le tlotlo le tebogo di nne tsa gago ka bosena-bokhutlo. Amen."], ["r", "Gongwe:"], ["M", "Ke fano, Jesu, yo mpitsang, ke tla go wena yo nthatang, ke tsisa pelo e e leng ya gago, wena yo ntshwetseng. Amen."], ["r", "Fa Kereke e tswa, o rapele jaana o re:"], ["M", "O re thuse pololong, le mo kgorogong ya rona. Re tlamele leetong le mo ditirong tsa rona. Re fe boswa jwa godimo, go nna bana ba Modimo. Amen."], ["r", "Thapelo ya fa motho a atamela go amogela Selalelo sa Morena:"], ["M", "Modimo, nkutlwele botlhoko, ke moleofi! Morena Jesu, wena yo o bakwang segolo, nkutlwele botlhoko! Morena Jesu, Kwana ya Modimo, yo o rweleng maleo a lefatshe, nkutlwele botlhoko! Morena Jesu, nthuse gore ke amogele Selalelo sa gago ka tshwanelo, ke amogele bopelotlhomogi jwa gago. Amen."], ["r", "Fa motho a amogetse Selalelo, a rapele a re:"], ["M", "Morena Jesu Keresete, mmele o o boitshepo wa gago ke o jele, madi a gago a a molemolemo ke a nole, le dipogo tsa gago le loso lo lo botlhoko lwa gago di ntiisitse. Morena Jesu Keresete, ke a go leboga mmogo le bakeresete botlhe ba gago. Amen."], ["r", "Thapelo ya go tswa mo Kerekeng"], ["M", "Morena, Modimo wa me, ke go lebogela Lefoko la gago le o ntshegofaditseng ka lone. Lefoko la gago ke sejo sa mowa wa rona. Nthuse ke tsamae ka Lefoko la gago mo botshelong jotlhe jwa me. Tshegofatsa go tswa ga me mo kerekeng, o tshegofatse go tsena ga me kwa gae. O ntshireletse gore Satane a se nkamoge tshegofatso e ke e neetsweng ke wena ka bopelotlhomogi jwa gago. Neela matla ka Mowa o o Boitshepo, ke gole ka Lefoko la gago mo go boifeng wena ka Jesu Keresete, Morena le Mopholosi wa rona. Amen."]]}, {"t": "Kgothatso ya ba ba amogelang Selalelo", "b": [["M", "Barategi ba me mo Moreneng! Lona lotlhe ba lo atamelang mo Selalelong, gopolang se Paulo, moaposetolo wa Morena, a se buang fa a re: \"A motho a itlhatlhobe pele, morago ga moo a je senkgwe se, a ba a nwe ka senwelo se; gonne yo o jang, a ba a nwa ka mokgwa o o sa tshwanelang, o ijela le go inwela petso, ka a sa tlotle mmele wa Morena.\" [1 Bakor. 11:28-29] Ka moo itiseng gore lo se amogele Selalelo se se Boitshepo ka mokgwa o o sa tshwanelang. Atamelang ka tumelo le ka boingotlo go amogela se lo se fiwang ke Morepholosi Jesu Keresete, e bong mmele wa gagwe ruri o lo o neelwang mo senkgweng, le madi a gagwe ruri a lo a nosiwang mo weineng, gore lo nne mo go Keresete le Keresete a nne mo go lona, lo nne mmele o le mongwe fela le ene. Supang ka botshelo jotlhe jwa lona fa lo le bana ba Mopholosi wa rona yo re mo tsaletsweng, a ba a re swela mo sefapaanong a re tsogela mo losong. Mo saleng morago lo ile tse a di ilang, lo ratane jaaka a lo ratile, lo itshwarelane jaaka a lo itshwaretse. A Modimo o re tshegofatse go dira jalo. Amen."], ["r", "Thapelo ya ba ba ratang go ja Selalelo"], ["M", "Morena Jesu Mopholosi wa me, o mpoleletse ka Lefoko la gago gore, ke wena senkgwe sa botshelo, mme yo o jang nama ya gago, a ba a nwa madi a gago, o na le botshelo jo bo sa khutleng, mme o tla mo tsosa ka letsatsi la bofelo. Ke tla go wena, ke a go rapela gore o njese mmele wa gago, o nnose madi a a boitshepo a gago. Ke itse gore ga ke na tshwanelo ya go amogela dineo tse dikgolo tseo, mme ke kopa gore o nthuse, o mphe tumelo e e siameng, ke tle ke tshware Lefoko la gago ka yona. O nkapese madi a gago le tshiamo ya gago, gore Selalelo sa gago ke se jele tshegofatso, e seng molato. Jesu Morena, ntlhomogele pelo. Amen."]]}];

var NEWH=[{"n":202,"t":"Latlhela go Morena","c":"Difela tsa Tumelo: Ka ga Modimo Rara","k":"K187","v":["Latlhela go Morena / tse di go imelang; / ka gonne oa di kgona / tse di go palelang! / Yo o dirang ditsela / tsa phefo, kwa e yang, / a o ka gotlhokela, / fa 'nao lo gatang?","Ikanye tlhe Morena / le se a se dirang, / foo o tla phela sentle, / o tswella mo tirong. / Modimo ga o kgonwe / ka sello tshwenyegong; / o batla go rapelwa / ke yo o dumelang.","Modimo, o Rraarona / yo o ikanyegang, / o itse go re naya / tse di re phedisang; / o itse go thibela / tse di re senyetsang, / o re dirafaletsa / tse o di akantseng.","O na le tsela tota, / ka o se yo ' pallwang; / o tshegofatsa batho, / go tsena leseding; / ga go na motho ope / yo ' ka go thibelang, / fa o abela batho / tse di itumedisang.","Le fa bo-Satan botlhe / e le ba ' ganelang, / Modimo o tla tswella / tirong ' o e dirang. / E bile o tla fetsa / se o se simollang; / ga re o belaele, / ke o ' nonofileng.","Fa o na le botlhoko, / tshabela Modimong; / mme o se nyeme moko, / ka ona o le teng; / o bopelotlhomogi, / o go ntsha bodibeng; / o lebelele ona / o o sa swabiseng.","Lebala matshwenyego / le tse di go Ilisang; / fa di lapisa pelo, / o tie Moreneng, / ka e se wena mmusi / wa tse di go tlelang; / di IaoIwa ke Modimo, / ke o o di itseng.","Le fa o ka diega / go thusa tlalelong, / le fa o ka nna jaaka / o o go lebetseng, / o se re, o lebetswe / ke o o go lekang. / O tswelle go rapela / Modimo o ' reetsang.","Mme fa o go fitlhela / o le boikanyong, / o tla go falodisa, / fa o sa gopolang; / morwalo oa o rola / o o go imetseng; / ga oa go leofisa, / ò yo ' itshokileng.","Ka moo o tshegofetse, / o tla nna yo ' bonang / serwalo sa botshelo, / mo o tla lebogang. / Modimo o go tsenya / dipalme diatleng; / o tla o opelela / le ka bosakhutleng.","Morena, ao khutlisa / tlalelo lefatsheng; / dinao le diatla / di tiise mo boeng, / mme o re babalele / go fitlha kwa losong. / Re tla goroga jalo / kwa gae legodimong."]},{"n":203,"t":"O didimale, o se lele","c":"Difela tsa Tumelo: Ka ga Modimo Rara","k":"K188","v":["O didimale, o se lele, / o ikanye tlhe Morena! / Mme o nne o mo solofele, / ke motswedi wa kgomotso. / Ke ene fela 'tsatsi la 'go, / o go tlhabela metlha yotlhe. / O didimale!","O pelo ruri, oa go rata, / 'tiro tsa 'gwe diabonala. / Mo tlalelong o na le thata, / botlhokong ke Motlamedi. / Mo bosuleng oa go femela, / le loso o a lo laola. / O didimale!","O itse gore ò a tlhoka, / wena le ba bangwe botlhe. / O bona phefo, fa e foka, / le 'pogiso tsa 'go tsotlhe. / Le dikeledi oa di bala, / letlhologello oa le bona. / O didimale!","Fa go se ope 'fatsheng leno / yo o ikanngwang ke wena, / Morena o a ikanyega, / o tshabele kwa go ene. / O itse pogo yotlhe ya 'go / le nako ya go e khutlisa. / O didimale!","O se mediwe ke dinteelo / tsa lewatle la dipogo. / O se lebale botshabelo, / ena yo ' se nang phetogo. / Mme le fa o tlhokofadiwa, / gantsintsi o tla gomodiwa. / O didimale!","O lelelang bophelong jwa 'go, / se o tla se jang ka moso? / Yo o go neileng botshelo / o boloka mmele wa 'go. / Seatla sa 'gwe se phedisa / diphedi tsotlhe ka lorato. / O didimale!","Dithunya o a di apesa, / di sa dire motlha ope, / le dinonyane oa di jesa, / le fa di sa jwale gope. / Le wena, o tla go tlamela, / mme matshwenyego a tla fela. / O didimale!","Go tla tla 'tsatsi la boikhutso / la go gollwa ke Modimo; / o tla bofolla mmele gotlhe / dikgoleng tsa yo ' bosula. / Ka loso o tla re golola, / ka tsogo o tla re ntšhafatsa. / O didimale!","Re tla kopanngwa le phuthego / ya baitshepi kwa godimo, / ba ba neng ba swa ka kagiso, / re tla itumela nabo. / Kwa teng re tla nna le Morena, / a re phimola dikeledi. / O thethebale!"]},{"n":204,"t":"O se ngongorege","c":"Difela tsa Tumelo: Ka ga Modimo Rara","k":"K189","v":["O se ngongorege, / gonne matshwenyego / a ' go imelang / a itsiwe sentle / ke Morena Jesu / yo o a fenyang. / O humile bophelong, / fa o sa lape go rapela, / o le modumedi.","Mmopi o humile, / le fa o' ka tlhoka / tse o ka di jang. / Utlwa tlhe: Modimo / ke Mong wa masimo, / pula le marang, / wa bojang jo bo tlhogang, / Mong wa monyo le dijwaIo, / le dikgomo jalo.","Fa o se na sepe, / go se felo gope, / kwa o ka nnang teng, / kobo o e tlhoka, / batho ba go eka / mono lefatsheng, / o se Ile! Dumela tlhe, / fa a le teng Mothatayotlhe / ka dipaka tsotlhe.","Yo ' balang dithiri, / yo ' jesang diphiri, / thaga le manong, / a o ka go lebala / a se ka a kgathala, / fa o le botlhokong? / Yo ' neetseng mo lefatsheng / Morwa go go rekolola / o sa go gopola!","Rra a a ka gana / go abela bana / sejo mo tlaleng? / Ruri, ke e kgolo / yona thekololo / ya ' go mo dibeng! / Yo ' akang, yo ' go forang / ke Satane, ka a rile: / Mong o go latlhile.","Mowa oa o jesa, / mme a ka lebala / mmele wa 'go jang? / Mmele le bophelo / le boitekanelo / di tswa mo go mang? / Mo motseng le mo nageng / o ntse a go babalela; / a go tlhabanela.","Fa o mmitsa Rara, / mme o mo ikanya / ka fa Lefokong, / ga a ne a gana / go go dira ngwana / yo o humileng. / Yo ' kopang, yo ' dumelang, / tsotlhe a ka di mo naya / ka bonako fela.","Ao, gakologelwa / Mong wa magodimo / yo ' go lefetseng. / O ne wa emelwa / ke Morwa Modimo / ka go ya losong. / Le jaanong teng kwa Rareng / o ntse a go buelela, / a go rapelela.","O na a go batla / thata le ka maatla, / o le timelong; / ga a ka a lapa, / wena o itsapa / go tswa maleong. / Ka o tsenye phologong, / a o sa ntse o galala / thuso e e kalo?","Lesa he go lela; / gonne go sa phela / ena yo ' thusang. / Dira 'tiro tsa 'go, / o ntse o rapela / yo ' ikanyegang. / Le fa o le lehumeng, / o tla phela o thusitswe / ke Mothatayotlhe."]},{"n":205,"t":"Jehofa yo ' mo leseding","c":"Difela tsa Tumelo: Ka ga Modimo Rara","k":"H55","v":["Jehofa yo ' mo leseding, / o busa dilo tsotlhe lefatsheng, / ke Mong-wa- thata-tsotlhe yo ' laolang, / ke gona re mo dudueletsang. / Mme re mo obamela mo moweng, / le go mo naya tlotlo mo kerkeng.","Masedi otlhe loaping, / dithaba le dinoka lefatsheng, / diphedi tsotlhe tse di mawatleng, / di tlotla ene yo ' di tlhodileng, / e bong Modimo, o o di busang; / mme o di neela ka fa di tlhokang.","Le rona ba re dumelang, / re tlotla ene yo o re busang. / O re rometse Jesu lefatsheng, / go re ntsha rotlhe rotlhe mo dibeng; / ke ene Rara yo o re ratang. / Bakang Morena lotlhe, ee, bakang!"]},{"n":206,"t":"Morwa Modimo Jesu Krist'","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K190","v":["Morwa Modimo Jesu Krist', / Morwa-Rra yo o nthabisang, / Mong wa pelotlhomogi; / o itse se ke se buang, / ke rata go nna mo nneteng, / o itse dilotsotlhe: / Ke go rata / ka natefo, / ka ke itse, / ga go sepe / se se lekanang le wena.","Go sengwe teng se se ntshwenyang, / ke gore ke yo ' tlhaelang / go rata wena tota. / Ke sa ithuta le jaanong / go rata wena mo pelong / bogolo go tse tsotlhe. / Ke a lopa / pelong ya me / mo go wena, / Jesu, ka re: / Tiisa mo go nna lorato.","Mme ene yo o go ratang, / le wena o mo rata jang, / o mo fa le kagiso; / mme le fa a ntse lefatsheng / mo dipogong le maketeng, / o tla go itumella. / O tla rua / la bofelo / boitumelo / jo bogolo, / a tswa tlalelong e kgolo.","Ga go na motho lefatsheng / yo ' utlwileng, yo o bonyeng / tse di tla newang bone / kwa godimong kgalalelong, / ba ba go ratileng pelong, / mme jaana baa go bona. / Gonne ruri / ga go tshwano / ya tsa mono / tsa tshokamo / le tsa gago tsa tlhomamo.","Ke gona ke tla ithutang / go rata wena yo ' nthatang, / go rata wena fela, / go dira se se go kgatlhang, / ka fa Lefoko le nthutang, / e bong go go direla. / La bofelo / ke tla fitlha / kwa go wena / ka lethabo, / ke golotswe gotlhe-gotlhe."]},{"n":207,"t":"Morena ke Modisa wa ka","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K191","v":["Morena ke Modisa wa ka, / ga go na se ke se tlhokang; / mme ka sebaka le sebaka / ke ene yo o mphudisang / mo mafulong a a manana, / a ba a nkise, nna nku ya 'gwe; / metsing a a ntapolosang. / E bile fa ke lapa thata, / ke idibetse, foo a nthuse, / a nthatafatse mo moweng.","Modisa o nketella pele / mo tselaneng e ' siameng. / Mo lefifing ga ke timele, / ke mo latela mo tseleng. / Mme le fa mo tseleng nka tsena / mo mogorogorong wa loso, / ga go na se se mpoifisang; / ka gonne Jesu o na le nna; / mme tsamma ya 'gwe e a nkgoga; / ke yona e e nkgomotsang.","O mpaakanyetsa boitumelo / ka dijo tse di natefang; / mme baba ba me ba tswa pelo, / ka gonne ke ba ba nkilang. / Le tlhogo ya me oa e tlotsa, / ka metlha yotlhe oa nkgomotsa, / ka moo ke mo tuduetsong. / Senwelo sa me sea tshologa, / lenyora lotlhe le fetoga / boitumelo mo pelong.","Jaanong ga go na motho ope / yo o ka re kgaoganyang. / Mme ga go na botshelo bope / jo bongwe jo bo ka nkgatlhang. / O ntshegofatsa ka masego, / ka ke le ngwana wa thatego / mo 'tlung ya gagwe phuthegong. / Motlhanka ga a na boswagona, / ke ngwana, nna ke tla bo bona / kwa gae mo legodimong.","A Haleluya a opellwe / Modisa yo o re disang; / a re tlotleng Imanuele / wa rona, yo o re thusang! / Mme yo o go kgatlhang bogolo / ke yo o go ratang gagolo / ka 'rato lo Io sa feleng. / A ko ' mphe pelo e ' ntseng jalo, / e ' go ratang, Mong, go le kalo, / Modisa yo o nthatileng."]},{"n":208,"t":"Legodimong, kgalalelong","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K192","v":["Legodimong, kgalalelong, / Jesu, o re gogele / kwa o ileng, kwa o ntseng teng, / Mong, a re go latele.","Le mo tseleng e ' siameng / re etelele pele. / Mo timelong, mo phapogong, / Jesu, re itshwarele.","Re sa le teng mo ditekong, / Jesu, se re tlogele. / Mo bofelong, e bong losong, / re thuse go go swela.","Re ise teng kwa lekgotleng / la gago la borena, / re nne kwa teng le ba ba leng / ba gago, ao Morena."]},{"n":209,"t":"Leina le le rategang","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K193","v":["Leina le le rategang / ke la ga Jesu, Mong; / ke lone le le gomotsang / ba ba mo maleong.","Le tlosa po Mifo mo pelong, / le re ntsha maketeng, / le re fodisa pobolong, / e e duIeng dibeng.","Le tshwana mo diphegelong / le metsi a ' nowang, / le tshwana mo ditlalelong / le Mmana o ' tiisang.","Ke lone le le phimolang / keledi mo matlhong; / ke lone le le gomotsang, / fa re le mo petsong.","Ke lone khumo botshelong, / e e sa nyeleleng; / le tshegofatso mo pelong, / lobone mo tseleng.","Leina le le rategang / la ' Jesu Kriste, Mong, / ke lone le le pholosang / ba ba tlhabologang."]},{"n":210,"t":"Jesu ene yo ' nthatang","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K194","v":["Jesu ene yo ' nthatang / ga a ka ke a ntlogela, / ka a le yo o ntshwereng / ka seatla e le ruri. / Ene Jesu yo ' ntshwereng / ke yo ke mo ikanyang.","Ere ke le poifong / ya go ka gatellwa 'fatshe, / e nne Kriste yo ' ntiisang, / ka letsogo a ntshegetse. /Jesu ke yo o ntwelang, / nna yo ke mo ikanyang.","Fa Satane yo ' ntlhoang / a ka nteba mo go Rara, / e nne yo o fitlhelang / Krisete a nthapeletse! / Jesu yo ' mpuelelang / ke yo ke mo ikanyang.","Ere ke le timelong, / mme lefifi le mpipile, / go se fa ke gatang teng, / mo ke reng, ke nyema moko: / E nne Jesu yo ' nkgogang, / nna yo ke mo ikanyang.","Batho ba ba mo ganang / ba tshwanetse go roroma; / tse ba di itshenkelang / di tla fela ka bonako. / Ene Jesu yo ' phelang / ke yo ke mo ikanyang.","Ga go se se tla kgonang / go mphamola mo go Kriste. / Ga ke yo ' belaelang / se se boletsweng ke ene! / Jesu ga se yo ' ntesang, / nna yo ke mo ikanyang."]},{"n":211,"t":"'Fika la bosakhutleng","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K196","v":["'Fika la bosakhutleng, / 'fika le le fatotsweng, / boitshubelo theregong / le kgololo tatlhegong, / ke itshuba lefikeng, / e bong Jesu yo ' ntshwetseng.","'Tiro tse ke di dirang, / dillo tse ke di lelang / ga se tse di ka tIosang / dibe tse di nkimelang. / Ga di ise Modimong, / ga di tsenye botshelong.","Mme ke madi a ' elang / a ga Jesu, a a tswang / mo tlhogong le 'tlhakoreng, / dinaong le diatleng; / ke ona a a ntlhapisang, / ke ona a a mpholosang.","Jesu yo o sa khutleng, / wena yo o ntlhabetsweng, / ke itigela / s'fapaanong, / ke iphitlha mo dinthong. / A ko ' nkine mo mading, / ke nne yo ' itshekileng.","Ke tla leba Jesu Mong, / ke ntse ke le botshelong / le motlhang ke yang losong, / ee, le gona mo tsogong. / Ke tla leba yo e leng / 'fika le le sa khutleng."]},{"n":212,"t":"Ditsela ' dintsi lefatsheng","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K197","v":["Ditsela ' dintsi lefatsheng / di khutla mo bontshong; / mme bantsi ba sepela teng, / ba wela tshenyegong.","Go tsela e nngwe e e yang / kwa gae legodimong: / Ke Jesu yo o re isang / kwa Rara a leng teng.","Ke tsela e ' sa timetseng, / ka e se e ' gakang; / e bonwa teng mo Beibeleng / ke ba ba dumelang.","Ke tsela e re falolang / ka yona melatong; / ke tsela e re tla fitlhang / ka yona 'godimong."]},{"n":213,"t":"Mokgabo wa me lefatsheng","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K198","v":["Mokgabo wa me lefatsheng / ke wena Jesu yo o leng / Motshegofatsi wa me. / Mo botlhokong / le ipelong / o nna mo pelong ya me.","Lorato lo o nthatileng / ka lone, ke lo ' tiileng, / lo ka se ka Iwa fela. / Mo tlalelong le mo losong / ke tla go ngaparela.","Lefoko le ' tswang Moreneng / ke lone le ' ikanyegang, / ga le ne le nyelela. / Mo botshelong / le bokhutlong / ke tla ineela wena.","Letsatsi ke le ' phirimang, / o se nne yo o ntlogelang, / Morena Jesu Kriste. / Lesedi la / 'go lefatsheng / a"]},{"n":214,"t":"Boitumelo","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K199","v":["Boitumelo / bo mo go Jesu, / le fa re le tshwenyegong; / gonne o aba / dineo tsotlhe / tse di tswang legodimong. / Ene o kgaola / dikgole tsotlhe; / fa re ikanya / ene Morena, / foo re tla phela. Haleluya! / O mo go rona, / re mo go ene, / fa re sa phela, / le fa re fela, / re tla nna nae. Haleluya!","Fa re na nao, / ga go na sepe / se se ka re senyetsang. / Ka gonne wena / o busa tsotlhe, / o re golla tlalelong. / Re a go boka / ka boitumelo, / re go opella / ka thata yotlhe / ka nako eno. Haleluya! / Re duduetsa / le go godisa / leina la 'go, / Mong wa dithata, / ka pelo yotlhe. Haleluya!"]},{"n":215,"t":"Le Mina la Morena Jesu","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K200","v":["Le Mina la Morena Jesu / ke leina la lesedi, / ke la go re: Mopholosi, / yo o pholosang dibeng.","Ke leina le legolo / le le gomotsang segolo / ba ba lelelang kgololo, / ba le mo ditlalelong.","Ga go teng leina jaaka / le la \"Jesu\", la Mongwaka; / eare fa ke bitsa lone, / ke nne yo o thusegang.","Ke leina la Modisa / yo o tlhoko, a fudisa / dinku le go di rudisa, / fa di le kidibalong.","Gape o bidiwa Kriste, / e le go tlhalosa tiro / yaopristi yo mogolo, / ya thuanyo Modimong.","Ke leina la borena, / ke la go re: Re golotswe, / gore re nne batho ba 'gwe, / Kgosi e e sa khutleng.","Jesu Kriste ke Modimo, / Mmusi le wa legodimo! / Leina le ke la bodimo, / ke le le mo tshwanetseng."]},{"n":216,"t":"Jesu, Modisa phuthegong","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K201","v":["Jesu, Modisa phuthegong, / o re ineetse mo losong / go re lefela kwa Rareng / molato o o tswang dibeng.","Ka re ne re le mo bontshong, / re bile re le timelong, / o fologetse lefatsheng / go re ntsha rotlhe mo dibeng.","Ka rosi re paletswe jang / go tshaba petso e e tlang! / Ka moo o tsenye mo losong / go re golola molatong.","Fa re ka swela melatong, / re tla ya tota kwa petsong e ' boitshegang kwa moleteng / wa mollo o o sa timeng.","Mme Jesu yo ' tsileng 'fatsheng / ke ene yo ' re golotseng / ka 'rato lo logolo jang! / Ke tiro e e gomotsang."]},{"n":217,"t":"Dinku tsa me, ka di utlwa","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K202","v":["Dinku tsa me, ka di utlwa / lentswe la me Beibeleng, / ga di kitla di gapiwa / ke Satane mo ' sakeng.","Ga di kitla di timela, / le fa di le thaelong. / Ga di kitla di nyelela, / ka di kgora mafulong.","Rara yo o leng mogolo / o di nnetse seatleng / ka lorato lo logolo, / ga di ne di gatšwa teng.","Jesu yo o buang jalo / ke Modisa yo ' siameng, / mme fa mongwe a timela, / o mmusetsa lesakeng."]},{"n":218,"t":"Jesu, ke wena yo ' nthatang","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K203","v":["Jesu, ke wena yo ' nthatang, / ke wena yo o mpholosang; / ke sianela sehubeng / sa gago, yo o mpiditseng.","Ga ke na se se ka mpipang, / ga k' itse kwa nka iphitlhang, / fa e se kwa go wena, Mong, / ka ke agile mo direng.","O nthuse ke le letshogong / le le ntshwereng, / le tswa dibeng. / Ke boifa Satan yo ' senyang; / ke ene tau e e dumang.","Mme ke lelala 'godimong, / o se ntlogele tlalelong! / Ke wena yo ' ikanyegang, / lefika le le tlhomameng.","A ko o ntshole diatleng, / a ko o mpipe diphukeng / tsa gago tse di femelang / mo dilong tse di boitshegang.","Ke go biditse thapelong, / o nkutlwe, wena Jesu Mong, / mme o ntshwatole lefifing / gore ke tshele leseding.","Ee, o motswedi o o nang / le metsi a a phedisang; / nna ke eletsa go nwa teng / bophelo jo bo sa khutleng."]},{"n":219,"t":"Jesu Kriste, o Modisa","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K204","v":["Jesu Kriste, o Modisa / yo ' molemo, yo ' disang / dinku tsa 'go; le nna ntise, / ke nne yo o go utlwang. / Ka o beetse dinku tsa 'go / ka lorato 'phelo jwa 'go, / le nna o bo mpeetse, Mong, / ka loso sefapaanong.","Ka o disa letsomane, / bone ba ba ratanang, / le nna a ko ' ntise jalo, / ke nne yo ' go ineelang. / A lorato lo nkelele, / Iwa me ke a lo go naya. / Wena Jesu yo ' nthatang, / ntire yo o go ratang.","Dinku di ntse di mo itse / ene yo o di disang, / le nna ke utlwile jalo / lentswe la yo o nkgogang. / Le ntse le ntlhagisa le re: / Tshaba Satan, moraedi, / yo dinku o di metsang, / tsotlhe tse di timetseng.","Dinku tsone di utlwella / lentswe le le di bitsang; / mme Modisa oa di Iwela, / ka a utlwa tse di Ilang. / Fa o mpitsa, ke tla reetsa, / fa o mpetsa, ke tla baka, / ke go utlwa Lefokong; / le nna nkutlwe thapelong.","Jesu, nkutlwe ke le ngwana / wa 'go yo o go Ilelang; / ka gobane ke nku ya 'go / e e go solofelang. / Reetsa he selelo sa me, / o gomotse pelo ya me. / Ka ke kopa, nkutlwe, Rra, / dira jalo, se re: Nnyaa.","Jesu, fa ke konyakonya, / o nne yo o mpulelang. / Jesu, nthute go akanya / 'Foko la 'go Lokwalong. / Nna, Morena, ke rapela / leineng la gago fela; / a ke utlwe mo pelong / o re: Ee! legodimong."]},{"n":220,"t":"Jesu yo ' nthatang","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K205","v":["Jesu yo ' nthatang, / Kwana e ' ntshwetseng, / ke a baka ' rato Iwa 'go / lo lo nkgogelang go Rrago; / lo lo nntshang dibeng, / ke ye legaeng.","Ke lo lo tukang, / lo lo pholosang. / Fa o nteba ka tsalano, / re kopanngwa ka thatano. / O nkgomotsa jang, / wena yo ' nthatang!","Ao, Modimo Mong, / o tswa 'godimong / go nna motho, gore batho / ba gololwe, ba nne phepa, / ka ba le dibeng / mono lefatsheng.","Jesu yo ' ntletseng, / nthuse mo tseleng / ka go sedifatsa pelo / ka lesedi la tumelo, / ke tswe lefifing, / ke ye leseding.","Mono lefatsheng / ke wa gago teng. / Ke itumella 'rato Iwa 'go, / ke tumisa 'tiro tsa 'go; / le kwa 'godimong / ke wa gago teng.","Yo o namolang / ba ba go batlang, / 'rato Iwa 'go a lo mphenye, / gore 'fatshe le se ntshenye, / le le go ilang, / yo ' re namolang.","Re mo kagisong; / gonne loratong / o ineetse go re swela, / rona jaanong re a tsheIa. / Re mo tshiamong / le mo kagisong.","Go humile jang / yo o go ratang! / Ka tumelo rea go tshwara, / ka lorato oa re fara. / Yo o go ratang o humile jang!"]},{"n":221,"t":"Gopola Jesu mo pelong","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K206","v":["Gopola Jesu mo pelong / yo o tsileng go rona, / a tlhaga kwa legodimong, / mme a nna Morwa-rrago. / Se mo lebale yo e leng / lesea ' o le tsaletsweng. / O mo leboge thata!","Gopola Jesu mo pelong / yo ' neng a go bogela, / a swela mo sefapaanong, / a go golola / jalo. A go fenyetsa tlhabanong / loso le Satan mo losong. / O mo leboge thata!","Gopola Jesu mo pelong / yo o bileng a tsoga, / a fenya loso mo tsogong / le ditlalelo tsotlhe; / ke ene yo o tsisitseng / kagiso e e sa khutleng. / O mo leboge thata!","Gopola Jesu mo pelong. / Fa a sena go di wetsa, / a tlhatlogela 'godimong, / go go direla manno, / legae le le tlhomameng, / kwa ene Jesu a leng teng. / O mo leboge thata!","Gopola Jesu mo pelong. / O tla ba a tla gape; / o tla atlhola mo tshekong / ya baswi le batshedi. / O iketleetse lefatsheng, / o tle o atlholelwe teng, / go pheIa nae ruri.","Ao Jesu, ntiise tumelong / ya nnete, ya tlhomamo; / ke se nne yo o lebalang / ditiro tsa 'go tsotlhe. / A e nne tse di nkgomotsang; / mme la bofelo mo losong / ke ye go phela nao."]},{"n":222,"t":"O tsela le bonnete le bophelo","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K208","v":["O tsela le bonnete le bophelo, / o buile jalo gore go nne felo, / kwa re ka tshabelang teng, ao Morena, / go nna le wena.","O tsela, gonne yo o tlang ka wena, / ene o fitlha sentle kwa go Rara. / Re a go kopa: Re etelle pele, / re se timele.","O boammaaruri, rona re ba maaka; / o re golole gotlhe mo go ona, / re fetolele setshwanong sa gago, / go nna ba gago.","Mme o bophelo, o Morwa Modimo, / re tla go bona le go phela nao. / Foo re tla baka ka mantswe a sele, / ka boipelo."]},{"n":223,"t":"Se reng: Dikhumo tsa lefatshe","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K209","v":["Se reng: Dikhumo tsa lefatshe / ke tsone tse di batlegang; / ga di lekane go mphedisa, / ga di nkgorise mo pelong. / Lo rate se lo se ratang, / ke rata Jesu yo ' nkgatlhang.","Ke ene bo Mitumelo jwa me, / e bile ke yo ' nkhumisang; / ke bona mo go ene fela / tse pelo e di eletsang. / Lo rate se lo se ratang, / ke rata Jesu yo ' nkgatlhang.","Tse di ratwang lefatsheng leno / ke tsone tse di nyelelang; / sebaka se fedisa bontle / jwa tsotlhe tse di dirilweng. / Lo rate se lo se ratang, / ke rata Jesu yo ' nkgatlhang.","Ke ene 'sedi le bophelo / le nnete e e sa khutleng. / Ke ene ruri botshabelo / jwa botlhe ba ba mo dibeng. / Lo rate se lo se ratang, / ke rata Jesu yo ' nkgatlhang.","Ke ene Kgosi ya tlotlego, / Morena mo kgalalelong, / Moregolodi wa lorato, / Monamoledi tatlhegong. / Lo rate se lo se ratang, / ke rata Jesu yo ' nkgatlhang.","O na le motse wa tlhomamo / le puso e ' sa senyegeng; / sedulo sa 'gwe sa bogosi / se eme ka bosakhutleng. / Lo rate se lo se ratang, / ke rata Jesu yo ' nkgatlhang.","Dikhumo tsa 'gwe di dikgolo, / ke Kgosi e ' apesitsweng; / o galalela sefatlhego, / ga se se se ka swafalang. / Lo rate se lo se ratang, / ke rata Jesuyo ' nkgatlhang.","Jesu o itse go nntšhafatsa, / ke nne yo o galalelang; / o tla mphetola, ke nne mošwa / ka mmele o ' sa senyegeng. / Lo rate se lo se ratang, / ke rata Jesu yo ' nkgatlhang.","Mme fa ke sa ntse ke tlhaellwa, / ke tlhoka tse 'ntsi lefatsheng, / legodimong o tla nkabela / tse tsotlhe tse o di tshotseng. / Lo rate se lo se ratang, / ke rata Jesu yo ' nkgatlhang."]},{"n":224,"t":"Ke a go rata, Jesu wa me","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K210","v":["Ke a go rata, Jesu wa me, / ka 'rato lo lo sa feleng! / Ke a go rata, thata ya me, / ka pelo e e sa lapeng! / O 'sedi le le nthabisang / jaanong le mo losong.","Ke a go rata, tsala ya me, / ao Jesu yo o nthatileng. / Ke a go rata, oa mphedisa, / o Kwana e e ntlhabetsweng. / Ke a go rata yo o leng / Monthusi yo ' ntshwetseng.","Joo wee! Ke diegile thata, / ka nna yo o sa go utlweng; / o ne o ise o nne wa me, / ke le yo o sa go itseng. / Jaanong ke tlhajwa ke ditlhong / pelong le mo matlhong.","Ee ruri, ke ne ke timetse, / ka nna sefofu mo moweng. / Jesu, ke ne ke go tlogetse, / ka rata tse di bopilweng. / Ke wena yo o mpusitseng, / yo o impontshitseng.","Kea go leboga, 'tsatsi la me, / ka o nkgolotse lefifing; / kea go leboga, Kgosi ya me, / ka o nkisitse leseding. / Kea go leboga thata jang, / Ngaka e ' nkalafang!","Mpoloke he, ke se fapoge / tseleng e ' yang legodimong. / O nthuse ke tle ke goroge / kwa phuthegong e ' go bakang. / Ke nne le wena kwa o teng / mo boitumelong.","Ke a go rata, Krone ya me, / ke a go rata, Jesu Mong! / Ke a go rata, khumo ya me, / le gona mo dipogisong. / Ee, ke go rata bophelong, / le gona mo losong."]},{"n":225,"t":"Bonang tlhe, go phatsima jang","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K211","v":["Bonang tlhe, go phatsima jang / Morena Jesu yo e leng / naledi e ya masa! / O Morwa Dafit yo o tswang / 'sikeng Iwa Jakob, yo ' tletseng / lorato le bonnete. / O pelontle, / o yo montle, / o mogolo, / o Morena, / o lesedi la lefatshe.","Morwa Modimo yo ' mpusang, / Morwa Maria yo ' nthusang, / o busa mo ntlheng tsotlhe. / Mafoko a o a rutang / ke ona a a mphedisang, / a phala le dinotshe. / Jesu, Jesu, / kea go baka, / ke itshupa / ke le wa 'go; / ke ka Mowa o ' Boitshepo.","Morena Jesu yo ' nthatang, / a ko o ntshelle mo pelong / molelo wa lorato; / o ntlhomamise tumelong, / go se nne se se nkgaoganyang / le wena Kgosi ya ka. / A ko ' ntlatse / boitumelo / le lorato, / re kopanngwe, / loso lo se re kgaoganye!","Bakriste botlhe, opelang / Modimo o ' galalelang, / lo o itumelele. / Re na le Jesu leetong, / re sepelela leseding, / re itse botshabelo. / 'Tšhaba tsotlhe, / lo opele, / lo ipele, / lo leboge / Jesu, Kgosi ya ba botlhe.","Jaanong ke itumella jang / Morena Jesu yo ' phalang / dikhumo tsa lefatshe! / O ntshole kwa Paradising, / ke go leboge thata teng, / ke phele nao ruri. / Amen, Amen, / Motlotlegi, / tla ka pele, / se diege, / ka ke go tlhologeletswe!"]},{"n":226,"t":"Ke dirang go ngongorega","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K212","v":["Ke dirang go ngongorega / yo ke leng / mo Kristeng, / le fa ke tshwenyega? / A nka tseelwa legodimo, / ka jaanong / tumelong / ke le wa Modimo?","Ke ne ke sa ikatega / kgorogong, / botsalong, / ke humanegile. / Mme ke tla huduga jalo / mo 'fatsheng / le ' tletseng / loso le konalo.","Thoto, mmele le bophelo, / tse di tswang / Modimong, / ke di filwe fela; / mme fa o di ntlogedisa / bofelong / mo losong, / ga ke ngongorege.","Fa o nthwesa sefapaano, / 'pogo teng / magetleng, / a ke tla tlhoboga? / Nnyaa, Modimo oa nkgomotsa, / o ' rileng, / nna ke teng, / ke tla se go rola.","O ntiretse tse di pila / gantsi jang / malatsing / a botshelo jwa me! / Mme ke tla nna ke ineela, / fa jaanong / mo tekong / ke rwesiwa 'pogo.","Satan le baikepi botlhe / ba ba Iwang, / ba ' ntshotlang / ka malatsi otlhe, / a ba ntshotle, ga se sepe! / Bofelong / mo tshekong, / foo ba tla senyega.","Loso ga lo re bolae, / ba re leng / Moreneng, / mme loa re golola. / Dibe di tla khutla gona, / re ya teng / kwa go leng / boitumelo fela.","Dilo tsa bophelo jono / di kayang, / di thusang? / ka di fela mono. / Kwa go ona re tla bona / tsotlhe tse / di phalang / tsa lefatshe leno.","Jesu, boitumelo jwa me, / mo tekong / le losong / ga re kgaogane. / Ke wa gago, ka o ntshwetse / s'fapaanong / botlhokong; / o nthekile jalo.","Mme o wa me, ke go tshwere, / Jesu Mong, / tumelong, / ga ke go tlogele. / A ko ' nkise kwa go Rara, / kwa o teng / mo bontleng / jo botonatona."]},{"n":227,"t":"Fa go le mo ntlheng ya ka","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K213","v":["Fa go le mo ntlheng ya ka / Modimo 'godimong, / go ka tla dira tsa ka, / tsa iphutha tlhabanong! / Ka ke le wa lorato / Iwa o o sa fenngweng, / ke ka dirwang ke batho / ba ba nkgakaletseng?","Ke tlhomamiseditswe / se ke se dumelang: / Modimo o mogolo / ke Rre yo o nthatang. / Mme fa go ka nna thata / teng mo merwaleleng, / bokete, fa bo gola, / a nntshe mo boketeng.","Motheo o tlhomame / o o ntlhomamisang: / Ke Krist' le madi a 'gwe, / ke mo ke emeng teng; / ke ngwana wa Modimo / ka Jesu Kriste, Mong; / ka moo ke boka ene, / ga ke yo ' ipokang.","Jesu ke tlotlo ya me, / lesedi bophelong. / Mme fa a se mo go nna, / ke tla nna mo bontshong; / Modimo o tla mpona, / e le o ' nkatlholang. / Ke tla nyelela fela / jaaka bojang mollong.","Mme Jesu o timile / bogale jo ' tukang; / o ntlhapisitse dibe, / a nkgolla mo losong. / Jaanong nka itumela, / ka tia mo pelong. / Tshekiso ga ke e tshabe / jaaka ba ba dibeng.","Ga go na sepe-sepe / se se ka nkatlholang. / Molete wa molelo / ke o ke o nyatsang. / Katlholo ga e ntshose, / ga se e e nkamang, / ka Jesu a mphemela, / ke mo tshireletsong.","Go aga Mowa wa 'gwe / mo go nna mo pelong; / mme ona o leleka / tse di ntlhokofatsang. / E bile o tsweletsa / tse o di simollang; / o nthapedisa Rara / go mmitsa tumelong.","Fa poifo e ka ntlela, / go le tse di ntshosang, / Mowa o nthapelele, / o le diphegelong. / Le fa ke sa di itse, / ke tse di itsiweng / ke yo ' itseng dipelo / le tse di bipilweng.","Mme Mowa o nkgomotsa / ka 'foko le le reng: / Modimo o tla thusa / yo o o rapelang; / o bile o agetse / ba ba o ikanyang / legae la go bona / tse ba di dumetseng.","Mme ke baakanyeditswe / kabelo ya me teng. / Le gona le fa ke swa, / ke e e tlhomameng. / Mme le fa ke ntse ke lla, / ke sa le lefatsheng, / Morena o nkgomotsa / ka tse di natefang.","Yo o phelang le Jesu, / yo o tlhoang Satan, / o bogisiwa thata, / ke yo o rwesiwang / morwalo o ' makete, / ke yo o sotliwang; / o rwala sefapaano, / o phela tlalelong.","A 'fatshe le thubege, / o yo o nkemetseng; / ga di nkgaoganye nao / tse ba ka di dirang. / Le fa e le dikgosi / tse di nkgalefetseng, / ke tla nna ke tlhomama, / ke eme tumelong.","Ga ke na go kgaoganngwa / le Jesu yo ' nthatang, / Ie e seng ke baengele / le tse di thabisang; / borena, kgalalelo, / le fa e ka nna eng, / tse dinnye le tse 'kgolo, / ga go se se nkgonang.","Ke bina, ke ipela, / ga ke khutsafalong, / ke tletse boitumelo, / ke baka difeleng / Jesu yo ' leng letsatsi / le le sa phirimeng; / ke itumella tsone / tse di legodimong."]},{"n":228,"t":"Go batlega se le sengwe","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K214","v":["Go batlega se le sengwe, / o se nthute, yo ' nthatang; / tsa lefatshe dia tlhaela, / le fa di phatsima jang! / Ka gonne ke tsone merwalo e ' thata, / mme pelo ea lapa, fa e ka di rata. / Mme sona se sengwe se se batlegang, / ke sona sa nnete, se se humisang.","Fa o rata go se bona, / se se batle lefatsheng; / hularela tse di mono, / batla Jesu yo e leng / Modimo le motho, Morena wa tsotlhe, / botlalo jwa nnete, Mothusi wa botlhe. / Teng o tla se bona se se batlegang: / Ke ene ka esi yo ' tshegofatsang!","A ke senke sona fela, / sona se se batlilweng / ke Maria a ntse 'fatshe / le go tuka mo pelong. / A tlhologeletswe go utlwa Morena, / a batla bophelo, a ba a bo bona; / a latlha tse tsotlhe, a ineela Jesung, / a bona ka nnete se se batlegang.","Fa o na le nna, Morena, / ke tla ema tshekisong, / ka o ntlhapisitse dibe / mading a ' tshologileng. / Ka loso Iwa gago ke siamisitswe, / mme kobo e tshweu ke e apesitswe; / ka yona ke tla ya kwa legodimong, / go phela le wena boitumelong.","Ee, ke tlhoka eng ne gape? / Ke yo o itshwaretsweng. / O isitse madi a 'go / gangwe fela Modimong, / wa dira kgololo ya batho ba botlhe, / re tle re gologe 'kgoleng tsa ga Satan; / kgololo ke yona e e sa feleng, / re bitsa Modimo Rraarona jaanong.","Boitumelo le kagiso / ke na natso mo pelong; / o Modisa wa me, Jesu, / o mphudisa Lefokong. / Keletso ya nama jaanong e fedile, / fa ke na le wena, ruri ke humile. / Ga go na yo mongwe yo 'ntapolosang, / ke wena yo ' esi yo o nkgomotsang.","Jesu, ee, ke wena fela / yo ke go itshenkelang. / Bona, leka, lebelela / ka fa ke go direlang. / Morena, fa ke le tseleng ya timelo, / o mpuse, o nkise tseleng ya bophelo. / Ke tlhokomologe tse di sa thuseng, / mme ke go ineele; ke se ' batlegang."]},{"n":229,"t":"Jesu, o bophelo jwa me","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K215","v":["Jesu, o bophelo jwa me / le thabiso mo moweng. / Ke ineela mo go wena / fa le ka bosakhutleng. / Ke tla bua, ke bolela / 'foko le, ke itumetse: / Jesu wa me tumelong, / ke wa gago loratong.","'Atla sa 'go se mpopile / ka lorato fela, Mong. / Mme bophelo o bo mphile, / wa mphemela tlalelong. / 'Rato lo ke lo logolo, / lo molemolemo ruri. / Jesu wa me tumelong, / ke wa gago loratong.","Ee, e rile ke goroga / ka botsalo lefatsheng, / wa mphemela ka lorato, / lone Io lo sa feleng. / Mme wa ntshwara ka seatla, / nna ke ise ke go batle. / Jesu wa me tumelong, / ke wa gago loratong.","Mme e rile ke M itaola, / ke le yo ' sa go batleng, / Mowa wa 'go wa bo o nkgoga, / ka o le yo o mpatlang. / Mme wa mpusa ka lorato / ditirong tsa boithato. / Jesu wa me tumelong, / ke wa gago loratong.","Gantsi ruri o mpiditse / ka lefoko mo therong; / nna ka gana le go nyatsa / lentswe la 'go mo pelong. / Nkabo ke sa phele, Rara, / fa o kabo o sa ntshwara. / Jesu wa me tumelong, / ke wa gago loratong.","Mowa wa 'go o ntshupetsa / boswa jwa me 'godimong. / Fa bophelo ke bo wetsa, / ke tla ya go wena, Mong, / kwa bonnong jwa boitumelo, / ga ke ka ke ka thibelwa. / Jesu wa me tumelong, / ke wa gago loratong.","Fa ke phela kampo ke swa, / ke wa gago, Jesu Mong; / ke ineetse wena gotlhe, / ke ka wena ke ipokang. / Jalo ke a go ikanya, / fa ke boga, oa nkgomotsa. / Jesu wa me tumelong, / ke wa gago loratong.","Jesu, utlwa la bofelo / sona se ke se kopang: / Fa ke tlelwa ke tlalelo / ya bofelo e ' tshosang, / fa ke pallwa ke polelo, / a ke bue ka phegelo: / Jesu wa me tumelong, / ke wa gago loratong."]},{"n":230,"t":"Nna ke go ineela, wena","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K216","v":["Nna ke go ineela, wena / Jesu yo o rategang. / Kea go baka, ao Morena / Jesu yo o tlotlegang! / Ke a itse, ba tla ntlhoa, / bone ba ba go tlhoang; / mme ke setse ke humile, / ka o le yo o nthatang.","Kea e nyatsa, tiro yotlhe / ya ba ba ithamakang. / Mme ka dilo tsa me tsotlhe / kea mo tlotla yo ' nthatang. / Ao, a nna ke ka mo nyatsa / yo o intlhaoletseng? / Ruri a nka tlhokofatsa / Jesu yo ' nkamogetseng?","Nyaa, lefatshe le tla itse, / fa e se le le nkgatlhang; / gonne Jesu o n' a nkgona / go nna yo o mo ratang. / Nna ke fentswe ke lorato / Iwa 'gwe lo lo nkgolotseng. / Ruri e tla nna molato / go tlogela yo ' ntshwetseng.","Fa ke ne ke lemogile / pele, ka fa a nthatang, / ruri nkabo ke batlile / pele Jesu yo ' thusang. / Ke pheletse jang lefela / mo metlheng e ' fetileng! / Gonne ga ke a phelela / Jesu yo o nthatileng.","Ke ne ke diega thata, / ke go nyatsa mo pelong. / Ke tsieditswe gantsi thata, / go le ba ba mphaposang. / Jaanong ga re kgaogane / botshelong le mo losong. / Ke wa gago, ka gobane / re kopantswe loratong.","Tlhomamisa pelo ya me, / fa e nyema tlhabanong. / A ko ' tiise mowa wa me, / o se lape tumelong. / Gonne fa ke ka tenega, / kana nka tshabela kae? / Ruri foo ke tla latlhega, / ke sa fitlhe gope gae.","Jalo kea go dumedisa, / Jesu wa me yo ' nkgatlhang. / Gape ke a go tumisa, / Jesu wa me yo ' nthatang. / A ko ' mphe ke tlhoafale, / ke tlhomame tumelong. / Jalo ke tla nna ka gale / motho wa 'go loratong."]},{"n":231,"t":"Morena Jesu yo ' nthatang","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K217","v":["Morena Jesu yo ' nthatang, / ga go na sepe se ' tshwanang / le wena mo ntlheng tsotlhe. / Ke wena yo ' nnatefelang, / yo ' nkgomotsang, yo ' mphedisang, / o phala dilo tsotlhe. / A ko ' nthuse / go go bona / kwa o gona, / kwa godimo. / Dira jalo, ao Morena.","E rile ke le timelong / le bofofung le bosilong, / ka nyatsa 'rato Iwa 'go. / Kgomotso e ne e se teng, / ka ke sa bona mo moweng / bopelonomi jwa 'go. / Tsena go nna, / o mponise, / o mphedise, / ke go itse; / mme ke bitse leina la 'go.","Ba bantsi mono lefatsheng / baa itsietsa, ke ba ' reng: / Tsa mono di lekanye. / Mme Ia bofelo mo losong / re ba fitlhela tlalelong, / kgomotso efedile. / A ko o mphe / boitumelo / le bophelo / jwa mannete, / jo bo tswang go wena Kriste.","Yo ' go tshwereng mo tumelong / o bonye ruri mo pelong / go itumela thata. / Mme le fa wena mo metlheng / e mengwe o itshuba teng, / o b' o ntse o re rata. / Kana bana, / fa ba ineela / go direla / wena fela, / tsotlhe o tla di ba naya.","Jesu, totisa mo pelong / tumelo e e tswang 'Fokong, / e ' ntseng jaaka seatla. / Ke yona e e go tshwarang, / ke yona e e re tiisang, / ka yona rea go kgatlha. / Disa, ntiise / go fenyetsa / dibe ruri, / go di senya. / A tumelo e tlhomame!"]},{"n":232,"t":"Jesu ke a go abela","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"Z151","v":["Jesu ke a go abela / pelo ya me ke e / gonne e batlwa ke wena / pelo e ya me e.","Wa re, nkabele ngwanaka / pelo e ya gago / e nne boago jwa me, / jo ke nnang go jona.","Ke e, Rra e amogele / o se ka wa e nyatsa. / E tshole le fa e le leswe / o e siamise.","E kgakgafala ka metlha / le go tswa mo tseleng. / Ka moo ke kopa go wena / a ko e siamise.","E tla tla ka mafega / e re nketeke Rra. / E gatake,M o e nolofatse / e tle e dumele.","A ko o nkine mo mading a / Mogolodi wa me / gonne ke ene yo o ntshwetseng / mo legonyeng le nna."]},{"n":233,"t":"Utlwa, utlwa, pelo ya me","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K218","v":["Utlwa, utlwa, pelo ya me, / ke Morena yo ' buang! / Oa go botsa: \"A o wa me, / a o mongwe yo ' nthatang?","Ke ne ka go batla pele, / o ntse o le lefifing; / mme ka bopelotelele / ka go isa leseding.","O ne o le motimedi / le motlhanka mo dibeng, / ka tla, nna Monamoledi, / ka ntsha wena timelong.","O ne o le mobobodi, / yo ' swelang mo ditlolong; / ke ne ka nna Mogolodi, / Ngaka ya 'go botlhokong.","'Rato Iwa ka ga lo fele, / ga se lo lo nyelelang. / Reetsa he o mpolelele: / A o mongwe yo ' nthatang?","Nna ke go etleeleditse / felo ' gontle 'godimong, / loso ke lo nyeleditse, / go go isa bophelong.\"","Jesu, ee, o nkitse gotlhe, / ke tla reng, ke ka supang? / Tiro di tlhaetse tsotlhe; / thusa, ke nne yo ' boang."]},{"n":234,"t":"Ke tla sala mo Jesung","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K219","v":["Ke tla sala mo Jesung, / ene yo o neng a ntshwela. / Ee, ke se se ntshwanetseng / gore ke mo kgomarele, / ene 'sedi bophelong. / Ke tla sala mo Jesung.","Ke ka mo tlogelelang, / ka ke sa le 'fatsheng leno? / Etswe e le yo ' nthusang / ka tse tsotlhe metlheng eno! / Ka a ntiisa mo moweng, / ke tla sala mo Jesung.","Fa go fela mo losong / pono, kutlo le polelo, / le fa nka nna matlhokong / le bontsing jwa ditlalelo, / foo ke tla nna yo ke reng: / Ke tla sala mo Jesung.","Fa ke fitlha 'godimong, / ke tla mmona jaaka a ntse; / ke tla nna mo polokong, / gonne Jesu o nthatile. / Ee, le gona legaeng / ke tla sala mo Jesung.","Lefatsheng le 'godimong / ke eletsa Jesu fela, / ene yo o nthuantseng / le Modimo ka go ntshwela; / ke yo ' ntshiamisitseng. / Ke tla sala mo Jesung.","Yo ke sa mo tlogeleng / ke Morena Jesu Kriste. / O nkgogela sedibeng / sa bophelo jwa mannete. / Go tlhogonno yo o reng: / Ke tla sala Moreneng."]},{"n":235,"t":"Ao, lo se ntie mo tseleng","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K220","v":["Ao, lo se ntie mo tseleng, / ka ke itlhaganetse / go batla Jesu yo e leng / Monthusi, ka a ntshwetse. / Ga ke diege maleong, / ke rata go ya 'godimong.","Moratwi, nka go latlha jang! / Go tshwana mang le wena? / Ke wena yo ' ntapolosang, / Monthati le Morena. / Fa wena o le yo ' nthatang, / ke batla eng, ke sa tlhokang?","Jesu, o wa me tumelong, / e bile ke wa gago. / Mme re kopantswe gotlhe, Mong, / ka dikweneso tsa 'go. / O 'fika le ke theilweng / go lone ka bosakhutleng.","Re phela fela moleteng, / fa o se na le rona. / Fa re na nao lefatsheng, / re na le legodimo. / O Mmana o o re tiisang / le metsi a ' re phedisang.","Mme go monatenate jang, / fa nka go itsholela! / Ke gona ke tla tshelelwang / lesego la 'go lotlhe. / Dipelo tse di go lebang / di itumela thata jang!","Morwalo o botlhofo jang, / fa o nthwadisa ona, / fa o le yo o nkgomotsang, / fa o nametsa pelo! / Mme fa o mpetsa loratong, / ke tla itshoka tumelong.","Le fa o nkgoga bophelong / ka thabo le dipogo, / e le tse di nkgakgamatsang, / ga di nkgaoganye nao. / Mme tsela e o e nkgogang / e nkisa go Rre legaeng."]},{"n":236,"t":"Kgosi ya dikgosi tsotlhe","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K221","v":["Kgosi ya dikgosi tsotlhe, / Mopholosi wa ba botlhe, / Morwa esi wa Modimo, / o ruile legodimo, / o Morena le Mobusi, / Morwa-Motho le Mothusi, / bontle jwa 'go bo a nkgatlha, / mme ke atla 'nao tsa 'go.","Legodimo le lefatshe, / maru, phefo le lewatle, / tsona dibopiwa tsotlhe / lewatleng le 'fatsheng lotlhe, / oa di busa, dia go utlwa, / oa di jesa, oa di thusa; / o Morena wa tse tsotlhe / le wa bone batho botlhe.","Puso ya bobedi ya 'go / ke phuthego, batho ba 'go / ba ba dumelang go wena, / ba ba go kayang Morena, / Mogolodi, Molefedi, / Montshi le Monamoledi. / O ba busa ka Lefoko / gore o ba nee bophelo.","Bogosing jwa kgalalelo / ga go khutle dikopelo; / ke tsa baengele ba 'go / le batlhanka ' bantsi ba 'go; / le tsa bone badumedi / ba ba fitlhileng go wena; / ba ntse ba go obamela, / ba go baka, ba sa lape.","Mong wa 'puso di le tharo, / ga go yo ' tshwanang le wena / ka matlotlo a tlholego, / ka botlalo jwa phologo / le ka go re solofetsa / tse dikgolo tsa 'godimo. / O femela 'tsala tsa 'go, / o dirisa baba ba 'go.","Busa he le pelo ya me, / senya dikeletso tsa me. / Jesu wa me, o mphemele, / Kgosi ya me, o ntlamele. / Ntshware tlhe, ke se fapoge, / ntsamaise, ke goroge. / Mono a ke go phelele, / koo o mphe go busa nao."]},{"n":237,"t":"Jesu, khumo ya dipelo","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K222","v":["Jesu, khumo ya dipelo, / mo go wena go bophelo, / jona jo bo sa feleng. / Mo go wena go boikhutso, / thabo le boitshwarelo, / ga di bonwe lefatsheng.","Jesu Mong, a ke go batle, / o gaisa tsa lefatshe; / ga se tse di mphedisang. / A ke tswelle ka tumelo, / ke go kgatlhe ka tirelo, / ke tle ke ye 'godimong."]},{"n":238,"t":"Jesu yo montle","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K223","v":["Jesu yo montle, / Mmusi mo 'ntlheng tsotlhe, / Modimo-motho bonneteng, / ke a go rata, / ke a go tlotla, / o thabo ya ka mo pelong.","Go gontle dikgwa, / naga ea di phala, / e e thunyang mo selemong. / Mong, oa di gaisa, / mme o thabisa / dipelo mo bohutsaneng.","Go gontle 'tsatsi, / ee, le ona ngwedi / le dinaledi 'godimong. / Jesu o phala / le baengele / le tsotlhe tse di 'godimong.","Ee, bontle jotlhe / jwa lefatshe lotlhe / ga se jo bo ka tshwantshiwang / le Kgosi ya me, / Mothusi wa me, / ke raya Jesu yo ' nkgatlhang."]},{"n":239,"t":"Ke boka thata jang lorato","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K224","v":["Ke boka thata jang lorato / lo lo itshupileng Jesung! / Lo bipa bontsi jwa melato / ya batho ba ba mo tshekong. / Lorato lo, loa nkgakgamatsa, / ka lone kea ipelafatsa.","Ka nnete o nthatile thata, / wa ntlhologellwa mo pelong. / Le nna jaanong ke a go rata / mo bophelong le mo losong. / Lorato lo, loa re kopanya, / a sengwe se ka re kgaoganya?","Ga ke na go ka go tlogela, / ka o nkemetse mo tshekong. / Le gona o ne wa mpogela, / wa ntshwela mo sefapaanong. / Morena, ke a go leboga, / ke wa 'go, ga nke ke tlhanoga!","Modimo, ke go naya pelo / le dilo tse o di mphileng. / Ee, ke go neela le bophelo, / jo Mong o bo nkadimileng. / A tsotlhe tsa me e nne tsa 'go / go galaletsa leina la 'go.","A tlotlo e nne ya leina / la Mong-motswedi o ' elang / lorato, lo go neng go ikina / go lone ba ba itshepileng. / Ba setse ba go obameIa, / mme ba ntse ba go opelela.","Ao Jesu, a ko o nkwalele / leina la 'go mo pelong; / a 'rato lwa 'go lo nkgomotse / ka gale mo maikutlong, / ke supe, ke le wa 'go, Jesu, / ka tiro, ee, le ka mafoko."]},{"n":240,"t":"Jesu, Mopholosi wa me","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"H69","v":["Jesu, Mopholosi wa me, / ruri o nthatile jang! / Jesu wa me, Jesu wa me, / nna nka go duela ka 'ng?","Ga ke na phemelo epe, / ke tshabela kwa o teng. / Jesu ruri ga go ope / jaaka wena lefatsheng!","Jesu nthuse, a ko ' ntshware, / fa ke mo dithaelong; / se ntlogele ke le gare / ga manaba mo bathong.","O Motswedi wa botshelo; / tlosa 'nyora mo pelong! / Mphelegetse la bofelo; / nkise kwa legodimong."]},{"n":241,"t":"Jesu o letsatsi","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"H78","v":["Jesu o letsatsi, / o monate jang! / O Motshegofatsi / yo ke go ratang. / Ntlhomogele pelo, / ntebe loratong, / o mphe le bophelo / jaanong le losong.","Tlosa dibe tsa me, / ntlhatswe mo mading, / a 'go, ke siame, / ke tswe mo dibeng, / gonne o ineetse / mo dipogisong, / gape o re swetse / mo sefapaanong.","Ke tla go phelela / mono lefatsheng, / ke tla go ineela / ka bosakhutleng. / A k'o ntshekegele / tsebe thapelong; / mme o nkamogele / mo legodimong."]},{"n":242,"t":"Fa diphefo di ka foka","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"H85","v":["Fa diphefo di ka foka, / go le thata bophelong, / ke tshabela kwa go Jesu / e le yo o mpolokang. Chorus: Oa mpoloka, oa mpoloka, / o mpoloka tlalelong; / oa mpoloka, oa mpoloka, / o mpoloka tlalelong.","Fa ke bona tse di thata, / mme di ntsentse selelong, / ke a itse, di itsiwe / ke Modimo o ' nthatang. Chorus: Oa mpoloka, ...","Mme fa mmaba a nthaela / go mphaposa tumelong; / o tla fenngwa ke seatla / sa Morena yo ' nthusang. Chorus: Oa mpoloka, ...","Fa ke rwele sefapaano, / mme se nketefalla jang, / o nthwadisa ka seatla / sa 'gwe se se ntshegetsang. Chorus: Oa mpoloka, ..."]},{"n":243,"t":"Jesu yo o rategang","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"H88","v":["Jesu yo o rategang, / ke tshabela sehubeng / sa 'go, kwa o mpolokang, / ntese ke iphitlhe teng. / Mme o ntshube bophelong / jwa therego le losong. / Go tsamaya bofelong / o ntsholele godimong.","G'ke itse kwa nka tshabelang / go bolokwa tlalelong. / Wena Jesu yo ' nthatang, / o 'tshabelo theregong. / Fa ke go ikanya fa / ga ke tsoge bosuleng, / gonne o mphemela teng / moriting, fa diphukeng.","Fa o wa me tumelong / ke humile mo 'fatsheng, / ka o Ngaka e ' thusang / botlhe ba ba mo dibeng. / Wena o mo tshiamong, / nna ke le tshiamollong. / Wena o mo boitshepong, / nna ke sule maleong.","Intshwarele tsalanong / Jesu wa me, yo ' nthatang; / ke tla fola mo pelong, / fa ke ntshiwa maleong. / O motswedi, o go tswang / mo go ona fa tseleng, / metsi ' mantle, a ' tlosang / 'nyora le le sa feleng. BOPHELO KA TUMELO"]},{"n":244,"t":"Modimo, rona rea go baka","c":"Difela tsa Bophelo ka Tumelo: Ka ga Kereke","k":"K225","v":["Modimo, rona rea go baka, / wena yo ' ikaeletseng / go bopa mo lefatsheng leno / phuthego e ' itshepileng, / e e go direlang ka metlha, / ka e le e e golotsweng / mo tatlhegong ya dibe tsotlhe / ka madi a ga Jesu Krist'.","O bitsa mongwe le yo mongwe / go tla go tsena mo kgorong. / Re ntse re utlwa sello sa 'go: / O tlhoka batho phuthegong! / Ke gona o romang badiri / go batla ba ba timetseng; / mme o laletsa le digole / le bone ba ba foufetseng.","O itiretse ka barongwa / Kereke ya 'go ditšhabeng; / mme mo go yona o opellwa / dipako tse di sa feleng. / Jesu ke Kgosi ya ba botlhe, / ke tlhogo gona phuthegong; / o ba dirile bongwefela / go go direla tumelong.","A re se ikanyeng ditiro / tse rona re ka di kgonang. / Le fa go ka nna e ' molemo, / re ba ba siamololang. / Re na le go ikamogella / tse re di baakanyeditsweng, / ba re dumelang Mopholosi / wa rona yo o re swetseng.","Morena, o re boIokele / tumelo e e pholosang, / re tle re kgomarelle ruri / Lefoko le ' itshepileng. / Re tlatse tlhe kagiso ya 'go, / lorato lo lo agisang, / dipelo di tle di tukele / ditiro tse o di re fang."]},{"n":245,"t":"Go tlhogonolo ba ba tlang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Kereke","k":"K226","v":["Go tlhogonolo ba ba tlang / go obamela mo kerkeng, / go batla Jesu Kriste teng, / le bone ba ' mo ineetseng.","Ba tla tswelela mo tseleng, / ka ba ntse ba le tumelong; / mme ba tla fitlha legaeng / kwa a leng teng kgalalelong.","Ba itumela leetong, / le fa ba imelwa mo meweng; / ke Jesu yo ' ba gomotsang, / o ba fitlhisa phologong.","Le rona ba re Moreneng / re tshwana nabo tshepelong, / re sepelela legaeng / la Sion kwa legodimong."]},{"n":246,"t":"Modimo ke phemelo e","c":"Difela tsa Bophelo ka Tumelo: Ka ga Kereke","k":"K227","v":["Modimo ke phemelo e / re tshabeIang go yona; / o tlosa ditlalelo tse / re wetseng mo go tsona. / Satan yo ' senyang / o gaketse jang! / O thata leanong / le mo ditsietsong; / ga go yo ' tshwanang nae.","Ga re na thata tlhabanong; / re ba re fenngwang fela: / Re Iwelwa ke Mogale, Mong, / yo o neng a re swela. / Kana yo ke mang? / Yo ke Jesu Krist', / ke yo o busang, / ke Kgosi dikgosing; / o fenya baba botlhe.","Le fa 'fatsheng go tletse jang / bo-Satan mo ntlheng tsotlhe, / re kabo re ba boifelang? / Re tla ba fenya gotlhe. Satan yo ' fentsweng, / yo ' sekisitsweng, / a ka senya jang? / Ke yo o ka digwang / ka 'foko le le lengwe.","Lefoko le tlhomame jang, / ga le na go fetolwa! / Ke Jesu yo ' le emelang / ka ona Mowa wa 'gwe. / Ba ' re amogang / tse re di tshotseng, / di tla ba thusang? / ka e se ba ' kgonang / go re amoga puso!"]},{"n":247,"t":"Go builwe tse dikgolo","c":"Difela tsa Bophelo ka Tumelo: Ka ga Kereke","k":"K228","v":["Go builwe tse dikgolo / ka ga Sion Lokwalong. / Ke phuthego ya ga Kriste, / ya ba ' yang legodimong; / e theilwe mo go lone / 'fika le le sa khutleng; / mme Modimo o nna gona / go ba tlhokomela teng.","Ga e ka ke ya senyega, / e ka fenngwa ke bomang? / Gonne Jesu o boikanyo, / yo o e sireletsang. / Ba ba dumelang go ene / ba tlhatswitswe mo mading / a ga Jesu, Mong wa bone, / ba falotse tshenyegong.","Ao Morena, a ke fitlhe / legaeng legodimong, / ke nne mongwe wa ba gago / go nna nao bosakhutleng! / Ke tla nyatsa maithamako / otlhe a ' mo lefatsheng, / go ya ke utlwatse pako / le baitshepi 'godimong."]},{"n":248,"t":"Tswelelang, tswelelang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Kereke","k":"K229","v":["Tswelelang, tswelelang, / Sion, tswelelang 'seding! / Tshubang pone tsa tumelo, / lo se lape loratong, / mme nwang metsi a bophelo. / Sion, tsela e tshesane jang! / Tswelelang, tswelelang!","Itshokeng, itshokeng, / Sion, itshokeng 'pogong! / Lo se tshabe dipogiso, / di tla fela mo losong, / go tla Krone ya bophelo. / Sion, fa lo boga lefatsheng, / itshokeng, itshokeng!","Tlogelang, tlogelang, / Sion, tlogelang 'fatsheng / khumo, tlotlo le menate, / mme lo dise thapelong; / lo se golafale pelo / ka tse di ratwang mo lefatsheng, / tlogelang, tlogelang!","Botsisang, botsisang, / Sion, botsisang 'fatsheng / mewa e ' lo bitsang gona, / se e lateleng dibeng; / mme lo gogwe ke lesedi. / Sion, tsotlhe tse lo di utlwang, / botsisang, botsisang!","Ineeleng, ineeleng, / ineeleng mo Modimong. / Nnang le Mowa le botshelo, / lo se swele mo dibeng; / lo nne ba ' ungwang maungo. / Sion, nnang bonatla tumelong. / Ineeleng, ineeleng!","Itshupeng, itshupeng, / Sion, itshupeng thateng / ya lorato Iwa Morena, / ene yo ' lo ratileng. / Lo ratane mo go ene. / Tsela ke e e bulegileng. / Itshupeng, itshupeng!","Tshwarellang, tshwarellang, / tshwarellang mo boikanyong! / Lo se kate ka morago. / Ke Morena yo o tlang. / Mo Iebeleleng ka thabo. / Sion, tlhabanong le mo losong, / tshwarellang, tshwarellang!"]},{"n":249,"t":"Jehofa, fa a se yo teng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Kereke","k":"K231","v":["Jehofa, fa a se yo teng, / go bue Israele, / fa a se yo ' re emelang, / re kabo re sa phele. / Re bannye fela mo palong. / Ba bantsi ba ba re tlhoang, / ba rata go re senya.","Ba re gakalla bogaleng, / mme fa ba letlelelwa, / ba ka re wetsa mo losong, / ba re fedisa gotlhe; / re kabo re le tlalelong, / re nwela mo morwaleleng, / go se mothusi ope.","Jehofa re mo lebogeng! / Gobane re falotse / jaaka nonyane mutlwaneng, / mogala o kgaotswe! / Jehofa yo ' re thusitseng, / a ene re mo tumiseng; / gobane o mogolo."]},{"n":250,"t":"Re bolokele loratong","c":"Difela tsa Bophelo ka Tumelo: Ka ga Kereke","k":"K232","v":["Re bolokele loratong / Lefoko la 'go, wena Mong; / thibela tlhe ba ba ratang / go ntsha Morwao mo pusong.","Itshupe, Jesu, lefatsheng / o le Morena bareneng, / mme o boloke tumelong / bakriste ba 'go pogisong.","Ao Mowa o o gomotsang, / re dire ba ba utlwanang; / o nne le rona tlalelong, / o re fitlhise botshelong.","Morena yo o atlholang, / o fenye ba ba re tshwenyang; / ba tlhabolose mo pelong, / ba pholosiwe tatlhegong.","Re thuse gore bofelong / re tsene mmogo bophelong; / ba, Jesu, o ba bogetseng / ba se latlhelwe moleteng. Ka ga Lefoko la Modimo"]},{"n":251,"t":"Beibel, 'Foko la Modimo","c":"Difela tsa Bophelo ka Tumelo: Ka ga Lefoko la Modimo","k":"K233","v":["Beibel, 'Foko la Modimo, / ke le re le kwaletsweng / ke bakwadi ba Modimo, / e le le le tswang Moweng. / Khumo yotlhe e go lone, / kitso yotlhe e mo teng, / go re etleeletsa jona / 'phelo jo bo sa khutleng.","Beibel ruri ke lesedi / le le tswang legodimong, / le le rutang batimedi / tsela go tswa mo bontshong. / Ea agisa, ea gomotsa, / e alafa mo moweng; / ea thabisa, ea nonotsha, / e bonega motseleng.","Beibel, ee, ke botshabelo / mo go ba ba dumelang; / mme e bile ke kabelo / e e tswang mo Modimong, / e le thebe, e le tšhaka / le lerumo tlhabanong, / e le thata ka dipaka, / fa re tsena thaelong.","Kana Beibel e tlhomame, / ke e e ikanyegang; / e re bontsha Mopholosi, / Jesu yo o re ratang. / Ka moo ke tla tlhoafala / go mo utlwa Lefokong; / gonne foo ke tla ralala loso, / ke ya bophelong."]},{"n":252,"t":"Lentswe la ' Jesu Lokwalong","c":"Difela tsa Bophelo ka Tumelo: Ka ga Lefoko la Modimo","k":"K234","v":["Lentswe la ' Jesu Lokwalong, / le ' utlwiwang mo ditherong, / ke lone le le re bitsang / go tshaba se se boitshegang.","Lentswe la ' Jesu Beibeleng / le sita tsotlhe lefatsheng; / ke lone le le re rayang: / Tshabang bogale jo bo tlang!","Lentswe la ' Jesu ' lentle jang! / Le fenya yo o raelang, / le re gomotsa botshelong, / le re nametsa mo losong.","Lentswe la ' Jesu, le e leng / kgothatso ya 'gwe bothateng, / ke le ' re ntshang mo timelong, / le re gogela 'godimong.","Moratwi Jesu 'godimong, / o re bonese mo pelong, / gore re utlwe mo moweng / lentswe la gago Beibeleng."]},{"n":253,"t":"Fa 'Foko le Ie pholosang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Lefoko la Modimo","k":"K235","v":["Fa 'Foko le Ie pholosang / le tsenye mo pelong / ka Mowa o o bonisang, / le isa 'godimong.","Ke lone le le re bontshang, / ka fa re ntseng ka teng, / le ka fa re ka gololwang / dibeng le moleteng.","Modimo re o bona teng, / ka fa o re ratang, / le ka fa o re rometseng / Jesu yo ' re gollang.","Re bona tsela e e yang / go Jesu 'godimong, / le ka fa re ka tsamayang / go tsena polokong.","Lesego le legolo jang / le bonwa Lefokong. / Ke lone le le gomotsang / phelong le mo losong.","Modimo o o rategang, / re tiise tumelong; / ke gona re tla go bonang / ka gale Lefokong."]},{"n":254,"t":"Utlwang tlhe thero e ' bitsang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Lefoko la Modimo","k":"K236","v":["Utlwang tlhe thero e ' bitsang / ka gale mo kerkeng! / Ke sejo se se phedisang / ba ba mo tshepelong.","Bonang, lo kgotshe mo moweng / ba lo sa dumeleng; / lo batla fela lefatsheng / tse di isang losong.","Botlhale jo bo sa khutleng / bo mo go Jesu Mong, / yo o lo etleeleditseng / moletlo mo kerkeng.","O bitsa botlhe a re: Tlaang! / go fiwa bojelong / dijo tse di lo phedisang, / tse di tswang Modimong.","Mme lotlhe ba lo nyorilweng, / tlaang lo nwe motsweding / wa metsi a a phedisang, / lo lapologe teng.","Bonang melapo e ' tletseng / lorato lo lo tlang / go rona mo Efangeleng / ka thero e ' bitsang."]},{"n":255,"t":"Tlaang go Jesu, a ko lo tle","c":"Difela tsa Bophelo ka Tumelo: Ka ga Lefoko la Modimo","k":"K237","v":["Tlaang go Jesu, a ko lo tle, / lotlhe ba lo lapileng! / Krisete o bitsa botlhe / ba ba sa leng mo dibeng.","Tlaang le lona basenyegi / ba lo swelang mo dibeng. / Jesu ene o lo swetse; / gore Io tswe tatlhegong.","Tlaang! ke pitso ya Morena / yo ' swetseng sefapaanong. / Lo dumele mo go ene, / se belaeleng pelong.","Ga go ope jaaka Jesu, / yo o ka lo pholosang. / Ene yo, o fentse loso, / ke yo o lo phedisang.","Jesu o n' a fologela / lefatsheng le mo bathong, / e le go ba itsholela / go nna nae 'godimong.","Itseng, fa lo sa dumele, / ga lo tsene phologong; / fa lo gana go dumela, / lo tla wela mo mollong."]},{"n":256,"t":"Morena, nna le rona","c":"Difela tsa Bophelo ka Tumelo: Ka ga Lefoko la Modimo","k":"K238","v":["Morena, nna le rona / ka boitshwarelo, Mong. / Thibela ene Satan / yo o re senyetsang.","Morena, nna le rona / ka 'Foko mo kerkeng, / mme o re fe pholoso / le ka bosakhutleng.","Morena, nna le rona / ka 'sedi mo bontshong, / re sireletse rotlhe, / re se we tumelong.","Morena, nna le rona / ka 'sego bophelong, / re okeletse tsotlhe / tse di re phedisang.","Morena, nna le rona / ka thata tlhabanong, / o re fenyise mmaba / yo o re raelang.","Morena, nna le rona / yo o ikanyegang; / mme o re tlhomamise / ka gale bonneteng. Thomo"]},{"n":257,"t":"Ao Morena, 'Foko la 'go","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K239","v":["Ao Morena, 'Foko la 'go / ke le le re phedisang. / Ke lohumo, lo gaisa / khumo tsotlhe lefatsheng. / Fa re ka le belaela, / re ka thewa mo go eng? / O re thae mo go lone, / re Ie ikanye tumelong.","Bua le nna o re: Amen; / o nne yo ' ntlhomamisang. / Ke tle ke tswelele pele / go go reetsa Lefokong. / 'Foko Ia 'go a le mpuse, / ke le rate bophelong, / jaaka go dirile ene / Maria mo Beibeleng."]},{"n":258,"t":"Yaang lo rute 'tšhaba tsotlhe!","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K240","v":["Yaang lo rute 'tšhaba tsotlhe! / Ke Morena yo ' laolang / a re: Yaang lo ba bolelle / 'Foko le le phedisang.","Lo ba rute go tshegetsa / se ke se lo laetseng; / gape lo ba kolobetse, / e nne ba me phuthegong.","Badumedi ba tla bona / 'phelo jo bo sa khutleng. / Ba ba ganang go dumela, / ba tla wela moleteng.","Ke neilwe thata yotlhe / 'godimong le lefatsheng; / nna ke na le lona gotlhe, / lona ba lo ntumetseng."]},{"n":259,"t":"Opelang tlhe, baditšhaba","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K241","v":["Opelang tlhe, baditšhaba, / 'sedi le tla mo bathong. / Batho ' bantsi ba tla thaba, / ba ineela Jesu Mong. / Ba tla utlwa, ba tla utlwa / 'Foko la 'gwe mo therong.","Jesu o ne a rerela / batho ba ba mo dibeng; / gape o ne a ba swela / go ba golla dikgoleng. / Ba tla bona, ba tla bona / Kwana e ba e tlhabetsweng.","Jesu o ne a laela / barutwana a re: Yaang / 'tšhabeng tsotlhe go di ruta, / e nne tse di dumelang; / mme di bone, mme di bone / 'phelo jo bo mo Kristeng.","Batho ' bantsi ba tla batla / Mogolodi mo dibeng; /
