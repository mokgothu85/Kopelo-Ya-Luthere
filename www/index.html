kang Jesu Kwana 'seding mo 'seding. Chorus: Godimong, godimong, / gae la me le kwa godimong, / godimong, godimong, godimong, / gae la me le kwa godimong.","'Tsala tsa me di 'godimong, / kwa ke tla di bonang phatsimong, / go nna mmogo le tsona 'seding, / kwa letsatsi le sa phirimeng. Chorus: Godimong ...","Ke tla thaba go ema fa troneng / le ba botlhe ba ba itshenketsweng, / go go baka ka bosakhutleng, / wena Jesu, yo 're ratileng. Chorus: Godimong ...","Ke eletsa go tsena 'godimong, / go nna nabo mo kgalalelong. / A go tsene ba kae le kae, / re nne mmogo ka bosakhutleng. Chorus: Godimong ..."]},{"n":346,"t":"Go teng bogosi godimong","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"H137","v":["Go teng bogosi godimong / kwa Jesu yo busang / go baengedi mo pusong / ba ba re laletsang. Chorus: Ba bitsa ba re: Tsena fa! / Ba bitsa ba re: Tsena fa! / Baengedi ba teng / ba ba mo bogosing, / baa bitsa: Tsena fa! Tsena fa! Tsena fa! / Baengedi ba teng / ba mo bogosing / baa bitsa: Tsena fa!","Bakreste ba tla tsena teng; / pusong ya Jesu Mong, / ba itshekile Moreneng, / ba dule maleong. Chorus: Ba bitsa ba re: Tsena fa! ...","Le Jesu yo o re swetseng / oa bitsa: Tsena fa! / Le Kerubim le Serafim / ba dumedisa teng. Chorus: Ba bitsa ba re: Tsena fa! ...","Lo se tshwarege mo 'fatsheng / le le mo thamakong, / mme lebellang kwa bogosing / jo bo legodimong. Chorus: Ba bitsa ba re: Tsena fa! ...","Go tla atlholwa ba ' ganneng, / ba fella mo mollong, / Mme bona ba ba dumelang, / ke ba yang polokong: Chorus: Ba bitsa ba re: Tsena fa! ... THAPELO"]},{"n":347,"t":"O re rute go rapela","c":"Difela tsa Thapelo: Tsa Metlha yotlhe","k":"K315","v":["O re rute go rapela, / Mowa o ' itshepileng; / re masilo, rea tlhaela, / ka re le ba ' sa itseng.","Fa re lesa go rapela, / re tla lapa tumelong; / jalo rea go kokotlela / go re tiisa thapelong.","Re tshwanetse go rapela, / ka re tlhoka bophelong. / Gantsi ruri rea tlalelwa, / Satan ke yo ' raelang.","Ruri, fa re sa rapele, / foo ga re nne Modimong. / Wena Mowa, o re thuse / go tswelela thapelong."]},{"n":348,"t":"Rara wa rona 'godimong","c":"Difela tsa Thapelo: Tsa Metlha yotlhe","k":"K316","v":["Rara wa rona 'godimong, / re bana ka Morwao, Mong; / o rata ba ba ratanang, / o rata ba ba rapelang / ka pelo yotlhe, mme e seng, / ka e le mokgwa bakristeng.","A leina la 'go, wena Mong, / le itshepisiwe mo bathong! / Lefoko le le phedisang / le rutwe ka fa tshwanelong; / re tshegofatse bophelong, / go phela ka fa Lefokong.","A puso ya 'go e nne teng / jaanong le ka bosakhutleng! / A Mowa o ' itshepileng / o nne le rona mo kerkeng, / o senye yo o raelang, / o bope ba ba dumelang!","Go dirafale lefatsheng / go rata ga 'go jaaka teng / go wena koo legodimong. / Re fe boitshoko dipogong / le kutlo e ntšhwa bophelong, / o fenye ba ba go ganang.","Ka 'tsatsi leno o re nee / dijo tse di re lekanyeng; / o re tlamele mo tlaleng, / a pula e ne masimong; / o re fodise malwetseng, / o nne lerona ditirong.","O nne yo ' re itshwarelang / melato yotlhe bophelong, / ka fa re tla itshwarelang / ba ba ka re leofelang, / mme o re thuse mo bathong, / re direlane kutlwanong.","Se re gogele thaelong, / mme o re tiise mo tekong; / o re golole mo thateng / ya ' Satan, 'fatshe, nama teng; / o re fe thata tlhabanong, / re tlhomamise tumelong.","O re golole masuleng / a otlhe a a lefatsheng; / o bo o re golle mo losong, / e bong Iwa go ya moleteng; / re nee go swela tumelong, / o re itseele 'godimong.","Re fetsa re re: Amen, ee, / thapelo ke e ' utlwilweng. / Re tiise jalo tumelong, / re se nne ba ' belaelang. / Ka ntlha ya ' Jesu Kriste, Mong, / re bua \"Amen\" bokhutlong."]},{"n":349,"t":"Fa re le mo ditlalelong","c":"Difela tsa Thapelo: Tsa Metlha yotlhe","k":"K317","v":["Fa re le mo ditlalelong, / le gona mo matshwenyegong, / foo re tshabela Moreneng, / ka go se thuso mo bathong.","Re tsile jaana phuthegong / go ikopanya thapelong, / go kopa thuso Moreneng, / Monamoledi maketeng.","Re tsholeletsa 'godimong / matlho a rona thapelong; / o nne yo ' re itshwarelang, / re falodise mo petsong.","O solofetsa Lefokong / go thusa ba ba go kopang / mo leineng la ' Jesu Krist', / la yo o re buelelang.","Ka moo re ba ba lelelang / go wena re le tlalelong; / o nne yo o re namolang, / ka fa o buileng ka teng.","Re itshwarele, Jesu Mong, / maleo otlhe a ' leng teng; / o re ntshe mo ditlalelong, / o re golole tshwenyegong!","Re nne ba ba go lebogang / ka tuduetso tumelong, / mme re nne ba ba go bakang / jaanong le ka bosakhutleng."]},{"n":350,"t":"Modimo Rara, o se nne bogale","c":"Difela tsa Thapelo: Tsa Metlha yotlhe","k":"K318","v":["Modimo Rara, o se nne bogale, / o se re betse, rona baleofi. / Se re atlhole, re basenyi fela, / ga rea tshwanela.","Fa o ka re atlhola ka tshwanelo, / rotlhe re tla latlhega e le ruri, / ka re sa kgone go itshiamisa / fa pele ga 'go.","Modimo Rara, o re rekegele, / ka Jesu Kriste o re itshwarele! / Re go rapela leineng la gagwe, / tlhomoga pelo!","Ka rosi re lerole le diboko, / re ba maleo, loso le botlhoko. / Ao, o se gane go re rekegela, / re itshwarele!","Gopola Jesu Kriste, Moreswedi, / o lebe ene, ka a re lefetse. / Ka madi a 'gwe o re pholositse, / re tle re phele.","Rra, o se re tlhoboge, re se fele; / se re tlogele, ka re tshwenyegile; / ka Jesu re abele Mowa wa 'go / le puso ya 'go."]},{"n":351,"t":"Ke tsholeletsa matlho a me","c":"Difela tsa Thapelo: Tsa Metlha yotlhe","k":"K320","v":["Ke tsholeletsa matlho a me / kwa dithabeng, legodimong, / kwa go leng Mong wa thuso ya me, / yo o mphang tsotlhe bophelong. / Jehofa mo legodimong / o tla ntlamela botlhokong.","Jehofa ke Mothatayotlhe, / yo o thusang, yo ' gololang / mo tlalelong ka metlha yotlhe, / o na le pelo e ' ratang / tse tsotlhe tse di bopilweng / legodimong le lefatsheng.","Oa go femela, o go disa / malatsi otlhe botshelong. / Fa batho ba ka go bogisa, / se tshoge, tia tumelong. / Modimo o o go disang / ke ona o ' sa otseleng.","Modisa wa Baisraele / ke ene yo o bolokang / ditokololo le mebele / le mowa o ' di laolang. / Ga a robale bosigong, / e bile ga se yo ' lapang.","Jehofa yo oa go femela, / ga ' go tlogele tlalelong. / Mo pogisong o ka tshabela / mo moriting kwa Modimong. / Fa o robetse bosigong, / o tla go disa borokong.","Fa 'tsatsi le Ila, le go fisa, / la motshegare tshepelong, / le ona ngwedi o go tshwenya, / fa o robetse bolaong, / ke ene yo ' go bolokang, / ke yo o go lapolosang.","Jehofa o go thibosetsa / masula otlhe mo tseleng; / e bile o tla go tshegetsa / le mowa wa 'go maketeng. / Leboga yo o go thusang / ka pelo e e mo utlwang.","Jehofa a ' go tshegofatse / mo pololong le kgorogong. / A ene a go nonofise / mo gae le mo tshepelong. / Mme fa o tsena mo losong, / a ' go tsholele 'godimong."]},{"n":352,"t":"Fa tatlhego e go tletse","c":"Difela tsa Thapelo: Tsa Metlha yotlhe","k":"K321","v":["Fa tatlhego e go tletse, / o le mo ditlalelong, / o rapele Rara thata, / o mo kope tumelong. / O re bona tlalelong, / o re utlwa thapelong. / Pelo ya me, gomotsega; / gonne o tla bolokega.","O ikanye tlhe Morena / yo ' sa tlhabiseng ditlhong; / itshwarelle mo go ene / Mmabaledi tlalelong. / Ke yo o go abelang / tsotlhe tse di batlegang. / Mo itsise, fa o tlhoka, / se tlhoboge, fa o boga.","Ee, Modimo goa o kgatlha, / fa a kopa tlalelong, / ka o batla dithapelo / le go tswella mo kopong. / Mme yo o o ikanyang, / yo ke monna yo ' fenyang / dira tsa 'gwe le tlalelo / ya jaanong le ya bofelo.","Motho, bona he ditiro / tsa Modimo mo bathong; / dilo tsotlhe di molemo, / tse o di ba tsisetsang. / Fa ba tsenngwa kwatlhaong, / o ba tiisa tumelong. / O se ka wa belaela, / o rapele, oa go utlwa.","Se ineele dithaelo / tsa ' Satan yo ' tsietsang, / mme busiwa ke kaelo / ya Modimo Lefokong. / 'Foko la 'gwe Beibeleng / ke lesedi mo tseleng; / le akanye, le dumele, / mme ka lone o sepele.","Ke tumisa tshegofatso / ya Jehofa yo ' nthusang. / O ntlosetsa tlhokofatso; / o leleka ba ' ntlhoang. / Ke tla mmaka bophelong, / ee, le kwa legodimong, / teng ke tla mo opelela / ka diletso le difela."]},{"n":353,"t":"O se re nyatse, ba re tlang go wena","c":"Difela tsa Thapelo: Tsa Motlha wa Ntwa","k":"K322","v":["O se re nyatse, ba re tlang go wena, / go go rapela tlalelong, Morena. / Ka metlha yotlhe rea go lebelela, / fa re rapela.","Thibela ba ba go nyatsang ka bomo, / ba ba ikgodisang le ka bosilo. / O re femele, re bahumanegi, / re se latlhege!","O re emele, fa ba re tlhabantsha, / ba ' re ilang; ka gonne oa ba kgona. / Ba tlhabolose, ba latlhise 'tšhaka; / re tla go baka.","Ke mang yo o ka re thusang, Morena? / Re ka ikanya mang fa e se wena? / Ka thuso ya 'go re tla fenya tsotlhe / le baba botlhe.","O na le thata mo babeng ba botlhe, / o ka boloka diphuthego tsotlhe, / ka moo re bitsa 'tlalelong tsarona: / Re thuse tota!"]},{"n":354,"t":"O Kgosi e e agisang","c":"Difela tsa Thapelo: Tsa Motlha wa Ntwa","k":"K323","v":["O Kgosi e e agisang, / Morena Jesu Krist'; / o thusa ba ba tlalelong, / ba ba go ikanyang. / Re tlhaeletsa kwa Rareng / mo leineng la gago.","Tlalelo ke e ' godileng / ka dintwa tse di teng; / ga go yo o ka re thusang, / yo ' re tlhabanelang, / fa e se wena Jesu Krist'; / re namolele baba.","O Kgosi ya kagiso, Mong, / ka fa o romilweng: / A ko o re ntshe mo dintweng, / re nne boiketlong, / re nne re utlwe lefatsheng / Lefoko la bophelo.","Dipetso tse di re tletseng / ke tse di tshwanetseng; / mme dibe ' re di dirileng / ke tse di bipilweng / ka madi a a tsholotsweng, / a re golotse gotlhe.","Tlalelo ke e kgolo jang / mo leroborobong, / mme yona e e e sitang / ke e e tswang dintweng. / Ka gonne ga go teng mo ntweng / tshwanelo le tshiamo.","Ee, go Ma tle go senyege teng / le botho mo bathong, / go be go tlhokwe kerekeng / Lefoko la 'go, Mong. / O re tlosetse lefatsheng / tlhabano le pheretlho.","A mowa o o bonisang / o thuse dipelong, / re nne ba ba tlhokomelang, / re nne ba ba utlwang / tse wena o di bolelang / ka dintwa le tlalelo. Dikgadima"]},{"n":355,"t":"Modimo o o tshabegang","c":"Difela tsa Thapelo: Sa Motlha wa Dikgadima","k":"K325","v":["Modimo o o tshabegang, / o ' kwa legodimong, / e bile ke o ' re ngokang / ka Jesu Kriste, Mong.","Ke ona o o dumisang / maru mo loaping; / ke o o a gadimisang; / ka o le mo tlading.","Ka moo re ba ' o gopolang, / ka fa o ntseng ka teng; / mme re ba ba o lebogang / ka pako difeleng.","O re golola mo poifong, / a re o tumiseng. / E bile ke o ' femelang / ba ba o ikanyang."]},{"n":356,"t":"Mong, re fe dijo ngwaga o","c":"Difela tsa Thapelo: Tsa go Rapelela Pula","k":"K326","v":["Mong, re fe dijo ngwaga o, / thibosa tlala lefatsheng; / re tshegofatse masimong, / Rraarona yo ' legodimong.","Re go rapela phuthegong, / o re fe dijo mo matlong, / jaaka o jesa mo nageng / 'nonyane tsotlhe tse di teng.","Le magakabe a a Ilang, / ke wena yo o a jesang, / diphedi tse di lebileng / wena yo o di tlhodileng.","Le rona ba re rapelang, / o re fe tse re di tlhokang; / mme re golole mo dibeng / ka Jesu yo o re swetseng.","Re bolokele ngwaga o / dijwalo tsotlhe masimong; / abela tse di lekanang / phuthego ya 'go e ' kopang.","Thibosa tlala lefatsheng, / malwetse, dintwa mo motseng; / o re fe pula e ' nosang / ka gale tse re di jwalang.","Modimo, o ' re ratileng / ka Jesu, re ba ' rapetseng, / re le ba ba go ikanyang / go ya le kwa bosakhutleng."]},{"n":357,"t":"Rra, re phuthegetse fano","c":"Difela tsa Thapelo: Tsa go Rapelela Pula","k":"K327","v":["Rra, re phuthegetse fano, / ka re le mo selelong; / gonne ga re itse ope / yo o re ntshang tlalelong. / Pula e a tlhokafala, / 'tsatsi le ntse le gakala; / tse di phelang mo nageng / ke tse di mo lenyoreng.","O Modimo o mogolo, / Mmusi yo ' sa fetogeng; / 'tiro tsa 'go tse dikgolo / ke tse di go supileng: / O tlhodile legodimo, / dikgwa, pula le masimo, / dibatana mo nageng / le dikgomo merakeng.","Ee, le rona ba re fano / re swabile dipelong. / Jaanong re tlogela maano / a a sa re phediseng. / Ruri, re go leofetse / ka go rata tsa lefatshe; / tseo ke tse di dirileng / gore re nne boketeng.","Rara, re go atamela / ka botlhoko mo pelong; / ka Morwao itshwarele / ba re tlhajwang ke ditlhong. / O re tlhomogele pelo, / o be o re fe bophelo. / Tsotlhe tse di sokameng / di lebale mo pelong.","Fa o tla re tima pula, / batho ba tla nna tlaleng; / 'kgomo fa di tlhoka phulo, / di tla swela dikakeng. / Ka go tlhoka le ka tlala / go ka tloga ga falala / badumedi phuthegong, / ba tshabela majakong.","Re fe pula, Mong wa rona, / pula e e siameng, / ya medupe e Ie tona, / e e sa re bolaeng / ka ledimo le ditladi, / e nne e e namagadi, / e ' thusangmo lefatsheng / tsona tse di swabileng.","Re kopile, Rra Modimo, / ka Morwao Jesu Krist'; / re lebile kwa go wena, / re boela malapeng. / Ruri ga re belaele: / Wena ga o e tlhaele, / pula ' tshweu, e ' re ntshang / letsatsing le le fisang."]},{"n":358,"t":"Rapelesega, Mong wa rona","c":"Difela tsa Thapelo: Tsa go Rapelela Pula","k":"K328","v":["Rapelesega, Mong wa rona, / Modimo mo legodimong! / Re mo komelelong e tona, / ga go na thuso mo bathong. / Letsatsi le lla thata jang! / Ga go na se se sa swabang.","Modimo, o Mothatayotlhe, / ke mang yo o sa go itseng? / O Mong wa baengele botlhe, / ke mewa e ' go reeditseng; / le rona batho lefatsheng, / ke wena ' o re bopileng.","Letsatsi, ngwedi, dinaledi, / ke wena ' o di beileng. / Lefatshe leno le diphedi, / ke wena ' o di tlhodileng. / Mawatle a ' gakgamatsang / le ona ke a ' go utlwang.","O laola phefo le sefako / le tladi e e tshabegang; / o nesa pula ka dinako / tse wena, Mong, o di ratang; / le gona o ntsha ditlhareng / dithunya le maungo teng.","Mme le fa di le kanakana, / ditiro tse di go kayang, / re phela fela ka go gana / tse wena o di laetseng. / Re bontshe ba re sa utlweng, / fa o se yo ' ka nyadiwang.","Modimo, o re itshwareIe, / ka re le ba ba inyatsang! / Ka Jesu o re rekegele, / o re gomotse ba re Ilang. / Re ka tshabela kwa go mang, / fa o le yo o re latlhang?","Rraarona, o solofeditse / go thusa ba ba go kopang, / ka moo re kopa mo go wena, / o nese pula e ' tlhokwang, / pula e e ka rudisang / mabele, mmopo le bojang.","Re tloga fano re dumela, / fa o le yo ' re utlwileng; / o tla re naya yona pula / ka nako e e lebanyeng; / mme re go boka dipelong, / Rraetsho yo ' legodimong."]},{"n":359,"t":"Bonang, lefatshe le omile","c":"Difela tsa Thapelo: Tsa go Rapelela Pula","k":"K329","v":["Bonang, lefatshe le omile, / komello ke e ' tshabegang; / majang a naga a swabile, / didiba ke tse di kgalang, / mme batho ba Ila mo tlaleng / le tsona 'kgomo lenyoreng.","Dinong di didimetse fela, / ga go melodi mo dikgweng; / dithole di a kuelela; / dinoka ke tse di kgalang, / mme maru a ' re tsisetsang / medupe, ke a a tlhokwang.","Diphologolo di fedile / ka Ieuba le le bolayang. / Matlhare a tlhotlhoregile / ka 'tsatsi le le a fisang. / Ga go na se se itumelang, / go setse tse di fegelwang.","Mme batho, ka ba sa dumele, / ba ikgolega barokeng, / gore ba ba nesetse pula / e e nosang kwa masimong. / Ga ba e batle Moreneng, / ba tabogela dingakeng.","Mme rona re tla kwa go wena / ka kopo e ' tswang dipelong: / Se re nyeletse tlhe, Morena, / le fa go se yo mo bathong / yo ' phepa, yo o siameng, / mme botlhe ba le mo dibeng.","A ko ' re thuse ka lorato, / Morena yo o rategang, / re itse gore re molato, / mme o yo o itshwarelang. / Folosa pula kwa marung, / e tshologele mo nageng.","Mme tshutshumisa ditselana / tsa 'go monono o ' kgatlhang. / Re go lebile jaaka bana / ba leba rraabo yo ' thusang. / Re utlwe, Mong legodimong, / o re fe dijo mo matlong.","Re thuse go pheIela wena / ka 'pelo tse di lebogang. / Re ise gae, Jesu Morena, / kwa go seng teng tse di tshwenyang, / kwa re tla nnang le wena teng / ka metlha e e sa khutleng. Tebogo"]},{"n":360,"t":"Ke tsile kwano phuthegong","c":"Difela tsa Thapelo: Tsa Moletlo wa Tebogo","k":"K330","v":["Ke tsile kwano phuthegong / ka thabo- kgolo mo pelong, / ka pako le tebogo. / Ke wena yo ke go bokang, / Modimo o ' galalelang, / o o se nang phetogo. / Pelo ya me / le molomo / le ditiro / dia go boka, / Rara le Modimo wa ka.","Lefatshe mo tikologong / le ne le le komelelong, / go se yo tsa bophelo. / Jaanong wa nesa pula teng / mo magoleng le mo nageng, / wa re tlhapisa pelo. / Ya nna ya na, / ya tlhogisa, / ya godisa / kwa masimo / tse di kotulwang ke batho.","Diphefo tse di fokileng, / le tladi e e tshositseng, / ga dia ka tsa re ama. / Ke wena yo o kganetseng / sefako se se ka senyang, / mme tsotlhe tsa siama. / Motho, bona / diphemelo / le tIamelo / ya Modimo: / o di tshole ka tebogo.","Mabele a mo difaleng, / jaanong re dule mo tlaleng, / pelo ea itumela! / Ao, tsaya pako molomong / le ditebogo mabogong, / ke tse, kea di go naya! / Neo tseo / tsa Modimo / wa godimo / a di thuse / batho gore o ba buse.","Dineo tse ke di filweng / a di se ntsenye molatong, / ke di dirise sentle. / A ke akanye mo pelong, / fa tsotlhe tse di mphedisang / o di mpha ka Iorato. / Jesu, tiisa / pelo ya me, / e tlhomame / ka Lefoko; / bofeIong a ke phologe!"]},{"n":361,"t":"Mo 'nageng tsa rona mono","c":"Difela tsa Thapelo: Tsa Moletlo wa Tebogo","k":"K333","v":["Mo 'nageng tsa rona mono / go ne go le komeIelo; / mo lefatsheng la ga etsho / ga utlwala sello se re: / \"'Tsatsi le fisa thata jang! / 'Tsatsi le fisa thata jang!\"","Sello se Mo sa tlhatlogela / kwa go Mong-wa-thata- yotlhe, / a nesetsa batho pula / ka lorato lo logolo. / Pula e pila thata jang! / Pula e pila thata jang!","A re lebogeng Morena, / re mo direleng bogolo; / o ntse a re babalela / ka tsa mmele Ie tsa mowa. / Mong o re rata thata jang! / Mong o re rata thata jang!"]},{"n":362,"t":"Re ya le Metong mo leineng","c":"Difela tsa Thapelo: Tsa Leeto","k":"K334","v":["Re ya le Metong mo leineng / la Mong wa rona 'godimong. / A moengele yo ' disang, / a a re pate mo tseleng.","Re bone thuso mathateng / jaaka Baisraele teng, / fa ba gololwa diatleng / tsa ' Farao, mo botlhankeng.","Morena, la Mola leetong, / le gona fa re lalang teng; / re lolamise mo tseleng, / o re femele dikotsing.","Foo ga re ba ba timelang, / mme re tla fitlha kwa re yang, / re itumetse dipelong, / re go leboga thapelong.","Morena, wena yo o Ieng / tsela ya nnete lefatsheng, / o re fitlhise 'godimong, / ka o re swetse s'fapaanong."]},{"n":363,"t":"Betsho, tlogang ka kagiso","c":"Difela tsa Thapelo: Tsa Leeto","k":"K335","v":["Betsho, tlogang ka kagiso, / Modimo o nne o lo dise, / o lo fitlhise kwa lo yang. / Fa Morena a lo goga, / foo ruri lo tla fitlha sentle, / le fa lo tsenye maketeng. / Lo na le Jesu Krist'; / o thusa tsamaong / batho ba 'gwe. / Se IebaIeng / ba re saIang; / le rona lo re rapelleng! DISAKRAMENTE Boitshepo"]},{"n":364,"t":"Rara yo o 'godimong","c":"Difela tsa Disakramente: Tsa Kolobetso e e Boitshepo","k":"K336","v":["Rara yo o 'godimong, / re tsisitse ngwana kwano; / o mo amogele, Mong, / dira nae kgolagano, / gore a nne ngwana wa 'go / botshelong jwa gagwe jotlhe.","Mo tlhapise, Jesu Mong, / mo mading, gore a bone / boitshwarelo maleong / a o tsaletsweng go ona. / O mo thuse go sepela / metlhaleng ya gago fela.","Mowa o ' itshepisang, / mo abele 'neo tsa 'go; / e nne wena ' o mmitsang, / o mo rute go dumela / mo go Jesu, ka ' mo swetse, / go nna tokololo ya 'gwe."]},{"n":365,"t":"Rara yo o 'godimong","c":"Difela tsa Disakramente: Tsa Kolobetso e e Boitshepo","k":"K337","v":["Rara yo o 'godimong, / re tsisitse bana kwano; / o ba amogele, Mong, / dira nabo kgolagano, / gore ba nne bana ba 'go / bophelong jwa bone jotlhe.","Ba tlhapise, Jesu Mong, / mo mading, gore ba bone / boitshwarelo maleong / a ba tsaletsweng go ona. / O ba thuse go sepela / metlhaleng ya gago fela.","Mowa o ' itshepisang, / ba abele 'neo tsa 'go; / o nne yo o ba bitsang, / o ba rute go dumela / mo go Jesu, ka ' ba swetse, / go nna 'tokololo tsa 'gwe."]},{"n":366,"t":"Tlaang jaana, re opele","c":"Difela tsa Disakramente: Tsa Kolobetso e e Boitshepo","k":"K338","v":["Tlaang jaana, re opele, / re be re lebogele / dineo tse ditona / kolobetsong ya rona.","E re fa bo Mitshwarelo, / ba re leng baleofi, / mme e re dira batho / ba ' Jesu, go ratana.","E re ntsha mo go mmaba, / e bile e re tsenya /pusong ya legodimo, / go aga le Modimo.","O dira kgolagano / le rona ya thatano. / Mme fa re fapogile, / re ka boela gona.","Re amogela jalo / dineo tse dikgolo, / tse e leng tsa legodimo, / tse di tswang go Modimo.","Mme fa re ka tswelela / mo tumelong, re fiwa / go rua ka botlalo / mo sebakeng sa go swa.","Go tswella kolobetso / ka go swa ntlheng ya dibe, / mme fa mokriste a swa, / Atam' o sweIa ruri.","E bile ka go tsoga / le Jesu Krist', Morena; / re tsoga re le bašwa / ka 'tsatsi la bofelo."]},{"n":367,"t":"Morena Jesu 'godimong","c":"Difela tsa Disakramente: Tsa Kolobetso e e Boitshepo","k":"K339","v":["Morena Jesu 'godimong; / yo o re ntshang mo maleong, / re go rapela tumelong, / re tshegofatse mo kerkeng.","Masea a re a tshotseng / ke bone ba o ba swetseng; / o ba tlamele bophelong, / ba nnele ruri tumelong.","Ke wena yo ' ba ratileng, / ka o ba tletse lefatsheng, / go ba biletsa tumelong / le go ba tshola mabogong.","Ba tsamaise mo tseleng, / go ba gorosa legaeng, / ka o boletse Lefokong: / Ke ba bogosi 'godimong.","O ba etleetse mo moweng, / o ba tsholele mo kerkeng; / ba ntshe dibeng ka madi, Mong, / a e nne ba ' pholosiwang."]},{"n":368,"t":"Bakaulengwe, rea lo tshola","c":"Difela tsa Disakramente: Tsa Kolobetso e e Boitshepo","k":"K340","v":["Bakaulengwe, rea lo tshola, / gore lo nne phuthegong, / ka lo tsile go ipobola, / lo fitlhile Modimong.","Lo tlogetse tsa lefatshe / tse di tswang mo boleong; / lo abelwa gompieno / tse di tswang mo Modimong.","'Atla tse tsa kabelano / re a di lo naa jaanong, /go nna mmogo ka tsalano / le lorato Modimong.","Lo se lebaleng maikano, / ona ' lo a ikanang: / Go latela ka thatano / Jesu yo o lo ratang.","Tlhabanelang Krist', Morena, / natlafalang thapelong. / Thata e tswa mo go ene, / go tlhomama tumelong."]},{"n":369,"t":"Lethabong ke bua ke re","c":"Difela tsa Disakramente: Tsa Kolobetso e e Boitshepo","k":"K341","v":["Lethabong ke bua ke re: / Ke yo ' kolobeditsweng! / Mme ke ngwana wa Modimo, / le fa ke le bokoeng. / Ke tla nyatsa khumo yotlhe, / ka ke humisitswe gotlhe / gona mo kolobetsong, / ka nna yo ' phologileng.","Dibe ga di mpoifise, / yo ke kolobeditsweng, / ka tumelo e ntshupetsa / Jesu yo o nkgolotseng / mo dibeng ka madi a 'gwe / le ka dipogiso tsa 'gwe. / Ruri, ke yo itshepileng, / ka ke tswa kolobetsong.","Satan, ke a go bolella: / Ke yo ' kolobeditsweng! / O tshwanetse go ntlogela, / wena yo o gaketseng! / Kolobetso e nkgolotse, / mme ka yona ke falotse, / mme ke ntshitswe bogosing / jwa 'go, ke mo leseding.","Mme fa ke swa, foo ke tla re: / Ke yo ' kolobeditsweng! / Ke tla rua jona boswa / jwa Modimo kwa bontleng. / Le fa mmele o tla bola / mo losong, ke a dumela: / Ke tla tsoga leroleng / le go phela bosasweng."]},{"n":370,"t":"Ka kolobetso go M ikopantse","c":"Difela tsa Disakramente: Tsa Kolobetso e e Boitshepo","k":"K342","v":["Ka kolobetso go M ikopantse / Modimo le nna mo pelong. / Ka boitumelo ke ikanya / Modimo mo ditlalelong. / Mme se se nthabisang ke se: / Nna ke yo ' kolobeditsweng!","Ka kolobetso ke abetswe / 'aparo tse di itshekileng; / ka tsona tse ke atlholetswe / bophelo jo bo sa khutleng. / Mme thuso mo kolobetsong / e tswa mading, sefapaanong.","Ka kolobetso ke neilwe / Mowa o o itshepisang; / ka ona o ke itshepile, / ke ona o o nthusitseng, / go tswa 'fifing le mo dibeng / le go dumela mo Kristeng.","Ka kolobetso ke kwadilwe / mo lokwalong legodimong, / ka jalo ruri ke ratilwe / ke Rara mono bophelong. / Leina le ke le teilweng / ke le Rara o le itseng.","Ka kolobetso ke humile, / ka ke le ngwana Modimong. / O intshwaretse, o ntheile: / Ke tla go thusa tlalelong! / Fa ke le yo o rapelang, / a nkutlwe a re: \"O batlang?\"","Ka kolobetso ke tla rua / bophelo jo bo sa khutleng; / mme ka tumelo ke tla bua / ke re: Ke ngwana Modimong, / ke hudugela legaeng, / go phela ka bosakhutleng."]},{"n":371,"t":"Modimo, ke kolobeditswe","c":"Difela tsa Disakramente: Tsa Kolobetso e e Boitshepo","k":"K343","v":["Modimo, ke kolobeditswe / mo leineng la gago, Mong. / Ke ngwana wa 'go, ke kopantswe / le bone ba ' tlhapisitsweng. / Jaanong ke tsentswe mo go Krist', / ke neilwe Mowa mo pelong.","Rara, o mpitsa ngwana wa 'go, / wa boswa kwa legodimong. / Mme Jesu, o nkabetse thuso / e ' tswang losong sefapaanong. / Mme wena Mowa, mo pelong / o a nkgomotsa tlalelong.","Le nna ke go solofeditse, / go nna yo o ikanyegang; / ka go re, ke itatotse Satan / le dilo tse a di ratang. / Ke ipofile maikanong / go nna wa gago botshelong.","Modimo, wena o boikanyo / kgolaganong e ' tlhomameng, / mme nna, fa ke e hularela, / a ke se swele tatlhegong. / O ntshole gape loratong, / fa ke timetse mo tseleng.","Jaanong ke go ineela sešwa, / Modimo wa me, tumelong; / o ntsose, ke nne boikanyo, / ke nne yo o go phelelang; / mme ke tswe gotlhe boithatong, / a ko ' nne yo o ntaolang.","Ntlogele, Satan, mmaba wa ka, / ga se nna yo ke go batlang. / Ke ne ka tshwenngwa ke letswalo, / Jesu o ntsentse kagisong / ka madi a ' ntshololetsweng. / Lefatshe, dibe, ntlogeleng!","Modimo Rara Morwa, Mowa, / o ntiise maikaelelong / a go nna wa 'go ka boikanyo / go ya go fitlha mo losong; / ke tle ke swele kagisong, / ke go tumise 'godimong. sa Morena"]},{"n":372,"t":"Mowa wa me, iketleetse","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K344","v":["Mowa wa me, iketleetse, / o tswe mo dibeng tsa gago; / tlaa 'seding ka boitumelo, / ipaakanye ka tumelo. / O bidiwa ke Morena / go ja Selalelo nae; / a go nee boitshwarelo / jo bo tswang losong Iwa gagwe.","Itlhaganne o kgatlhantshe / Jesu, Mogolodi wa 'go; / kana o a konyakonya / mojakong wa pelo ya 'go; / o akofe go mmulela, / o mo tshole ka tsalano / o re: Tlaa, ke a go rata, / o nne Mopholosi wa me.","Nna, Morena, ke utlwela / 'rato Iwa 'go tlala tota; / go tlhologeletswe pelo / go abelwa sejo sa 'go. / Ga ke bolo go lelela / seno se go se nosiwa. / Jesu, Mogolodi wa me, / o nkopanye le Modimo.","Jesu, o letsatsi la me, / Jesu, o bophelo jwa me; / o motswedi wa pholoso, / wa kgomotso le nametso. / Ka moo ke a go rapela, / a ke tshole Selalelo / ka tumelo le tshwanelo, / ke be ke se lebogele.","Jesu, o ne wa tla fela / ka lorato go re swela; / mmele wa 'go wa robiwa, / madi a 'go a tshololwa, / mme ka senkgwe le ka weine / o re naya tsona tseo, / go re itshwarela dibe, / mme re boke 'rato Iwa 'go.","Jesu, senkgwe sa botshelo, / nthuse ke se itshenyetse, / ke se jele tlhe lefela, / ke le tafoleng ya gago. / Dijo tse a di ntshupetse / 'rato lo logolo Iwa 'go. / Ke tle ke nne fa go wena / godimong jaaka kajeno."]},{"n":373,"t":"Morena Jesu bosigong","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K345","v":["Morena Jesu bosigong / jo o ekilweng ka jona, / a re gopola mo pelong / ka 'rato lo lotona:","A tsaya senkgwe seatleng, / mme a se nathoganya, / a b' a lelala kwa Rareng, / a se mo lebogela.","A bua a re barutweng: / Tsayang lo se je lotlhe, / ke mmele wa me o ' neetsweng / losong, go thusa botlhe.","Ya baya gona o tsayang / senwelo go ba nosa, / a re: Ke madi a me, nwaang! / A tla lo lapolosa.","Ke madi a a tshololwang / go itshwarela batho. / Ke ona a a gololang / ba ba nang le melato.","Motlhang lo jang, motlhang lo nwang, / lo nkgopoleng ka gale, / ka ke le ene yo ' lo ntshang / petsong e e botlhoko.","Ee, Jesu, Moreswedi, Mong, / ke go leboga thata! / A ko o nnee Selalelong / bophelo le kgomotso."]},{"n":374,"t":"Morena yo o laletsang","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K346","v":["Morena yo o laletsang / baleofi, o mpiditse, / ka moo ke yo ' atamelang / dijong, di etleeditswe. / A o ko o ntlhapise, Mong, / ke tsene mo Selalelong / ke ntse ke ipaakantse. / Ka yo o sa ipaakanyang / e le yo o tla latlhegang, / ka a se na tumelo.","Boikwatlhao mo pelong / ke ipaakanyo ya me. / Ke itatlhela dinaong / tsa gago, Jesu wa me. / Ke kopa ke le tlalelong, / a ko ' nkgolole maleong / ka ntlha ya madi a 'go. / O ntshwetse mo sefapaanong, / go nthekolola tatlhegong / ka lone loso Iwa 'go.","Ke tsile yo ke dumelang, / ke kopa thata ya 'go. / A ko ' nkwalele mo pelong / mafoko a 'go, o re: / Tsayang le go ja senkgwe se! / Ke mmele wa me o ' neelwang / losong ka go bapolwa. / Tsayang le weine, lotlhe nwaang! / Ke madi a me a ' tshollwang, / ka ona loa gololwa.","Ke tshola mmele mo senkgweng, / ke o ja ka tumelo; / mme ke nwa madi mo weineng, / ke se na pelaelo. / Ga se se se tlhaloganngwang, / mme ke se se gakgamatsang, / ka se re sita rotlhe. / Mothatayotlhe yo ' dirang / tse tsotlhe ka fa a ratang, / ke mo ikanya gotlhe.","Ke tsile mo Selalelong / go bona 'rato Iwa 'go, / le go gopola pogo, Mong, / e e botlhoko ya 'go. / Mme ke go leba s'fapaanong, / o le kgobong le mo losong, / ka lone a ke phele! / O Kgosi e e siameng, / nna ke motlhanka yo ' dibeng, / o Mmusi, ke lerole.","Mme thuso e, e kgolo, Mong, / a nka e go duela? / Ke tla go rata bophelong, / ke tla e lebogela / ka go itshoka pogisong, / ke tla tswelela tumelong / ka thata yotlhe ya me. / Ke tla itshwarela lefatsheng / bone ba ba nkgopisitseng / le tsona dira tsa me.","Go dira tsona tsotlhe tse / go thata, ke paletswe! / Mme ke ka fetsa tiro e, / fa wena o nkemetse; / ke wena, Jesu, yo o leng / teng fano mo Sakramenteng, / o age pelong ya me! / Ke tiisitswe Selallong, / go go direla mo kutlong / botshelo jotlhe jwa me."]},{"n":375,"t":"Moswedi wa basenyi","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K347","v":["Moswedi wa basenyi / ke Jesu Golgoteng, / o sule ka botlhoko / go re ntsha mo dibeng.","Jaanong re mo gopola / re le Selalelong, / ka a n' a re golola / ka loso s'fapaanong.","Ee, o na a bapolwa / ka 'mapo legonyeng, / mme re gololwa jalo / ke ene mo dibeng.","Ke rona ka maleo / re mo kokotetseng, / mme ga a leba seo, / ke yo ' re lefetseng.","Mme a re swela jalo, / a fitlhwa lebitleng, / a ba a re tsogela, / re tsoge diphupung.","Jaanong rea mo gopola / a le kwa Golgoteng, / mme a re rekolola / ka go re swela teng.","Jesu, re go leboga / jaanong mo phuthegong. / Re thuse go goroga / le kwa legodimong."]},{"n":376,"t":"Ao, ke go lebogela jang","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K348","v":["Ao, ke go lebogela jang / mmele le madi a 'go! / Le nna a ke nne yo ' phelang / ka 'neo tse tsa gago. / Ke go leboga, Jesu Mong, / ka o sa nnyatsa maleong, / mme wa tla go ntekola.","Ke wena yo o ntlamelang / botshelong jotlhe jwa me; / jaanong ke nna yo ke buang: / O wa me, nna ke wa 'go! / Mme mo mading le mo mmeleng / wa gago ke tla bona teng / kgomotso le bophelo.","Ke wa 'go ka bosakhutleng, / ke tla phelela wena, / mme wena yo o njesitseng, / kea itse, o tla nnaya / go tia le mo bokoeng / ka sejo se ke se jeleng, / ke bone go falola."]},{"n":377,"t":"Morena yo o re swetseng","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K349","v":["Morena yo o re swetseng, / o senkgwe sa bophelo, / o jesa ba ba mo tlaleng, / o ba fa boitshwarelo. / Ke gona ke go rapelang: / Mpaakanye, nna yo ke tlhokang, / mme ke tle ka tshwanelo, / go tshola Selalelo.","Nkgogele, Jesu, mafulong / a tshegofatso ya 'go; / o be o nkise fa dijong / le motsweding wa gago. / Oa itse, ke mo maleong, / mme ke bokoa tumelong. / O nnee boitshwarelo, / ntiisetse tlhe tumelo.","Morena, ke mo tlalelong / ya dibe, ke a lela, / ke bitsa wena, Jesu Mong, / ke bile kea go kopa: / A ke tle mo Selalelong / sa gago, ke le tumelong, / o njese mmele wa 'go, / o nnose madi a 'go.","Ntlosetse kilo mo pelong / le bogalaka jotlhe. / A ke nne yo ' ikwatlhayang / ka ntlha ya dibe tsa me. / Ao, Kwana e e tlhabetsweng / sefapaanong kwa Golgoteng, / ke kopa ka thapelo / gore o nkamogele.","Jaanong ke atamela fa, / ruri, ga kea tshwanela; / maleo a a nkimelang / a mantsi jang! Aa ntetsa. / Jesu, nkgomotsa tlalelong, / ka o nowa tswa 'godimong, / go batla balatlhegi, / ee, le bahumanegi.","Maleo ke a a ntwatsang; / Morena, o mphodise; / bofofu ke jo bo ntshwenyang, / Morena, o mponise. / Ke kwana e e timetseng, / mpusetse kwa letsomaneng. / Khutlisa tlhe selelo, / mme o mphe boitumelo.","Moratwi wa me, tlaa jaanong, / o age pelong ya me. / A ke nne wa 'go bophelong, / mme wena o nne wa me. / Kopano e, e siame jang! / A e nne e e tlhomameng / mo malatsing a otlhe, / ka kwano le koo pele.","Morena Jesu, tlaa jaanong, / o njese senkgwe sa 'go. / Le gona nnose fa jaanong / senwelo se sa gago. / Ee, Jesu wa me yo ' nthatang, / ka re kopantswe Selallong, / o ntsose, fa o tla tla, / ke ye go phela nao."]},{"n":378,"t":"Mowa wa me, o tlogele","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K350","v":["Mowa wa me, o tlogele / dijo tsotlhe lefatsheng. / Tlaa jaanong o amogele / Selalelo altareng. / Mmaba oa se galefela, / rona re a se thabela.","Pelo, o se belaele / thuto e o e utlwang / ga Selallo, o dumele / se se go gakgamatsang. / Se imelwe ke molato, / tshola Jesu ka tumelo.","Jesu, ka o rata go tla, / tsena fela mo pelong; / mme Morena, o a itse, / fa ke sa le maleong. / Ke go kopa ka thapelo, / a ko o mphe boitshwarelo.","A ke tshole ka senkgwana / mmele o o bapotsweng. / Ka senwelo ke nosiwe / madi a a tsholotsweng. / Mopholosi o etela / ene molatlhegi jalo.","Tlaa, Morena, o nkabele / mmele wa 'go mo senkgweng; / Mowa wa 'go o gogele / mowa wa me mo tseleng, / gore ke go kgomarele / bophelong, ke go latele.","Tlaa jaanong, mme o ntlhapise / dibe tsa me mo mading. / Ke godisa 'rato Iwa 'go, / ka o ntshwetse Golgoteng; / o nkabela thekololo / ka lorato lo logolo.","Jaanong fa ke amogela / 'neo tseo Selalelong, / ke tla nna ke lebogela / petso ' o e bogileng / le matlhoko otlhe a 'go / le boitshoko jotlhe jwa 'go.","O ntiisetse tlhe tumelo / le go nkgoga botshelong. / A ko ' nthute go rapela / le go rata batho, Mong. / Nthatafatsa, ke tlhabane / le lefatshe le Satane.","O nkgothatse, Jesu wa me, / ka Selallo bofeIong, / sona e nne mhago wa me, / fa ke tlogalefatsheng. / A legodimong, Morena, / ke nne Selallong le wena."]},{"n":379,"t":"Ao, Jesu yo o nthatileng","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K351","v":["Ao, Jesu yo o nthatileng, / Morena yo o bapotsweng, / yo o ntshwetseng sefapaanong, / yo o nntshitseng mo maleong,","ke tsile mo Selalelong / sa gago ke le botlhokong; / ke mo dibeng, ke Iwala jang! / O se nne yo o ntelekang!","O Ngaka e e alafang, / o 'tlhare se se fodisang, / sediba se se sa kgaleng / le senkgwe se se sa feleng.","Ka moo ke yo o rapelang: / Nkalafe nna yo ke Iwalang, / o nnose yo ke nyorilweng, / o njese yo ke mo tlaleng!","Mme tsona tse ke di kopang / ke pelo e e dumelang / le matlho a a budilweng / le khumo e e sa feleng.","A ke go tshole mo senkgweng, / le gona jalo mo weineng; / ke se lebale mo pelong / matlhoko a 'go s'fapaanong.","O nnee tse di tla mphedisang, / leleka tse di ntshenyetsang. / A ke nne yo o kopantsweng / le wena ka bosakhutleng.","Bolaya tsotlhe mo pelong / tse di tswang teng mo boleong; / lorato lo tsalelwe teng, / lone lo lo tswang tumelong.","Mme o mphemele mo direng / tse tsotlhe tse o di itseng. / A ke nne yo o sepelang / tseleng e e tla nkgorosang.","A ke nne motho yo ' ratang / tse tsotlhe tse di go kgatlhang. / O mphe kagiso lefatsheng / le tapoloso legaeng.","Ka moso nkisa bogosing / jwa gago jo bo kwa 'seding, / ke itumele Selallong / sa gago kwa legodimong."]},{"n":380,"t":"Mong a a bakwe, ka a re jesitse","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K352","v":["Mong a a bakwe, ka a re jesitse, / a bile a re nositse / ka ona mmele le ka madi a 'gwe, / rona badumedi ba 'gwe. / Kirieleison. / Ka o neetse mmele mo losong, / o tsholotse madi s'fapaanong, / Jesu Mong, yo ' busang, / re ntshe mo ditlalelong. / Kirieleison.","Jesu Morena ruri o re swetse / gore re se ka ra fela; / lorato loo, lo a re gakgamatsa, / ruri oa re tshegofatsa! / Kirieleison. / Jesu, madi a 'go pogisong / a re rekolotse tshenyegong, / melatong le losong, / a re isa 'godimong. / Kirieleison.","Jesu, a ko o re fe thuso ya 'go, / re tsamae tsela ya 'go. / A re ratane, ka re tlhakanetse / Selalelo se le sengwe! / Kirieleison. / Mowa wa 'go o ' itshepileng / o re rute tse di tshwanetseng, / go nne teng mo kerkeng / 'rato lo lo sa feleng. / Kirieleison."]},{"n":381,"t":"Re tswa mo Selalelong","c":"Difela tsa Disakramente: Tsa Selalelo sa Morena","k":"K353","v":["Re tswa mo Selalelong / ka tebogo mo pelong, / ka re bonye yo o fang / mowa se se phedisang: / Jesu, Kwana e ' tsileng / go re sweIa Golgoteng.","Mowa o ' re abelang / sego le re le batlang, / o re tsose mo pelong, / o re tsenye mo thabong / ka Morena Golgoteng / Jesu yo ' re ratileng.","Mmele o re o jeleng / mo senkgweng fa altareng / ke wa ' Jesu yo ' ratang / batho botlhe thata jang! / O ba tiise tumelong / gore ba nne ba 'go, Mong.","Madi a re a noleng / mo weineng mo senwelong, / a tsholotswe Golgoteng, / re tle re tswe mo dibeng. / Ona ke a ' re tiisang, / go nna ba ba dumelang. BANA"]},{"n":382,"t":"Ke konyana mo 'sakeng","c":"Difela tsa Bana","k":"H188","v":["Ke konyana mo 'sakeng / la ga Jesu yo e leng / Moredisa, o a nkitse / ka leina, o ntisitse / mafulong a' nkgorisang. / Ke mo ke itumellang.","Mme mogang ke nyorilweng / o a nnosa sedibeng. / Mo moweng o a nthudisa, / gale o a ntsamaisa / mo tseleng e ' siameng; / jaana ke sa tlhoka eng?","Lefifing go ka ntshosang? / Jesu ke yo o mpayang / magetleng, a nkisa gae / ke tle ke phelele nae / mafulong a sa swabeng. / Gona kwa paradiseng."]},{"n":383,"t":"O re tshegofatse","c":"Difela tsa Bana","k":"H189","v":["O re tshegofatse / le go re tlamela, / Rara yo o rategang, / rona, ba re go kopang.","O re nee kagiso / ka malatsi otlhe / Mowa, tsena dipelong / o re supe Jesu Mong.","Jesu Mopholosi, / Mong wa batho, Kgosi, / re go ikanya gotlhe; / busa ba ba go ratang.","Amen, Amen, Amen! / Tlotlo e nne jalo / ya Morena Jesu Krist' / yo o re tshegofatsang."]},{"n":384,"t":"Ela tlhoko dinaledi!","c":"Difela tsa Bana","k":"H195","v":["Ela tlhoko dinaledi! / Yo di tlhodileng ke mang? / Maru ona a o itse / kwa a tswang le kwa a yang! / Mong wa tsona ke Modimo / oa di bitsa ka maina. / Ga go se se lebetsweng. / Ga go se se lebetsweng.","Ela tlhoko dinonyane, / ka di fofa leaping! / Lebelela le ditlhapi / tse di nyeulang metsing! / Di bopilwe ke Morena. / O di bitsa ka maina. / Ga go e e lebetsweng. / Ga go e e lebetsweng.","Lebelela bana botlhe / ba ba atileng 'fatsheng! / Ba tshameka ba thabile / ga go se ba se tlhokang. / Ke Modimo yo leng rraabo / O ba bitsa ka maina. / Ga go yo o lebetsweng. / Ga go yo o lebetsweng. TLHOMAMISO"]},{"n":385,"t":"Motlhodi wa me, tlaa","c":"Difela tsa Tlhomamiso","k":"K166","v":["Motlhodi wa me, tlaa / o nne yo ' mponisang; / o nkgoge mo tseleng / go ya le kwa losong. / Ke itira setlhabelo / ka ditokollo tsa me; / ke neela pelo ya me / mo tirelong ya gago. / O rata, ke nne wa 'go, Rra; / Motlhodi wa me, tlaa.","Ao Jesu yo ' nthatang, / ntlhapise mo mading / a gago, a ' tlosang / maleo mo pelong! / Mme e re ke timetse, / Morena, o ntatele, / o nthuse, ke falole / mo tatlhegong ya dibe. / Ke nna yo o latlhegileng. / Ntlhapise mo mading.","Mowa o ' emelang / Morena mo bathong, / o nne yo ' mphenyisang, / fa ke le thaelong; / o nthute go dumela / go Kriste Jesu fela; / o nkgoge, ke tsamae / ditsela tsa 'gwe nae. / Ke wena yo o nnonotshang, / nna yo ke palelwang.","Modimo o o leng / o mongwe borarong, / o nkwalle mo pelong, / ka fa o ntseng ka teng. / Itseele pelo ya me / go nna Tempele ya 'go. / Go galalele wena / ka 'tiro tsa me tsotlhe. / Fa ke gotshwere tumelong, / ke mo boitumelong."]},{"n":386,"t":"Mo 'nageng tse ditalana","c":"Difela tsa Tlhomamiso","k":"H178","v":["Mo 'nageng tse ditalana / Jesu o fudisa teng. / Dinku tsa 'gwe le konyana / tse o a di ratileng. / Rara o mo laodisitse / botlhe ba ba mo utlwang. / Bona mme ba mo ineetse / ene yo o ba disang.","Ya re fa go diragala / kwana nngwe 'tsomaneng / e timetse, e sa bonwe, / e ntse tatlhegong nageng, / Jesu yo e leng Modisa / yo ' molemo phuthegong / a e batle go e isa / kwa 'sakeng, mo pholosong.","A lo ka se ka lwa rata / go nna ba 'gwe phuthegong? / Gonne o eletsa thata / go lo isa pholosong. / Ruri o na a lo swela / ka lorato s'fapaanong, / go lo thusa, go lo tseela / gona kwa legodimong. DIPAKA"]},{"n":387,"t":"A re tsogeng, bo sele","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K354","v":["A re tsogeng, bo sele, / re tsene thapelong! / Letsatsi le tlhabile / le le re gopotsang / Modimo, fa o riIe: / A 'sedi le nne teng! / Jaanong re ka direla / ditiro leseding.","Morena, o letsatsi / la rona mo pelong. / Wena Motshegofatsi / wa rona bophelong, / a ko ' re phatsimele, / re tsoge borokong / ka go tlogela dibe / tse di re timetsang.","Morena, intshwarele / tse ke di dirileng / le dibe tsotlhe tsotlhe, / tse di sa itsiweng. / Le gona kea go kopa: / Nna le nna 'tsatsi le; / bosula bo se ntlele, / ke se nne maleong.","Ke a go solofela, / Jesu yo o ntshwetseng; / o tsile gangwe fela / go re ntsha mo dibeng. / Ga ke boife sepe, / ka ke le tumelong; / ga go na thata epe / e ' ka ntshwenyang jaanong.","Jesu, kea go rapela, / o nthuse 'tsatsi le, / gore ke dire fela / tse di go thabisang; / ka gonne o kgatlhega / ka tse re di dirang / mo leineng la gago, / yo o re ratileng.","Ditsala tsotlhe tsa me / le ba ke ba ratang, / losika lotlhe Iwa me, / ee, le ba ba nthatang, / Jesu, ba thuse botlhe / go phela tumelong; / mme bangwe ba timetse, / ba buse timelong.","Le badumedi botlhe / ba ba go ineetseng / mo ditšhabeng tse tsotlhe / le kwa ba phelang teng, / ba nee boitumelo / jo bo tswang Lefokong; / fa ba tshwanetse go swa, / ba swele tumelong.","Ke bua ke re: Amen, / ka pelo e ' itseng, / fa rotlhe re tla fiwa / tse re di kopileng. / O tla ntsholela gona / go wena 'godimong, / le bone batho botlhe / ba ba mo tumelong."]},{"n":388,"t":"Itsose, mowa wa me","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K355","v":["Itsose, mowa wa me, / opela o leboge / Motlhodi wa tse tsotlhe, / Modisa wa ba botlhe.","Bosigo bo fetile, / letsatsi le tlhabile; / mme ke tsogile sentle / ka thuso ya Modimo.","Ee, Rara, o ntisitse, / o Mong wa thata yotlhe. / Nna ke robetse pila, / le fa Satan a nkila.","Mme e re ka ke tshela, / ke rata go leboga. / Ke tsisa dithapelo, / ke bile ke opela.","Se gane pako ya me, / o itse pelo ya me; / ga ke na ditshupelo, / fa e se dithapelo.","A o ke o ntlamele / kajeno le ka gale, / o ntshole jaaka ngwana, / ke nne 'phukeng tsa gago.","Morena, tlhomamisa / ditiro tsa me tsotlhe, / ke dire, o na le nna, / o be o ntshegofatse.","O tsene pelong ya me, / o e dire Tempel ya 'go, / o nkotle ka Lefoko / go fitlha ke goroga."]},{"n":389,"t":"Ditiro tse ke di dirang","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K356","v":["Ditiro tse ke di dirang / ke di rapella Modimong, / di tshegofale lefatsheng, / di tlotle o o mphedisang, / o o nthusang.","Ke kgona tsotlhe bophelong / ka thata e ' tswang Modimong. / Ke batla Jesu thapelong, / ke mo ineela bophelong. / Ke yo ' nthusang.","Fa a sa nthuse mo tirong, / ke tla nna yo o palelwang. / Modimo ke o ' ntirelang / tse tsotlhe tse di batlegang; / ke o ' nthusang.","Ka o ntlamela lefatsheng / ke tla o tlotla difeleng. / Ka 'Foko le o le buang / ke dira tse di ntebanyeng; / ke o ' nthusang.","Tshimologong le bokhutlong / ke itshwarella Modimong. / O nnaya tse di tla nthusang, / ka moo ke yo o lebogang / o o nthusang.","Mme fa ke tsena tlalelong, / o nthusa mo ' gakgamatsang, / ka ke le yo ' simolotseng / ditiro tsa me Moreneng, / yo o nthusang.","Ke ene yo ' mpabalelang / mo bophelong le mo losong. / O dira ka fa a ratang. / Ke ene ' ke mo ikanyang, / ke yo ' nthusang.","Ke tla tswelela lefatsheng / go dira tsotlhe Moreneng. / O tla khutlisa mo losong / ditiro tsa me lefatsheng; / ke yo ' nthusang."]},{"n":390,"t":"Bakang Morena, ba lo boifang ene!","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K357","v":["Bakang Morena, ba lo boifang ene! / A re opeleleng leina la 'gwe, / re ise pako altareng ya gagwe. / Bakang Morena!","Bosigong jono o re bolokile, / o re khurumeditse ka phemelo; / jaanong o re tsositse ka boipelo. / Bakang Morena!","Modimo o re tshegofatsa jaana: / re kgona go dirisa tlhaloganyo / le ditokollo go ipabalela. / Bakang Morena!","Fa mollo o M ise o tle go re fisa / le matlo jalo, re ntse re robetse, / ke thuso ya 'gwe, ka a re femetse. / Bakang Morena!","Mme fa basenyi gongwe dinokwane / di sa itseela ditsarona tsotlhe, / ke pabalelo ya Mothatayotlhe. / Bakang Morena!","Rraarona, o Modisa yo ' boikanyo, / a ko o tswelle go re disa jalo / mo bosigong le gona motshegare. / Bakang Morena!","Le gompieno pata batho ba 'go / gongwe le gongwe kwa ba tla yang gona; / mme o ba thuse ditirong tsa bone. / Bakang Morena!","Re tlhotlheletse gore re eletse / go dira ka fa Lefokong la gago; / mme o re tiise, fa re le bokoa. / Bakang Morena!","Re siamise gore re go boife, / re se tshameke ka dipetso tsa 'go, / re tlhabologe, o ise o tle gape. / Bakang Morena!","Morena, fa o boa, o fitlhise / batlhabologi, badumedi, ba 'go, / kwa baengele ba opelang gona: / Bakang Morena!"]},{"n":391,"t":"Ka letsatsi le tlhabile","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K358","v":["Ka letsatsi le tlhabile, / batho, tsenang dipakong! / Tumisang Motshegofatsi, / lo mmakeng, lo lebogeng!","Le diphologolo tsotlhe / di tumisa mo dikgweng / yo o ntseng a di phedisa, / e le yo ' di bopileng.","Le ditlhare le dithunya / tse di gona kwa nageng / di tumisa Mong wa tsona, / yo o di kgabisitseng.","Dinonyane di tumisa, / di agile ditlhareng, / ka melodinyana yotlhe / ene yo o di itseng.","A le rona re tumise / Mmopi yo ' re bopileng, / re mmakeng jaaka diphedi / tsotlhe tse di lefatsheng."]},{"n":392,"t":"Morena, tsena mo pelong","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K359","v":["Morena, tsena mo pelong, / o 'tsatsi la tshiamo. / Nkgogele kwa kgalalelong, / ntlosetse ditshokamo. / O mphe jaanong / tumelo, Mong, / kagiso le lesego / mosong o montle ono.","O nthobaditse bosigong / tisong ya baengele. / Ke se ke se lebogelang / ka pelo ya me yotlhe. / Se nkgane, Mong, / motshegareng / o nketelele pele, / o mpate 'tsatsi lotlhe.","Molemo wa 'go ' o M itshupang / o nthuta go leboga; / ke gona ke o gopolang, / fa mo mosong ke tsoga. / Ke o ' nthusang, / ke o o nntshang / serung sa mmaba wa ka: / Satane, mong-wa-maaka.","A ko o ntshelle mo pelong / botlhale jwa bodimo. / O mpipe ka diphuka, Mong, / tsa tshireletso ya 'go. / Matshwenyegong / le botlhokong / nkgomotse, Jesu wa me, / o tlose 'pogo tsa me."]},{"n":393,"t":"Ka pelo ya me yotlhe","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K360","v":["Ka pelo ya me yotlhe / ke yo ' go lebogang / mosong o le ka gale, / Morena yo ' nthatang. / Yo o ntseng mo troneng, / Modimo wa mannete, / ka leina la ga Jesu / ke yo o go bakang.","Ka gonne o mphemetse / bosigong borokong. / Ke ne ke sa tlalelwa, / ke le mo kagisong. / Jaanong ke yo ' kopang: / Morena, intshwarele / maleo a me otlhe, / a ' go gakaditseng.","Le gompieno gape / o nne yo ' mpolokang. / Satane a se nkgone, / yo o nkgakaletseng. / Nnamole tlalelong / ya mollo le ya tlala, / ya loso, ya molato / le yona ya ditlhong.","Mowa le mmele wa ka / le tse ke di tshotseng / ga mmogo le bagolo / le batho ba ' nthatang, / ke ba ke ba tsenyang / mo diatleng tsa gago. / O re boloke rotlhe, / re se nne tshwenyegong.","Romela moengele / go nthusa kgatlhanong / le Satan le 'thaelo / tse di re tlhaselang. / Ke nne tshireletsong, / fa Satan a nthaela, / a leka go ntshenyetsa, / go nkwetsa tatlhegong.","Morena, o ntaole / yo o sa palelweng. / O tshegofatse tsona / tse ke di ikaeletseng. / Ke yo o ineetseng / ka mowa le botshelo, / ka mmele le ditiro / go wena yo ' nthatang.","Ke fetsa ke re: Amen, / ke yo o dumelang, / fa wena o tla utlwa / tse ke di kopileng. / Jaanong ke ya tirong, / go e dira ka tebogo, / ka o e ntaoletse, / e ke e abetsweng."]},{"n":394,"t":"Jesu o tla kwa go rona","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K361","v":["Jesu o tla kwa go rona / ka mahube a letsatsi, / kwa re solofetseng ene / go re tshegofatsa teng.","Jaanong a re se mo gane, / a re mmuleleng lobati. / Re mo tshole ka boikobo; / mme a tsene dipelong.","Jesu, o nne mo go rona, / o kganele dira tsotlhe. / O re kwale bukeng ya 'go / ya go tsena bophelong.","Mme Morena, re fudise / mafulong a matalana, / e bong 'Foko la botshelo, / lone le le tshedisang.","Amen, go tla dirafala, / Jesu o tla nna le rona; / re tla mmona ka lethabo, / e se yo ' re tlogelang."]},{"n":395,"t":"'Sedi le le sa khutleng","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K362","v":["'Sedi le le sa khutleng / le le tsetsweng keodimo, / re romele mo mosong / marang a 'go, re a bone. / Tlosa bontsho dipelong, / tsena teng.","'Fifi le le re wetseng, / ka Atam a leofile, / a le tloge merafeng, / ka letsatsi le tlhabile, / e bong Jesu yo ' tsileng / lefatsheng.","A go wele dipelong / monyo wa molemo wa 'go. / Re gomotse tlalelong, / lapolosa 'somo la 'go, / le se swabe dipogong, / bophelong.","A lorato lo ' tukang / Iwa 'go lo bolae 'tiro / tse di dirwang boatleng. / Mme a ko o re kuruse / gore re tswe maleong / mo mosong.","A re apoleng jaanong / diaparo tsa boleo; / re apare mo mosong / tshiamo ya Morena Jesu / e e gololang losong / le mollong!","'Sedi le le sa khutleng, / a ka 'tsatsi la bofelo / re tsosiwe diphupung, / re nne batho ' bašwa gotlhe / bophelong jo bo tletseng, / lethabong.","O nne 'sedi mo tseleng / go ya lefatsheng le lešwa. / Tsotlhe tse di re Ilisang, / re fetise mo go tsona; / re gorose legaeng, / boikhutsong."]},{"n":396,"t":"Simolola mo mosong","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K363","v":["Simolola mo mosong / 'tiro tsa 'go tsotlhe / ka Morena tumelong, / ke Mothatayotlhe. / Fa o tsoga mo mosong / gongwe o robala, / bua nae thapelong, / utlwa 'Foko la 'gwe.","Simolola mo mosong / go mo obamela, / a nne yo o go thusang / tlalelong tse tsotlhe. / Bosigong, motshegareng, / fa o mo rapela, / o le mo dithaelong, / foo o tla go Iwela.","Fa Morena a le teng, / e le wa 'go gotlhe, / o tla go ntsha mo direng / le dipogong tsotlhe. / Mo ikanye tshwenyegong, / ka a Ie Morena; / o tlhomame tumelong, / go tla fenya ene.","'Tiro tsa 'go Modimong / di tla tshegofala; / mo direle bophelong, / mme o tla go naya / tse di batlegang 'phelong / le letlhogonolo, / mme kwa pele 'godimong / dilo tse dikgolo.","Tsotlhe tsa me bophelong, / Jesu, di laole / le go phela lefatsheng, / ee, le go swa ga me. / Nthusa jaanong ditirong / tsotlhe tsotlhe tsa me, / e nne tse ' tshegofetseng. / Go nne jalo, Amen!"]},{"n":397,"t":"'Tsatsi le dule","c":"Difela tsa Dipaka: Tsa mo Mosong","k":"K364","v":["'Tsatsi le dule, / 'sigo bo sele, / sedi le tsile, / mme re tsogile, / re sa itumela, re le lethabong. /Tlhogo le mmele / di lapologile / jaanong di tiile, / di kgona go dira, / re ikutlwa thata mmeleng le pelong.","Jaanong re bona / 'tiro tsa ona. / Di a o boka, / di re supetsa: / Mothatayotlhe o busa 'fatsheng. / Le legodimo / le tlotla Modimo. / Go tla ya gona / ba ba leng ba ona / go nna le ona ka bosakhutleng.","Rea itumela, / re opelela / Mmopi wa rona / sefela sena / go nna tshupelo ya gagwe mosong. / Go mo fa pelo / ke yona tshwanelo, / le go opela / ke gona go neela / Modimo tlotlo jaanong thapelong.","Go re robatsa / le go re tsosa, / go tshegofatsa / le go boloka / ke tsa Modimo o o mo pusong. / Fa re robala, / o tla nna le rona; / mme fa re tsoga, / re a o leboga; / gonne o thuso ya rona 'phelong.","Ke tsholeditse, / ke lebisitse / maikutlo otlhe / go wena gotlhe, / go kopa 'sego la gago tirong. / Mme matshwenyego / le yona tatlhego / o di fedise, / o be o mpoloke / le go mphemela mo dithaelong.","Jaanong ka ene / Jesu Morena / o intshwarele, / go tle go fele / melato yotlhe e e nkimelang. / Gape o nkgoge, / a ke se fapoge / mo tseleng ya 'go, / ka ke le wa gago, / a 'atla sa 'go se nntshe maketeng.","'Tlalelo tsotlhe / tsa 'fatshe leno, / tsone dia fela, / rona re leta / tsa legodimo tse di tlhomameng. / Boitumelo / bo tla bo bo tletse; / re tla nna gona / le Jesu Morena, / re iketlile ka bosakhutleng."]},{"n":398,"t":"Phumusetsa bana ba 'go","c":"Difela tsa Dipaka: Tsa Dijo","k":"K365","v":["Phumusetsa bana ba 'go, / Rara yo o 'godimong. / Tshegofatsa 'neo tsa 'go, / tse o di re fang jaanong. / Thusa gore di re tiise / bophelong mo lefatsheng. / Mme fa re swa, o re ise / kwa o teng, kwa legaeng. / Amen."]},{"n":399,"t":"Re go tsisetsa malebogo","c":"Difela tsa Dipaka: Tsa Dijo","k":"K367","v":["Re go tsisetsa malebogo, / Morena yo o re jesang; / jaanong re bonye tapologo / ka dijo tse re di filweng. / Ke wena yo ' re jesitseng / ka metlha yotlhe lefatsheng.","O re kgorise fela jalo / ka dijo tse di sa feleng, / o re phedise ka Lefoko, / re thatafale mo moweng, / go ya re fitlhe 'godimong / go aga nao, Jesu Mong. / Amen."]},{"n":400,"t":"Rara, 'tsatsi le tiketse","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K368","v":["Rara, 'tsatsi le tiketse, / mme re tsenye bosigong. / Jaanong ke go lebogela / thuso e ke e bonyeng. / Motshegare o ntisitse. / Dira jalo le bosigo. / Ke yo o go rapelang: / O mpoloke borokong.","Utlwa dithapelo tsa ka, / o se gane kopo e, / a ko ' intshwarele gape / tsotlhe tse ke di sentseng. / Ke a di ikwatlhaela, / ke tla leka go tsamaya / fela ka fa molaong, / nthuse moo ka Jesu Mong.","Mmele, mowa, ditsarona, / tsotlhe tse ke di tshotseng / le baetsho le ba botlhe, / ba ke ba itseng 'fatsheng, / borokong o ba femele, / mme o rome moengele, / a re dise bosigong, / a re tsose mo mosong.","A lesego la 'go le nne / le nna fa ke robetseng. / O mphemele ka diphuka, / ke se tsene tlalelong. / O thibose le molelo, / khutsafalo le selelo; / o re dise bosigong, / re se wele tshenyegong.","Disa maikutlo a me, / ke ntse ke le borokong, / gore fa ke tsoga gape / e nne a a siameng; / ke tle ke nne Tempel ya 'go, / e o tla nnang mo go yona, / ke se phele mo dibeng, / ke nne yo ' itshekileng.","Ditokollo tsa ka tsotlhe, / lo tseneng boikhutsong! / Lebogang Mothatayotlhe, / fa lo tsoga mo mosong; / gonne ene oa lo disa; / mme fa loso lo khutlisa / 'phelo jaana bosigong, / mowa o ye 'godimong."]},{"n":401,"t":"Letsatsi le fetile","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K369","v":["Letsatsi le fetile, / mme re bolokegile, / re sa le bophelong. / Rea go itumelela, / Mong, ka re sa nyelela, / mme o thusitse ditirong.","Jaanong rea go rapela, / Morena, re itshwarele, / ba re leofileng; / re leofetse wena; / re sentse jang, Morena! / A ko o re ntshe mo dibeng.","Ga re na thata epe, / e bile ga go sepe / se re ka se go fang, / fa e se pelo fela, / le fa e sa tshwanela, / o yo o tla e baakanyang.","Ka re ya go robala, / Morena Jesu, o nne / le rona bosigong; / fa Satan a raela, / wena o tla re Iwela, / re tla go baka mo mosong.","Fa loso lo ka ntlela, / bophelo bo ntlogela / kajeno bosigong, / foo ke tla leba wena; / o nthuse, ao Morena, / go gorogela 'godimong."]},{"n":402,"t":"Jesu, ntisa bosigong","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K370","v":["Jesu, ntisa bosigong, / ka ke rata go robala. / O mphemele borokong / le baetsho, re robetse. / Jesu yo ' ikanyegang, / disa ba ba go kopang.","Jesu yo ' sa otseleng, / o thibose ditlalelo, / tsone ' di ka re welang, / rona re ntse re robetse. / Jesu yo ' ikanyegang, / kganna tse di ka tshosang.","Re boloke tumelong, / thusa gore e se fele; / a e gole dipelong, / re tle re go kgomarele. / O re thuse mo metlheng / yotlhe mono lefatsheng.","Fa jaanong mo bofelong / rotlhe re tshwanetse go swa, / o re ise boikhutsong / le go re abela boswa. / Budulatsa mo losong / matlho, re nne kagisong.","Jesu, yo ' tla bonalang / go atlhola batho botlhe, / ka letsatsi le o tlang / o re tshole rona rotlhe, / o re ise 'godimong / kwa bontleng le kwa thabong."]},{"n":403,"t":"Jesu, tlaa o nne le rona","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K371","v":["Jesu, tlaa o nne le rona, / ka re tsena bosigong, / tshegofatsa batho ba 'go / ba robetse bosigong.","Mme re go ipobolela / dibe ' re di dirileng; / re golole, o re thuse, / rona ba re molatong.","A o ko o namolele / botlhe ba ba tlalelong. / Ba femelwe ke baengele, / ba ba tsenye thagamong.","Le fa jaanong go fifetse, / ga go se ' go subetsweng. / Tsotlhe o ntse o di bona, / le fa e le bosigong.","Ga a lape go re disa / motshegare, bosigong; / ga o gane go re tiisa, / fa re le mo bokoeng.","Loso fa lo re ratela / gompieno bosigong, / gona re a solofeIa / go isiwa 'godimong."]},{"n":404,"t":"Jaanong re tsena bosigong","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K372","v":["Jaanong re tsena bosigong, / Morena, re ya thobalong, / re bonesetse lefifing; / o 'sedi le le sa khutleng.","Re go leboga dipelong, / o re disitse mo tseleng, / wa re femela tlalelong, / wa re boloka bophelong.","Jaanong ka re ya thobalong, / re lebe boitshwarelong; / o se nne yo o galefang, / o itse tse di re pallang.","A re robale mo tisong / ya baengele bosigong. / Thibosa tsotlhe tse di tswang / go Satan yo o re tshwenyang."]},{"n":405,"t":"Pelo ya me, a ko ' thanye!","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K373","v":["Pelo ya me, a ko ' thanye! / Maikutlo, lo tsogeng, / lebogang Modimo Rara, / ene yo o nthusitseng. / O mphemetse mo metlheng / yotlhe e e fetileng; / le fa Satan a nthaetse, / ga a nkgona ka tsietso.","Rara, ke go lebogela / thuso ya 'go ditirong; / mme ka o ne o mphemela, / ga kea wela tatlhegong. / Ke ne ke le thagamong / 'tsatsi lotlhe le jaanong. / Baba o ba Ielekile, / ka ntlha ' moo ke sa phedile.","Mme molemo wa 'go otlhe, / 'tiro tse o di dirang / tsa lorato, tsa phemelo, / di lemogwa ke bomang? / Ke tse dintsi thata jang! / Ke tse di gakgamatsang! / Ee, Modimo, o nthusitse, / mme marumo a mphositse.","Motshegare o fetile, / mme re tsenye bosigong; / 'tsatsi lone le tiketse, / tsotlhe di ya thobalong. / Rara, nkeme tlhe nokeng, / o nne yo o ntshegetsang; / lefifing o nne lesedi, / ke ikanya wena wesi.","Ka boutlwelo-botlhoko / o nne yo ' intshwareIang; / dibe tsa ka gompieno / di ntshekisa mo pelong. / Satan yo o ntogelang / maano a a mpolayang, / o mo kobe, mo swabise, / a se kgone go ntshenyetsa.","A ko o mphe boikhutso, / ke robale bosigong. / Nkhurumetse ka lesego, / kgapha tse di ka ntshwenyang. / Ke go neela diatleng / ba ga etsho le baeng / le ditsala le dithoto, / tsotlhe o di tlhokomele.","Wena Rara, o utlwile / diphegelo dipelong. / Jesu Kriste, ka o phela, / se ntlogele bosigong! / Mowa o o gomotsang, / wena tsala e ' nthusang, / a ko o rapelesege! / Tsotlhe a di dirafale."]},{"n":406,"t":"Letsatsi le fetile","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K374","v":["Letsatsi le fetile, / ka moo ke go lebile, / ke le yo ' lebogang. / O ntebe ka lorato, / ke tle ke tshegofale, / gotetsa mollo mo pelong.","Ke itswalela gape / pelong ya gago, Rara, / yo o ikanyegang; / o kgaphe tsa lefifi / le tsone tsaboleo / ka go nna le nna bosigong.","Morena, o ntemose, / fa o ntikanyeditse / ka gale botshelong; / mme o ne o nkgopotsa, / fa e le wena wesi / yo o re itumedisang.","Malatsi a bophelo / a mpolelela gore / ke ya bosakhutleng. / Bosakhutleng jo bontle, / ke go tlhologeletswe, / legae ga le yo lefatsheng."]},{"n":407,"t":"Letsatsi le le phatsimang","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K375","v":["Letsatsi le le phatsimang / jaanong le phirimile. / Ditiro tse di lapisang / le tsona di fedile. / Fa o ya borokong, / lelala 'godimong, / o lebe Jesu thapelong. / O tla go tsenya kagisong.","Mme dinaledi 'godimong / di a re bonegela. / Di sedifatsa lefifing, / mme Jesu oa di phala: / ke yo o phatsimang / pelong e ' dumelang; / ke ene esi yo o ntshang / mo lefifing ba ' rapelang.","Diphologolo mo nageng / le batho baa otsela. / Go teng yo o sa robaleng, / o a re lebelela. / Ke Jesu yo ' nkitseng, / yo o sa otseleng, / o ntlhokomela bosigong, / gore ke se nne tlalelong.","Se nnyatse yo ke opelang / sefela sa tebogo. / Ga go kagiso mo pelong, / ke ise ke rapele. / Ke yo ' go tsisetsang / pako e ' tshwanetseng / ka pelo e e go ratang, / Morena yo o nthatileng.","Jaanong ka ke ya thobalong, / kea go ineela, Jesu; / ka wena ke mo thagamong, / ka o bile o mphemela. / Ga ke yo ' boifang, / yo o ka tlalelwang; / ka o na Ie nna thobalong, / ke tsoga boitumelong."]},{"n":408,"t":"Ke tlotla wena maitisong","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K377","v":["Ke tlotla wena maitisong, / Modimo Rara 'godimong, / ka ntlha ya 'neo tsa 'go. / O nkutlwe, Rra, / merapelong, / ka ke le ngwana wa 'go.","O tlhotse le nna mo tirong, / o mpolokile mo tseleng, / jaaka ke go kopile. / Mo legaeng / le kwa nageng / wa ntshegofatsa gotlhe.","Modimo, tse ke di tshotseng / ka fa mmeleng le mo moweng / di tswa go wena tsotlhe. / Ke wena ' o / di nneileng; / o mpolokile gotlhe.","Ke go ineela seatleng, / a ke robale kagisong, / o intshwarele dibe. / Ntsholele teng / legodimong, / fa ke tshwanetse go swa."]},{"n":409,"t":"Jesu, o Modisa","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K379","v":["Jesu, o Modisa / wa dinku tsa gago / yo ' sa robaleng. / O ne o mpoloka / gompieno gape / mo ditlalelong. / Dira jalo bosigong; / baya baengele ba 'go / tikologong ya me.","A ko o mphemele / gore ke se wele / mo ditlalelong. / Gape nthekegele / le go intshwarela, / ke nne kagisong; / gonne ke yo ' golotsweng / ka dipogo tsa 'go, Jesu, / ka o ne wa ntshwela.","O boloke tsotlhe / le baetsho botlhe / jaana bosigong. / Mme o re tsholele / mabogong a gago, / re nne thagamong. / O nne le nna bosigong, / re se ka ra kgaoganngwa, / ke robale jalo.","Tswala matlo gore / Satan a palelwe / ke go tsena teng. / Jesu, Mofemedi, / phutha dikokwana, / di nne diphukeng. / O nne yo ' khurumetsang / ka phemelo le boikhutso / bana ba Modimo.","Nthibosetse loso, / gore ka mmamoso / ke tswe thobalong. / Mme fa o atlhotse / gore jaanong ke swe / mo bosigong jo, / foo ga ke yo o ganang. / Jesu, ke ineetse wena, / ka o nkamogetse.","Mme molomo wa me, / lona matlho a me, / jaanong ikhutseng! / Mmele le bophelo, / Rra, ke di go neetse / tsotlhe diatleng. / Fa ke tsoga mo mosong, / fa ke sa ntse ke tla phela, / o mpaballe gape."]},{"n":410,"t":"Malatsi a fetile","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K380","v":["Malatsi a fetile / a tiro mo bekeng; / go tsena boikhutso / jwa Sontag lefatsheng. / Lesego la Modimo / ga se le le felang; / re boleletswe jalo / ke yo o re ratang.","Re bonye beke yotlhe / dineo tse di tswang / mo go Modimo Rara, / yo o re tlhodileng, / jaaka o ntlhokometse / ka tse di phedisang / dingwaga tsotlhe tsa ka, / tse ke di phedileng.","Fa ke akanya sentle / tse ke di diretsweng, / foo ke ikwatlhaela / tse ke di dirileng: / ke fapogile tsela / e ke e laetsweng. / Ke leofetse jalo / Morena yo ' nthatang.","Morena, o se mpetse / ka fa go ntshwanetseng, / ka wena o biditse / ba ba latlhegileng, / wa re: Tlaang kwano go nna, / tlaang ba lo lapileng. / Ke tla lo lapolosa, / ke lo ntsha mo dibeng.","Ee, Rara, ke dumela / ka ene Jesu Krist', / fa o tla intshwarela / maleo loratong. / Jaanong nna ke ikana / go phela melaong, / go tlhokomela tsotlhe / tse o di ntaetseng.","Ka ke le ngwana wa 'go, / mpoloke thobalong, / o rome baengele, / ba ntise bosigong. / Boroko ka bo tshwana / le go nna mo phupung, / Rraarona, a ko ' ntsose / ka moso thobalong.","Fa beke ya bofelo / e ka nna yona e, / fa ke tshwanetse go swa, / ke yo o ineelang. / Foo ke tla ya go bona / Sontaga 'godimong; / ke tla nna le Modimo / le ka bosakhutleng."]},{"n":411,"t":"Morena, se nkatoge bosigong","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"H184","v":["Morena, se nkatoge bosigong / 'fifing o ntise go ya mo mosong, / ga go bathusi, ba tlhaela jang. / Nna le nna, wena yo o re thusang.","Botshelo ke jo bokhutshwane jang. / Ga go tlhomamo mo tse di leng teng. / Nka solofela mang fa o se teng. / Nna le nna, wena yo ' sa fetogeng.","Ka nako tsotlhe ke go tlhoka jang, / Morena Jesu yo o rategang. / O botshabelo jwa me lefatsheng. / Nna le nna menateng le maketeng.","Mofenya-loso se nkatoge tlhe. / Fa o le ntlheng ya rona bophelong, / ga re boife tse di re tlelang. / Nna le nna, wena yo o nkemelang.","Le gona se tlogele tlalelong / fa motlha wa me o khutla 'fatsheng. / Le mo 'fifing le mo ke sa boneng, / o 'sedi la me le le sa khutleng."]},{"n":412,"t":"Ke lapile thata jang!","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"H185","v":["Ke lapile thata jang! / Jalo ke ya boikhutsong. / Rara yo ' legodimong / a ko ' ntise bosigong.","Mme tse ke di fositseng. / O phimole tsotlhe tse! / Ke tshabela kwa mading / a ga Jesu yo ' ntshwetseng.","Botlhe ba ke ba itseng, / ba tsholele seatleng, / batho botlhe lefatsheng, / ba femele lefifing.","Thusa le ba ba lwalang, / o gomotse yo ' lelang, / botlhe mo tikologong, / ba robale kagisong. Kereke"]},{"n":413,"t":"Re a go baka, Krisete","c":"Difela tsa Dipaka: Tsa Kgakolo ya Kereke","k":"K381","v":["Re a go baka, Krisete, / o re golotse timelong; / mme re go kopa, o nne teng / mo 'tlung e o e agetsweng.","A ko o nne yo o disang / Kereke ' o e agetsweng; / o e femele basenying, / e tle e thuse phuthegong.","Leina le ' itshepileng / la gago a le tlotlwe teng. / Lefoko la 'go fano 'tlung / le rutwe ka fa tshwanelong.","Ba ba tsholwang kolobetsong / le ba ba tlang Selalelong, / a e nne ba ba dumelang, / ba itshupe jalo ditirong.","O thuse botlhe ba ba swang / gore ba swele tumelong, / mme a ba tsene maagong / a gago kwa legodimong."]},{"n":414,"t":"Modimo o o rategang","c":"Difela tsa Dipaka: Tsa Kgakolo ya Kereke","k":"K382","v":["Modimo o o rategang, / re rata kago ya 'go jang! / Ke e re e go agetseng / go utlwa 'Foko la 'go teng.","Re itumela mo pelong / go phuthegela mono 'tlung, / kwa 'neo tsa 'go di bonwang, / fa re kopana thapelong.","Re rata thata go nna teng / le badumedi mo kerkeng; / o re direle phuthegong, / re go arabe thapelong.","Re batla jalo 'tsatsi le / altare ya 'go fano 'tlung / go tshola tse o di re fang / 'Fokong le Disakramenteng.","Ke jaaka thaga setlhareng / le peolwane loboteng / di batla kwa di ka agang / le kwa di ka tsalelang teng.","Ee, botlhe ba ba phuthegang / mo 'tlung e o e agetsweng, / ke bone ba ba go bakang; / ba sego thata thata jang!"]},{"n":415,"t":"Morena, re ntse mmogo fa","c":"Difela tsa Dipaka: Tsa Nyadiso","k":"K383","v":["Morena, re ntse mmogo fa / kajeno phuthegong, / go rapelela bona ba / ba ' nyalanang jaanong.","Ka e le ba ba ikanang / go phela nyalanong / ka boikanyego mo lapeng, / ba nee lesego teng.","A ba se phele thulanong / e e ka nyatsegang; / ba agisanye botshelong, / baitshupe loratong.","A ba thusanye bolwetseng / jo bo ka ba tshwarang; / o ba ntshe mo ditlalelong / tse di ka bawelang.","A ba tlamelwe lehumeng / ke yo o fetotseng / metsi, a ' dira weine teng / kwa Kana lenyalong.","Rara, ba tiise tumelong, / fa ba le bokoeng; / ba gogelane kwa Jesung / le kwa legodimong.","O ba abele loratong / masego lefatsheng; / mo bophelong le mo losong / se ba tlogele teng.","Fa ba kgaoganngwa bofelong / ka loso lefatsheng, / a ba bonane kwa bonnong / jwa gago kwa bontleng."]},{"n":416,"t":"Go pila thata nyalanong","c":"Difela tsa Dipaka: Tsa Nyadiso","k":"K384","v":["Go pila thata nyalanong, / fa Jesu yo o rategang / a tshegofatsa yona. / Dineo tsotlhe tse di tswang / go ene yo ' re phedisang / di fologela gona / mo 'tlung, tirong, / mo monneng le / mosading, fa / ba nyalana / ka tumelo, ba ratana.","Fa ba ntse ba le kutlwanong / ka boikanyo nyalanong, / foo ba tla amogela / letlhogonolo lefatsheng, / mo baengele 'godimong / ba bileng ba itumela. / Nyalo eo / e tlhomame, / ba e filwe / ke Modimo, / o ba ratanang ka ona.","Foo monna ke yo o tshwanang / le sona 'tlhare se se nang / le 'kala tse dinana. / Mosadi ke yo o tla nnang / moweine ruri o ' ungwang, / ka a tla tshola bana. / Ruri, ruri, / o lesego, / o mma-bana, / mong wa lapa, / o gopolwa ke Modimo.","Ke lona ba lo tlhaotsweng, / gore go ate lefatsheng / morafe wa Modimo. / Modimo o ' tshegofatsang / o dira se ' gakgamatsang, / gore lo tle lo bone / bana bantle, / tshimanyana, / tshetsanyana / go thabisa / pelo le go ba godisa.","Nametsegang! Itumeleng, / Modimo o ' lo la Moletseng / go nyala le go nyalwa, / ke ona o o lo ratang, / ke ona o o lo thusang / ditlalelong tsa lona. / O tla itse / go lo thusa, / go lo busa / dilong tsotlhe / tsa botshelo jono jotlhe.","Le fa lo tsena dipakeng / tse di bokete bophelong, / lo tsholla dikeledi, / lebellang fela Modimong; / ke ona o ' di phimolang, / o tla Io itumedisa. / Ee, Modimo / ona osi, / o ' leng Kgosi, / o tla thusa; / gonne ona oa di busa.","Tlaa, Mong wa rona, tlaa jaanong, / re gakolole tlalelong, / re nee boitumelo. / Ka moo re ba ba go bakang / ka 'fela tse di go tlotlang / ka poko le kopelo. / Re be re tle / kwa go wena / le go tsena / legodimo / go go baka, ao Modimo."]},{"n":417,"t":"Yo e leng monna wa tumelo","c":"Difela tsa Dipaka: Tsa Nyadiso","k":"K385","v":["Yo e leng monna wa tumelo, / yo o boifang Modimo mo pelong, / ke ene yo ' bonang phemelo / mo ditseleng tsa mono bophelong. / Ee, o tla tlhogonolofala teng / mo ditirong tsa gagwe lefatsheng.","Mosadi wa 'gwe o tla tshwana / le 'tlhare sa moweine lelapeng; / ka gonne o tla tshola bana, / ba tshwana le maungo dikaleng; / e bile ba tla dula fadijong, / ba etsa matlhogela selemong.","Ee, yo o boifang Modimo, / o newa tse di tswang mo Moreneng; / o phela ka tsa legodimo, / o tla di bona ruri lefatsheng / ka metlha yotlhe mono bophelong / go ya go fitlha gona mo losong.","Le gona go tla leelefala / bophelo jwa 'gwe mono lefatsheng; / e bile o tla tshegofala, / a bona ditlogolo botsofeng. / Kagiso e nne teng mo phuthegong, / letlhogonolo le nne teng matlong! TSHEGOFATSO"]},{"n":418,"t":"Bopelotlhomogi jwa Morena Jesu Kriste","c":"Sefela sa Tshegofatso","k":"K386","v":["Bopelotlhomogi jwa Morena Jesu Kriste / le lorato Iwa Modimo Rara / le kabelanyo ya Mowa o ' Boitshepo / di nne le rona, rona rotlhe. Amen."]}];
H=H.concat(NEWH);
var MISS=[{"n":1047,"d":"K47","o":48.5,"t":"Hosiana 'godimong","c":"Difela tsa Meletlo: Atfente","k":"K47","v":["Hosiana 'godimong / go Morena, morwa Dafit, / a tla go nna yo 'busang / ba losika lwa Jakobe; / ene ke yo o tlhongwang / go nna Kgosi ya dikgosi / ka taelo ya ga Rraagwe, / mo pusong e 'sa feleng.","Puso re e boka jang / ya Morena yo 'ntseng jalo! / Ga go ope yo 'tshwanang / nae mo lefatsheng lotlhe. / Ke yo o tlhokomelang / dintlha tsotlhe tsa molao; / batho a ba nee kagiso, / e le yo 'ba thabisang.","Kgosi e, e boreneng, / a ditšhaba di e tlotle; / kwa letsatsi le tlhabang, / e nne e tumele pele. / A le ba ba bongwaneng / ba e boke ba thabile, / go thabisa badumedi; / baba ba nne ka ditlhong.","A ko 'nkwale mo bukeng / ya ba gago ba bogosi; / ke go naya mo pelong / bonno jwa 'go, Kgosikgolo! / Ke ikopanya mo moeng / le masomo a magolo, / a a tlhatlosang Hosiana, / a go tshola lethabong.","Batho ba 'gwe, ipeleng, / Dudueletsang Morena! / Jesu yo o lo ratang / o goroga mo go lona. / Tlaang jaanong, mo ineeleng, / ene Morwa wa Modimo. / A go se diege ope / go y'o tsena pholosong."]},{"n":1049,"d":"K49","o":49.5,"t":"Go tsetswe Betlehem motseng","c":"Difela tsa Moletlo wa Botsalo jwa Morena","k":"K49","v":["Go tsetswe Betlehem motseng / Morepholosi Jesu Krist': / Haleluya, Haleluya!","Le fa a letse bojelong, / o Kgosi mo legodimong. / Haleluya, Haleluya!","Re itumela thata jang, / ka re le ba ba pholoswang! / Haleluya, Haleluya!","Re galaletsa difeleng / Modimo ka bosakhutleng. / Haleluya, Haleluya!"]},{"n":1060,"d":"K60","o":59.5,"t":"Lorato lwa Modimo lo lotona","c":"Difela tsa Moletlo wa Botsalo jwa Morena","k":"K60","v":["Lorato lwa Modimo lo lotona, / o ntshitswe k'eng ne mo legodimong? / Mme o gogetswe k'eng teng kwa go rona, / go balatlhegi mono tshenyegong? / Ke ka lorato lo lo leng / pelong ya gago, Jesu, lo lo sa khutleng.","Lorato lo logolo mo go wena, / ka o tlogetse Rara bogosing; / o itshenketse tiro e, Morena, / go thusa batho ba ba lefifing. / Lorato lo logolo jang! / Ke mang 'fatsheng yo o ka lo tlhaloganyang?","Lorato lo tsalanye le nna jaana: / Lo fologetse gone mo nameng. / Morwa Modimo le nna rea ratana, / ka a mpatlile ke le mo dibeng. / Go tsetswe ene lefatsheng, / yo 'phedisang ba ba suleng kafa moeng.","Lorato lo, lo tlhogonolofatsa / merafe yotlhe e e timetseng. / Lone lorato lo, lo tshegofatsa / ba botlhe ba ba tlang, ba sa ganeng. / Ke gona a re dumeleng / go Jesu yo e leng lorato lo 'tsileng.","Ga go na sepe se se nang le thata / go tshosa batho ba ba dumelang. / Jaanong re ka gololwa, fa re rata / Imanuele yo o re thusang. / Ke gona tlaang, kgomarelang / Lorato lwa Modimo lo lo re batlang."]},{"n":1103,"d":"K103","o":110.5,"t":"Fa dibe di nkimela","c":"Difela tsa Dipogiso tsa Morena","k":"K103","v":["Fa dibe di nkimela, / Morena, mo pelong, / o nthuse go gopola / wena yo o ntshwetseng, / kafa o sikereng ka teng / merwalo ya melato, / o le sefapaanong.","Ke kgakgamatso 'kgolo / e re e lebileng: / Morena o n'a swela / ba ba mo botlhankeng. / Ba ba latlhegileng dibeng, / Mesia a ba swela, / a tsena mo losong.","Ga go maleo ape / a a ka ntshenyetsang. / Ke tlhomogetswe pelo, / ka ntshiwa molatong / ka madi a 'ntshololetsweng; / ke se ka ka boifa / tatlhego moleteng.","Ka moo ke go leboga / jaanong mo botshelong, / ka ntlha ya pogisego / ya gago botlhokong; / ke yona e e mpontshitseng / lorato lo logolo, / o le yo 'ikanngwang.","Morena, a dipogo / tse di galakileng / di ntlogedise dibe, / ke nne yo 'di tlhoang; / ke se lebale mo pelong, / fa wena o nkgolotse / ka loso mo dibeng.","Fa e le sefapaano / se ke se sikarang, / fa e le dipogiso / tse di ntlhokofatsang, / a ke nne yo 'go latelang, / ke itshokele tsona, / ke le mo tumelong.","A ke direle batho / se o se ntiretseng; / ke rate mongwe ka nna, / le fa e ka nna mang. / Ke se nne yo 'ipatlelang, / ke se itimokanye; / tsalano e nne teng.","Kgomotso ya bofelo, / fa ke ya mo losong, / ke dintho le tlalelo / tsa gago dipogong. / Ka tsona ke boitumelong. / O tlaa ntsholela ruri / teng kwa legodimong."]},{"n":1107,"d":"K107","o":113.5,"t":"Hutsafalang mo dipelong","c":"Difela tsa Dipogiso tsa Morena","k":"K107","v":["Hutsafalang mo dipelong! / A ga re kake ra lla? / Go isiwa kwa phupung / Krist', Morwa Modimo.","Tlalelo wee! Yo 'phedisang / ke yo 'suleng ka nosi; / ke yo o re batletseng / puso ya Modimo.","A motho wee, yo 'boleong, / ao, o dirile jalo, / wena yo 'senyegetseng / ruri ka boleo!","Mme tlaa jaanong, tlaa fa losong / lwa Kwana ya Modimo; / madi a 'tshologileng / a go tshologetse.","Yo 'rategang, o pila jang, / o morwa lekgarebe! / Ga go yo 'ka go lebang, / a sa ikwatlhae.","Yo 'akanyang, yo 'gopolang / loso le phitlho ya 'go, / o tlaa tshegofala jang / mo pelong ya gagwe!","Yo o ntshwetseng, yo 'mphitlhetsweng, / ke a go obamela! / Jesu yo o nkgolotseng, / ke tlaa go phelela."]},{"n":1153,"d":"K153","o":170.5,"t":"Ke eme fano tshekisong","c":"Difela tsa Boikwatlhao","k":"K153","v":["Ke eme fano tshekisong, / Morena, ke mo melatong, / go ithusa go a mpalla. / Maleo a me 'mantsi jang! / Ke ona a a ntshekisang, / a ntsisa fa go wena. / Ka ke le boikwatlhaong, / ebile ke le tumelong, / ke madi a 'go a 'tlosang / melato e e nkimelang. / Ao Jesu, Mong, / ke go leboga thata jang! / O nthusa go nna tshiamong."]},{"n":1163,"d":"K163","o":179.5,"t":"Rona balatlhegi ba re boleong","c":"Difela tsa Boikwatlhao","k":"K163","v":["Rona balatlhegi ba re boleong, / Ee, re mo go jona go tswa botsalong. / Jona bo re tsentse mo ditlalelong / tsa go ya go wela ruri mo mollong. / Wena Jesu Kriste, re a go rapela / go re itshwarela.","Ke pelotlhomogi e e kana kang! / Rara o thusitse rotlhe loratong / mo go Morwaa-ona yo o ineetseng / go re swela rotlhe, re ye phologong. / Wena Jesu Kriste, re go boka thata, / ka o re pholosa.","Rara oa re rata, a re lebogeng! / Jesu oa re thusa, a re dumeleng! / Moya oa re goga, a re ineeleng! / Re tle re tlhomame tota Lefokong. / Wena Jesu Kriste, re a go rapela, / o re tlhomamise."]},{"n":1164,"d":"K164","o":179.51,"t":"Jerusalem yo 'boikepong","c":"Difela tsa Boikwatlhao","k":"K164","v":["Jerusalem yo 'boikepong, / Jesu, o mo leletse, / ka o le yo 'itumellang / phetogo ya dipelo. / Fa ke le boikwatlhaong / ka ntlha ya dibe mo pelong, / foo o nne yo o ntlhapisang, / yo o tlosang / maleo a a nkimelang.","Fa Rara a le bogaleng / ka ntlha ya dibe tsa me, / ke leba kwa dikeleding / tsa gago, dia nkgomotsa. / Ke tsa botlhokwa Modimong. / Yo di mo ikwatlhaisang, / o mo lebile loratong, / boitshwarelong, / o mo thabisa mo pelong.","Tse di tshosang mo lefatsheng, / ka gantsi dia re llisa; / mme batho ba ba go ganneng / ba tshwenya batho ba 'go. / Ke bone ba ba re lwantshang, / le fa re phela kagisong. / Ka gale se se nkgomotsang, / Morena Krist', / ke kafa o bogisitsweng.","Ke wena yo o badileng / 'keledi tsotlhe tsa me; / le tsona tse di sa balweng / ke rona, oa di itse. / Ka gonne tse di re tshwenyang / ke tsona tse di go amang; / o nne yo o nthekegelang, / yo o nthusang; / o itse tse di nkimelang.","Morena, ke leboga jang, / fa le nna o nteletse! / Ke wena yo o mpatletseng / serwalo sa botshelo. / Ke tlaa se rwala 'godimong, / fa wena o ntsholetse teng, / ke na le ba ba tlhaotsweng, / re le 'thabong, / re boka yo o re lletseng.","Ga go se se tlaa kgonang / go mphamola mo go Kriste. / Ga ke yo 'belaelang / se se boletsweng ke ene! / Jesu ga se yo 'ntesang, / nna yo ke mo ikanyang."]},{"n":1195,"d":"K195","o":210.5,"t":"Motswedi o o phedisang","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K195","v":["Motswedi o o phedisang / wa metsi a 'lapolosang / ke ene Jesu Kriste. / O bitsa yo o nyorilweng, / yo o tlhokang mo lefatsheng / kagiso ya Modimo; / o bitsa yo o imelwang, / yo o wetseng mo molatong, / go se na ope yo 'thusang.","Mme Jesu a tla lefatsheng / go batla ba ba timetseng / le go ba rekolola. / A dira jalo loratong, / a swela rona s'fapaanong, / a ba a re tsogela. / Jaanong re ba ba golotsweng, / re ka boela botshelong / ka tsela e 'bulegileng.","Mme noka e e fitlhisang / dithuso tse di batlegang / ke ona Moya wa 'gwe; / ke pula e 'tswang Modimong, / ke monyo ka mo dipelong, / o re phedisa seša; / ke ona o 'galaletsang / Moregolodi yo 'fentseng, / ke Jesu yo o re swetseng.","Fa re ya teng kwa motsweding, / fa re rapela tumelong, / ruri re tlaa nosiwa. / Ke Jesu yo o re nosang / ka go re golla mo dibeng / le go re fa kagiso. / O tlosa poifo dipelong, / re tle re nne mo kgomotsong / ka Moya o 'itshepileng.","Morena o dirisa eng / go nosa ba ba dumelang? / O nosa ka Lefoko! / O bua le nna, ke yo 'reng: / Ke go lebile loratong; / a ko o nkitse jalo. / Ebile ke yo 're nosang / Kolobetsong le Selallong / ka 'rato lo lo sa feleng.","Mme rona ba re nosiwang, / a re nneng ba ba dumelang; / a re se latlhegelwe. / Mme fa re nole motsweding, / re fetogile dipelong, / re tlholegile seša; / re tlaa nna ba 'nonofileng / go nosa ba ba nyorilweng / metsi a a tswang mo Jesung."]},{"n":1207,"d":"K207","o":221.5,"t":"Ao, Jesu Kriste 'godimong","c":"Difela tsa Tumelo: Ka ga Modimo Morwa","k":"K207","v":["Ao, Jesu Kriste 'godimong, / yo o leng mo kgalalelong: / Tshola pako mo go rona, / Kgosi-kgolo!","Re ne re swetse maleong, / mme wa re leba loratong, / wa ba wa tla mo go rona, / Mopholosi!","Wa itseela mo go Maria / botho jwa rona ka Moya / le ka thata ya Modimo, / Morwa-Motho!","Mme wa re ruta lefatsheng / kgoro e e pitlaganyeng / le go tsalwa ke Modimo; / o Moruti!","Wa ba wa supa mo therong, / fa o tlaa boa bofelong / gore o re itsholele, / Moprofeti!","Wa ba wa tsena mo losong / o le pogong le tshotlegong, / e le ka ntlha ya maleo, / Moreswedi!","Wa fologela bobipong, / wa ba wa tsoga mo losong, / wa swabisa ene Satan, / o Bophelo.","Wa tlhatlogela kwa Rareng, / mme o ntse teng mo Tempeleng, / e le go re buelela, / Mopresiti.","Ao Jesu, thusa ba e leng / ba gago ba o ba swetseng, / ba bonise ka Lefoko, / o Lesedi.","Ba thuse, Jesu, bofelong, / ba tle ba tsene bophelong, / gore ba go obamele, / o Morena.","A re bakeng yo
