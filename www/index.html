<html lang="tn"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e5a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopelo ya Luthere</title>
<style>
:root{--bg:#f2f5f3;--ink:#1a2624;--mute:#5c6b68;--acc:#1e5a4c;--line:#cfd9d5;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a19;--ink:#e6efec;--mute:#96a8a3;--acc:#7fcbb6;--line:#2a3937;--card:#1a2523}}
:root[data-theme="dark"]{--bg:#121a19;--ink:#e6efec;--mute:#96a8a3;--acc:#7fcbb6;--line:#2a3937;--card:#1a2523}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Iowan Old Style",Palatino,Georgia,serif}
header{padding:20px 16px 12px;max-width:680px;margin:auto}
h1{font-size:1.5rem;margin:0;color:var(--acc);line-height:1.2;display:flex;align-items:center;gap:10px}h1 img{width:40px;height:40px;flex:none}
.sub{color:var(--mute);font-size:.85rem;margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 16px;max-width:680px;margin:auto;z-index:2;border-bottom:1px solid var(--line)}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
button{font:inherit;font-size:.9rem;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}
main{max-width:680px;margin:auto;padding:8px 16px 48px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.n{min-width:2.9rem;color:var(--acc);font-weight:700;text-align:right}
.t small{display:block;color:var(--mute);font-size:.8rem}
.back{margin:12px 0}
h2{font-size:1.3rem;margin:.4rem 0;color:var(--acc)}
.meta{color:var(--mute);font-size:.85rem;margin-bottom:16px}
.v{margin:0 0 1.2em;display:flex;gap:12px}
.v b{color:var(--acc);min-width:2.2rem;text-align:right}
.v span{display:block}
.part{border-top:2px solid var(--acc);padding-top:.7rem;margin-top:1.6rem;font-size:1.45rem}.tx{margin:.4em 0 1em 3rem}.chb{text-decoration:underline;min-width:4.2rem!important;text-align:left!important}.nn{margin:1.2em 0 .6em}.rub{color:var(--mute);font-style:italic;font-size:.9em;margin:1.2em 0 .3em}
.emp{color:var(--mute);padding:24px 0}
.pu{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}.an{display:flex;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}.an p{margin:.15em 0}.an i{color:var(--mu)}.pu p{margin:.2em 0}.pu .n{min-width:2rem;text-align:left}
footer{max-width:680px;margin:auto;padding:0 16px 32px;color:var(--mute);font-size:.8rem}
.dh{margin:1.6em 0 .2em;font-size:1.15rem;color:var(--acc)}.dh2{margin:.8em 0 .3em;font-size:1.05rem}.dl{margin:1.2em 0 .3em;font-weight:700;letter-spacing:.03em;font-size:.9em}.dq{margin:.8em 0 .15em;font-weight:700;font-size:.92em;color:var(--mu)}.di{margin:.3em 0;font-style:italic}.dp{margin:.3em 0 .9em}.dr{margin:.1em 0 .9em}</style></head><body>

{n:1,t:"A go tlotliwe o e leng Modimo o le nosi",c:"Difela tsa Pako",v:["A go tlotliwe o e leng / Modimo o le nosi! / O re lebile tsalanong, / o a re itshwarela. / Modimo ke o re ratang. / Kagiso e re e bonang / e tlosa ditlhabano.","Re go leboga phuthegong, / Morena wa tshiamo! / Modimo Rara 'godimong; / o busa ka tlhomamo. / O na le thata e fetang; / o dira ka fa o ratang; / ka moo rea itumela.","Modimo Morwa, yo o ntseng / le Rraago kwa godimo; / ke wena yo re ruantseng / ka loso le Modimo. / Ao, Kwana e re tlhabetsweng, / re utlwe ba re tlaletsweng, / re tlhomogele pelo.","Modimo Mowa boitshepong, / ke wena Mogomotsi; / o re boloke tumelong / dithaelong tse dintsi. / Mogang re tsenang mo losong, / a ko o re ntshe botlhokong! / Re go ikanya jalo."]},
{n:2,t:"A re tsogeng, re opeleng ga Jesu",c:"Difela tsa Pako",v:["A re tsogeng, re opeleng / ga Jesu yo o re swetseng! / A batho botlhe phuthegong / ba mmake thata bophelong.","Le gona a re opeleng / ga 'rato lo mo tsisitseng / go swela batho s'fapaanong, / go ba golola mo petsong.","Le gona a re opeleng / ga tsogo ya 'gwe mo phupung, / Morapeledi 'godimong / wa ba ba golotsweng losong.","Le gona a re opeleng, / re itumele mo tseleng, / ka re tla fitlha 'godimong, / re sena go tswa tatlhegong.","Re tla opela 'godimong / le bontsi jo bo leseding, / ka tuduetso phuthegong / ga Kwana e r' e tlhabetsweng."]},
{n:3,t:"Fa nkabo ke na le melomo",c:"Difela tsa Pako",v:["Fa nkabo ke na le melomo / e mentsi e e sa balweng, / foo nkabo ke opella ruri / difela tse di obakang, / Modimo o o nthatileng / ka ntlha ya tse o di ntiretseng.","Lona ditlhare ka dikala, / opang diatla, opelang! / Majang a naga a matala, / dišeše tse di mo nageng, / tsogang lo nthuse mo pakong, / re tlotle Rara 'godimong!","Modimo Rara, kea go baka, / ka o ntse o le yo o nthatang, / ka o nthusitse ka dipaka / tse tsotlhe mo dipogisong; / o intshwaretse mo pelong, / ka ke ne ke le molatong.","Le wena ke a go leboga, / Modimo Morwa yo o ntshwetseng. / Ka madi a 'go go phimoga / melato ya ka e o ntshentseng. / Ke gone Satan a tlhokang, / ka fa a ka ntatofatsang.","Le wena Mowa wa pholoso, / re go leboga mo kerekeng; / o re gomotsa ka mafoko / a Beibele a a tshedisang. / Re bileditswe tumelong, / re tle re fitlhe botshelong.","Ke bonye thuso mo go wena / ka metlha yotlhe bophelong. / Ka nnete, Kgosi, o mphemela / ka thata yotlhe botlhokong; / o ntisa le mo dipakeng, / mogang ke leng pharagobeng.","Ke tla tswelela go itumela, / le fa ke boga botlhokong. / E bile ke go opelela / difela ke le tlalelong; / ka gonne mo matshwenyegong / ke itshwarella Modimong.","Ka pelo ke tla go leboga / tlamelo ya 'go lefatsheng. / E bile ke go opelela / ka ntlha ya tse o di mphileng. / Mme fa ke pallwa mo losong, / ke tla go baka phegelong.","A ko o se nnyatse, Kgosi ya me, / fa ke go baka bokoeng. / Ke tla go baka ka botlalo, / fa ke le kwa baengeleng. / Ke tla nna yo o opelang / dipako tse di go kgatlhang."]},
{n:4,t:"Ke fitlhisitswe nakong e",c:"Difela tsa Pako",v:["Ke fitlhisitswe nakong e / ke Rara wa lorato; / mme o kganetse tsotlhe tse, / tse di ka nnang molato. / Lesego lotlhe mo moweng, / boitekanelo mo mmeleng, / o di nkabetse tsotlhe.","Ke go tumisa mo bathong, / ke go leboga thata, / Mothusi wa me bophelong, / ka o ntse o re rata. / Ke lebogela 'rato loo / le boikanyo jotlhe joo. / Ka nnete o nthusitse.","Kea go rapela, Jesu Mong, / a o ko o tswelele / go ntshegofatsa botshelong, / ke tle ke go tshelele. / Mme fa ke tsena botlhokong, / ditlalelong le mo losong, / le gona moo o nthuse."]},
{n:5,t:"A go bakiwe phuthegong",c:"Difela tsa Pako",v:["A go bakiwe phuthegong / Rara wa boitshwarelo, / Modimo o legodimong, / o re fileng bophelo! / Ke ona o re nametsang, / ke ona o re fenyisang. / Nayang Modimo tlotlo!","O bakwa mo baengeleng, / ke Kgosi ya dikgosi. / Le botlhe ba ba lefatsheng / a ba o bake osi, / Modimo o o re fileng / masego otlhe a a teng. / Nayang Modimo tlotlo!","Tse Rara o di tlhodileng / o tla di tlhokomela, / o di femela mo direng, / o be o di tlamela. / Pusong ya gagwe lefatsheng / re bona tshiamiso teng. / Nayang Modimo tlotlo!","Ke o biditse tatlhegong: / \"Morena, se ntlogele!\" / Ke bonye thuso tlalelong, / kgomotso ga e fele. / Ke ka ntlha ya moo ke lebogang / Modimo o o re ratang. / Nayang Modimo tlotlo!","Modimo o o sa khutleng / ga o re hularele; / ke botshabelo mo direng, / poloko rea e newa. / Fa re tshwenyega botshelong, / o re gogela kagisong. / Nayang Modimo tlotlo!","Jaanong le ka bosakhutleng / ke tla o baka thata. / Ke tla o tlotla difeleng / metlheng e ya go phela. / Le wena o nne tumelong, / o duduetse phuthegong! / Nayang Modimo tlotlo!","Mme ba lo itseng Jesu Mong, / nayang Modimo tlotlo! / Ka lo dumela Modimong, / nayang Modimo tlotlo! / Medimo yotlhe e latlheng, / lo e fapoge lonyatsong. / Nayang Modimo tlotlo!"]},
{n:7,t:"Kgosi ya mannete",c:"Difela tsa Pako",v:["Kgosi ya mannete, / Mmusi wa ba botlhe, / tshola pako mo go rotlhe. / O bopelotelele, / ga oa re tlogela, / le fa re ne ra timela. / Utlwa tlhe, / se re nnyaa, / fa re obamela, / fa re go rapela.","Wena legodimo, / baka o mo tlotle / le ditiro tsa 'gwe tsotlhe! / Baka, wena 'tsatsi, / baka, wena ngwedi! / Bakang, lona dinaledi! / Godisang, / tumisang / Mmusi yo mogolo, / Kgosi e bonolo!","Wena pelo ya me, / baka o opele / ka dipesalome le difela. / Ba lo nang le mowa / lo tumise mmogo, / mo lebeng ka nametsego! / Ga go teng, / yo e leng / Kgosi jaaka ene, / Mmusi le Morena.","Tlaang ka Haleluya, / lona ba Morena, / ka lo solofela ena. / Tlaang ka Haleluya, / lona ba ga Kriste, / lo itshupe ka bonnete! / Opelang, / lebogang / jaanong le ka gale / ka bopelokgale!"]},
{n:8,t:"Godisang Morena, lona baditšhaba",c:"Difela tsa Pako",v:["Godisang Morena, / lona baditšhaba, / mo itumelleng gagolo! / Ineeleng Morena / ka go mo dumela; / lo tle, lo ntse lo opela. / Mo lebeng, / mo itseng, / Mong wa batho botlhe, / yo o busang tsotlhe.","Direlang Morena / ka boitumelo, / lo mo tlotle ka tshwanelo. / Tlaang fa go Morena, / lo mo obamele, / lo rapele ka dipelo. / Khubamang, / lebisang / pelo kwa go ena; / gonne ke Morena.","Dumelang Morena, / ke Modimo Rara, / yo o re dirileng bana. / Ga re ba yo mongwe, / re ba gagwe fela, / yo o re fileng go tshela. / Tumelong, / Lefokong / re nna dinku tsa 'gwe / bofulong jwa gagwe.","Tsenang ka tebogo / ka dikgoro tsa 'gwe, / lo bonale fa go ene. / Tsenang ka bonako / Tempeleng ya gagwe / ka tumelo le ka pako. / Lebogang, / tumisang / leina la 'gwe thata; / gonne oa lo rata."]},
{n:9,t:"Tlaa, Motswedi wa masego",c:"Difela tsa Pako",v:["Tlaa, Motswedi wa masego; / gonne nna ke latlhegile. / O nkutlwise nametsego / ka Lefoko mo pelong.","Jesu, ke a go rapela, / a ko o nthuse go opela / ka dipesalome le difela / tsa baagi leseding.","O nne le nna mo ntlheng tsotlhe / le kwa ke yang teng ka gale; / ke tla go ikanya gotlhe, / ke tla fitlha kwa o teng.","Timelong a ko o mpatle, / Jesu, o se ka wa ntatlha. / Ntsamaise, ke sepele / mo tseleng e e siameng.","A ke se go leofele, / wena Jesu yo lorato, / yo o nthatileng le batho / botlhe mono lefatsheng.","Jesu yo o swetseng lefatshe, / o re tlhogonolofatse, / o be o re tshegofatse, / o re ise botshelong."]},
{n:10,t:"Ipeleng, ka lo lekotswe",c:"Difela tsa Pako",v:["Ipeleng, ka lo lekotswe / lotlhe ba lo Modimong! / Jesu Kriste o re golotse / ka lorato tshenyegong. / Bakang Jesu, bakang Jesu, / ka re dule kgolegong!","Thekololo eo e tletse / batho ba ba lefifing; / e ne ya ba dirafalela, / ba nne kgololesegong. / Bakang Jesu, bakang Jesu / yo re ntshang mo timelong!","Rotlhe re gakgamaditswe / ke se a se dirileng. / Ene yoo o humisitse / ba re humanegileng. / Bakang Jesu, bakang Jesu, / Moreswedi Golgoteng!","Ene Jesu ke mowetsi / wa phologo ditšhabeng. / Rona re baamogedi / ba ba e lebogelang. / Bakang Jesu, bakang Jesu, / lotlhe ba lo mo itseng!"]},
{n:11,t:"Bakang Morena mo moweng",c:"Difela tsa Pako",v:["Bakang Morena mo moweng, / mmakeng ka dikopelo! / Ka Haleluya mo tlotleng, / lo bake ka tshwanelo. / Bakriste, lo tsogeng, / lo mo opeleleng! / A 'pako tse di mo kgatlhang / di tlhatlogele kwa o teng!","Ke yo o re itshwarelang / ditshiamololo tsotlhe. / Ke ene yo re fodisang / mo matlhokong a otlhe. / A re galaletseng / yo o re thusitseng. / O pelonolo mo moweng / go ba ba mo bohutsaneng.","Bakang yo re tsiseditseng / botshelo le phologo! / O phutha ba ba timetseng / ka thero ya Lefoko. / Ke ene yo utlwang / ba ba mo rapelang; / mme ba ba ikokobetsang / ke ba ba mo galaletsang.","Mme rotlhe a re lebogeng / Modimo o wa rona. / Legodimong le lefatsheng / ke fa o busang gona. / Letsang diletso fa, / opang Haleluya! / Ke one o re nonotshang / ka 'Foko le le pholosang."]},
{n:6,t:"Jaanong ke thanya borokong",c:"Difela tsa Pako",v:["Jaanong ke thanya borokong / go baka Jesu Kriste Mong. / Lorato lwa 'gwe lo ntse jang! / Ke lo lo re gakgamatsang.","O ne a mpona botlhokong, / a nthusa ke le tlalelong. / Tsalano ya 'gwe e ntse jang! / Ke e e re gakgamatsang.","Ka ke agile mo direng / tse di nkgogelang mo dibeng, / ke ene yo di mphenyetsang / ka thata e gakgamatsang."]},
{n:13,t:"A re bakeng Modimo",c:"Difela tsa Pako",v:["A re bakeng Modimo / o re fileng masimo, / go bona dijo gone / tse re phelang ka tsone.","O re neile pelo, / mebele le maphelo; / o di boloka tsotlhe, / tsa rona le tsa botlhe.","Mebele oa e tswesa / le mewa oa e jesa; / e bile o tswelela / go e re bolokela.","Morena o re tletse, / o re siamisitse; / o swetse dibe tsotlhe / go re pholosa rotlhe.","Ka Mowa wa Rraetsho / re ikanya kolobetso / le sone Selalelo / le 'Foko la botshelo.","Modimo o itshwarela / ka ene Jesu fela. / Morago re tla bona / dineo tse ditona.","Rraarona, rea rapela, / a ko o re tlamele; / o re femele rotlhe / le ba ga etsho botlhe.","Re bolokele nnete, / kgolego a e fete, / re bake leina la 'go / ka Jesu Kriste. Amen."]},
{n:14,t:"Tsogang lo lebogeng",c:"Difela tsa Pako",v:["Tsogang lo lebogeng / ka 'pelo le diatla / Modimo o dirang / ditiro tsa bonatla, / tse re di diretsweng / ke one lefatsheng, / metlheng e fetileng / le yona e leng teng.","Modimo, o o leng / Mohumi wa bophelo, / re nee mo lefatsheng / kagiso le ipelo; / tlhomamo tumelong / go ya le kwa losong; / o re ntshe 'tlalelong / tse tsotlhe botshelong.","Ka moo a re bakeng / Modimo wa mannete, / o o itshenotseng / Rara, Morwa le Mowa. / Ke o o phedileng / metlheng e fetileng; / mme o ntse o le teng / le ka bosakhutleng."]},
{n:15,t:"Baka Morena! Ke Kgosi ya tlotlo le thata",c:"Difela tsa Pako",v:["Baka Morena! Ke Kgosi ya tlotlo le thata. / Go dira jalo a e nne keletso ya pelo. / Kgobokanang! / Psalter le harpa, tsogang, / mo tumiseng thata thata!","Baka Morena! Ke Mmusi le Kgosi ya tsotlhe. / O go femela ka 'phuka tsa gagwe mo gotlhe. / Kana ke mang / yo o go babalelang? / Ke ene Mothatayotlhe!","Baka Morena, Motlhodi le Mong wa bophelo! / O go neile le mmele le boitekanelo. / Mo tlalelong / le mo dipatikegong / o go femetse ka gale.","Baka Morena, ka a ntse a go babalela! / Ka metlha yotlhe o bonye lesego la gagwe. / Yo go ratang / ke ene yo o fenyang; / ga a nke a go tlogela.","Baka Morena! A leina la gagwe le tlotlwe! / Tlaang le losika lwa Abraham, lo tle lo bake! / Se lebaleng, / Kriste ke 'sedi tseleng. / Pako e khutla ka Amen."]},
{n:16,t:"Merafe yotlhe lefatsheng",c:"Difela tsa Pako",v:["Merafe yotlhe lefatsheng, / bakang lo tumiseng / Modimo one o o ntseng / godimo mo bontleng.","Tsogang, a re opeleleng / Modimo 'godimong, / o o dirang mo lefatsheng / ditiro mo bathong.","Ke one o re bolokang / ka gale tumelong. / Obitsa ba ba timetseng / go boa phapogong.","Le fa re le bokoa jang, / re wetse mo dibeng, / ke o o re itshwarelang / tse re di dirileng.","Rra, re thabise mo pelong, / re tiise mo moweng; / le fa re le mo tlalelong, / re babalele teng.","Re fe kagiso lefatsheng, / boiketlo phuthegong, / letlhogonolo mo tseleng / le thuso ditirong.","Ka re sa phela lefatsheng, / re tiise tumelong; / mme e re fa re swela teng, / re ise 'godimong."]},
{n:17,t:"Tsoga, wena mowa wa ka",c:"Difela tsa Pako",v:["Tsoga, wena mowa wa ka, / tsena kwa legodimong! / Baka yo e leng Morena, / yo o leng kgalalelong! / Tsoga, mowa, o opele, / o nne o di lebogele / tse dintsintsi botshelong / tse a di go diretseng.","Rara, tshegofatso ya 'go / e fetela mo bathong. / O nthusitse ka ditsaago, / wa nkgomotsa mo pelong. / Le fa ke ne ke tlaletswe, / o ne o ntse o na le nna. / A go bakwe phuthegong / Rara yo ikanyegang.","Jesu Krisete, Morena, / o ineeletse mo losong. / Boitshwarelo ke bo bonye / mo go wena tumelong. / Pelo ya me ke boago, / bonno le Tempele ya 'go. / A go bakwe phuthegong / Jesu yo re golotseng!","Mowa o o Boitshepo, / 'neo tse o di nnayang / di gaisa dilo tsotlhe; / o re tsenya leseding / la go itse Jesu sentle, / ka go bitsa \"Abba, Rara\". / A go bakwe phuthegong / Mowa o o tshedisang.","A batshedi ba ba gone / 'godimong le lefatsheng / ba opelle Mong wa bone / 'pako tse di tshwanetseng. / A ba boke, a ba tlotle, / ba direle ene gotlhe. / A go bakwe phuthegong / Mmusi yo o tlotlegang!"]},
{n:18,t:"Jehofa, kea go opelela",c:"Difela tsa Pako",v:["Jehofa, kea go opelela, / gobane o ntse o le yo busang. / Go pila go go lebogela / masego otlhe a o a mphileng. / O nthute go opela leineng / la ga Krisete Jesu yo ntshwetseng.","Nkgogela, Rara, go Morwao, / mme Morwa a nkgogele kwa Rareng. / A Mowa o o tswang go wena / o mpuse gotlhe-gotlhe maikutlong; / ke nametsege thata mo pelong, / ke go opelle boitumelong.","Ao, Rara, utlwa merapelo / e ke e rapelang mo difeleng! / A ko o ntlhomogele pelo, / fa ke go obamela mo moweng. / A Mowa o nkgogele kwa o teng, / go go opella ke le kwa baengeleng.","Ee, Mowa wa 'go o nkemela / ka diphegelo tse di sa buiweng. / O nthuta go rapela sentle, / o supa, ke le ngwana Modimong. / Mme ke tla rua boswa mo Jesung, / ke bitsa \"Abba, Rara\" mo pelong.","Fa pelo e ka bua jalo / ka Mowa wa 'go o itshepileng, / o ntlhotlheletsa go le kalo, / gone o ntlhomogela pelo teng: / O nnaya tsotlhe tsotlhe bophelong, / tse ke di kopileng mo tumelong.","Ke kopa leineng la Jesu, / Morapeledi wa me 'godimong; / ka e le kopo ya Morena, / ke utlwa \"Ee\" le \"Amen\" Modimong. / Jaanong ke nametsega mo moweng, / ke tla go baka ka bosafeleng."]},
{n:19,t:"Baka Morena, tlhe, mowa wa ka",c:"Difela tsa Pako",v:["Baka Morena, tlhe, mowa wa ka! / O mmake go ya kwa losong! / Ke tla mo tlotla malatsi otlhe, / ke sa ntse ke le yo tshelang, / yo mphang botshelo lefatsheng; / a bakwe ka bosakhutleng. / Haleluya, Haleluya!","Kgosi e tshwana le batho botlhe; / e tla boela leroleng. / Tiro tsa yona di fela tsotlhe, / fa e tlosiwa lefatsheng. / Ka go se yo ka re thusang, / re batla thuso Modimong. / Haleluya, Haleluya!","Ruri go sego yo thuso ya 'gwe / e leng Modimo wa Jakob, / yo o sa kgaoganeng le ona, / a itshwarella mo Kristeng. / Ke mang yo o tla thusiwang? / Ke ene yo o dumelang. / Haleluya, Haleluya!","O ne wa tlhola lefatshe lotlhe / le dilo tsotlhe tse di teng. / Tsotlhe di tla re dirafalela / tse o di solofeditseng. / Ke ona Mmusi lefatsheng, / ke ona o ikanyegang. / Haleluya, Haleluya!","Ona o siamisetsa botlhe / ba ba siamololetsweng. / Bahumanegi le batlalelwi / o ba kgorisa mo tlaleng. / Mme ba ba bofilweng dibeng / o ba funolla dikgoleng. / Haleluya, Haleluya!","Ee, le difofu oa di bonisa, / mme bone ba gateletsweng / le bone o ntse o ba godisa, / fa e le ba ba dumelang. / Mme o tlamela le baeng / le dikhutsana mo tlaleng. / Haleluya, Haleluya!","Gape dikgato tsa batenegi / o di thibela mo tseleng, / gore lemena, fa ba le epa, / go wele bone ka mo teng. / Ke ona Kgosi merafeng. / Bakriste, tlaang, itumeleng! / Haleluya, Haleluya!","Batho, lo bake yo leng mogolo, / yo o re gakgamaditseng. / Tsotlhe di tiise ka go re: Amen! / Di mo tumise mo pakong. / Lona ba gagwe, lebogang / yo o leng bongwe borarong! / Haleluya, Haleluya!"]},
{n:20,t:"Opela, pelo ya me",c:"Difela tsa Pako",v:["Opela, pelo ya me, / opela lobokong; / o boke Molaodi / yo o legodimong. / Ke tla mo opelela / ke le mo lefatsheng, / ke mmaka ka difela / ke le boitumelong.","Ke sego, fa ke itse / kwa thuso e tswang teng / Jakobe o e bonye, / e tlhaga Modimong. / Yo ineetseng Morena / ke yo o humileng; / o phologile mono / le kwa bosakhutleng.","Mong wa dithata tsotlhe / ke yo o dirileng / ka tlhaloganyo tota, / ga go se tlhaelang: / Lefatshe, legodimo, / tse tsotlhe tse di teng, / bontsintsi jwa ditlhapi / metsing mo mawatleng.","Ene o ikanyega / go ba ba dumelang; / ga a tlhokomologe / yo o mo rapelang. / E bile o femela / ba ba gatelelwang. / Lefoko le tlhomame / le a le buileng.","O na le mekgwa mentsi / go golla mo losong. / O otla le go jesa, / fa re le mo tlaleng. / Le fa go se kotulo, / re ba ba tla kgorang; / ka tshegofatso ya 'gwe / re tla tswa tlalelong.","Morena ke lesedi / la ba ba foufetseng. / O thusa le balwetsi, / ke yo ba fodisang. / O rata badumedi / ba ba mo ikanyang; / ba mo fitlhela e le / Tsala e gaisang.","Batlholagadi botlhe / ba ba mo rapelang, / le tsona dikhutsana, / ke yo di agelang. / O ipusolosetsa / go ba ba mo ilang. / O ba thubela matlo, / mo ba agileng teng.","Nna, ka ke le lerole, / ke ka go boka jang? / O Kgosi ya dikgosi, / ke tshwana le bojang. / Mme ka o intshenketse / go nna mo phuthegong, / ke tla godisa leina / la gago mo bathong."]},
{n:21,t:"Ao, mowa wa me, baka Morena",c:"Difela tsa Pako",v:["Ao, mowa wa me, baka / Morena yo o go ratang; / o se ka wa lebala / tse ene o di dirileng; / o itshwaretse dibe / tse di go imetseng, / wa pholosiwa jalo, / wa tsholwa bongwaneng; / mme wa nna jaaka bontswi / ba ba nonofileng. / Morena o boloka / ba ba mo ikanyang.","O ne a re itsise / go rata 'gagwe molaong / le bopelontle jwa 'gwe, / e le yo re itshwarelang; / o khutla go galefa, / fa re le thapelong; / re kopa boitshwarelo / ka yo o re swetseng; / o bopelotlhomogi / go ba ba mmoifang; / maleo a latlhetswe / kgakala lewatleng.","Morena o direla / ba botlhe ba mo ikanyang; / o tshwana le rra-bana / yo o lorato mo baneng; / o itse rona batho, / fa re tswa leroleng; / re tshwana le dithunya / tse di tlhotlhoregang; / fa phefo e di foka, / ke tse di nyelelang; / le ene motho jalo / ke yo o tla felang.","Mme bopelotlhomogi / jo bo leng teng mo Modimong / bo tlhomametse ruri, / ee, bo ntse ka bosakhutleng; / bo ikanngwa ke bone / ba ba mo phuthegong / kajeno le ka gale / le ka go sa feleng; / sa rona ke go mmoifa, / re le kgolaganong, / go supa ka ga gagwe, / re le ba ba mmakang.","Morena o a bakwa / ke baengele 'godimong; / e bile o direlwa / ke bone boitumelong; / le rona re eletsa / go mmaka difeleng, / gore go dirafale / se se mo tshwanetseng. / A a re tlhomamise, / re nne boikanyong; / re tla mo opelela / le ka bosakhutleng."]},
{n:22,t:"Le fa ke sa ntse ke tlhoka",c:"Difela tsa Pako",v:["Le fa ke sa ntse ke tlhoka / ke tshwengwa ke tse dintsi / e bile ke se na thata / ya go fenya ka bonna, / ke tla tlhoafalla ena / Mogolodi wa me yo. / Le kajeno kea mo ikanya / gonne ke yo o ntshwetseng.","Fa ke na le Jesu Kriste / ga ke tlhoke mo 'fatsheng. / Fa Mothusi a le gona / ga ke boife go swa. / Gonne ka ena ke fenya / maleo le Satane, / gonne ka ena ke bona / boswa jo bo sa khutleng.","Ee ka pelo ya me yotlhe, / ke leboga 'rato lo / lo tshwanetsweng ka ntlha ya me, / gore ke tle ke phele. / Ee Morena kea leboga, / ka ntlha ya lorato lo. / A ko o nkise go wena / ke tle ke go tumise."]},
{n:23,t:"Re ntse re le mo lefifing",c:"Difela tsa Pako",v:["Re ntse re le mo lefifing / re thuma mo dibeng, / mme ka ntlha ya go sa itse / re dule mo tseleng.","Ga tla Morena ka lentswe / la tshedimosetso. / Ga tla barongwa ba gagwe / ba rera Lefoko.","Lefoko la go Morena / le siame tota / le koba lefifi gotlhe / le na le thata jang.","Le a re sedimosetsa / re bona kitso teng. / Molaetsa o mogolo / re o rerelwa teng.","Ke lesedi le legolo / le re phatsimela. / Lona lo a re tsweletsa / go fitlha go wena.","Tlaang re utlweng lentswe leno / le le tswang Modimong / re le boloke mo pelong / re le rate tota.","Mme lona lo a re bontsha / bopelotlhomogi / ka lona re bo lelelwa / 'rato lwa Modimo.","Mogolodi rea mo itse / yo re pholositseng, / Mogomotsi rea mo itse / yo o re gomotsang.","Re lebogela tsotlhe tse / tsa lorato lwa 'go, / Morena, re a tumisa / ka pholoso ya 'go."]},
{n:24,t:"Bakang Modimo 'godimong",c:"Difela tsa Sontaga",v:["Bakang Modimo 'godimong, / ka o dirile tlholegong / lesedi le le phedisang / ka 'tsatsi le, le lentle jang!","Morena a tswa mo losong / ka 'tsatsi leno mo mosong; / ke ene yo ntshiamisang, / ke ene yo o mpholosang.","Ke 'tsatsi le le natefang, / ke lone le re tlhabelang, / ka re ruantswe Modimong, / ka re le banamo Jesung.","Jesu, boloka lefatsheng / Lefoko la 'go mo kerekeng; / re utlwe lone botshelong, / mme re go bake 'godimong."]},
{n:25,t:"Go tlhaba 'tsatsi mo mosong",c:"Difela tsa Sontaga",v:["Go tlhaba 'tsatsi mo mosong. / Modimo, tsena mo pelong; / o 'tsatsi le le phatsimang, / leleka tse di fifatsang.","S' o sa ntlha ke se gopolang / e nne tebogo mo pelong; / o tsene go nna bophelong, / o nne mo go nna tumelong.","Fa ke ya gona kwa kerekeng, / o ntshireletse mo tseleng, / ke ipaakanye mo pelong, / ke nne yo o itshwaretsweng.","A pelo e nne e utlwang, / molomo e nne o bakang, / seatla e nne se nayang, / ke tlotle yo o tumileng.","O kwale tsotlhe mo pelong, / ke se nne fela yo utlwang; / o nne yo o nthatafatsang, / ke nne modiri ditirong.","Ke tlhole ke nne boikhutsong, / ke lapologe botshelong. / Mme o mphemele mo bathong / ba ba senyang letsatsi le.","Jaanong ke tsena mo kerekeng / ka boitumelo mo moweng; / ke tla nna fano dinaong / tsa Jesu Kriste boiketlong."]},
{n:26,t:"Haleluya! Moso ono",c:"Difela tsa Sontaga",v:["Haleluya! Moso ono / o monatenate jang! / Rona ba re tsileng kwano / re ba ba itumellang / tshegofatso e leng teng / mo go rona mo kerekeng.","'Tsatsi le la go ikhutsa, / 'tsatsi le lapolosang, / lone le, le phatsimela / ba ba kgobokanelang / merapelo tumelong / le go tlotla Jesu Mong.","Botsalano jwa Morena / re bo utlwa mo pelong, / jaaka monyo o rudisa / 'tlhogi tse di mo nageng; / ke jo bo re thabisang, / ke jo bo re phedisang.","Ke tlogetse 'tiro tsotlhe / tse di ka kgoreletsang / Jesu Kriste go ntirela, / Kgosi e e nnonotshang / go nna mo kabelanong / ya baitshepi Lefokong.","Ke eletsa go apara / kobo e e siameng, / ke tshiamo ya ga Kriste, / yona e e tshwanetseng: / Madi a a tsholotsweng / ruri, ke a ntlhapisang.","Ke bolola ka ipelo / go kgatlhantsha Jesu Krist'. / Ke eletsa go kopanngwa / le yo o nthekolotseng, / le go bona mo moweng / ene yo o nthatileng.","Jesu Kriste, o Morena, / utlwa se ke se kopang, / jwala peo ya Lefoko / mo pelong e rapelang, / e nne peo e tlhogang, / e e tla go ungwelang.","A re fetse 'tsatsi leno, / ka fa re simolotseng. / Nosa o godise peo, / 'Foko re le utlwileng, / go fitlhella bofelong / go nne Sontag 'godimong."]},
{n:27,t:"Modimo o o 'godimong",c:"Difela tsa Sontaga",v:["Modimo o o 'godimong, / a ko o nkutlwe mo mosong! / O mo go ba ba opelang, / o mo go ba ba rapelang.","Ke ya kwa 'Tlung e rategang, / kwa wena o re direlang, / ke batla thuso mo thutong / ka 'tsatsi leno phuthegong.","Ka re le mmogo mo kerekeng, / a ko o fologele teng / ka Mowa o o tlhagisang, / ka Mowa o o gomotsang.","O tshegofatse yo rutang, / re utlwe wena mo therong, / re tle re gole mo kitsong, / le go siama botshelong."]},
{n:28,t:"Ke 'tsatsi la Morena",c:"Difela tsa Sontaga",v:["Ke 'tsatsi la Morena, / a re itumeleng! / Kajeno re gopola / yo o duleng phupung. / Ka Sontag yo wa rona / a re tseneng kerekeng, / go obamela gona / yo o re golotseng.","Tempele e ya rona / ke yona e tletseng / masego a magolo / a a tswang Moreneng. / Tlaang re mo lebelele, / gore re mmone teng: / lesego le elele / go ba re rapetseng.","Ao Jesu, re fudise, / o Kgosi merafeng, / o tle o re kgorise / ka dijo mo moweng. / Ke rata go nna nao / ke le mo lefatsheng, / ke tle ke phele nao / le ka bosakhutleng."]},
{n:29,t:"Tlaang lotlhe, a re direleng",c:"Difela tsa Sontaga",v:["Tlaang lotlhe, a re direleng / Morena, Mmusi lefatsheng; / itumeleng, duduetsang, / tlaang lotlhe kwano, phuthegang!","Modimo lo o lemogeng, / ke ona o re bopetseng / go nna ba ona bophelong, / re itshwaretswe mo Jesung.","Ke o o sa re lebaleng, / ke ona o re fudisang; / re dinku tse o di disang, / o re fudisa Lefokong.","Mme lona ba lo o ratang, / tsenang ka pako mo kerekeng; / difela lo di opeleng / ka 'pelo tse di lebogang.","Modimo lo o lebogeng, / lo o tumise kopelong; / tlaang lotlhe, lo o opelleng, / ke sona se se tshwanetseng.","Ke ona o o sa lapeng / go rata batho mo pelong; / o re phedisa lefatsheng, / le gona ka bosakhutleng.","Modimo ke o tlhomameng / ka gale boitshwarelong; / ke ona o sa fetogeng, / o nnela ruri bonneteng.","Modimo Rara 'godimong / le Morwaa-ona loratong / le Mowa o itshepisang / ka gale lo o tumiseng."]},
{n:30,t:"Go boitshepo, go monate",c:"Difela tsa Sontaga",v:["Go boitshepo, go monate / felo Jesu o leng teng; / go tlotleng ka tlhoafalo / ka go tsena mo kerekeng;","gonne fano boitshwarelo / bo elela mo bathong / le kagiso le bophelo, / jona jo bo tswang Jesung.","Re tlhogonno go nna fano, / bantsi ba mo sekakeng. / Re jesiwa ka menate, / bantsi ba swa mo tlaleng.","Batho bantsi ba senyega / ka lefifi mo moweng. / Rona re a pholosiwa / ka lesedi Beibeleng.","Fa e kabo e se wena, / Jesu yo o re swetseng, / ruri re ne re tla tsena / jaaka bone moleteng.","Jesu, o re thuse jalo, / go sepela leseding, / gore re tle re tlhabantshe / dilo tse di lefifing."]},
{n:31,t:"Phuthego e humile thata",c:"Difela tsa Sontaga",v:["Phuthego e humile thata / e e phelang mo Lefokong; / e dirisang le kolobetso / le go jesiwa Selalelong / ka Mowa o o phedisang, / ka one o o re tiisang.","Mme a tatlhego wee ya motse / o o phelang mo lonyatsang! / Kwa 'Foko le tlhokang bautlwi, / ba kgotshe tse di lefatsheng. / Ke motse o ka tshwantshiwang / le 'sope le le tshabegang.","Gomotsegang, lebang Jakobe, / a bona Bethel sekakeng; / bakriste ba ntlha ba phuthega / fa kae ba le baheitaneng? / Ba kgobokana dikgageng, / ba utlwa Efangele teng.","Ka moo ga go re belaetse, / go teng Modimo gona fa; / fa rona re utlwang Lefoko, / o itirela kerke teng. / Le fa re bannye mo palong / o tla re leba loratong.","Le fa re kgobokana fano; / go bantsi ba ba dumelang; / le fa re sa ba bone mono, / re bongwefela Moreneng. / Lefoko le re phedisang, / le bone ke ba le utlwang.","Morena, o re tshegofatse, / fitlhisa 'Foko dipelong; / fa re abelwa Selalelo, / a re se tshole tumelong! / Re boe re le lethabong, / re go phelele bophelong.","Re tlhomamise mo go ona / motheo o o thailweng; / ke wena Jesu Krist', Morena, / o sele ruri ga o teng. / Re tlhomamise boikanyong, / fa go le ba re bogisang.","Morena, re a go rapela, / o nne le rona dipelong; / a tsone e nne Tempel ya 'go, / re hume jalo bophelong, / go ya re fitlhe Tempeleng / legodimong kwa Moreneng."]},
{n:32,t:"Tlaang lo mpuleleng mojako",c:"Difela tsa Sontaga",v:["Tlaang lo mpuleleng mojako, / ke yo tsenang mo kerekeng / gore ke nne teng ka pako / le lethabo mo pelong; / gonne go Modimo teng, / o nkgomotsa mo moweng.","Mong, ke tsile kwa go wena, / wena tla go nna kerekeng! / Fa o na le nna, Morena, / ke yo o tshegofetseng. / Tlaa o tsene mo pelong, / o nkgogele tumelong.","Nthusa, ke go atamele / ke le yo go boifang. / Tshola kopo le difela / tse ke di go supelang. / Bula tsebe mo kutlong, / tsenya pelo 'godimong.","Rumafatsa pelo ya me, / fa o jwala peo teng; / sedifatsa tlhaloganyo, / nnaya tse di tlhomameng; / ke nne yo go ungwelang / tsona tse o di batlang.","Tiisa neo ya tumelo, / yona e o e mphileng; / e godise, e femele, / e nne e e tlhomameng; / a e nkgoge mo tseleng, / e nkgorose legaeng.","Bua, Kgosi, ke tla utlwa, / nthome, ka fa o ratang; / a ke se kgorelediwe / go nwa metsi motsweding, / go ja senkgwe Lefokong / la kgomotso tlalelong.","Jesu wa me, bula kgoro, / o mphudise mafulong. / Mmana wa 'go o nkgorise, / nkise kwa legodimong. / Kwano go tlalelo jang! / Koo go tse di thabisang."]},
{n:33,t:"Jesu yo o rategang, thusa tlhe",c:"Difela tsa Sontaga",v:["Jesu yo o rategang, / thusa tlhe, re tlhokomele / se o se re rerelang, / mme dipelo di gogele / ka Lefoko la Modimo / kwa go wena gotlhe-gotlhe.","Re fifetse mo kitsong, / tlhaloganyo rea e tlhoka; / Mowa o o bonisang, / ona o re sedimose; / go akanya le go dira / go tswa mo thateng ya gago.","Jesu, o mo leseding, / o marang a kgalalelo, / a a tswang mo Modimong, / ona o o bitsa Rrago. / Dithapelo le kopelo / a di fitlhe kwa go wena."]},
{n:34,t:"Morena Jesu Kriste, tlaa",c:"Difela tsa Sontaga",v:["Morena Jesu Kriste, tlaa, / re neele Mowa mo pelong, / o re busetse mo nneteng, / re lebe boitshwarelong.","O tsose pako molomong, / etleetsa pelo mo kutlong, / o re godise tumelong, / re itse leina la 'go, Mong;","go ya re fitlhe lesomong / le le bakang legodimong, / re lebe wena leseding, / re thabe ka bosakhutleng.","A go tlotliwe mo pakong / Modimo Rara yo busang / le Jesu yo o re ratang / le Mowa o re tshedisang."]},
{n:35,t:"Dipeo tse di jwadilweng",c:"Difela tsa Sontaga",v:["Dipeo tse di jwadilweng / jaanong mo dipelong, / Morena, di nosetse teng, / di itshupe mo tirong.","Ke wena yo di nosetsang / ka pula mo moweng. / Ke wena yo re phedisang / ka Mowa Lefokong.","Ke gona re tla golelang / kitsong le loratong. / Ke gona re tla tswelelang / go ungwa tumelong."]},
{n:36,t:"A ke nne ngwana wa 'go",c:"Difela tsa Sontaga",v:["A ke nne ngwana wa 'go / ka ene yo ntshwetseng. / O ntheile: Nna ke Rrago / yo o sa fetogeng. / Ao, Rara, o se ntese / go wela tenegong; / le nna ga ke go lese, / jaanong le bokhutlong."]},
{n:37,t:"A ke go kgomarele",c:"Difela tsa Sontaga",v:["A ke go kgomarele, / Mong yo ikanyegang. / A ke tswelele pele / thutong e tlhomameng! / A ke se tlhanogele / Lefoko la 'go, Mong, / mme a ke go phelele, / ke fitlhe phologong."]},
{n:38,t:"Rara, re bolokele",c:"Difela tsa Sontaga",v:["Rara, re bolokele / dithuto phuthegong. / A batho ba dumele, / ba ate mo palong. / Tumelo a e gole, / e eme Lefokong; / le rona re le tshole / go tia dipelong.","Boloka tlotlo ya 'go / mo ba ba go ganneng, / mme tsona dira tsa 'go / di fenye lefatsheng, / gore di tlhabologe / le go tswa lefifing; / di be di go ineele, / Morena, leseding.","Boloka rona rotlhe, / ba o re rekileng, / le kerke ya 'go yotlhe, / e o e agileng. / Satan o leka thata / go senya lefatsheng; / Morena, o tswelele / go re femela teng.","Boloka letsomane, / Modisa yo disang. / O thata, ka gobane / o fentse yo senyang. / Mme ga go teng mothusi / yo ka le bolokang, / fa e se wena Mmusi / yo le tlhabanelang.","Boloka boswa jwa 'go, / jo bo itshepileng; / o fenye le go tlosa / tse di sa go kgatlheng. / Re goge ka Lefoko / la gago mo tseleng; / khutlisa le tatlhego / e e tswang mo dibeng.","Boloka Efangele / ya gago phuthegong, / o re bonise rotlhe / ba re leng mo bontshong. / Tlaa o re lapolose / ka yona lenyoreng, / o be o re pholose / ka yona maketeng.","Boloka badumedi / mo dipitlaganong, / o be o ba femele, / fa ba le thaelong. / Mme fa ba ka tlhoboga, / ba tlise tlhabanong. / Re thuse go goroga / koo, kwa legodimong."]},
{n:39,t:"Go fedile mo kerekeng",c:"Difela tsa Sontaga",v:["Go fedile mo kerekeng / thuto, kopo le go utlwa. / Jesu yo re ratileng, / ga re nke re be re khutla, / go go baka ka tumiso; / gonne re na le kagiso.","Mme a re phatlalaleng, / re na le letlhogonolo / mo pelong le mo moweng, / re le filwe ka lorato. / Ao Morena, o re goge, / gore re se go tlhoboge.","O re thuse pololong / le mo kgorogong ya rona. / Re tlamele leetong / le mo ditirong tsa rona. / Re fe boswa jwa 'godimo, / re le bana ba Modimo."]},
{n:40,t:"Go tswa le go tsena, Mong",c:"Difela tsa Sontaga",v:["Go tswa le go tsena, Mong, / o go tlhogonolofatse; / re fe dijo mo tlaleng, / tiro o e tshegofatse. / Jesu, fa re sena go swa, / re fitlhise koo go wena."]},
{n:41,t:"Sontaga o fetile",c:"Difela tsa Sontaga",v:["Sontaga o fetile; / kajeno ke utlwile / tse ke di batlileng. / Modimo o nthutile, / o bile o nneile / lesego le le tswang 'Fokong.","Morena o agile / mo go nna ka Lefoko / le ke le utlwileng. / Ke kgona go robala, / ka Jesu a tlositse / melato yotlhe e ntshosang.","Ke setse ke fodile, / ka ke le Tempel ya 'go, / Modimo borarong. / Lesedi ke le tshotse, / ka wenao ntekotse, / wa mphalodisa lefifing.","Matshwenyo a ga Satan / ga ke a tshoge thata, / le fa a ntwantsha jang. / A loso lo ka ntshosa? / Nnyaa, Jesu a ntlhapisa / maleo a a tshabegang.","Ke tla ya go robala, / mme wena o tla ntisa / bosigo borokong. / Ka wena ke tla bona / Sontag yo mongwe gona / kwa pele kwa legodimong.","Ke tla lapolosiwa, / mme Jesu o tla ntsosa, / ke mmona kwa a teng; / foo ke tla duduetsa, / ke be ke galaletsa / leina la 'gwe lethabong."]},
{n:42,t:"Ka 'tsatsi le re simolola",c:"Difela tsa Meletlo: Atfente",v:["Ka 'tsatsi le re simolola / ngwaga o mošwa mo kerekeng, / mme re tshwanetse go gopola / Morena Jesu yo tsileng / go re lekola lefatsheng, / go re golola mo dibeng.","Re neilwe gape ka lorato / go utlwa Jesu Lefokong; / mme le fa re na le molato, / o sa re bitsa mo therong. / Ee, o re tiisa mo tseleng; / ka moo a re mo lebogeng.","Morena, re a go rapela, / fitlhisa 'Foko lefatsheng. / Re reteletswe go dumela, / fa re sa tsoswe borokong. / O tletse sona lefatsheng, / go re busetsa botshelong.","Modimo Rara wa ba botlhe / le wena Jesu, yo e leng / Mothusi wa lefatshe lotlhe, / le Mowa o itshepileng, / yo o leng bongwe borarong, / re go godisa phuthegong."]},
{n:43,t:"Bulang dikgoro dipelong",c:"Difela tsa Meletlo: Atfente",v:["Bulang dikgoro dipelong, / go tsene yo galalelang! / Ke Kgosikgolo bareneng, / ke Mopholosi lefatsheng, / yo ntshang merafe tatlhegong. / Ka moo a re duduetseng: / Go tlotlwe mo bathong / yo o mo romileng!","Ke yo mogolo mo thusong, / mo tshiamong le bonolong. / O nosi fela boitshepong, / o pelonolo mo moweng. / Tlalelo yotlhe e leng teng / o e khutlisa lefatsheng. / Go tlotlwe yo o tlang, / yo o re pholosang.","Lefatshe le tlhogonno jang, / le busiwang ke Kgosi e! / Mme batho ba lesego jang, / fa e agile dipelong! / Morena yo o thabisang / ke 'tsatsi le re tlhabetseng. / Go tlotlwe yo o tlang, / yo o re gomotsang!","Mo tsholeleng mo dipelong, / lo mo direle Tempel teng; / mme bontle jo e kgabisang / ke mowa o mo lebellang. / Foo go tla tsena Jesu, Mong, / go lo phedisa dipelong. / Go tlotlwe yo o tlang, / yo o re humisang!","Morena Jesu, tlaa jaanong, / o tsene gona mo pelong / ka kgoro e go buletsweng, / o b' o tle ka lorato teng; / re tsamaise mo tseleng / ka Mowa go ya legaeng. / Re ba ba go tlotlang, / Mong yo galalelang."]},
{n:44,t:"Morena wa tlotlego",c:"Difela tsa Meletlo: Atfente",v:["Morena wa tlotlego, / ke tla go tshola jang? / Ke go tlhologeletswe / le bontsi mo bathong. / Ao Jesu, mponegele / ka 'sedi mo pelong, / ke tle ke itse sentle / se se go thabisang.","Ba Sion ba gasitse / dipalme mo tseleng; / mme nna ke tsisa pako / e e tswang mo pelong. / Dipelo di a bina / pakong le tumisong, / di a go kgomarela / ka gale tumelong.","Re ne re tshela fela / re le khutsafalong. / Re ne re tlhoka puso / e ka re phedisang. / O tsile ka tse tsotlhe / tse di ka re thusang, / go dirafatsa tsotlhe / tse di re thabisang.","O tsile go nkgolola / ke le mo dikgoleng; / o tsile go ntshwatola / dibeng le mo kgaleng. / Ka nnete o nkabela / dikhumo tumelong; / di ka se ka tsa fela / jaaka tse di 'fatsheng.","O tsile ka bonolo / kwa go nna lefatsheng, / ka 'rato lo logolo, / lo lo re lebanyeng / le bone batho botlhe / ba ba matshwenyegong / le maketeng a otlhe, / go re ntsha tatlhegong.","Mme lona ba matlhoko, / ba lo hutsafetseng, / se lebaleng Lefoko, / lo se itlhobogeng. / Morena wa kgomotso / o eme fa kgorong, / o tla lo lapolosa, / a nna le lona fa.","Le fa lo itapisa / jaanong le bosigong, / ga lo na go mo tsisa / ka thata mabogong. / O tla tla ka boene, / a tletse mo pelong / lorato lo logolo, / lo lo ntshang poifong.","Go lalediwa lona / ba lo reregileng / go tla go itshwarelwa / tse lo di dirileng. / Itseng, o tla lo tlela / pholoso e tletseng; / e bile o fa boswa / ba ba mo ikanyang.","Lo se ka lwa ba reetsa / ba ba lo rogakang. / Morena o falatsa / ba ba mo nyaditseng. / O tla tla e le Kgosi / e thata mo tshekong, / go fenya baba botlhe / ba ba mo ganetsang.","O tla tla go atlhola / ba ba mo latlhileng. / O tla tla go agisa / ba ba mo ratileng. / Ao Jesu, Jesu, tlaya, / o re ntshe tshepelong, / re fitlhe kwa go wena, / kwa boitumelong."]},
{n:45,t:"Go atametse Kgosi",c:"Difela tsa Meletlo: Atfente",v:["Go atametse Kgosi, / tlaang re e kgatlhantsheng! / Ke yona Mopholosi / wa ba ba lefatsheng. / Bakriste, opellang / Morena Hosiana, / lo khubamele ena, / lo bake yo o tlang!","Ee, lona babobodi, / tlaang lo itumeleng! / Go tlile Mogolodi, / yo o lo ntshang dibeng; / lo mo amogeleng, / o tsile ka dineo, / o naya boitshwarelo / ba ba latlhegileng.","Lo nanogeng, batlhoki, / mme lo se boifeng; / ka re na le Mmoloki, / go ka nna kotsi jang? / Re ka tswa tlalelong, / o a re tshegofatsa, / o bile o gomotsa, / o re ntsha mo losong.","Tlaang, lona balatlhegi, / tlaang lo ikwatlhaeng! / Le lona batenegi, / boang, lo se tseneng / losong le moleteng! / Tlaang tlhe, lo a bidiwa, / mme lotlhe lo tla fiwa / boitshwarelo teng.","Mme fa re latlhegelwa / ke dilo lefatsheng, / ka ene re tla newa / tse di sa senyegeng. / Mong yo o phedisang / ka dijo batho botlhe / le tse di phelang tsotlhe, / ga se yo lebalang.","Tlaang lotlhe, tsholang Kgosi; / tlaang itlhaganeleng! / Lo se ka lwa mo gana / yo o lapolosang! / Ao, lo diegetseng? / Morena wa bonolo / o tsisa thekololo / go ba ba mo dibeng."]},
{n:46,t:"Jesu, kea go dumedisa",c:"Difela tsa Meletlo: Atfente",v:["Jesu, kea go dumedisa, / yo o tlang mo lefatsheng! / Yo ganang go go tumisa / ga se yo o go ratang. / Nna, pelong ke a go rata, / ke ntse ke go batla thata. / Jesu wa me tumelong, / ke wa gago loratong.","Ga o tshwane le dikgosi / tsa ditšhaba lefatsheng, / ka e le wena Mopholosi / yo o re humisitseng. / Rona re go leofetse, / wena o re itshwaretse. / Jesu wa me tumelong, / ke wa gago loratong.","Khumanego yotlhe ya 'go, / ao, e nkhumisitse jang! / Jalo ruri ke wa gago / ke le yo go ikanyang. / Ke a tlhoka, o tla nnaya / khumo yotlhe ya pholoso. / Jesu wa me tumelong, / ke wa gago loratong.","Le fa batho ba go gana, / ke go tshwara mo pelong; / ga re kitla re kgaogana, / re kopantswe loratong. / Jesu, ke tla go phelela, / gore ke swe, ke na nao! / Jesu wa me tumelong, / ke wa gago loratong.","Le fa batho ba go kgala, / ba go nyatsa lefatsheng, / ke tla leka ka tlhoafalo / go goroga 'godimong. / Ke tla bona teng kabelo / ya serwalo sa bophelo. / Jesu wa me tumelong, / ke wa gago loratong.","Jaanong kgoro e atlhame, / tsena, Jesu, mo pelong! / Ga o ka ke wa ntlhobosa, / ruri, o tla tsena teng. / Tlosa dibe tsotlhe tsa me, / ke tle ke go bake jaana: / Jesu wa me tumelong, / ke wa gago loratong."]},
{n:47,t:"Ao, baakanyang dipelo",c:"Difela tsa Meletlo: Atfente",v:["Ao, baakanyang dipelo / tsa lona ka kwa teng, / ikwatlhaeng lo boe / dibeng le timelong! / Ke mang ne yo o tlang? / Ke Kgosi, Mopholosi! / Ke ene Jesu Kriste / yo o re gololang.","Lo siamise tsela / e o e tsamayang. / Iketleetseng lo tshole / Morena tumelong. / Tlosang megopolong / makgapha, oa a ila, / lo mmaakanyetse mmila, / a tsene dipelong.","Fa lo ikokobetsa / lo ratwa Modimong; / mme fa lo ikgodisa, / lo wela tatlhegong. / Mme yo o mo nneteng, / a gogwa ke Modimo, / o ipaakanya pelo, / go tsena Kriste teng.","Johane o tlhabile / mokgosi mo therong / a re, go latlhegile / yo o sa mo utlweng. / A rera sekakeng, / a bitsa batho botlhe, / a ba supetsa Kwana / e e ba ntshang dibeng.","Nna ke tlhomola pelo, / ga ke yo tshwanetseng; / Morena, ntlhabolose, / ke nne yo nyorilweng; / o tsene mo pelong, / ka wena o ntsaletswe, / e bile o mpogetse, / ke nne yo o phelang."]},
{n:48,t:"A ke wena yo o tlang",c:"Difela tsa Meletlo: Atfente",v:["A ke wena yo o tlang, / kampo a go tla o sele? / Tshupo tse ke tsa ga mang, / tse di boleletsweng pele / ke bakwadi Beibeleng? / Ke tsa Kriste lefatsheng!","Bona ba ba sa boneng, / Jesu o ba bonisitse, / le digole mo mmeleng / Jesu o di fodisitse. / Bona ba ba mo dibeng / o ba ntshitse molatong.","Bona ba ba sa utlweng / ba ka utlwa, ba dumela. / Bona ba ba sa bueng / ba ka bua, ba opela. / Mme le ba ba mo losong / ba boela bophelong.","Le badidi mo moweng / ba rerelwa Efangele. / Ena yo o sa kgotšweng / ke Morena, Mogolodi, / ke yo tshegofadiwang, / ka e le yo dumelang.","Jesu, Montshi molatong, / o Moruti yo molemo. / Ngaka mo dipobolong, / o nkalafe ka Lefoko. / Yo o go atamelang / o tla tshegofala jang!","Ke go utlwa Beibeleng, / kea dumela, go tlhomame / tsotlhe tse di kwadilweng / ka ga gago, Jesu wa me. / O ntshwatotse mo dibeng, / ka o tsile lefatsheng."]},
{n:49,t:"A go bokwe lefatsheng",c:"Difela tsa Meletlo: Atfente",v:["A go bokwe lefatsheng / Rara yo legodimong, / yo o dirafaditseng / dipolelo Beibeleng!","Se borre ba se iletseng, / se ba se eleditseng / le tse ba di kwadileng, / di bonetse lefatsheng.","Thuso e lebeletsweng / ke Israel Modimong, / ke e bonetseng jaanong / Betleheme motsaneng.","Abrahame yo filweng / tsholofetso tumelong, / a ineela Modimong: / Ke yo o itumetseng.","Mopholosi yo letwang / ke Jakobe botsafeng; / Morwa-lekgarebe yoo: / Ke yo o tsileng jaanong.","Kea go dumedisa, Mong, / ka Hosiana phuthegong! / O nkalafe mo pelong; / gore ke nne kagisong.","Tsena, Kgosi, mo pelong, / ke ya gago, wena Mong; / o e tlhatswe mo mading, / gore ke tswe boleong.","O nkgomotse mo pelong, / ka ke sa le bokoeng, / ke le yo tsiediwang / ke Satan bolotsaneng.","Gata noga e sumang, / ene Satan yo senyang, / ke latele tumelong / Jesu, go ya bophelong.","E re o tla bofelong / mo marung, kgalalelong, / ke tl'o go kgatlhantsha teng, / ke nne nao legaeng."]},
{n:50,t:"Jaanong a re bakeng",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Jaanong a re bakeng / ka pelo, a re reng: / \"Jesu oa ratega, / le fa a le botlhokong, / a sa ikatega, / a letse bojelong. / O mogolo jang! / O mogolo jang!\"","Ke tlhofaletse jang / Morena yo bakwang! / Ngwana wa Modimo, / nkgomotse mo pelong, / nkise kwa godimo / go wena phologong / kwa legodimong, / kwa legodimong!","Ke leofile jang / ka tse di boitshegang! / Ke ne ke tla tsena / molelong o sa khutleng. / Mme bonang, Morena / o tsile lefatsheng / go nntsha mo losong, / ke nne bophelong.","Mme re tla thaba kae? / Legodimong kwa gae, / kwa go leng baengele / ba ba opelelang / Jesu Krist' Morena / dipsalme dintle jang! / Re tla fitlha leng / gona legaeng?!"]},
{n:51,t:"Ke go tumisa, Jesu Mong",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Ke go tumisa, Jesu Mong, / ka o tsetswe mo bathong / ke lekgarebe lefatsheng; / go pako mo baengeleng. / Haleluya!","Go bonwa ngwana bojelong; / Morwa esi 'godimong / wa Rara yo o sa khutleng / o fologetse mo nameng. / Haleluya!","Ke ene yo o dirileng / dilo tsotlhe lefatsheng; / jaanong o letse sehubeng / sa 'mmaagwe yo o mo tshotseng. / Haleluya!","Lesedi le le sa khutleng / le phatsima lefatsheng, / le bonegela mo bontshong / go re gogela 'godimong. / Haleluya!","Jesu o tsile lefatsheng, / a nna motho mo boeng / go re ntsha rotlhe maleong, / re tshole boswa 'godimong. / Haleluya!","Le fa a tshwana lefatsheng / le molala mo tlaleng, / o re humisa mo moweng, / go aga kwa baengeleng. / Haleluya!","O re diretse tsotlhe tse / go re bontsha 'rato lo; / ke 'rato lo logolo jang! / Tlaang, lotlhe lotlhe, lebogang! / Haleluya!"]},
{n:52,t:"Ke tlhaga kwa legodimong",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Ke tlhaga kwa legodimong, / ke lo tsholetse mo pelong / mafoko a a pila jang, / a mantsi a a thabisang.","Ka lo tsaletswe bosigong / Mmoloki mono Betlehem. / Ke Ngwana yo o montle jang! / Ke ene yo o lo ratang.","Ke Jesu Kriste 'godimong, / o tla lo thusa tlalelong. / Mmoloki ke yo o tsileng / go lo golola mo dibeng.","O lo tsisetsa lefatsheng / pholoso e lo neilweng / ke Rara yo o sa khutleng, / go phela mo baengeleng.","Mme tshupo e, e lemogeng: / Lesea le le lo tletseng, / le gona teng mo maseleng / mo bojelong mo setaleng.","Tlaang, tlaang, a re itumeleng, / re tsene le badisa teng / go bona se re se newang / ke Rara yo o re ratang.","Lemoga pelo, leba foo, / o bone ene Ngwana yoo. / Ke Jesu yo o tsaletsweng / merafe yotlhe lefatsheng."]},
{n:53,t:"Baengele ba tswa 'godimong",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Baengele ba tswa 'godimong, / ba ya kwa Betlehem 'sigong / go iponatsa badiseng / ba ba disang kwa merakeng.","Ba bua ba re: \"Mo motseng / wa Dafit lo tsaletswe teng / Mesia yo lo mmolletsweng / ke ene Miga Beibeleng.\"","Mme tlaang jaanong, itumeleng! / Modimo o o sa feleng / o itlisitse mo nameng / ya lona, mme o ineeleng!","Satan o wetse katlholong, / ga a na thata phuthegong. / Modimo lo na nao jaanong, / o fenya dibe mo losong.","Mme a ba ba o ineetseng / ba ka lebalwa lefatsheng / ke ona? Nnyaa, solofelang, / lo fenye ba ba ganetsang.","Lo nametsege botshelong, / lo tla ba fenya bofelong. / Tlotlang tlhe ka bosakhutleng / Modimo o o sa feleng."]},
{n:54,t:"Ngwana yo o tlhelele",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Ngwana yo o tlhelele / wa yo o sa khutleng, / o ntse le Rraagwe pele / ka fa go kwadilweng. / Mme ene ke naledi / ya masa le lesedi / le le tsabakelang.","Morena o tsisitswe / ke Rara lefatsheng, / Maria a sa itse / monona mo nameng. / Morena o re ntshitse / losong, o ntšhafaditse / bophelo lefatsheng.","Re neele tlhaloganyo, / Modimo, mo pelong, / lorato le boikanyo / go gola mo kutlong, / re kgalegele ene / Mmoloki le Morena / yo montle mo moweng.","Mmopi wa dilo tsotlhe, / ke wena yo o dirang. / O busa rona rotlhe, / le ba ba go ganang. / Dipelo o di goge, / gore di se fapoge, / tsa wela tshenyegong.","Atam' mogologolo / a a swe mo pelong! / Keletso le ditlolo / tse di senyang 'phelong, / le tsona di tswe tsotlhe. / O re rudise rotlhe, / re phele mo moweng."]},
{n:55,t:"Bakriste botlhe, lo bakeng",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Bakriste botlhe, lo bakeng / Modimo 'godimong! / Ka ntlha ya Morwa yo o tsileng / kajeno mo bathong.","O tswa go Rraagwe boreneng, / jaanong o monnye jang! / Ke yo o ikamogileng / tse di mo tshwanetseng.","O anya maši mabeleng / a 'mmaagwe yo o tswang / sikeng lwa 'Dafit yo go tweng, / ke yo o tla mo tsalang.","Mme le fa a tswa losikeng / lwa yo o tsenyeng losong, / o busa ka bosakhutleng, / ka a dule Modimong.","Mme Mong wa thata yo o busang, / jaanong o botlhankeng. / Yo o tlhodileng tse di phelang / o tsenye bokoeng.","Kajeno nna ke yo o tlotlwang, / mme ene o tshotlong! / Lorato lwa ga Jesu Mong / ke lo lo makatsang.","Kgoro e e yang Paradising / ke e e bulegileng, / mme go tlogile mojakong / Kerub yo o disitseng."]},
{n:56,t:"Tlaang go Jesu, re mo tlotle",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Tlaang go Jesu, re mo tlotle, / opelang ka pelo yotlhe, / mme mmakeng ka mowa otlhe, / lona ba lo dumelang!","Dibe tsotlhe a di fele, / mme Satan a a nyelele, / gore re tle re itumele; / gonne re mo phologong.","Ene Rara o re neela / Ngwana wa 'gwe go re lwela. / Ruri, o tla re itseela / kwa go ene 'godimong.","Jesu o gogilwe thata / ke lorato go re rata, / le fa Satan a re gata, / re thusiwa tlalelong.","Ene Jesu ke naledi / ya 'Jakobe, le lesedi / mo go rona badumedi, / go bonesa lefatsheng.","Satan o re tshwentse thata, / mme Morena a mo gata, / kwa thabeng e ya dikgata, / gore re tswe mo losong.","Jaana re a itumela, / ka re itse go dumela / mo go wena, Jesu, fela, / wena yo o tsileng 'fatsheng.","Mme jaanong, o re thabise, / o re thuse, o re dise, / gore re go dumedise / kwa o teng legodimong."]},
{n:57,t:"Pelo ya me, itumele",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Pelo ya me, itumele / mo motlheng, / fa go leng / pako ya baengele. / Utlwa! 'Foko le tumile / lesomong, / 'godimong: / \"Krisete o tsile!\"","Ee, go tsetswe gompieno / yo o fenyang, / yo o tlosang / matshwenyego ano. / Ke Modimo wa botshelo / o tsenyeng / mo nameng / gore o re swele.","Ee, Modimo o re rata / mo Jesung, / ke ka moo / itumeleng thata! / A jaanong o ka re gana, / ba o re / neileng / Morwaa ona Jesu?","Jesu a tla go nna Kwana / e rweleng / magetleng / dibe tsa ba botlhe. / Yona e batletse rona / Modimong / 'godimong / kutlwelo-botlhoko.","Mme jaanong re mmona fano / bojelong, / bodiding, / yo o re bitsang a re: / \"Latlhang matshwenyego otlhe, / bonnaka, / nna ke teng, / ke tla lo direla!\"","Tlayang kwano, lona lotlhe, / sianang / lo boneng / Jesu, lo mo tlotle. / Jalo, mo rateng le lona, / yo o lo / busetsang / kwa go ene Rara."]},
{n:58,t:"Ke eme fano bolaong",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Ke eme fano bolaong / jwa gago, Jesu wa me, / mme ke inyatsa mo pelong / ka ntlha ya go tlhoka ga me. / Kabelo tse ke di go fang / ke pelo e e lebogang / le mowa le maikutlo.","Lorato lwa 'go, Jesu Mong, / lo ntsibositse thata. / Setshwano sa 'go bojelong / se ntsenye pelong gotlhe. / Ke gona ke tla go tsholang / ka pelo e itumelang, / ga nka ke ka go lesa.","E rile o tla lefatsheng, / le nna wa ntlela jalo, / wa mpatla yo ke sa go itseng, / go ntshola ka tsalano. / E rile ke tswa seatleng / sa gago se se mpopileng, / wa impha ka lorato.","Ke ne ke tshela lefifing, / wa nna letsatsi la me / le le mpeileng mo leseding / go phela ke thagame. / Ee, wena 'tsatsi le le mphang / tumelo e e pholosang, / o pila thata thata.","Ke go lebile bojelong, / ke a go baka, Jesu, / yo o ntseng mo khumanegong, / etswe o le Morena. / Kgabiso e go tshwanetseng / ke gouta tse di lefatsheng; / mme o di ganne tsotlhe.","Maitumelo lefatsheng / ga a ka a go kgatlha. / Mme o ineetse maketeng, / Modimo wa go latlha. / Jaanong ke tla ya phologong / ka mahutsana a 'go, Mong. / Ke go leboga thata."]},
{n:59,t:"Itsose, mowa o lwalang",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Itsose, mowa o lwalang, / mme o tlhologelelwe / Lesea le le bidiwang / Rara, mme o itumele! / O tsile jaana bosigong, / mme o nna mono mo bathong / go batla batho ba 'gwe, / ba nne ditsala tsa 'gwe.","Dumela, yo o rategang! / O Kgosi ya tlotlego. / Dumela, Kwana e tlang / go rona ba tatlhego! / Ke tla go baka bophelong / ka thata yotlhe mo pelong, / ka o itsentse gona / mo tshenyegong ya rona.","Modimo Morwa, re tla reng, / ka o tlogetse puso, / go tla go rona ba re leng / teng mo go se nang thuso? / O ka tswa jang mo bontlengtleng, / kwa kgalalelo e leng teng, / go beela baba ba 'go / bophelo jo jwa gago?","Mme motho yo o mmatlileng, / ao, ke wa khumanego, / mme o mo ntshitse mo masweng, / jaanong ke wa tlotlego. / Le fa a le mo thogakong, / mo lefifing le tatlhegong, / Morena, o mo tletse / 'fatsheng, go mo itseela.","Mong wa lefatshe yo e leng / Motsisi wa kagiso, / Mogakolodi mathateng, / Mofenyi wa molete, / o ne o reng, go tla 'fatsheng, / go nna motlhanka le moeng, / go tshwana jaaka ene / motho yo seng Morena?","A tiro e diragetseng, / e sa tshwaneng le epe! / Go tsile yo o humileng / go ba ba se nang sepe. / Go tsile yo o thata jang, / Morena yo o laolang / molelo le dithaba, / le maru le ditšhaba!","O Ngwana yo o montle jang! / O gakgamisa batho botlhe. / Ke wena yo ke go ratang / bogolo go tse tsotlhe. / A ko o tsene mo pelong, / o etse o le bojelong, / kea e go baakanyetsa, / ga nka ke ka tsietsa.","Mpolelle se nka se go fang, / ka o Moratwi wa me. / O bile o nthatile jang, / mme o bophelo jwa me. / Itseele se ke se tshotseng, / o ntsee ka fa ke ntseng ka teng, / ke a go naya tsotlhe, / go rata ga me gotlhe.","Ke go tumisa mo moweng / kajeno le ka gale; / ka o le nkgonne lefatsheng, / a nke ke tlhoafale / go ema sentle tumelong, / ke sa ntse ke le tshepelong, / ke tlotle, ke go bake, / Mmoloki le Mong wa ka!"]},
{n:60,t:"Ao Jesu 'seding, ao Jesu bontleng",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Ao Jesu 'seding, / ao Jesu bontleng, / thuanyo ya me mo Rareng! / O fologetse lefatsheng / go tshwana le nna mo nameng. / Ao Jesu 'seding, / ao Jesu bontleng!","Ao Jesu 'seding, / ao Jesu bontleng, / o re golole Sataneng! / Re tlhomogele pelo, Mong, / a ko o re ntshe molatong. / Ao Jesu 'seding, / ao Jesu bontleng!","Ao Jesu 'seding, / ao Jesu bontleng, / o boitumelo lefatsheng! / O tsenye mono mo nameng / go re gomotsa selelong. / Ao Jesu 'seding, / ao Jesu bontleng!","Ao Jesu 'seding, / ao Jesu bontleng, / o thebe ya me mo direng! / Botsalo jwa 'go lefatsheng / bo re thibosa mo dibeng. / Ao Jesu 'seding, / ao Jesu bontleng!","Ao Jesu 'seding, / ao Jesu bontleng, / o re nametse mo moweng! / O re tsenyetsa mo pelong / lorato lo fenyang losong. / Ao Jesu 'seding, / ao Jesu bontleng!","Ao Jesu 'seding, / ao Jesu bontleng! / O re gogele mo tseleng, / re go ineele tumelong, / re bolokege botshelong. / Ao Jesu 'seding, / ao Jesu bontleng!"]},
{n:61,t:"Re ntse re le batimedi",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Re ntse re le batimedi, / re tsamaya mo losong; / jaanong go tlhabile 'sedi / la Modimo mo bontshong. / Haleluya, Haleluya, / re lekotswe kgolegong!","A re tlhatloseng Hosiana / go Morena 'godimong! / O tsaletswe 'fatshe leno, / go golola batho teng. / Ke Morena wa barena, / o laola lefatsheng!","Jesu o re falodisa / mo go tse di re tshwereng; / mo tlotleng lo mo ineele, / Mogolodi lefatsheng! / Ke Morena wa barena, / batho botlhe, lo mmakeng!","Phuthegong lo mo direle, / Kgosi e khumanegong, / ene Ngwana yo o tlhelele / wa Modimo 'godimong. / Ke Morena wa barena, / lo mo itumeleleng.","Puso ya 'gwe e tla fenya / bofelong mo lefatsheng; / baganetsi a ba senya; / mme ba ba mo ratileng, / ba tla tshela, ba opela / Amen, Haleluya teng."]},
{n:62,t:"Go tsile Jesu mo bathong",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Go tsile Jesu mo bathong, / go ba ntsha mo dibeng, / le go ba isa phologong, / teng kwa Paradiseng.","O tletse ba ba bofilweng / ke Satan kgolegong / go ba golola bogoleng / le mo matshwenyegong.","O tletse ba ba sa boneng, / ba ba mo timelong, / go ba busetsa mo tseleng, / ba tsene leseding.","O tletse ba ba sa utlweng, / ba utlwe mo therong / Morena yo o ba bitsang, / ba tsene phologong.","O tletse ba ba tshogileng / maleo mo pelong, / go ba gomotsa mo meweng, / go ba ntsha selelong.","Hosiana! Kgosi 'godimong, / tsogang lo e bakeng, / lo tlotle Jesu mo pakong, / merafe lefatsheng."]},
{n:63,t:"Re neetswe Jesu ka lorato",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Re neetswe Jesu ka lorato / lwa 'Rara jaana bosigong, / o tsetswe popegong ya batho. / Tlaang, tlaang lo mmone bojelong, / mme lo mo tshole tumelong; / o dule jaana 'godimong.","Mme Ngwana yo re mo senkile, / Morwa Modimo 'godimong. / Le baprofeti ba kwadile / ga gagwe teng mo dikwalong / ba re: O tla tsalelwa teng / kwa Betleheme, mo motseng.","Re mmonye ruri, ee, o tsile, / ke ene yo o phatsimang; / le rona jaanong re itsile / lesedi le le bonesang. / O re bonesa mo pelong / ka 'Foko la 'gwe phuthegong.","Re tla phatsima jaaka ene, / fa re mo tshola tumelong. / Re itse gore ke Morena / yo gololang mo maleong. / Ee, re golotswe Sataneng / ke Jesu yo re mo filweng.","Mme jaana re thabile thata, / kajeno a re opeleng, / re bake ene, ka a rata / go nna le rona lefatsheng, / go re golola mo losong / le go re isa 'godimong."]},
{n:64,t:"Ka botlalo jwa sebaka",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Ka botlalo jwa sebaka / go tsaletswe lefatsheng / Montshi le Mmoloki wa ka, / go ntsha batho mo dibeng. / O ne a le thogakong / go golola mo dibeng / batho botlhe ba tatlhego, / gore ba tle ba ratege.","Jesu Kriste o tsaletswe / ke 'kgarebe lefatsheng. / Ruri ka botsalo jwa 'gwe / re emelwa mo dibeng. / O ineetse mo losong / go golola molatong / batho botlhe ba bosula, / legodimo a le bula.","Molefedi le Mothusi / yo o ka re pholosang / ke Mmoloki, Morebusi, / Ngwana yo o rategang. / Mme a tsalwa bosigong, / a nna motho, Jesu Mong, / gore rona re nne bana / ba Modimo, go ratana.","Mme jaanong, ka re le bana, / bana ba o ba ratang, / ruri o re naya jaana / Mowa o itshepisang. / O re ruta mo pelong / go rapela tumelong: / \"Abba, Rara, ke nna ngwana, / nkutlwe, o se ka wa nkgana!\"","Lona bana ba pholoso, / ba lo leng mo Modimong, / mme lwa rutwa ka Lefoko, / sepelang mo tumelong. / Foo go tla siama jang! / Lo tla nna ba ba ruang / mmogo le Morwa Modimo / tsotlhe, le tsa legodimo."]},
{n:65,t:"Kwa Betleheme motsaneng",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Kwa Betleheme motsaneng / o leng wa 'Dafit, kgosi, / ka go solofeditswe teng / Mesia, Mopholosi, / bonang, bonang, bonang! / Modimo o dirang? / Wa roma Jesu lefatsheng / go re golola mo dibeng.","Morwa Modimo yo o tsetsweng / ke Ngwana wa tlotlego; / o gone teng mo maseleng / mo 'tlung ya khumanego. / O beilwe bojelong, / o mo khumanegong, / e le moeng mo lefatsheng / la batho ba ba mo dibeng.","Kwa Betleheme merakeng / badisa-matsomane / ba bona gona mo nageng / moengele gautshwane. / Ba utlwa 'foko teng / la yo o romilweng / go ba itsise yo e leng / Mothusi wa ba ba dibeng.","A bua a re: \"Se boifeng! / Lo neetswe Mopholosi / kwa Betleheme mo motseng, / jaaka lo boleletswe. / Ke gona yang kwa teng, / lo mmone motsaneng, / kwa o letseng teng bojelong / mo maseleng, khumanegong.\"","Ba bona ba ntse ba le teng / ka tshoganyetso ruri / baengele, ba tswa 'godimong, / ba bua jaana ba re: / \"A go nne 'godimong / tlotlo mo Modimong, / kagiso e nne lefatsheng, / mo bathong ba ba o kgatlhang!\"","Tlaang, batho, tlaang, obamelang / Morena, Mopholosi! / Mme lotlhe ba lo mo utlwang, / bakang lo bue jaana: / \"Jesu yo o tsetsweng / ke ene yo o tsileng / go nna Mmoloki mo bathong, / ba tle ba ye legodimong!\""]},
{n:66,t:"Thabang botlhe, thabang botlhe",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Thabang botlhe, thabang botlhe, / bakeng seno mo moletlong. / Re ne ra latlhega, / Kresete a tsalwa. / Opang botlhe ka diatla lethabong.","Thabang botlhe, thabang botlhe, / bakeng seno mo moletlong. / Kreste o tsaletswe / go re rekolola. / Opang botlhe ka diatla lethabong.","Thabang botlhe, thabang botlhe, / bakeng seno mo moletlong. / Fifi le fetile / tsatsi le tlhabile. / Opang botlhe ka diatla lethabong.","Thabang botlhe, thabang botlhe, / bakeng seno mo moletlong. / Gonne baengele / ba tlotla Modimo. / Opang botlhe ka diatla lethabong."]},
{n:67,t:"Tlaang fa badumedi, tlaang lo itumele",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Tlaang fa badumedi, tlaang lo itumele, / tlaang kwano, lo tsene kwa Bethlehem! / Gore lo bone Ngwana Jesu Kreste, / lo obamele ene, / lo obamele ene, / lo obamele ene, Morena.","Ke Kgosi ya tlotlo, Mmusi wa baengele, / o farwa ke mmaagwe mo difarong, / mme ke Modimo Mong-wa-thata-yotlhe. / Lo obamele ene, / lo obamele ene, / lo obamele ene, Morena.","Le lona baengele, opelang difela, / bakang tlhe, Modimo o romileng / Morwa yo esi, go re rekolola. / Lo obamele ene, / lo obamele ene, / lo obamele ene, Morena.","Mme Jesu Morena, re a go leboga, / ka o tsetswe go nna motho 'fatsheng. / Morwa Modimo, sala mo go rona. / Re a go obamela, / re a go obamela, / re a go obamela, Morena."]},
{n:68,t:"Banyana tlaang kwano lo kgobokaneng",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Banyana tlaang kwano lo kgobokaneng! / Tlaang fa bojelong jo bo mo Bethlehem! / Lebang ka fa Rara o lo thabisang / ka neo e kgolo e e kgatlhisang.","Lebang, tlhe, Ngwanyana yo o tswang 'godimong; / mmoneng bojelong a le khumanegong; / o phala baengele le batho 'fatsheng, / le tsona dikgosi tse di ditšhabeng.","O mo setaleng o laditswe jwanyeng / Maria le Josef ba thaba moweng, / badisa ba tsile, ba mo mangoleng, / baengele ba mmaka kwa legodimong.","Banyana, tlaang kwano, re obameleng, / gobane o tsetswe go re ntsha dibeng; / o teng bojelong a le khumanegong, / mme ruri ke ena yo o tswang 'godimong.","Mme rona banyana re ka mo nayang / ka ntlha ya lorato lo gakgamatsang? / Ga a batle khumo e e nyelelang, / o batla dipelo tse di mo ratang.","Ke gona, Morena, re go ineelang / ka 'pelo tsa rona tse di go ratang. / Re kopa, re ise kwa legodimong, / re nnele teng ruri mo kgalalelong."]},
{n:69,t:"Tidimalong, bosigong",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Tidimalong, bosigong, / botlhe ba mo thobalong; / mme bagolo ba Jesu Mong, / ba mo disa, yo o tsetsweng, / go tl'o re ntsha dibeng, / go tl'o re ntsha dibeng.","Mo lefifing kwa nageng; / go rometswe badiseng / moengele, yo o ba rayang: / Yang ka pele kwa Betlhehem. / Mopholosi o teng, / Mopholosi o teng.","A re thabeng mono 'fatsheng; / gonne Ngwana yo o tsetsweng / o re rata le mo pelong; / o tla re ntsha mo maleong, / go re isa 'tshelong, / go re isa 'tshelong."]},
{n:70,t:"Go tsetswe Jesu Kreste",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Go tsetswe Jesu Kreste, / ke yo o tlhogileng / mo moding wa Isai, / ka fa go kwadilweng. / Ke yo o tlhogileng / mo moding wa setlhare, / se se senyegileng.","Jesu, Morwa Modimo, / yo re mmonang 'jelong, / o tsetswe ke Maria, / yo o itshenketsweng. / Yo o tshegofaditsweng / bogolo go basadi / botlhe mo lefatsheng.","Mme modi wa Isai / ke yo o re kgatlhang. / Lefifi la lefatshe / ke le o le tlosang. / A re mo thabeleng! / Ke motho le Modimo, / Ke yo o re golotseng.","Bakang Modimo Rara / le Morwa moletlong, / le Mowa wa boitshepo, / Modimo o le teng! / Re bake yo e leng / Mmoloki wa ba botlhe, / yo o re isang seding."]},
{n:71,t:"Ke ya le badisa gona",c:"Difela tsa Moletlo wa Botsalo jwa Morena",v:["Ke ya le badisa gona / Bethlehema kwa go Jesu / yo o tsaletsweng setaleng / gore ke tswe mo dibeng.","Ke tla baka le baengele / 'rato lwa Modimo, Rara, / le kagiso lefatsheng / ka a tsile mo bathong.","Ke ya teng le batlhalefi, / ke mo ntshetsa neo ya me, / e bong pelo e ratang / ene yo o nthatileng.","Ke akanya le Maria / yona kgakgamatso-kgolo: / Go bonetse mo nameng / Morwa yo o sa khutleng.","Ke a go tshola, Jesu wa me, / tla o age pelong ya me, / ke nne nao moletlong, / o nne le nna botshelong."]},
{n:72,t:"Dinako di a feta",c:"Difela tsa Ngwaga o Mošwa",v:["Dinako di a feta / tsa ngwaga o felang, / mme re a go rapela, / Mong yo ikanyegang. / O itse tsotlhe fela, / tse di neng di le teng, / go thaba le go lela / tsa ngwaga o ileng.","'Tlalelo tse tsa mono / di re bogisetsang? / Loso lwa motlha ono / lo re kgaoganyetsang / le bone ba ga rona / ba re ba ratileng? / Ba re tlogetse re le / sellong le maketeng.","Gakologelwang sona / se re se lebalang: / Lefatshe le la rona / ga se le tlhomameng. / Jesu o re batletse / legae 'godimong, / ka gonne o re swetse, / a re ntsha tatlhegong.","Mo botshelong jwa rona / go tse di ledisang. / Ka moo ba re leng mono / re ba ba eletsang / go ya 'gaeng la rona, / kwa Rara o leng teng, / go bona gape bone / ba ba re tlogetseng.","Ee, ke ntse ke gopotse / legae kwa Modimong. / Teng Jesu o phimotse / 'keledi mo matlhong / a bone ba ga etsho / ba ba tswang dipogong. / Teng ga go na letshogo, / go 'thabo mo Jesung.","Tshwanelo ya botshelo / jwa rona lefatsheng / ke go lebisa pelo / go yo o re swetseng. / Le fa e kete loso / ke lo lo boitshegang, / ga re boife sepe, / Jesu k' yo lo fentseng.","Morena, o re tiise, / fa re le mo tekong, / o b' o re tsamaise, / re tswelle thapelong. / Mme fa boitumelo / bo se yo mo pelong, / o tiise teng tumelo, / re fenye bofelong."]},
{n:73,t:"'Nyaga, 'kgwedi le dinako",c:"Difela tsa Ngwaga o Mošwa",v:["'Nyaga, 'kgwedi le dinako, / tsotlhe ke tse di fetang: / Di nyelela ka bonako, / ga go se se tlhomameng. / Dilo tsotlhe ke motlhala / o o nyelelang tseleng. / Tiro tsotlhe ke go jwala, / thobo e tla bofelong.","Borraetsho ba lelelwa / ke rona ba ba setseng. / Ee, le rona re latelwa / ke losika lo lo tlang. / Batho ba dipaka tsotlhe / ba tla fella mabitleng. / Mme Modimo wa baphedi / o ba tsosa diphupung.","Mme o Mmopi le wa rona, / yo o sa re lebaleng. / 'Foko la 'go le le gona, / ke le le tla re tsosang. / Phelo ke go ipaakanya, / re ntse re le mo tseleng, / go go tshola ka lethabo / ka letsatsi le o tlang.","Fa sebaka se fedisa / tsotlhe, kana go ka tweng? / Ga se ka ke sa go ama, / o le yo o sa khutleng. / Fa go ka tla ditlalelo, / ga ke tshoge mo moweng; / gonne o ntse o le Rara, / yo o sa mphetogeleng.","Le mo tlalelong o Rara, / o le yo o tshegofatsang; / le mo botshelong o Rara / fela jaaka mo losong. / Fa ke tletswe ke phetogo, / wena o yo o tlhomameng; / o tla ntshwara ka letsogo / la 'go le ikanyegang.","Lona 'nyaga tsa tlalelo / le tsa thabo, lo feteng! / Fa ke lela, ke itshwarella / ka yo o ikanyegang. / Fa tse tsotlhe di nyelela, / di ya gona bofelong, / mme Morena a ka nkgoga, / ke tla fitlha legaeng."]},
{n:74,t:"Hee! Dinyaga di a fela",c:"Difela tsa Ngwaga o Mošwa",v:["Hee! Dinyaga di a fela / ka bonako lefatsheng. / Le sebaka sea nyelela, / ga go se se tlhomameng. / Tsotlhe mono lefatsheng / ke tse di re itsiseng, / fa bophelo bo tla fela / ka bonakonako fela.","Jalo batho ba khutlile / ba le bantsi lefatsheng, / le ba ba ne ba phedile / le nna mono magaeng. / Nna ke sa le bophelong, / ee, ke teng mo phemelong / ya Modimo le Mothusi / yo mogolo, Morebusi.","Boikanyo le molemo / ga se tse di ntshwanetseng. / Ke diretswe ke Modimo / ka lorato lo tletseng. / Thata ya me lefatsheng / ruri ke e tlhaetseng; / pelo ga e na tlhomamo, / mme e tlhoka le tshiamo.","Mme ke rata go boela / kwa go Jesu yo o mpitsang. / Ke dumela go tlogela / tsotlhe tse o di itsang. / Tsona ke di dirileng / ke tse o di lefetseng. / Nthuse, Rara, ke sepele / ka boikanyo, ke dumele.","Fa o sa ntse o ntetlella / go nna teng mo lefatsheng, / le bokete o bo nthwesa, / a ko o nne le nna teng, / gore le mo ditekong / ke lemoge mo pelong, / matshwenyego le mathata / o di nthwesa, ka o nthata.","O letsatsi, ee, o thebe / bathong ba 'go diphatseng; / o re sekegele tsebe, / fa re le mo bothateng. / O re rute mo pelong / go itshoka ditekong / tsotlhe tsa bophelo jono, / re tle re go boke rotlhe.","Fa bophelo bo tla fela, / ke le mo pitlaganong, / foo ke tla tla, ke go neela / mowa wa ka diatleng. / Go tla nna monate jang, / go se se se ka ntshwenyang, / go le fela boitumelo / mo pusong ya kgalalelo."]},
{n:75,t:"Jaanong ka ngwaga o felang",c:"Difela tsa Ngwaga o Mošwa",v:["Jaanong ka ngwaga o felang / re baka Jesu yo o phelang. / Ke ene yo re tlametseng / ka metlha e e fetileng.","Morena yo o rategang, / Morwa Modimo yo o busang, / a ko o boloke tumelong / bakriste ba 'go phuthegong.","O nne le rona mo kerkeng, / o re kgothatse mo moweng, / o re femele thaelong, / re gole thata tumelong.","A ko o re tiise tumelong, / re name medi loratong. / A re se wele mo dibeng / ka ngwaga o o re tletseng.","A ko o re pate botshelong, / se re tlogele mo losong; / re tiise gona mo tseleng, / o re fitlhise legaeng.","Koo re tla baka lesomong / la baengele 'godimong, / re phela rotlhe leseding / la gago ka bosakhutleng."]},
{n:76,t:"Jesu, re tsena mo ngwageng",c:"Difela tsa Ngwaga o Mošwa",v:["Jesu, re tsena mo ngwageng / o mošwa o sa itsiweng. / O se re kobe, ba re tlang, / re se na se o se batlang.","Thibosa tlala lefatsheng, / re ka tla ra nna lehumeng. / Re fe lesego malapeng, / letlhogonolo masakeng,","Tsweletsa thuto mo kerkeng, / itshupe Disakramenteng. / Re bua Amen! Wena Mong, / o tla re utlwa thapelong."]},
{n:77,t:"Go tsena ngwaga lefatsheng",c:"Difela tsa Ngwaga o Mošwa",v:["Go tsena ngwaga lefatsheng, / wa pele o fetile. / Re itumela mo kerkeng, / ka gonne re phedile. / Re lelalela 'godimong, / re itumela Modimong. / Ke Rara, Morwa, Mowa.","Ke Rara yo o re fileng / Morwawe ka lorato. / Ke ene yo o tsenyeng nameng, / mo popegong ya batho. / Mme Mowa o re o tshotseng / o re itsise Beibeleng / ga tsotlhe tsa phologo.","Disakramente mo kerkeng / le thuto ya Lefoko, / le mmuso o o siameng, / phodiso ya matlhoko, / di re fe monongwaga, Rra, / mo sekolong le mo kerkeng / le malapeng a rona.","Re lebogela tsotlhe, Mong, / mme r' a re, o tswelele / go disa rotlhe lefatsheng / ka ngwaga ono otlhe. / Mme fa re tsena mo losong, / re ise kwa legodimong / ka Jesu Kriste. Amen!"]},
{n:78,t:"Jesu wa me, lefatsheng",c:"Difela tsa Ngwaga o Mošwa",v:["Jesu wa me, lefatsheng, / ee, ke wena yo o leng / boikhutso mo pelong / le kgomotso botlhokong.","Khumo e e lefatsheng / ke mabebe tumelong; / Jesu ke yo o phalang / khumo yotlhe botshelong.","Le fa go le dira teng, / di nkgatella leroleng, / Jesu yo o mphemelang / o tla senya ba nkilang.","Le fa ke le bolwetseng, / mme ke fela bokoeng, / Ngaka e e nkalafang / ke Morena yo o nthatang.","Le fa ke le lehumeng, / ke le yo o tlhokang 'fatsheng, / Jesu yo o nkgopolang / ke yo o mpabalelang.","Fa ba nkisa ditšhabeng, / kwa ke sa go tlwaelang, / Jesu ke yo o mpatang, / o mpha tse di batlegang.","Fa ba ntshotla mo thutong / le Modimo 'godimong, / Jesu yo o nkgomotsang / ke Morena yo o ntiisang.","Jesu yo ke mo ratang / ke Morena yo o phalang / le dinotshe mo dijong / tse di botshe mo 'ganong.","Ke ka moo ke dumelang / mo go ene yo o nthatang; / o gaisa lefatsheng / dilo tsotlhe tse di teng.","Ke ka moo ke mo dirang / wa ntlha ruri mo pelong; / ke yo ke mo phelelang, / ene Jesu yo o ntshwetseng.","Jesu ke yo o njesang, / Jesu ke yo o mphedisang, / Jesu ke yo o nthatileng, / Jesu ke yo o ntshwetseng.","Madi a o itshepileng / a 'gwe, a o tshologileng, / le matlhoko s'fapaanong / a nkgomotsa mo losong."]},
{n:79,t:"Tlaang re ye go rapela",c:"Difela tsa Ngwaga o Mošwa",v:["Tlaang re ye go rapela, / tlaang re ye go opella / Mmoloki wa bophelo, / yo o se nang bokhutlo.","Re ntse re ya kwa pele, / re kgabaganya 'nyaga; / tsa pele di fetile, / o mošwa o re tletse.","Re tshwenyegile thata, / ra batla go tlhoboga; / go dintwa le dikotsi, / di tletse ka lefatshe.","Modimo, Rra-bophelo / o a re babalela, / fa go le ditlalelo, / fa di re boifisa;","Ke jaaka bomma-bana / ba fara bone bana, / ba ba tlhobaelela, / fa go le magadima.","Mmoloki wa bophelo, / tsa rona di lefela, / fa wena o sa dise, / o sa re sireletse.","Re baka boikanyo / jwa gago jwa ka metlha: / dithuso tsa 'go tsotlhe, / yo o tlosang botlhoko.","Re go rapela gape, / Rraarona gore o nne / motswedi wa lethabo / mo gare ga dipogo.","Ke go tlhologeletswe, / ka o le pelonomi; / ba re ikutlwang jalo, / o re fe boiketlo.","Masetla-pelo otlhe / le dintwa le polao, / o di khutlise gotlhe, / go tlale boitumelo.","Re nee lesego la 'go / mo matshelong a rona; / o lebe ka lorato / ba bannye le bagolo.","Fa batho ba latlhega, / ba thuse o le Rraabo; / fa ba sa bone tsela, / o nne Mogakolodi.","Fa dijo le dikobo / di ba feletse gotlhe, / e le bahumanegi, / o ba tlamele gape.","Balwetse o ba thuse; / ba ba tshwenyegang thata, / ba solofologile, / o ba thabise pelo.","Re lopa la bofelo, / o re fe Mowa wa 'go, / o o fetang tse tsotlhe, / o tle o re laole.","Re nee tse tsotlhe tseo, / re bone tlhe botshelo; / di nee bakriste botlhe / ngwageng o mošwa ono."]},
{n:80,t:"Kea go phelela",c:"Difela tsa Ngwaga o Mošwa",v:["Kea go phelela, / ke a go swela, / Jesu ke wa 'go / 'phelong le mo losong.","Re tlhomogele, / re itshwarele, / re ise, Jesu, / go wena godimong.","O mphalodise, / mme o mphitlhise / ka tuduetso / kwa go Rraetsho."]},
{n:81,t:"Naledi e e phatsimang",c:"Difela tsa Ponatshego",v:["Naledi e e phatsimang / ya moso e fitlhile. / Ke Jesu yo galalelang, / lefifi le nyeletse. / Mme o phatsima mo kerkeng, / 'Fokong le mo Sakramenteng; / ke 'sedi le legolo.","Boraraetsho ba e neng / e le baheiten pele, / e n' e le ba ba sa itseng / Modimo wa mannete; / e n' e le ba ba timetseng, / ba phela fela mo dibeng, / mme ba swa fela jalo.","A go lebogwe phuthegong / Modimo wa lesedi, / ka rona re le kopanong / ya bone badumedi. / Fa re ne re sa tsena teng, / go kabo go re thusa eng / go phela 'fatsheng leno?","Mme ka re le mo tumelong, / re bana ba Modimo, / ba boswa mo tsholofelong / ya dilo tsa 'godimo; / gobane yo o dumelang / go Jesu yo o mo ratang, / ga a ka ke a nyelela.","Mme bone ba ba ikanyang / lefatshe le mamone, / le bone ba ba ineelang / boleo, ba sa bone, / ba tla nyelela poitshegong! / Morena, ba ntshe boikepong, / ba ikwatlhae ruri!","Ga go na thuso leineng / la gago la mokriste, / fa o sa phela mo dibeng, / o nyatsa Jesu Kriste. / Mokriste yo o dumelang, / yo o itshupang mo ditirong, / o tla tlotlega ruri.","Mponise, Jesu, mo moweng / ka 'sedi la Lefoko. / A ke sepele mo tseleng / ya gago ya phologo. / Mme fa ke tsena mo losong, / ke tla ya nao 'godimong, / ke tshwana le letsatsi."]},
{n:82,t:"Jesu yo o phatsimang",c:"Difela tsa Ponatshego",v:["Jesu yo o phatsimang / wa losika lwa Jakobe, / ke tla go direla kang / moletlong o montle ono? / Tse ke di go supelang / o di ngoke loratong.","Tshola gouta seatleng, / yona ke tumelo ya me, / e o e mphileng 'Fokong / le ka 'Sakramente tsa 'go. / Fa e lekwa pogisong, / e nne e e tlhomameng.","Le dibano o di tsee, / e bong ona morapelo, / o ke o tsisang jaanong / ka molomo le ka pelo. / Utlwa yo o rapelang, / yo o go obamelang!","Tshola mera e e babang, / e e rayang boikwatlhao; / dibe tse di mpolayang / ke ikwatlhaela tsona, / ke ntse ke le yo o kopang: / Tshola tse ke di tsisang!"]},
{n:83,t:"Dumela, 'somo le le tswang",c:"Difela tsa Ponatshego",v:["Dumela, 'somo le le tswang / teng kwa botlhabatsatsi! / Matlhale ba lo latelang / Motlhogonolofatsi, / e bong yo re mo tsaletsweng / kwa Betleheme motsaneng, / lo tsile lwa dumela / se Balam o se buileng / le Daniele Beibeleng, / mme jalo lwa sepela.","Mme wena motho ditšhabeng, / ba etse ka tlhoafalo. / Itlhaganele, mmatle teng / 'Fokong le le boitshepo! / Ke gona fa o mmonang teng, / le fa le rerwa kae le kae. / Mo ntshetse pelo ya 'go. / O tla go ruta sekolong, / a go lokisa phuthegong / ka 'Foko la bophelo.","Kwa Arabia ga tswa teng / le kgosi ya sesadi, / mme ya etela Bajuteng / go bona Salomone, / yo tumileng mo botlhaleng. / Mme fa, go Jesu yo o leng / botlhale go mo feta! / Ka moo he a re mo senkeng, / lesea Jesu yo o tsileng, / ke Salomon wa nnete!","Mo senke jaana kwa o teng, / o setse batlhalefi; / se boife sepe lefatsheng, / le 'seng ba ba bogale. / E rile ba tla mo motseng, / ba botsa ba re: \"O fa kae / yo o tsetsweng, Morena?\" / Mme ka ba utlwa, ba ya teng / kwa Betleheme setaleng, / ba mmona, fa ba tsena.","Tlaang, lona ba lo dumelang! / Tlaang, a re yeng go ene, / go ene yo o re ratang, / ke Jesu Krist', Morena. / Ke ene yo o re thusang, / ke yo o tla re femelang / metlheng ya ditlalelo. / Ke ene yo re reileng: / Ke naya bone ba ba mpatlang / serwalo sa bophelo."]},
{n:84,t:"Sedifala, 'fatshe lotlhe",c:"Difela tsa Ponatshego",v:["Sedifala, 'fatshe lotlhe, / tsena tlhe mo leseding! / Gonne Jesu Krist' o tsile / jaaka 'tsatsi le tlhabang. / Ba ba ntseng fa go lefifi / ga baa latlhwa ke Modimo.","Re ne re foufaditswe / malatsing a fetileng. / Rotlhe re ne re tlogetse / o o kwa legodimong. / Kana re ne re eletsa / tsa lefatshe leno fela.","O ne o re fitlhegetse / o re solofeditseng / go romela Mogolodi, / yo o tla re gololang. / Re ne re se na bophelo, / le lesedi re le tlhoka.","Mme lesedi le tlhabile, / fa a fitlha lefatsheng: / Jesu a tla go re thusa, / go re isa leseding. / A khutlisa tsa lefifi / le poifo le botlhoko.","Jesu, 'sedi la dipelo, / re ntshe rotlhe lefifing; / kana re ntse re timela, / go se 'sedi mo pelong. / Jesu, a lorato lwa 'go / lo nne lo re phatsimele!","Jesu, nna le rona mono / motshegare, bosigong; / o leleke tsa lefifi, / tsone tse di re tshosang. / A lefifi le maleo / di se ka tsa re laola!","A lesedi la bophelo / le le tswang boitshwarelong, / a le re itumedise / re le ka mo madibeng; / lone le re sireletse, / re se fenngwe ke thaelo!","Jesu, o re nee nonofo, / o re tiise mo pelong: / A tumelo e itshupe / ka ditiro loratong; / kwa godimo re phatsime / go gaisa dinaledi."]},
