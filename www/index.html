 ee, ba tla tswa mo 'ntlheng tsotlhe / go dumela Moreneng, / go mo tlotla, go mo tlotla, / yo o ba rekolotseng.","Kgosi Jesu o tla fenya / ka Lefoko lefatsheng; / mme e bile o tla senya / 'tšhaba tse di mo ganneng: / Mo 'ntlheng tsotlhe, mo 'ntlheng tsotlhe / Jesu o tla busa teng.","Jesu, roma 'kala tsa 'go / kwa go ba ba timetseng, / gore Efangele ya 'go / e tsamae lefatsheng, / go bonisa, go bonisa / bone ba ba mo dibeng."]},{"n":260,"t":"Pholoso ya lefatshe","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K242","v":["Pholoso ya lefatshe / o e dirile, Mong; / wa nna Morekolodi / wa ba ba maleong. / O butse legodimo / ka phenyo s'fapaanong; / re opeIela wena / Haleluya pakong.","O filwe 'thata tsotlhe / 'fatsheng le 'godimong / go fitlha dira tsa 'go / di weIe dinaong; / ba bantsi ba ditšhaba / tse di tikologong / e nne ditsala tsa 'go, / ba tsene modirong.","Ba sa ntse ba bidiwa; / barongwa ba ya teng / go tlatsa ntlo ya 'go / ba o ba golotseng. / Se tshabeng tshenyegelo! / Lo se lapeng tseleng! / Mme latlhelang molelo / wa Mowa merafeng.","Ee, phutha matsomane / a gago mo bathong / ba 'tšhaba tsa lefatshe, / ba ye Selalelong. / O ba bulele kgoro, / ba tle ba tsene teng; / mme sedifatsa bone / ba ba sa leng 'fifing."]},{"n":261,"t":"Ao Jesu, 'sedi lefatsheng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K243","v":["Ao Jesu, 'sedi lefatsheng, / bonisa ba ' sa go itseng; / mme o ba tsise phuthegong, / gore ba tsene phologong.","O ba bonise dipelong, / ba ' sepelang mo timelong; / le bone ba ba bofilweng / ke dilo tse di sephiring.","Mme botlhe ba ba tenegong, / ba tlhabolose dipelong, / o ba godise mo meweng, / o ba busetse 'tsomaneng.","Utlwisa ba ba sa utlweng, / buisa ba ba sa bueng, / nonotsha ba ba boifang, / ba ipolele mo bathong.","Fatlholla ba ba fatlhilweng / ke dilo tsa lefatshe le, / o phuthe ba ba faletseng, / o ba busetse phuthegong.","Re tla nna nabo phuthegong, / le gona kwa legodimong; / re baka ka bosakhutleng / wena yo ' re pholositseng."]},{"n":262,"t":"A re tsogeng mo phuthegong","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K244","v":["A re tsogeng mo phuthegong, / a re utlweng mo moletlong / ditiro tsa Modimo, / o ' rometseng / mono 'fatsheng / Morwawe Jesu Kriste.","Jesu ga se yo o tletseng / Bajuta fela lefatsheng; / o tletse 'tšhaba tsotlhe. / Ba ba utlwang, / ba ' dumelang, / o ba pholosa botlhe.","Mme ba ntlha ba ba dumetseng / ke batlhalefi ba ' tsileng / go batla Krist' Morena. / Ba mmonye teng / Betlehemeng, / mme ba mo obamela.","Mme ba lo tswang baheitaneng, / tlaang moletlong, itumeleng, / lo mmake, lo leboge. / Itigeleng / mo mangweleng, / lo obamele ene.","Ao, Jesu, yo ' re ratileng, / re phatsimele lefatsheng / ka sefatlhego sa ' go. / Mo bophelong / le mo losong / re nne 'seding la gago.","Lesedi le tla lefatsheng, / Jesu o fitlha ditšhabeng / ka thero ya Lefoko. / Yo ' le utlwang / mo tumelong / o tla nna le phologo.","Legodimong, kgalalelong / ke kwa re tla go bonang teng, / Mong, o le kgalalelo. / Re tla nna teng / kwa legaeng, / lefifi le fedile."]},{"n":263,"t":"Barongwi ba kagiso","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K245","v":["Barongwi ba kagiso / ba ile mafatsheng. / Ditiro le matsapa / tsa bone merafeng / di tla tshegofadiwa / ke yo ' ba romileng. / Mme foo go tla thabiwa / le kwa baheitaneng.","Bitsang lo bueng thata / le batho mo therong. / Lesedi le tla fenya / lefifi dipelong. / Lefoko le ' boitshepo / ke le le imelang / ba ba ratang lefifi, / ba ba ikepileng.","Go ka tla batlhaedi / go tlhapa mo mading / a ' Jesu, Moreswedi, / a yo ' re ntshang 'fifing. / Isang tlhe Efangele / bathong le merafeng, / gore ba bone Jesu / yo o gollang dibeng.","Ka thero lo tla kgona / ba ba fapogileng; / le bone bajabatho / ba fenngwa dipelong. / Bonang, ba tla latlhela / medimo mo mollong; / mme ba tla obamela / Morena tumelong.","Ba lo leng ba Morena, / tlang lo mo lateleng! / Lo be lo bege Jesu / mo go ba ' mo tlhokang. / Lo baakanyeng ditsela / tsa gagwe mo bathong. / Fa ba mo amogela, / ba tla nna phologong.","Go tla nna baopedi / ba phenyo e ' tsenyeng / matlong a badumedi / le kwa baheitaneng. /Tlhabano, fa e khutla, / re tla nna kagisong; / o tla bo a re file / botshelo 'godimong."]},{"n":264,"t":"Ka pelenyana lefifi 'fatsheng le tla fela.","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K246","v":["Ka pelenyana lefifi 'fatsheng le tla fela. / Lefatshe lotlhe le tla nna mo leseding fela. / Mo bofelong / 'Foko la ' Jesu 'Kwalong / batho ba tla le dumela.","Ka pelenyana Satane o tla bo a fentswe. / Puso le thata tsa gagwe di tla bo di sentswe. / Mme mo 'fatsheng / puso ya ' Jesu 'tšhabeng / tsotlhe e tla bo e tsentswe.","Gape le gona badiri ba bantsi ba tla ya, / ba tla rerela ditšhaba 'khutlong tsa lefatshe. / Gotlhe 'fatsheng / ba tla ineela Kristeng / go nna ba gagwe ka nnete.","Jesu, a ko ' tle ka pele, o re bofolole, / o re tsholele go wena, o se re tlhoboge. / Mo tlhabanong / e e tla tlang bofelong, / Morena, o re fenyise.","Ka pelenyana tse tsotlhe di tla diragala. / Tsotlhe tse o di buileng Lefokong di tlhomame. / Mo bofelong, / fa o bonala marung, / re tla ya re go kgatlhantsha."]},{"n":265,"t":"Re ba ' Jesu Krist' Morena","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K247","v":["Re ba ' Jesu Krist' Morena, / re ba ba golotsweng ke ene / ka loso mo sefapaanong. / Re ba gagwe ka dipelo / le ka mebele le ditiro / mo tumelong go ya losong. / Re go rapela, Mong, / boloka tumelong / batho ba 'go; / mo mafulong / a ' Lefokong / o re gogele 'godimong.","Jesu, Mong wa thobo - kgolo, / oketsa palo ya badiri, / ka e se e e lekanyeng. / Roma rona batho ba 'go, / le rona re ye go laletsa / baheiten go tla phuthegong. / Go tshegofala jang / mokriste yo ' ratang / tiro eo, / e ' supetsang / ba ' senyegang / Mothusi yo ' ba pholosang!","Jesu, leba he bontsintsi, / jo bo ntseng ka dinyaga ' dintsi / mo lefifing le mo dibeng. / Kana ga ba utlwa pitso, / ka ba tlhokile Efangele, / lesedi la ' go Beibeleng. / Ba phatsimele, Mong, / o ba ntshe mo bontshong. / A baheiten / ba tle 'sakeng, / e bong kerkeng / go phela ka bosakhutleng."]},{"n":266,"t":"Morena wa lorato","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K248","v":["Morena wa lorato, / o dule 'godimong / go rekolola batho / ba ba mo maleong; / mme ba go kokotetse / ka tshotlo s'fapaanong, / mme batho le Modimo / o ba ruantse teng.","O tsile go busetsa / ba botlhe Modimong / le go ba baakanyetsa / Selallo 'godimong; / ba borwa le bokone / le ba ' bophirimeng / le ba ba kwa botlhaba / ba bilediwa teng.","O ba apesa kobo / e e itshekileng; / ka yona o ba nnisa / teng koo fa tafoleng. / Ba ba neng ba sa itse / pholoso ya 'go, Mong, / jaanong ba go tsisetsa / dipako tebogong.","Ga go na boikhutso / go fitlha sebakeng / sa phenyo ya lorato / Iwa gago ditšhabeng; / go fitlha o lebantshe / ba ba pholositsweng / le ene Mong wa bone, / yo o ba bopileng.","Ee, budulela bone / ba ba swetseng dibeng / ka Mowa wa bophelo, / ba tsoge maleong; / ba khutle go direla / Satane yo ' senyang; / mme ba nne ba 'go ruri / ba ba go phelelang.","Rea bitsa, o re utlwe, / re ba ba dumelang. / Lefoko a le supe / thata e ' kgaolang / dikgole tsa baheiten / ba ba mo kgolegong; / o nne lesedi tota / la bone bosigong."]},{"n":267,"t":"A Sion e agiwe","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K249","v":["A Sion e agiwe, / phuthego ya ga Jesu / e ate lefatsheng! / A re e ageng pila, / maleo re a ile. / A batho botlhe ba tle teng.","Bonang tlhe baditšhaba / ba ba sentsweng ke mmaba / ba latlhegile jang! / Ba tlhoka boitumelo, / ga ba na boitshwarelo / jwa dibe tse di ba senyang.","Ba utlweleng botlhoko, / ba thuseng ka Lefoko / la ' Jesu Kriste Mong; / lo tukiseng dipelo, / lo ntsheng le dikabelo, / gore ba ntshiwe tatlhegong.","Ao batho ba Morena, / ba lo phelang ka ene, / ba lo leng mo kerkeng, / a lo ka leba fela; / fa batho ba timela / le go latlhelwa moleteng?","A Sion e agiwe, / merafe e phuthege, / a e tle phologong. / A re thuseng tlhe rotlhe / ka ditsarona tsotlhe / go aga Kerke mo bathong!"]},{"n":268,"t":"Emang tlhe ka bopelokgale","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K250","v":["Emang tlhe ka bopelokgale, / mme nnang badisa teng mo dithakong; / lo rere Efangelethata, / lo sa boife sepe tumelong; / lo tlhabe tlhe mokgosi ditšhabeng / tse tsotlhe tse di mono lefatsheng.","Tukisa mollo wa tumelo / mo dipelong tsa batho, Jesu Mong. / O rome tlhe thobong ya gago / badiri ' bantsi ba ' ikanyegang; / ka gonne ke ba ba tlhokafalang. / Thobo e kgolo, e tla fela jang?","Romela tlhe Lefoko la 'go / ka bontsi jwa baruti ditšhabeng; / itlhaganele go re thusa, / leleka Satan gotlhe mo bathong. / Namisa puso ya 'go merafeng, / go bakwe leina la 'go lefatsheng.","Morena, thusa batho botlhe, / golola baditšhaba kgolegong! / Bonisa le difofu tsotlhe / ka Mowa wa 'go o ' sedifatsang. / Fokisa Mowa wa 'go lefatsheng, / o tlhabolose batho ditšhabeng.","A 'Foko la 'go le siane, / go se nne felo fa le sa fitlheng; / ba bantsi ba le utlwe sentle, / fa e le lone le le phedisang; / Baisrael ba tsose borokong, / le bone ba dumele mo Jesung.","Morena, utlwa dithapelo / tsa rona ba re leng mo phuthegong. / Gopola batimedi botlhe, / mme o re tlhomamise tumelong; / mme re nne ba 'go go ya kwa losong, / re rue boswa ka bosakhutleng."]},{"n":269,"t":"Tlaang, batho, tlaang ka pele","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K251","v":["Tlaang, batho, tlaang ka pele, / tsenang mo phologong! / Lo nyatse tsa lefifi, / lo phele tumelong! / Latlhang medimo yotlhe / e sele lefatsheng, / lo ineeleng tlhe gotlhe / Modimo o ' phelang.","Jehofa o a phela, / ke ene yo ' sa sweng! / Medimo e tla fela, / ke e e sa itseng / go bona le go utlwa, / ga e thuse tlalelong / Jehofa o tlhomame, / ke yo o e tlosang.","Ditshwantsho tsa medimo / tse lo di dirileng, / le fa e le mereo, / ga se tse di thusang; / yo o thusang ke ene / yo o re pholosang; / ke Jesu Krist' Morena; / mmatleng lo dumeleng!","Ka moo re ikanya ene / yo o re gololang; / ene Morwa Modimo / yo ' re itshwarelang. / Jesu o re ratile / go fitlha mo losong; / o re goIotse jalo / le ka bosakhutleng.","Ka moo re itumella / mokgosi mo therong, / ka o re bontsha tsela / e ' yang legodimong. / Lefoko la bophelo / ke le le re thusang. / Fa rona re dumela, / re fitlha bophelong.","Modimo wa thuanyo, / re utlwe ba re reng: / Romela tlhe Lefoko / go ba ba sa itseng. / Merafe e megolo / e e sa robetseng, / e e tlhokang kgololo; /a e tswe mo losong!","O ipatlele batho / ba ba yang ditšhabeng, / ba ba tletseng lorato / go ba ba timetseng. / Mme o ba tlhomamise / ka gale mo tirong. / A Mowa o ba tiise / le mo dipogisong."]},{"n":270,"t":"O tla tla leng, Morena Jesu Kriste","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"K252","v":["O tla tla leng, Morena Jesu Kriste, / go itshupetsa 'tšhaba sa Bajuta, / go ba sirolla kobo ya ga Moše, / ba tle ba bone?","Modimo o ikanetse Abrahame / wa re: Losika Iwa 'go ga lo fele; / gape: Lefatshe le tshegofadiwa / ka ntlha ya gago.","O boikanyo, o a dirafatsa: / Ba setse ba boetse kwa Kanana; / yo ba mo tlhabileng ba tla mo leba, / ba mo lelela.","Madi a gago a a wetseng bone, / a a ba fetogele tshegofatso! / Kana o rapeletse baba ba 'go, / o ba pholose."]},{"n":271,"t":"Le fa e le mang yo o dumelang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"H90","v":["Le fa e le mang yo o dumelang, / a a ise kwa le kwa mo lefatsheng. / 'Foko la Morena le le Beibeleng, / gore go tle yo 'ratang. Chorus: Yo o dumelang, yo mo phuthegong, / a kaele batho ba ba mo bontshong, / a re: Go teng Rara, yo o lo ratang, / oa lo bitsa a re: tlaang!","Yo ' batlang a e se yo ' diegang. / Kgoro e atlhame, e e yang 'seding, / kgoro e ke Jesu, yo o laletsang; / tsenang lotlhe, tlaang jaanong. Chorus: Yo o dumelang, ...","Tlaang go nna ba botlhe ba ' lapileng. / Yo ' ratang a ka tla, o ikanye se! / Yo ' ratang a ka tla, yo o dumelang. / A ka tsena 'godimong! Chorus: Yo o dumelang, ..."]},{"n":272,"t":"Rerang lesedi ka mo lefifing","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"H92","v":["Rerang lesedi ka mo lefifing, / ba reng ba ba tla swang ka ba ntse dibeng, / isang Lefoko go ba ' senyegang, / a go se nne ope yo ' ba lebalang! Chorus: Rerang lesedi, rerang lesedi. / Bantsi ba sa le ' fifing; / rerang lesedi, rerang lesedi, / bantsi ba swela dibeng.","Rerang ba boe mo bateneging, / baetsho ba teng, ba ba ikepileng, / ba ineetse Satan, ba phela nameng. / Ba saleng morago, ba tlhaboloseng. Chorus: Rerang ba boe, rerang ba boe / go ba ba tenegileng; / Rerang ba boe, rerang ba boe, / mme lo ba tlhaboloseng.","Rerang pholoso e e mo Jesung, / go botlhe 'fatsheng ba ba mo timelong. / Ga go ntshe sepe dibeng le losong / fa e se tumelo e e mo Jesung. Chorus: Rerang pholoso, rerang pholoso, / batho ba mo timelong. / Rerang pholoso, rerang pholoso! / Pholoso e mo Jesung."]},{"n":273,"t":"Tlaang go Morena, se diegeng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Thero ya Thomo","k":"H100","v":["Tlaang go Morena, se diegeng, / lo bona tsela mo Beibeleng. / Jesu ke yo lo ntshang mo dibeng / oa bitsa, a re: Tlaang! Ba botlhe: Mme go tla nna jang legodimong, / re sa tlhole re le maleong, / mme re le gona kgalalelong / le boitumelong.","Tsisang le bana, ka a re: Tlaang! / Ba ke ba gagwe ba ba ratwang; / Jesu ga se yo ' ka ba ganang, / o a ba raya: Tlaang! Ba botlhe: Mme go tla nna jang legodimong, ...","O bitsa botlhe: Tlaang pholosong. / Se diegeng, tsenang tumelong! / Lo ise lo swe, lo sa le teng. / Tlaang, lo mo lateleng! Ba botlhe: Mme go tla nna jang legodimong, ... jwa Dibe"]},{"n":274,"t":"Morena, o nthatile jang!","c":"Difela tsa Bophelo ka Tumelo: Ka ga Boitshwarelo jwa Dibe","k":"K255","v":["Morena, o nthatile jang! / O yo o nkgolotseng / ka madi a 'go a a nntshang / dibeng le moleteng.","Ke madi a a nkgomotsang, / fa ke le botlhokong / jwa dibe tse di nkimelang, / a ntsenya lethabong.","A ntiisa thata mo pelong, / motlhang ke nyemileng; / ke ona a a nkhumisang, / fa ke le lehumeng.","Ke madi a a nkemisang, / motlhang o ke weleng, / ke se nne yo o latlhegang, / mme ke tswe maleong."]},{"n":275,"t":"Jesu oa re lapolosa","c":"Difela tsa Bophelo ka Tumelo: Ka ga Boitshwarelo jwa Dibe","k":"K256","v":["Jesu oa re lapolosa, / rotlhe ba re lapileng; / Jesu oa re imolola / ba re imelwang dibeng.","Lefatsheng ga re na felo / fa re ka gomodiwang; / gape ga go botshabelo / kwa re ka tshabelang teng:","Jesu a le nosi fela / ke yo ' re falodisang; / Jesu oa re itshwarela, / ke yo o re gomotsang.","Dibe tsotlhe oa di tlosa; / o re swetse s'fapaanong. / Mo losong o tla re tsosa / go re isa 'godimong.","O dirile thekololo / ka go swela Golgoteng. / Jaanong re na le kgololo, / rona ba re ineetseng. Bokeresete"]},{"n":276,"t":"Modimo, se o se batlang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K258","v":["Modimo, se o se batlang / 'Fokong le mo therong, / a ke nne yo o se ratang / pelong le mo tirong.","Le sona se o se ganang / mo go nna botshelong, / a e nne se se ilegang / pelong le mo matlhong.","Ditiro tse ke di dirang, / a di tswe mo Kristeng; / a a nkgogele mo tseleng, / e a e ntaelang.","Ke gona ke tla direlang / Jesu mo ditirong; / ke gona ke tla mo etsang, / ke sa le tshepelong."]},{"n":277,"t":"Go batho teng ba ba batlang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K259","v":["Go batho teng ba ba batlang / dikhumo fela lefatsheng; / mme bone ba ba dumelang / ba huma ba le Modimong.","Baikepi ba ba sa boneng / ba batla tse di senyegang; / mme bone ba ba tlhaotsweng / ba batla tse di tlhomameng.","Go bangwe ba ba ikanyang / mereo e e sa thuseng; / ba bangwe ke ba ' ikanyang / mafoko a ' tswang Modimong.","Go bangwe ba ba direlang / badimo ba ba palelwang; / ba bangwe ke ba ba utlwang / Modimo o o sa pallweng.","Go boitumelo lefatsheng / jo bo fellang mo tatlhegong; / jo bongwe jo bo tswang Jesung / bo tswella teng legodimong.","A re tswelleng mo tumelong, / ka re sa eta lefatsheng; / mme fa re tsena mo losong, / re tla goroga Moreneng."]},{"n":278,"t":"Lona ba lo mo Kristeng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K260","v":["Lona ba lo mo Kristeng, / ka lo sa le tshepelong, / opelang, mo lebogeng, / tswelelang mo bonneteng.","Lona ba lo tswang 'fifing, / fetelang kwa leseding; / mme lo etse bophelong / baitshepi 'godimong.","Ba ne ba le lefatsheng / ditekong le mathateng; / Jesu yo o pholosang / o ba ntshitse tatlhegong.","Tswelelang, se diegeng, / rapelang, se boifeng! / Lo tla fitlha 'godimong, / lona ba lo mo Kristeng."]},{"n":279,"t":"Go tshegofaditswe monna","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K261","v":["Go tshegofaditswe monna, / ene yo ' sa tsamayeng / ka fa kgakollong ya bone / ba ba ikgatlhang dibeng. / Ee, go tshegofala jang, / ene yo o fapogang / tsela e ya baitlotli / le sedulo sa basotli.","Ee, go tshegofala ene, / yo o nnang mo molaong / wa Modimo, Moretlhodi, / a mo utlwa bophelong. / O tla gola tumelong / jaaka 'tlhare moIapong. / Se tla bonwa se ungwile, / fa sebaka se fitlhile.","Mme ba Mikepi ba tlosiwa / jaaka moko mo phefong; / gonne bone ba ineela / maleong le boikepong. / Ga se ba ' atlholelwang / ke Modimo mo tshekong; / ga se ba phuthego tota, / ba tla ntshiwa mo go yona.","Mme Morena o tla goga / basiami mo tseleng; / mme ka nnete o tlhoboga / bone ba ba mo dibeng. / Ba bosula mo pelong, / ba bosula mo tirong, / bone bao ba tla senyega, / basiami ba tla phela."]},{"n":280,"t":"Ke fano, Jesu, yo ' mpitsang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K262","v":["Ke fano, Jesu, yo ' mpitsang, / ke tla go wena yo ' nthatang, / ke tsisa pelo e e leng / ya gago, wena yo ' ntshwetseng.","Ke diegile thata jang / go utlwa lentswe le ' mpitsang! / O itshokile yo ' nkitseng, / ga oa nkatlhola mo dibeng.","Morena, ke mo selelong, / ke itatlhela dinaong / tsa gago, Jesu, yo ' ntshwetseng, / se mpetse nna yo ke ganneng.","Ke wetse gotlhe bokoeng / jaaka Petrus mo lewatleng; / o nne seatla se se nang / le thata, se se nkinolang.","O ne o mpitsa gantsi jang, / jaanong ke nna ' ke go bitsang! / O nthuse yo ke paletsweng, / mme o nkgorose legaeng.","Fa e le wena yo ' ntiisang, / ke tla nna yo o thata jang, / go go latela botshelong, / ditlalelong le mo losong."]},{"n":281,"t":"Lona ba lo golotsweng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K263","v":["Lona ba lo golotsweng / ke Morena mo dibeng, / se pheleng mo lefifing, / lo sepele leseding.","Opelang mo tshepelong, / lo boetse bophelong. / Kgosi e e lo busang / ke Morena yo ' fentseng.","Tswelelang mo dikgatong / tsa Mofenyi tlhabanong; / lo se lape mo tseleng, / lo itshoke mathateng.","Jesu yo ' lo supetsang / ka fa lo ka falolang, / lo mo etse ditirong / go tla lo ya 'godimong."]},{"n":282,"t":"Tlaang, bana ba Modimo","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K264","v":["Tlaang, bana ba Modimo, / tlaang a re sepeleng! / Tlhamallang lo lebile / teng kwa bosakhutleng. / Tlaang a re tiisanyeng; / lefatshe le bosula, / mme rotlhe rea raelwa, / lo nneng fa Moreneng.","Mme tsela e tshesane / e re e tsamayang. / Morena o boikanyo / yo o re biditseng. / A re mo lateleng! / Go iwa motseng ole, / Jerusalem o mošwa, / o o galalelang.","Keletso le kgatlhego / tse di lo raelang, / a di bolawe tsotlhe / ke ba ba sepelang. / Tse di lo timetsang / lo di latlheleng ruri; / baeti ba Morena / ke ba ba di ilang.","Yo ' ikanyang Morena, / a le mo tshepelong, / o ka se ke a phutha / mahumo a ' diang. / Ke yo ' itumellang / tlamelo ya bophelo / e e tlosang tlalelo, / ke mo go lekanyeng.","Ka thato ya Modimo / re phela lefatsheng, / re le baeng, baeti / ba ba yang legaeng. / Yo o itshokelang / dipogo le ditshotlo / ka bopelotelele, / o tla goroga teng.","Re baka ene Rara, / ke yo o tsamayang / le rona go re tiisa, / re se nne ba ba wang. / Ke ene yo ' re fang / kgomotso, fa re lela, / kagiso le ipelo, / fa re le poifong.","Tlaang, bana ba Modimo / a re tshwaraganeng, / re itumelelane / re le mo sekakeng! / Tse di lo kgaogantseng, / di tloseng ka bonako; / bonang, le baengele / ke ba ba re patang.","Mme fa go ka wa mongwe / wa rona mo tseleng, / a a tsosiwe gape / ke yo o tiileng. / A re tlhokomeleng: / re nne boikokobetso / le go nna boitsheko, / ka fa go tshwanetseng.","Ka moo re tla tsamaya / le Jesu mo tseleng, / re itatola tsotlhe / tse a di tlhoileng: / Go phela lefatsheng / ga go a re lekana, / re itshenketse go ya / kwa re tla mmonang teng."]},{"n":283,"t":"A re tsamaeng le Jesu","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K265","v":["A re tsamaeng le Jesu, / tlaang a re mo lateleng! / O re eteletse pele / go gologa lefatsheng. / A re lelaleng godimo, / re ntse re le lefatsheng, / re dumele mo peIong; / mme re dire tsa lorato. / Nna le rona, Jesu Mong, / re gogele 'godimong!","A sekao sa ga Jesu / se re goge dipogong; / boitshoko bo latelwa / ke lethabo Modimong. / Ba ' jwalang ka dikeledi / ba tla roba ipelong; / go botlhofo Modimong / go fetola 'tsatsi pula. / Fa re boga nao, Mong, / re nna nao 'godimong.","A re sweng le ene Jesu / loso Iwa 'gwe s'fapaanong; / lone lo kganela loso / Iwa go wela moleteng. / A re sweng mo ntlheng ya dibe, / re bolae bophelong / dikeletso mo nameng, / re simolle go ntšhwafala. / A re swele wena, Mong, / re ye nao bophelong.","Ee, a re pheleng le Jesu, / ka a dule mo losong! / Re tla tsoga re le bašwa, / re tswa tota mo losong. / Jesu, re 'tokollo tsa 'go; / mme fa re nna nao 'fatsheng, / re nna nao mo bontleng, / teng mo pusong ya ga Rrago. / Re a go phelela, Mong, / mono le kwa 'godimong."]},{"n":284,"t":"Modimo o ' phelang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K266","v":["Modimo o ' phelang, / Motswedi wa dineo, / o botlhe o ba fang, / le bone ba boleo; / a ko ' mphe lefatsheng / mmele o ' fodileng / le pelo mo mmeleng / e e mo kagisong.","O nthuse mo tirong, / ke tlhoafale thata; / tse o di ntaetseng, / a ke nne ke di rate, / ke dire mo nakong / e e di lebanyeng; / mme tse ke di dirang, / a di nne lesegong.","A go tswe molomong / polelo ya tlhomamo; / a ke nne yo ' buang / mafoko a bonnete. / Mme a ke a buang / a e nne a ' thusang, / a ' itumedisang, / a a se nang ditlhong.","O nthuse tlalelong; / e se nnyemise moko; / o nne yo o ntiisang, / ntshodisa sefapaano. / Fa go le yo ' ntlhoang, / ke fenye loratong; / fa ke le pelaelong, / o nne yo ' nkgakollang.","A ke nne kagisong / le bone batho botlhe; / ka fa go utlwanang / le ditaolo tsa 'go. / Mme mono bophelong / a ke itshoke teng; / le gona mo losong / ke swele mo Kristeng.","Mme fa o tla tshekong / ka 'tsatsi la bofelo, / go tsosa mo losong / baswi ka kgalalelo, / o ntsose mo phupung / ka mmele o ' sa sweng, / o nkise phuthegong / ya ba ba tlhaotsweng."]},{"n":285,"t":"Itumele Moreneng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K268","v":["Itumele Moreneng, / yo o go nayang bophelo. / Ke naledi mo tseleng, / o bonesa le dipelo. / Jesu ke yo o nayang / pelo se e se tlhokang.","O tlogele lefatsheng / ditlhapelo, di a Ilisa. / Itshwarelle mo Kristeng, / o go naya boitumelo, / ka e le yo o nayang / pelo se e se tlhokang.","Yo ' ratang Jesu pelong, / o tla rata 'Foko la 'gwe; / o tla supa ditirong, / fa a utlwa 'taolo tsa 'gwe. / O phelela yo ' nayang / pelo se e se tlhokang.","Le fa o le dipogong, / o itshoke ka tumelo; / gonne kwa legodimong / o tla fiwa boitumelo. / O tla bona yo ' nayang / pelo se e se tlhokang."]},{"n":286,"t":"Nna ke rata Jesu fela","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K270","v":["Nna ke rata Jesu fela, / ene yo ' nthekolotseng! / Satan ke a mo tlogela, / ke yo o ntsieditseng. / O itshema yo ' nthatang, / e le yo o ntlhoileng. / Nna ke rata Jesu fela; / ke ithuta go dumela.","Nna ke rata Jesu fela, / batho lo gakgamallang? / Ke tlhoafala go dumela / mo go Jesu yo ' ntshwetseng. / O n' a ntsenya kagisong; / ke wa gagwe bophelong. / Ene ke a mo latela; / ke ithuta go dumela.","Nna ke rata Jesu fela; / dibe ke tse di fenngwang; / joo nna wee, fa ke kgopisa / ene yo o nkemetseng! / Foo ke yo o mmapolang, / ke le yo o itatlhang. / Jesu o a nthapelela; / ke ithuta go dumela.","Nna ke rata Jesu fela; / pelo, o boifelang, / fa letswalo le go tshosa? / Kriste yo o re swetseng / o re thusa Modimong, / re nne boitshwarelong. / Nna ke rata Jesu fela; / ke ithuta go dumela.","Nna ke rata Jesu fela! / Dilo tsotlhe tse di teng / ga di ntlogedise Jesu, / ene yo o nthatileng: / Tlotlo, kgobo gongwe eng, / kgosi, khumo lefatsheng. / Nna ke rata Jesu fela; / ke ithuta go dumela.","Nna ke rata Jesu fela, / ene yo o nkgolotseng. / Ke isiwa kwa go ene, / fa ke tsena mo losong. / Ke tla bona yo ' nthatang, / go nna nae 'godimong. / Nna ke rata wena Jesu; / o ntiisetse tlhe tumelo."]},{"n":287,"t":"O nkgoge ka diatla","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K271","v":["O nkgoge ka diatla / mo botshelong. / O thata, o bonatla, / ke wena Mong. / Ke tshaba go nna nosi / mo tsamaong; / tlaa, wena Jesu, o nne / yo o mpatang.","O didimatse pelo / mo dipakeng / tsa thabo le selelo, / tse di ntletseng. / A ke nne fa go wena / fa dinaong; / ke gomotsege tota / mo tumelong.","Le fa ke sa go bone / matshwenyegong; / o tla mphitlhisa sentle / kwa ke yang teng. / O nkgoge ka diatla / mo bophelong. / O thata, o bonatla, / ke wena Mong."]},{"n":288,"t":"Pelo, solofela","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K272","v":["Pelo, solofela / mo Moreneng! / Solofela go ya / thuso e nne teng! / O lapelang? / 'Sigo k' jo bo sang; / mme go gaufi ene / yo o go thusang. / Ka metlha yotlhe / mo tlalelong / o tla go femela, / Modimo Mong.","Pelo, solofela / mo Moreneng! / Solofela go ya / thuso e nne teng! / O boifelang? / Ga se yo ' palwang, / gonne o mogolo / go tse di tshwenyang. / Monamoledi / mo tlalelong, / le nna o mpholose, / Modimo Mong."]},{"n":289,"t":"Nna ke batla, ke eletsa","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H108","v":["Nna ke batla, ke eletsa / go ya bophelong. / Ke tla leka go di fenya / tse di nthibelang. / Yo ntiang le yo batlang / go nthibela kwa ke yang, / ga a nthate, ke mo rate / ke ya godimong.","Ke biditswe, ke itshenketswe / go nna fa troneng / ya ga Kwana; ke siana / go ya kwa ' seding. / Botlhe ba ba diegang / ba ka bona krone jang? / Ke tlhoile, ke latlhile / tse di nthibelang.","Ntsamaise, mme o ntiise / Jesu kwa ke yang. / Busa le dikgato tsa me / tse ke di dirang. / Fa ke mo dithaelong, / mo boeng mo tshepelong, / 'atla sa go, thata ya go / di nntsha tlalelong.","Ga ke kgone ka bogame / go ya pholosong. / Mme ka wena, ao Morena, / ke nne mo phenyong. / Madi a o ntsholletseng / a mpha thata tshepelong; / mme ka wena ke tla tsena / kwa legodimong."]},{"n":290,"t":"Dira ditiro tsa 'go","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H111","v":["Dira ditiro tsa 'go / nako e sa le teng! / Gonne go tla bosigo, / fa go sa dirweng. / Dira 'seding la motsi, / nako e sa le teng, / gonne fa le phirima, / o tla nna 'fifing.","Dira ditiro tsa 'go, / o sa le bokaung! / Bophelo boa feta, / bo khutla losong. / Dira ka tlhoafalo / tiro mo Moreneng, / di dire ka boikanyo / jo bo sa lapeng.","Dira ditiro tsa go, / go fitlha tsofading / foo go tla khutla tiro / tsotlhe lefatsheng. / Dira sebaka sotlhe, / se nnele boikhutsong; / o tla ikhutsa gotlhe, / e le mo phupung."]},{"n":291,"t":"K'itshwarella Modimong","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H112","v":["K'itshwarella Modimong, / fela Modimong / le fa ke le pogisong / le matshwenyegong. / Ke tla bua mo pelong, / go fitlhela bokhutlong: / K' itshwarella Modimong, / fela Modimong.","Ke sepela lefatsheng / ke le tlalelong, / jaaka Jakob mo tseleng / Mosopotameng. / Le fa ke le borokong, / ke eletsa mo pelong: / K' itshwarella Modimong, / fela Modimong.","Tsela e tshesane jang, / e 'yang 'godimong, / mme ke e e re thusang / go ya bophelong. / Baengele 'godimong / ke ba' re biletsang teng, / k' itshwarella Modimong, / fela Modimong.","Bosigo ke jo bo sang, / letsatsi le teng. / Jalo keyo ' ineelang / sešwa mo Jesung. / Nna yo ke mo agelang / Bethel ya me mo pelong: / K' itshwarella Modimong, / fela Modimong.","Tsela ya me lefatsheng / e fella losong; / foo ke tla ya leseding, / kwa legodimong, / kwa go Jesu yo 'nthatang, / re le mo kgalalelong: / K' itshwarella Modimong / ka bosakhutleng."]},{"n":292,"t":"O se nkatoge, Mong","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H113","v":["O se nkatoge, Mong, / nkatamele. / Se ntese tshepelong. / Ke tla ya kae? / Ka wena yo ntshwetseng / ke tswelle leseding. / O se nkatoge Mong; / nkatamele.","Tsela mono 'fatsheng / ke ya boeng, / kgaola dikgole tlhe, / ke phologe. / 'Fifi le nthibetseng, / le tloge mo tseleng. / O se nkatoge Mong, / nkatamele.","Ke fetse mo 'fatsheng / thomo ya 'go, / ke be ke tle 'seding, / fa o leng teng. / Ke itse tumelong, / thata e ' mphemelang. / O se nkatoge Mong, / ke tla ya kae ?"]},{"n":293,"t":"Sala sentle, sala Modimong","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H115","v":["Sala sentle, sala Modimong, / ena Rara a go thuse, / tsela tsa 'go a di buse. / Sala sentle, sala Modimong. Chorus: Sala sentle mme re fiwe / go bonana gape Modimong. / Sala sentle mme re fiwe / go bonana gape Modimong.","Sala sentle, sala Modimong! / A Modimo a go dise, / ka diphuka a go bipe. / Sala sentle, sala Modimong. Chorus: Sala sentle ...","Sala sentle, sala Modimong! / Fa lefatshe le go tshwenya, / thata ya 'gwe e tla fenya. / Sala sentle, sala Modimong. Chorus: Sala sentle ..","Sala sentle, sala Modimong! / Rara a a go femele, / ena a go tsamaise. / Sala sentle, sala Modimong. Chorus: Sala sentle ..."]},{"n":294,"t":"Tlaang batho, lo se eme","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H118","v":["Tlaang batho, lo se eme, / mme a re tsweleleng. / Bonang bophelo jona / bo feta mo 'fatsheng. / Mme mmele o tla fitlhwa / ka pele lebitleng, / mme ka re sale mono, / tlaang, tlaang a re tlogeng. Chorus: Mme go tla nna bofelong / boikhutso godimong. / Ammaaruri, ammaaruri, / boikhutso godimong.","Baratwi betsho ' bantsi / ba teng kwa Kanaan; / ba fentse tsa lefatshe / ba ikhutsa foo jaanong. / Re sa ntse re tlhabana / kajeno mo 'fatsheng, / mme re tla bona phenyo / le bona mo Kristeng. Chorus: Mme go tla nna bofelong ...","Morena o Ma re thusa / mo tlhabanong 'fatsheng, / mme re tla bona krone / fa re tswa mo ntweng. / Tlaang re mo lebelele / ka tebo thapelong / go be go tle re fenye / re tsene kwa Sion. Chorus: Mme go tla nna bofelong ..."]},{"n":295,"t":"Tlaa, mponegele, Jesu, mo tseleng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H121","v":["Tlaa, mponegele, Jesu, mo tseleng / le mo boeng, / ka o lesedi la me mo 'fifing / mono 'fatsheng. / Busa dinao tsa me tshepelong / le kgato tsa me go ya 'godimong.","Ee, pele ke ne ke le timelong / le phapogong, / mme o mpusitse; ke mo tumelong / le polokong. / Ka rato lwa 'go lo lo mpatlileng / ke mo 'seding, ke dule mo 'fifing.","Tsamaya le nna, Jesu, tshepelong / mo botshelong, / o se ntlogele mo dithaelong / le poitshegong; / fa o ntse le nna go ya bofelong / ke tla goroga kwa legodimong."]},{"n":296,"t":"A k' o ntese, a k' o ntese","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H146","v":["A k' o ntese, a k' o ntese / ke ye tlhe go bona Jesu. / Nna ke llela Jesu wa me, / ke goletswe ke go mmatla, / go nna nae mo troneng.","Jesu wa me, Jesu wa me, / ruri o letsatsi la me. / Ke tla fitlha leng go wena, / kwa nka go bonang, Morena, / le baitshepi ' godimong.","Go ntle jang, go ntle jang, / mo baengele ba opelang. / 'Phuka nka di bona kae, / go fofela koo kwa gae, / mo ba mo opelelang.","Ruri re tla itumela / fa re tsena ka difela / mo Jerusalem o mošwa, / o o agilweng ka gouta, / o o kwa legodimong.","Paradise, paradise, / re tla aga ka kagiso, / jaaka ba ba lorang toro. / Jesu re bulele kgoro / e ' isang paradiseng."]},{"n":297,"t":"Nanoga pelo ya me","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"H150","v":["Nanoga pelo ya me, / lelala 'godimong / mo lefatsheng o tlhoka / se se ikhutsisang, / mme kwale kwa 'godimong / go Kwana ya Modimo. / Go boikhutso teng, / boikhutso 'godimong.","Mme fa o sa bofilwe, / a k'o tswe kgolegong / ka Kwana e romilwe / go go ntsha tshwenyegong. / E fentse, ee, e fentse, / le dira e di sentse! / Go boikhutso teng, / boikhutso godimong.","Ao, Kwana ya Modimo, / e ' mo kgalalelong, / mphe phuka, go gofela / go wena 'godimong. / Ke tla nna koo le wena / go se na kgaogano. / Go boikhutso teng, / boikhutso 'godimong.","Mme le fa ke eletsa / go ya kwa o leng teng, / ke tla nne ke itshoka, / ke sa le lefatsheng. / Ke itse o tla mpitsa, / ka moso, ka o rata / ke ye boikhutsong, / boikhutso 'godimong. rata Bakaulengwe"]},{"n":298,"t":"Yo ' reng, o rata mo pelong","c":"Difela tsa Bophelo ka Tumelo: Ka ga go Rata Bakaulengwe","k":"K273","v":["Yo ' reng, o rata mo pelong / Modimo, mme a tlhoile / mongwe-ka-ene mo bathong, / o tla bo a akile. / Modimo o o re ratang / o bua o re: \"Ratanang!\"","Ba re tshelang mo lefatsheng, / re bona bakaulengwe / ba tlhoka ba le tlalelong, / mme re sa ba fe sepe, / re batho ba ba timanang, / ka re sa rate ba ' tlhokang.","Yo ka lefufa a sotlang / mokaulengwe wa 'gwe, / le ene yo a mo tshegang, / fa a wa tseleng ya 'gwe, / ke motho yo o sa rateng / mokaulengwe lefatsheng.","Yo ka bogale a kgobang / mokaulengwe wa 'gwe, / le ene yo o rogakang / yo mongwe, a rumola, / yoo ga se motho yo ' ratang / bomorwa-Rraagwe tumelong.","Rraarona kwa legodimong / ke a le mongwe fela; / re ditokollo mo mmeleng / wa ga MorenaJesu. / Ka moo a re direlaneng / ka 'rato lo lo tshwanetseng.","Re phologetse kwa Jesung, / re rekolotswe rotlhe / ka madi a 'gwe s'fapaanong, / re itshwaretswe rotlhe. / Mme kana re ka tlhoa jang / ba Jesu o ba ratileng!?","Ka ntlha ya moo a re thuseng / le bone ' babotlana; / go ba direla loratong / ke go direla Jesu. / O tla atlhola bofelong, / ka fa re dirileng ka teng.","Yo o bonang ba ' tlaletsweng, / a sa tlhomoge pelo, / o tla atlholwa bofelong, / go se pelotlhomogi. / Ka moo re kopa wena, Mong: / Re tshelle 'rato dipelong."]},{"n":299,"t":"Bana ba Modimo","c":"Difela tsa Bophelo ka Tumelo: Ka ga go Rata Bakaulengwe","k":"K274","v":["Bana ba Modimo, / ikitseng, lo batho / ba bogosi jwa lorato. / Ithuteng ka Jesu / gore lo ratane / lotlhe le go agisanya! / Ratanang, / latelang / Jesu Krist', Morena, / mme lo etse ene.","OM itshwarela dibe, / Jesu, Moreswedi, / o re tshololetse madi. / Lona baleofi, / o lo rekolotse / mo dibeng, o lo golotse / timelong, / melatong, / o lo amogetse, / o lo itshwaretse.","Fa Satan a batla / go lo kgaoganya / ka dikgang, le go tlhabana, / foo lo se diege, / lo itshwarelane, / lo ruane ka bonako! / Tlogelang, / khutlisang / kgang le dikomano / le dikgaogano.","Mme lo se itlhome: / Lo le basiami, / mme ba bangwe e se bone. / Gape ke tshwanelo / go bipela batho / dibe tsotlhe ka lorato. / Ratanang, / tsalanang, / tukisang lorato, / lebalang melato.","Fa re rata go nna / bana ba bogosi / jwa ga Kriste, e le Kgosi, / rona re tshwanetse / go ratana rotlhe / le go rata batho botlhe. / Ke Satan / yo ' ratang / gore re ilane / le go kgaogana.","Utlwa, Abba Rara, / utlwa, Morwa Mowa, / o re thuse go ikwatlhaya, / gore go nyelele / kgang le go tlhoana, / re nne bana ba kagiso. / Phuthegong / le bathong / re nne ba lorato / ka malatsi otlhe."]},{"n":300,"t":"Kana go monate jang","c":"Difela tsa Bophelo ka Tumelo: Ka ga go Rata Bakaulengwe","k":"K275","v":["Kana go monate jang / teng kwa batho ba phelang / ka kutlwano ditirong, / bolotsana bo se teng.","Ke ba ' solofeditsweng / sego le ba le batlang / le botshelo lefatsheng, / le jo bo sa nyeleleng.","Ao, lorato mo bathong / lo timile dipelong! / Botlhe ba ba boithatong / ga se ba ba ratanang.","Ke ba ba iphelelang, / ba ba tlhokomologang / batho ba ba sepelang / jaaka bone lefatsheng.","Jesu yo o sedulong / sa bogosi 'godimong, / leba dintwa tse di teng, / di khutlise phuthegong.","O Modisa lefatsheng, / phutha ba ba timetseng; / ba nne ba ' itshwarelwang, / ba ba itshwarelanang.","Fa thatano e le teng, / go monate phuthegong; / foo re bona Modimong / tsone tse re di kopang.","Tshela Mowa dipelong, / ona o ' re phedisang, / ona o o re tiisang, / o ' re itumedisang.","Jaanong he, a re bakeng / yo o godimodimong, / yo o bongwe borarong, / yo o re tshwaraganyang. Tumelo"]},{"n":301,"t":"Go bitsa Kriste: Ntateleng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K276","v":["Go bitsa Kriste: Ntateleng, / lona bakriste lotlhe; / iitatoleng, itlhabantsheng, / a nna ke lo laole! / S'fapaano lo se sikareng, / ntshaleng morago, ntateleng!","Nna ke lesedi mo tseleng, / ke lo etella pele, / mme ene yo o ntatelang / ga a ne a timela. / Ke tsela e e lo isang / kwa legaeng legodimong.","Ke mo boikokobetsong, / pelong ke a lo rata; / mafoko a ke a buang / ke a ' bonolo thata. / Ka moo ke yo o lo bitsang: / Tlaang go nna ba lo imelwang!","Ke lo supetsa tse di leng / bosula, lo di fenye; / lo phepafale dipelong, / lo nne boammaaruri. / Ke 'fika le le tlhomameng, / mo ruri lo ka agang teng.","Fa lo imelwa, se boifeng, / nna ke tla lo imolla. / Ke tla lo thusa bophelong / le go lo tlhabanela. / Motlhanka yo o ntlogelang / mo tlhabanong o mobe jang!","Ene yo o iphelelang / bophelo ga a bo bone; / mme motho yo o tla ntshwelang, / ene o tla bo bona; / ka gonne yo ' sa mpogeleng, / ene ga se yo ' ntshwanetseng.","Tlaang lotlhe, a re lateleng / Morena Jesu Kriste / mo pogisong le maketeng, / re be re tiile moko! / Motshabi ke yo ' sa boneng / bophelo jo bo sa khutleng."]},{"n":302,"t":"Lona batho, tshabang thata","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K277","v":["Lona batho, tshabang thata, / tshabelang kwa Moreneng! / Fa lo rata tsa lefatshe, / lo tla wela tshenyegong. / Lelalang legodimong, / tswaang ka pele maleong, / fetogang he maikutlo / ka poifo le thoromo.","Iphapheng dilong tsa nama, / di gogela botlhokong; / lo tshwanetse go tlhomama / Lefokong le tumelong. / Lo le tshware mo pelong, / go tiisiwa mo tirong. / Mekgwa ya bosula yotlhe / yona lo e latlhe gotlhe.","Batho, a lo ka ganela, / fa lo sa le boleong, / lo le taolong ya nama, / lo le ruri tatlhegong? / Ke Morena yo ' thusang, / yo o ka lo pholosang; / fa a gana go itshwarela, / lo tshwanetse go latlhega.","Lo tlhabane le boleo / le go fenya tumelong. / Ganelang le dilo tsotlhe / tse di maswe bophelong. / Fa lo tsena boketeng, / lo se ngongorege teng; / yo ' ipatlelang kagiso, / a a se tshabe dipogiso.","Tlhabanang ka tlhoafalo / gore lo ye phologong; / mme fa lo sa dire jalo, / lo tla wela tshenyegong. / Kana lo tla fenya jang, / fa lo le ba ba tshabang? / Ke mofenyi a Ie nosi / yo o tla tlotlwang ke Kgosi.","TIogeIang basulafatsi, / lona ba lo dumelang! / Ao, go tshega le banyatsi / moo go senya mowa jang! / Fa re leba Jesu, Mong, / a le mo sefapaanong, / ga re ka ke ra itumela / le lefatshe, ra Ie ineela.","Boifang Modimo, lotlhe, / ona o ' ka latlhelang / mmele, ee, le ona mowa / mo mollong o ' tshabegang; / mme ka e le o ' ratang / botlhe ba ba dumelang, / jalo tlaang lo o rapele, / gore o lo rekegele.","Tshabang thata go leofa, / batlang thuso Moreneng! / Ene yo, o tla akofa, / a lo isa legaeng. / Re boloke he jaanong, / re se wele tshenyegong; / re ipatlele go falola / ka poifo le thoromo.","Amen, ee, o nthuse jalo, / ka fa ke go rapetseng. / Ntiise tlhe, ke tlhoafale / kampanong e ' sa feleng. / Jesu, nthuse tlhabanong, / go nna thata tumelong; / mme ke dise, ke rapele, / boswa ke bo amogele."]},{"n":303,"t":"Ao lona ba lo tsositsweng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K278","v":["Ao lona ba lo tsositsweng / le Kriste, tswaang tlhe mo dibeng, / batlang tsa legodimo, / kwa Jesu, Kgosi, o ntseng teng, / ka fa letsogong le le jang / la Rara, la Modimo. / Ratang, batlang / tsona tsosi / tsa bogosi / jwa Morena, / gore lo humeng ka ene.","Lo tsenye mo kolobetsong, / ke go re, lo ba ba suleng / le ene ntlheng ya dibe. / Bophelo jo lo bo phelang / bo tswa le Kriste mo losong / go phela sešwa nae. / Bonang, lona / badumedi, / lo baphedi / ba Modimo, / ba bophelo jwa 'godimo.","E tla re mo ponatshegong, / fa Kriste mo kgalalelong / a tsile go atlhola, / le fa lo sotlwa lefatsheng, / lo tla nna nae legaeng, / a lo itumedisa. / Ruri, ruri, / lo tla tsena / le Morena / la bofelo / dikagong tsa kgalalelo.","Ka moo he bolayang jaanong / boleo jo bo mo pelong / le tsotlhe tsa boikepo! / Tshabang tse lo di dirileng, / lo sa ntse lo le mo dibeng, / batlang tse ' boitshepo! / Kana bana / ba 'keletso / tsa tsietso / ba tla wela / mo petsong e e botlhoko.","Mme fela jalo aparang / motho yo mošwa, lo rateng / go tshwana le Morena; / gobane yo ' lo bopileng, / ke yo o lo itlhaoletseng / go tshwana nae ruri. / Jesu, Jesu, / tshegofatsa / o ntšhwafatse / batho ba 'go, / gore ba nne 'tlung ya gago."]},{"n":304,"t":"Ga go bokhutlo mo kgannyeng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K280","v":["Ga go bokhutlo mo kgannyeng, / re sa le kganelong; / ka re sa phela lefatsheng, / re tla nna tlhabanong.","Baba ba rona ' bantsi jang / ka kwa ntle le pelong! / Ke bone ba ' re tlhaselang / bosigo le motsing.","'Keletso tse di raelang / di tsoga mo pelong. / Ke tsona tse di huduang, / di tsenya molatong.","Satan yo ' kgarakgatshegang, / a duma lefatsheng, / ke ene mmaba yo ' batlang / go re isa moleteng.","Ee, botlhe ba ba Moreneng / ba sa le kganelong; / ke bona ba ba tlhomameng / ka gale tlhabanong.","Mme lona ba lo leng mo ntweng / ya yo ' ikanyegang; / itseng, fa ruri a le teng, / yo o lo nonotshang.","Ga go bokhutlo mo kgannyeng, / re sa le kganelong; / mme fa re fentse lefatsheng, / re tsena kagisong."]},{"n":305,"t":"Bakriste ba re tsamayang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K281","v":["Bakriste ba re tsamayang / ka boikanyo mo tseleng, / re na le yo o re Iwelang, / ke Jesu, tsalatsamaong.","Kwa gae re tla fitlha teng / go bona boswa 'godimong, / le fa re sa le lefatsheng / mo thaelong le tlhabanong.","Ee, Jesu yo o ntseng troneng / ya gagwe mo legodimong, / ke Mononotshi makoeng, / o tla re isa kwa phenyong.","Mosupa-tsela lefatsheng / ke ona Mowa Lefokong, / o ' re bontshang kwa re yang teng, / ba re sa leng mo leetong.","Ke gona re itumelang, / re itshokela bokhutlong; / lesedi la ga Jesu Krist' / le tla re isa 'godimong."]},{"n":306,"t":"Tsenang mo teng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K282","v":["Tsenang mo teng, / e bong mo lewatleng / la dipogiso jaaka Baisraele! / Lo boifang? Ene oa lo tshedisa, / yo ' laolang 'fatsheng le lewatleng. / Tsenang mo teng.","Yo ' re Iwelang / ke Kriste yo ' busang, / mo lewatleng o ntshitse letsibogo, / go tshedisetsa batho ba 'gwe mmogo / go ene kwa moseja kwa a busang, / yo ' re Iwelang.","Lo lelelang, / lo hutsafalelang? / A ke ka teko le dipatikego? / Bonang tlhe matshwenyego a tla fela / mo bokhutlong. Lo hutsafalelang? / Lo lelelang?","Mo tlhabanong / se tlhabiseng ditlhong, / Iwa tshaba, lo le boi go tlhabana. / Go ka nna jang, fa go ka fenya mmaba? / Ao, itshokeng! Se tlhabiseng ditlhong / mo tlhabanong.","Ao Jesu Mong, / re tiise mo tekong! / Re tla itshoka, fa re na le wena / Mothusi tumelong, o le Morena. / Yo ' re Iwelang, re tiise mo tekong, / ao Jesu Mong."]},{"n":307,"t":"Jesu, mo tseleng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K283","v":["Jesu, mo tseleng / e ' yang bophelong, / o re etelele pele, / rona re a go latela. / Re gorose teng; / Jesu, legaeng.","Mono lefatsheng, / fa go thata teng, / o re tlhomamise gore / re se imelwe ke merwalo; / gonne dipogong / re ya 'godimong.","Mo matshwenyegong / le mo dilelong / tsa ba bangwe le tsa rona, / re nonotshe go itshoka. / Re lebise, Mong, / teng kwa bokhutlong.","Thusa tsamaong / go ya bokhutlong. / Fa mathata a re tlela, / o nne o re babalele. / Mme mogang re swang, / re ye phologong.","Kwa legodimong / mo kgalalelong / re tla boka, re fitlhile, / fa tshepelo e fedile, / re le mo bontleng, / re ikhutsa teng."]},{"n":308,"t":"Tlaang, bakriste, lo utlwane","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K284","v":["Tlaang, bakriste, lo utlwane, / tsayang marumo lo tlhabane / le mmaba yo ' lo tlhaselang. / Tlhomelang he ka bonako, / lo tshotse 'Foko la Modimo, / lo fenye Satan yo ' tshwenyang. / Mme lo se mmoifeng, / Imanuel o teng, / Hosiana! / Yo ' re thusang / o thata jang! / Ka ene re ba ba fenyang.","Tswaang dikeletsong tsa nama, / ka Krisete lo tla tlhomama / le go sepela boitshekong. / Thata e tswa mo go Jesu, / lo thatafale ka tumelo, / lo se nne ba ba theekelang. / A ene yo ' lapang / a lebe kwa a yang, / teng go thabo. / Gomotsegang, / tlhabanelang / go fiwa krone legaeng.","Tlhabanang tlhe ka tshwanelo / dinyaga tseno tsa bophelo, / di feta ka bobebe jang! / Yo ' fetsang e le mofenyi, / e tla re baswi ba tsosiwa, / a tsoge boitumelong. / Re ba ba golotsweng, / tshotlego lefatsheng / e tla khutla. / Legodimong, / kwa Modimong / re tla nna ruri tlotlegong.","Jesu, tiisa bana ba 'go, / o ba fenyise dira tsotlhe, / e le ba o ba rekileng. / Jesu, re phedise sešwa, / re phele ka lorato Iwa 'go, / re tiise re le maketeng. / O tshele dipelong / Mowa wa gago, Mong, / re tlhomame / mo tumelong / le loratong, / go ya re fitlhe kwa o teng."]},{"n":309,"t":"O kampane ka tshwanelo","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K285","v":["O kampane ka tshwanelo, / fa o gogwa mo pelong; / fa Modimo o go goga / go go isa bophelong.","O kampane, o akanye: / Tsela e tshesane jang! / Kgoro ka e pitlaganye, / bonnye ke jo bo tsenang.","O kampane, gonne Jesu / ke yo o go batlileng. / Thuso ya 'gwe e gaisa / dilo tsotlhe lefatsheng.","O kampane go e batla, / gana se se thibelang; / yo ' batlang ka pelo yotlhe / ke yo o tla e bonang.","O kampane go mo rata, / Jesu yo ' go ratileng; / a tse tsotlhe di sutele / Jesu yo o di phalang.","O kampane, se ikanye / thata ya 'go tlhabanong; / itshwarelle ka Morena, / ke yo ononofileng.","O kampane ka thapelo, / o se lape selelong; / o boloke 'Foko la 'gwe / mo pelong e e utlwang.","O kampane ka tlhomamo, / o nne fela Moreneng. / Tshaba kgoro ya katlhamo / e ' isang kwa moleteng.","O kampane, se ganelle / kwa Sotom mo tshenyegong. / Se diege, o tshabele / kwa Tsoare polokong.","Jesu, fa a boa, a tla, / o tla tshola yo ' fentseng. / O kampane thata thata / gore o nne yo ' fenyang."]},{"n":310,"t":"Ba re mmogo re ikana rotlhe","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K286","v":["Ba re mmogo re ikana rotlhe, / Moreswedi s'fapaanong, / go nna ba 'go ka boikanyo jotlhe, / bophelong le mo losong! / Amogela maikano ao. / A ' go kgatlhe, a go natefele! / O re tiise tumelong! / Amen! Re mo kagisong."]},{"n":311,"t":"Mowa wa me, disa tlhe","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K287","v":["Mowa wa me, disa tlhe, / bitsa o rapele, / gore Satan a se tle, / o sa solofela. / Yo o ntseng / boatleng, / o tla mo tlhasela, / a mo fenya fela.","Tsoga pele borokong / jwa 'go jwa boleo! / Go tla tsena tatlhegong / yo ' ratang tlhapelo. / Ao, ditlhong / mo tshekong / di tla nna dikgolo, / go se na phalolo.","Tsoga, gonne yo ' salang / mo dibeng tsa gagwe, / o ka bonisiwa jang / ke Modimo wa 'gwe, / o o tlang / kwa mothong / ka dineo ruri, / fa a ikwatlhaya.","Tsoga, gonne ba ba Iwang / nao ba bogale; / ke Satane yo ' dumang, / o tla ka botlhale. / K' yo ' itseng / mo metlheng / ya boitumelo / go tsietsa pelo.","Tsoga, gonne yo ' thusang / Satan ke lefatshe. / Ee, le Ieka thata jang / gore le robatse / pelo teng / mo dibeng! / Tshaba baraedi, / o nne modumedi.","Tsoga, gonne mo nameng / go agile mmaba, / e bong pelo e e reng: / A o tshaba thabo? / Ke e ' ntseng / ka fa ntlheng / ya ' Satan le batho / ba ba boithato.","O rapele tlhabanong, / o ntse o disitse; / gonne Rra Iegodimong / k' yo ' fenyang bothata. / Mo mmeleng / le moweng / oa go thatafatsa, / oa gotlhagafatsa.","Ee, o thusa tlalelong, / fa o mo rapela, / o sa khutle tumelong / go mo ngaparela. / Mo babeng / ba ba teng, / o tla fenya fela, / fa o mo rapela.","Mme rapela Modimong / leineng la ' Jesu. / Foo o tla nna yo ' fentseng / mo nakong ya loso. / Gonne teng mo Kristeng / ruri oa re rata, / o tla re fa thata.","Ka moo a re se lapeng / go rapela thata, / le go disa mathateng / le e seng go kata, / gore teng / mo motlheng, / fa Morena a tla, / re ye go nna nae."]},{"n":312,"t":"Badumedi ba Morena","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"H122","v":["Badumedi ba Morena / ba lo sa tshabeng, / ba lo tlhabanang le baba / mono lefatsheng. Chorus: Jesu o tla nna le rona / go ya bokhutlong. / Re tla kgona re tla fenya, / ene a le teng.","Ene Satan le ba gagwe / ba bogale jang! / Ka baetsho ba bolawa, / tlaang, mme tlhabanang! Chorus: Jesu o tla nna le rona ...","Lebang ene, Jesu Kriste, / yo o lo tiisang, / lo tla fenya ka leina / la 'gwe tlhabanong. Chorus: Jesu o tla nna le rona ...","Re se lape, bagaetsho, / mo ditshwenyegong! / Jesu o tla re namola / go ya kwa phenyong. Chorus: Jesu o tla nna le rona ... DILO TSA BOFELO"]},{"n":313,"t":"Batho botlhe ba tla fela","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K288","v":["Batho botlhe ba tla fela, / ka ba tshwana le bojang. / Ba tshwanetse go nyelela, / ka ba le mo maleong. / Mmele o tla bola pele, / mo tsogong o nne o sele. / Ee, o tla tswa mo losong / go ya kwa kgalalelong.","Mme bophelo jwa me jotlhe / ke bo neela mo losong. / Ka Modimo o bo tsaya, / ga ke yo ' hutsafalang; / gonne mo dinthong tsa ' Jesu / ke na le kgololo tota; / loso Iwa 'gwe s'fapaanong / lo nkgomotsa mo losong.","Jesu Kriste, Mong o ntshwetse, / ke yo o mpholositseng; / o nthusitse jalo gore / ke tsamae kagisong. / Ke tlogela 'fatshe leno, / lone le la ditlalelo, / ke ya kwa legodimong, / go nna nae kgalalelong.","Gona ke tla itumela / le ba bantsi phuthegong / ya baitshepi, ke direla / Molaodi 'godimong. / Gona ke tla opelela / ene Rara, Morwa, Mowa / dikopelo lesomong / la baengele phatsimong.","Teng re tla fitlhela bone / ba ba swetseng tumelong, / bo-Jesaya, ee, le bone / bo- Petoro mo tlotlong; / botlhe ba mo ipelela / e le ba ditshika tsotlhe / go tswa mo tshimologong / le go fitlha bokhutlong.","Ao Jerusalem o montle, / o phatsima thata jang! / Mo go wena go kopelo / ya difela masomong. / Boitumelo bo a tsoga, / 'tsatsi le a simologa, / 'tsatsi le le sa khutleng / kwa go Jesulegaeng.","Teng re tla nna le Modimo, / ona o ' re bopileng, / re apere kgalalelo, / re rwesitswe ditlhogong / 'krone ' dintle tsa bophelo. / Ka melomo le dipelo / re tla mo tumisa teng / yo o re pholositseng.","Jaanong ke tswa mo go lona, / ke ya kwa bosakhutleng. / Ba ga etsho, salang sentle, / ke huduga lefatsheng! / Lo tswelele go dumela; / gonne foo lo tla ntatela. / Salang sentle mo bathong, / ke ya kwa go Jesu Mong!"]},{"n":314,"t":"Nna ke seboko leroleng","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K289","v":["Nna ke seboko leroleng, / ke mo poifong ya loso. / Kgomotso ga e teng moweng, / nkgomotse, wena Jesu, / yo o ntshwetseng sefapaanong / go nthekolola mo losong; / o ntlhomogele pelo.","Ka ke le kala setlhareng, / se e leng wena Jesu, / a Mowa wa 'go o nne teng / le nna, fa ke ya go swa. / Ee, fa ke khutla sebakeng / go phela mono lefatsheng, / nkgogele kwa go wena.","Jaanong ka ke le tlalelong, / Morena, se ntlogele. / Nkgomotse le mo poifong, / a ko o ntlhokomele. / Nkgopola, Jesu, yo ke leng / tokollo ya 'go e ' phelang; / o ntshole ka kagiso.","Modimo o ' sa fetogeng, / gopola 'Foko la 'go, / le o le buileng 'Kwalong! / O rile: Nna ke Rrago. / Ga ke go latlhe mo tshekong. / Ke tla go tshola mo losong / le go go fa bophelo.","A ko o tiise mo pelong / Lefoko leo la 'go, / gore ke tsene boikhutsong / le kagisong ya gago. / Nna ke yo o go ikanyang. / kea go ineela yo ke swang. / Mmoloki, o mpoloke!","Jaanong ke neela diatleng / tsa gago mowa wa me. / Ao Rara, yo ' sa ntebaleng, / fa kee swa, a ko ' ntshole. / Fa puo e le e ' mpallang, / o nkutlwe yo ke fegelwang / ka ntlha ya ' Jesu. Amen."]},{"n":315,"t":"Fa nako ya me lefatsheng","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K290","v":["Fa nako ya me lefatsheng / ya go swa e fitlhile, / a ko o mpate mo tseleng, / o se ka wa ntlogela, / ka o le yo o nthatileng, / ke neela mowa diatleng / tsa gago, Jesu wa me.","Fa dibe tsa me bofelong / di ntshwenya, ke tlaletswe, / foo o nkgakolle, Jesu Mong, / gore ke itshwaretswe. / A ke gopole mo losong / loso Iwa gago s'fapaanong, / lo o nthusang ka lone.","Kgomotso ya me mo moweng / ke ya go itse gore / ke tokololo mo mmeleng / wa gago, mme o nkitse. / Le fa ke swela lefatsheng, / ke swela ruri Moreneng; / ga ke kgaogane nae.","Ka o tsogile mo losong, / le nna ke tla tswa gona. / O tlhatlogetse 'godimong, / mme teng ke tla go bona. / Jaanong ke sa boifelang? / Fa ke swa, foo ke lelelang? / Ke tla nna nao ruri.","Ke hudugela kwa Jesung, / ke mo tlhologeletswe. / Ke tla robala mo phupung / go ya a be a ntsose; / gobane kwa legodimong / ke tla nna ruri bophelong / ka Jesu Kriste. Amen."]},{"n":316,"t":"Sebaka sa me sa bofelo","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K291","v":["Sebaka sa me sa bofelo, / go itse mang, se tla tla leng? / Loso lo ka tla ka lobelo, / Iwa ntsenya mo pitlaganong. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso, Mong.","Fa ke thabile motshegare, / bosigo nka nna tlalelong; / gonne re aparela loso / le kobo mono lefatsheng. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso, Mong.","Morena, nthute go gopola / bokhutlo jwa me bophelong. / Ke se diege goikwatlhaya, / ke swele boitshwarelong. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso Mong.","A ke laele ba M ntlo ya me, / ke nne yo o ipaakantseng, / le go ineela thatong ya 'go, / e nne e 'ntirafalelang. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso, Mong.","Rra, bipa dibe tsotlhe tsa me / ka madi a ' ntshololetsweng; / gobane loso Iwa ga Jesu / ke lone lo ' ntapolosang. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso, Mong.","Mading le mo dinthong tsa gago / ke mo ke ithobalelang. / Ke fa go leng kgomotso ya me / le tsotlhe tse ke di batlang. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso, Mong.","Tlalelo le fa e le loso / ga se tse di re kgaoganyang; / gobane ke kopantswe nao, / ke wena yo ' ntlhomamisang. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso, Mong.","Kolobetsong ke go apere, / ke gona mo ke dirilweng / ngwana-Modimo, mme ke filwe / tshiamo e e ntekanyeng. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso, Mong.","Ke jele mmele, ka nwa madi / a gago mo Selalelong; / ka moo ga o ne o ntebala, / o tla nkgorosa legaeng. / Jesu, Jesu, Montshwedi s fapaanong, / a ke swe ka kagiso, Mong.","Le fa ke ka swa gompieno / gongwe ka moso lefatsheng, / ka madi a 'go ke kgabile / go ka tsholelwa 'godimong. / Jesu, Jesu, Montshwedi s'fapaanong, / a ke swe ka kagiso, Mong.","Ke phela ka boitumelo, / mme ke tla swela tumelong. / O ka ntirela la bofelo / ka fa thatong ya gago, Mong. / Jesu, Jesu, ke itse mo pelong: / Ke tla swa ka kagiso, Mong."]},{"n":317,"t":"Modimo ka fa go rateng","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K292","v":["Modimo ka fa go rateng / ga gago a ke fole. / Mo bophelong le botlhokong, / Morena, o ntshwatole. / Mme fa ke swela lefatsheng, / ntsholele gona kwa bontleng.","Modimo, fa nka swa jaanong, / a ko o se ntlogele; / foo o nne le nna mo losong / gore ke se nyelele, / fa ke tlogela lefatsheng / ditsala tse di nthatileng.","Mmele a M o lale lebitleng, / mme mowa o boele / go wena go nna bosasweng, / gore o itumele, / ka mono o ne o le teng / mo dipogong le maketeng.","Satane, mmaba yo ' ntshwenyang, / a ruri o ka ntshenya? / Ka a le teng yo ' mo kgonang, / o ka se ka a mphenya! / Morwao yo o nthatileng / ke ene yo ' ntueletseng.","Jaanong ke hutsafalelang, / ka ke le modumedi? / Ke Jesu yo ' nkapesitseng / ka bosenang-molato. / Lefatshe ke le le ntenang, / ke ya go phela Modimong."]},{"n":318,"t":"Kriste ke 'phelo jwa me","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K293","v":["Kriste ke 'phelo jwa me, / yo ke mo ineetseng; / mme loso loa nkhumisa, / ke mo boitumelong.","Ke tloga ka lethabo, / ke itse kwa ke yang, / ke ya go Jesu wa me / go nnela ruri teng.","Ee, ke ya kwa go ene / Montshwedi s'fapaanong; / ke tla nna le Morena / ka gale botshelong.","Jaanong ke fentse mono / matlhoko lefatsheng; / ka ona motsi ono / ke ntshiwa maketeng.","Ke bonye bo Mitshwarelo / ka ene yo ' ntshwetseng; / jaanong go boitumelo / pelong le mo moweng.","Fa thata e ntlogela, / ke tsena tlalelong, / go bua go mpalela, / o nkutlwe 'phegelong.","Fa pelo le kgopolo / di fela mo losong, / Morena, o mogolo, / nkgopole mo losong.","A ke huduge jalo / ka fa o laetseng; / loso lo nne thobalo / go ikhutsa lebitleng.","A ke go kgomarele / le gona mo losong, / ke tle ke go phelele / le mo kgalalelong.","Teng koo ke opelela, / ke le legodimong, / Rraarona, Morwa, Mowa, / ke le mo leseding."]},{"n":319,"t":"Go swa ke se se boitshegang","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K294","v":["Go swa ke se se boitshegang / go ba ba mo dibeng. / Ee, ke se se reregisang / ba ba sa dumeleng.","Ke loso lo lo kgweeletsang / baikepi molelong. / Ke lone lo lo fitlhisang / baitshepi 'godimong.","Ke loso lo lo busetsang / mebele leroleng; / ke lone lo lo e isang / phupung le go boleng.","Mme mowa ke o o phelang / le kwa bosakhutleng, / mannong a a galalelang / gongwe kwa moleteng.","Go tla tla Jesu lefatsheng / ka tsheko mo bathong, / go tsosa ba ba robetseng / mo mmung le mo losong.","Go tla tswa botlhe bobipong / jo bo ba bipileng; / go tla tswa botlhe mo losong, / 'fatsheng le mawatleng.","Go tla ya bangwe leseding, / ba bangwe moleteng, / jaaka go tlhaoIwa lesakeng / dinku mo dipoding.","Morena wa me, yo ' ntshwetseng, / fa ke swa bofelong, / a wena yo o nthatileng / o nkise 'godimong."]},{"n":320,"t":"Diphupu mono lefatsheng","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K295","v":["Diphupu mono lefatsheng / di didimetse jang! / Tlhodio yona ga e teng / le tse di huduang.","Tshwenyego e khutlile teng / go ba ba Modimong, / ka ba golotswe maketeng, / ba ikhutsa kagisong.","Ba ile kwa Paradising, / kwa boitumelong; / mme botlhe ba ' ikepileng / ba wetse tshenyegong.","Ba ba swetseng mo tumelong / ke ba ba itsileng, / fa ba tsosiwa mo tsogong / ya ba ba siameng.","Ke sona ' re se ikanyang / le rona bophelong. / Ke sona se ' re nametsang, / fa re tsena losong."]},{"n":321,"t":"Re fitlha mmele lebitleng","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K296","v":["Re fitlha mmele lebitleng, / re ba ba sa belaeleng, / fa o tla tsoga bofelong / go tshela ka go sa feleng.","Ke mmele o o tswang mo mmung, / o tla boela leroleng; / o tla tsosiwa mo phupung, / fa phala e Ila mo marung.","Mowa o phela bosasweng / kwa Modimong, bosakhutleng, / ka o golotswe maleong / ke Jesu mo sefapaanong.","Matsapa a moswi 'fatsheng / le 'pogo di khutlile teng. / O n' a imelwa mo dibeng, / o sule, mme o sa le teng.","Mowa o tshela legaeng, / mmele o bola mo phupung; / mme la bofelo mo tsogong / o tla galalediwa teng.","O n' o le mono pogisong, / o tla ya kwa boitumelong, / o tla phatsima mo bontleng / jaaka letsatsi lefatsheng.","Re o tlogela diphupung, / mme re boela kwa matlong / a rona go ipaakanya teng, / ka re tla swela lefatsheng.","Jesu yo o re golotseng / ka madi a 'gwe mo dibeng, / o tla re disa diphupung, / o tla re tsosateng mo mmung.","Ka moo re ba ' galaletsang / leina la 'gwe thata jang! / Mme re tla mmaka 'godimong, / mogang re tsogang mo losong."]},{"n":322,"t":"Malatsi ke a a fetang","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K297","v":["Malatsi ke a a fetang / ka pele-pele thata jang! / Tota ke mang yo ' a balang, / mang yo o reng: / Loso ke lo ' re okameng?","Bophelo ke jo bo tshwanang / le toro, musi le bojang. / Ke jo bo khutshwafaditsweng / ke Mmopi Mong; / mme motho a nne tebalong.","Ke wena fela yo o leng / Modimo o o sa khutleng. / Ke go ikanya bophelong / le mo losong / ka ene Jesu Kriste Mong.","Mme ka ke sa le lefatsheng, / o nthute, ke nne yo ' balang / malatsi a ke a phelang. / Ntemose, Mong, / se motho o se phelelang.","Dikhumo tse o di tshotseng / ga di go thuse mo losong. / Fa o sa tsene leseding / mo bophelong, / o ya 'fifing le ' sa khutleng.","Tsa mono tse di mphaposang, / tse dintle tse di phatsimang / a di ye koo! Mme mo pelong / le teng mo tlung / a go nne wena, Jesu Mong!","Ee, go tla nna monate jang / mo gae mogang ke go bonang! / O nthute le mo dilelong / le mo thabong / go thatafala tumelong."]},{"n":323,"t":"Fa bana ba tlosiwa","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K298","v":["Fa bana ba tlosiwa / ka loso, ba isiwa / go Rraabo 'godimong, / re a re: Re ba filwe, / e bile re ba tseetswe / go phela ka bosakhutleng.","Ka ba kolobeditswe, / ba be ba tlhapisiwa / maleo mo mading, / jaanong a go molato, / fa Jesu ka lorato / a ba biletsa kwa a teng.","Ngwanyana yo le ene / o sego, ka a tsena / ka pele legaeng: / O tla nna teng kwanyana / ya yo o ratang bana, / ya ' Jesu yo o mo swetseng."]},{"n":324,"t":"Mong wa dinku yo 'disang","c":"Difela tsa Dilo tsa Bofelo: Ka ga Loso","k":"K299","v":["Mong wa dinku yo 'disang / dikwanyana ka boikanyo, / o diretse sentle jang / ngwana yo o suleng jaana! / Ga a fegelwe mo pelong, / ga go sello molomong.","O mo ntshitse mogoteng, / o nageng e e talana. / O apere bontle teng, / diaparo tse ditshwaana. / O ntse nae leseding / go mo tlotla baitsheping.","Jesu Mong, re ise teng / boagong jwa legodimo / gore ngwana yo ' suleng / re kopanngwe nae gape; / mme re phele mo bontleng / mmogo ka bosakhutleng. Bofelo"]},{"n":325,"t":"Ka pelenyana 'bakeng se se tlang sa bofelo","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K300","v":["Ka pelenyana 'bakeng se se tlang sa bofelo, / go tla tla Satan go leka ba e leng badumedi. / Batho, thanyang, / lo rapeleng, lo diseng, / nnang badumedi ba nnete.","Ka pelenyana go tla tla bo-kriste ba maaka, / ba re, ba dira ditshupo le dikgakgamatso. / Ba batla eng? / Go diga ba ' dumelang, / go ikhumisa ka bone.","Ka pelenyana le bone baruti ba maaka / ba tla raela bakriste le go ba faposa. / Se dumeleng, / fa ba re: Kriste ke yo! / le fa ba ka tla ka tšhaka.","Ka pelenyana lorato lo tla tsidifala; / mme ba tla reka, ba tla ja, ba tla nwa, ba nyala. / Se ikanyeng / tse di ratwang lefatsheng. / Ratang Morena bogolo!","Ka pelenyana Morena o tla re golola / mo masuleng a lefatshe, mme o tla re tshola / go ya bontleng / le bosasweng mo Kristeng; / teng re tla phela le ene."]},{"n":326,"t":"Motsi wa dipoitshego","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K301","v":["Motsi wa dipoitshego, / o ka ona bofelong / Jesu o tlang ka tlotlego / go ntsha baswi mo losong. / Ba tla tsoga, ba tla tsoga, / ba ya botlhe kwa tshekong.","Jesu le baengele botlhe / ba tla bonwa mo marung; / mme baphedi mo ntlheng tsotlhe / Ie batsogi diphupung / ba tla ema, ba tla ema / pele ga 'gwe mo marung.","Matlho otlhe a tla bona / Moatlhodi mo tshekong, / yo ' tsileng go betsa bone / ba ba tswang boikepong / go tlhaola, go tlhaola / badumedi mo bathong.","Baikepi ba tla swaba / le go tlhajwa ke ditlhong. / Ba tla leka go mo tshaba, / yo o tlang mo dikgabong / go ba betsa, go ba betsa, / go bawetsa molelong.","Mme ke badumedi fela, / ba ba yang legodimong / go nna teng le 'go direla / Jesu mo boitumelong; / go opela, go opela / Haleluya bophelong."]},{"n":327,"t":"Modimo, se re se bonang","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K302","v":["Modimo, se re se bonang / se a re gakgamatsa. / Letsatsi le mo lefifing, / mme batho ba tshogile. / Bokhutlo ke jo bo tsileng / jwa tsotlhe tse di lefatsheng, / jaanong dia fedisiwa.","Bonang Morena yo o tlang; / o boitshega ruri! / Utlwang trompeta e e Ilang, / diphupu dia bulega. / Go tsoga baswi ba ba teng, / ba bilediwa lekgotleng / la tsheko ya bofelo.","Mme baswi ba ba tumelong, / e tla re ba tsosiwa, / ba tlhatlogele 'godimong, / mme gona ba tla fiwa / go bona Jesu mo troneng, / mo bontsing jo bo sa balweng, / ba mo dikanyeditse.","Ga go poifo epe teng, / ba itumela botlhe / mo kagisong e ' sa khutleng, / ba le loratong fela. / O tla nna nabo leseding, / o tla ba isa metsweding / ya metsi a bophelo.","Modimo, se re se bonang / se a re gakgamatsa. / Letsatsi le mo lefifing, / mme batho ba tshogile. / Ke itatlhela s'fapaanong, / ke tlhoafetse thapelong / go ya ke mo kgatlhantshe."]},{"n":328,"t":"Go tshwanetse ga swa botlhe","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K303","v":["Go tshwanetse ga swa botlhe / ba ' phelang mo lefatsheng, / go swa jaaka dilo tsotlhe, / ga go ope yo ' sa sweng.","Baswi bone ba tla utlwa / pitso ba le diphupung, / ba tla tsoga, ba ya mmogo / kwa tshekong e ' mo marung.","Mowa wa me, a ko ' tsoge / le letsatsi mo mosong, / o apole podufalo, / o ineele thapelong.","Metlha eno e tla fela / le ditiro lefatsheng; / mme kwa pele re tla roba / ka fa re jwetseng ka teng."]},{"n":329,"t":"Jesu ke yo o fenyang","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K304","v":["Jesu ke yo o fenyang / ba ba tlhabanang le ene, / e le ba ba tla bewang / tlase ga dinao tsa 'gwe. /Jesu ke yo ' re isang / leseding go tswa 'fifing."]},{"n":330,"t":"Ao, tsogang, lesang thobalo!","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K305","v":["Ao, tsogang, lesang thobalo! / Badisa ba re bitsa jalo. / Ba ga Jerusalem, tsogang! / Jaana ke bosigogare. / Monyadi ke yo, lo apare. / Tsayang dipone lo tlogeng. / Yang lo mo kgatlhantsheng, / ba lo tlhalefileng! / Haleluya! / Iketleetseng / mo dipelong / go ya nyalong e ' sa feleng!","Sion o utlwile pitso, / oa tsoga, oa itlhaganela, / a itumetse mo pelong. / Ka go tsile Kgosi ya 'gwe, / e ' phatsimang jaaka naledi, / e tlhaga kwa legodimong. / Tlaa, Jesu, yo ' nthatang, / o ntseele kwa o yang. / Hosiana! / Selalelong, / legodimong / re tla nna nao lethabong.","A difela di opelwe / ke batho le ke baengele / go tlotla wena mo troneng. / Motse ona ke wa gouta; / dikgoro ke tsa diperela; / re tla nna fa baengeleng. / Ga go na yo ' bonyeng, / ga go yo ' utlwileng / thabo eo. / A re thabeng, / re opeleng / difela le Haleluya!"]},{"n":331,"t":"Ke itumella thata jang","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K306","v":["Ke itumella thata jang / sebaka sa go tsoga, / go bona Jesu yo o tlang / go ntsaya, go nkgorosa / legodimong, / mo masomong / a bone batlhaolwi, / a bone badumedi.","Mme ke eletsa mo pelong / letsatsi la kgololo; / ke le le intumedisang, / ke dirwa motho ' mošwa. / Legodimong, / kgalalelong / ke tla nna le bophelo / jo bošwa jwa boipelo.","Ee, ke dumela mo pelong, / ga nke ke swela ruri, / ka Kriste yo o tsogileng / a tla tla le go ntsosa. / Le mo tshekong, / mo bokhutlong / ga nka ke ka tlalelwa, / ka Jesu a nkemela.","Ke lebeletse bofelong / tuelo ya tumelo / le go phatsima 'godimong / ka krone ya bophelo. / Tlaa, Jesu, tlaa / o nkise kwa / bosweng jwa legodimo, / go phela le Modimo."]},{"n":332,"t":"Go tla tla ruri tshekelong","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K307","v":["Go tla tla ruri tshekelong / ene Morwa Modimo; / o tla tla mo kgalalelong, / o tla atlhola botlhe. / Foo go nne mang yo o tshegang, / motlhang o tsotlhe di tukang / jaaka Petro a kwala. [2. Pet. 3,7]","'Trompeta di tla lela teng / dintlheng tsa 'fatshe lotlhe; / mme go tla tsoga diphupung / ka pele baswi botlhe. / Mme ba ba sa leng bophelong / ke bone ba ba fetolwang / ka lone 'tsatsi leo.","Mme go tla balwa mo bukeng / maina a ba botlhe / le 'tiro tse di dirilweng / ke batho 'fatsheng lotlhe. / Ke fa go tla tswelang ' seding / tse di diretsweng sephiring / ke mongwe le yo mongwe.","Joo wee ene yo ' nyaditseng / Lefoko la Morena; / a batla fela lefatsheng / dithoto le dikhumo! / O tla atlholwa mo tshekong, / a ya le Satan moleteng / wa mollo o mogolo.","Ao Jesu, thusa tlalelong / ya tsheko ya bofelo / ka ntlha ya dintho tsa 'go, Mong, / gore leina la me / le bonwe gona mo bukeng / ya gago, e o kwadileng / baitshepi mo go yona.","Kea kopa yo ke tlhaelang: / o mpuelele gona / motsing wa tsheko e e tlang, / gore ke ye le bone / ba gago ba baitshenketsweng / go tsena nabo legaeng / la gago la bodimo.","Ao Jesu, o diega jang / ka 'tsatsi la bofelo! / Tlaa tlhe, re ba ba tshwenyegang / fatsheng ka ditlalelo. / Re go tlhologeletswe, Mong; / akofa, Jesu, tlaa tshekong, / o re golole. Amen."]},{"n":333,"t":"Tsogang tlhe, badumedi","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"K308","v":["Tsogang tlhe, badumedi, / dipone di tshubeng! / Letsatsi lea phirima, / re tsena bosigong. / Monyadi o ipaakantse, / ke yo o gorogang / go le bosigogare. / Disang lo rapeleng!","Dipone a di tuke, / tshelang mafura teng! / Siamisang dipelo, / pholoso e le teng! / Badisa ba dithako / ke gona ba kuang / ba re: O atametse. / A re mo kgatlhantsheng!","Ee, makgarebe otlhe / ba lo tlhalefileng, / lo lelaleng godimo / tsogang, mo kgatlhantsheng! / Lenyalo le baakantswe, / tsenang mo mojakong, / ke oo, lo o buletswe / ke yo o lo ratang.","O fa gaufi thata, / tsogang mo borokong! / Lo se ka Iwa otsela, / mmoneng, o fa kgorong! / Ditlhare di tlhogile, / ke gona re itseng: / Selemo se fitlhile, / a re itumeleng.","Itshupeng lo bonale / fa pele ga yo ' tlang; / mokriste yo ' botlhale / a e nne yo ' disang! / Morena o tla betsa / ba ba mo nyaditseng. / Mme go tla itsietsa / yo o sa dumelang.","Ba lo neng lo itshoka, / lo le ba ba bogang, / o tla tla go lo tseela / kwa ene a leng teng. / Lo tla nna leorena / mo boitumelong, / lo busa teng le ene, / ka lo le ba ' fentseng.","Teng ruri re tla bona / tse di gakgamatsang, / e bong legae la ona / le le galalelang. / Mebila ke ya gouta, / ke e e phatsimang, / dithako di gadima / ka majwe a ' kgatlhang.","Morena Jesu Kriste, / o se diege, Mong; / o 'tsatsi, re tlhabele, / o re ntshe tlhabanong. / Re go tlhologeletswe / ba re go rapelang. / Fedisa ditlalelo, re ise 'godimong."]},{"n":334,"t":"Kagiso e monate","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"H164","v":["Kagiso e monate, / fa e le phuthegong, / fa botlhe ba ratana, / ba ba mo tumelong.","Lesego la Modimo / le ella dipelong / tsa batho ba ga Jesu, / ba ba mo kagisong.","Jerusalem o mošwa, / ba tla nna mmogo teng, / ka 'rato le kagiso, / le ka bosakhutleng.","Ee, rotlhe re tla tsena / ka Jesu bogosing, / re tla nna mmogo gona / ka gale Moreneng.","Ee, rotlhe re tla tsena, / ba re mo dumelang, / re tla nna letsomane / le a le fudisang."]},{"n":335,"t":"Mo lebogeng! Ee, mo lebogeng!","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"H172","v":["Mo lebogeng! Ee, mo lebogeng! / Morena! Gonne ke ene ruri yo o re thusang, / ke yo o re thusang, le ka go sa feleng.","A re mmakeng! Morena mmakeng! / Ao mowa wa me o se lebale yo ' go tlametseng; / yo o go tlametseng, yo o go tlametseng.","Mo Moreneng botlhale bo teng / le thata yotlhe; o pelonolo e ' sa fetogeng; / e e sa fetogeng, e e sa fetogeng.","O kana ka'ng! O boitshepo jang! / Mafatshe otlhe a tletse ruri tlotlo ya 'go, Mong; / tlotlo ya gago Mong, tlotlo ya gago Mong.","Mo ineeleng! Mo obameleng! / Mme leina la 'gwe re bitse lone re le thapelong; / re mmitse thapelong, re mmitse thapelong.","Mo opelleng! Mo opeleleng, / Morena yo o utlwang dipako a le godimong; / a le legodimong, a le legodimong."]},{"n":336,"t":"Poloko e ntiragaletse","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"H173","v":["Poloko e ntiragaletse / ka tshwaro e sa ntshwanelang. / Ke eme fa ke gakgametse! / Modimo o molemo jang! / Ke gona ke itumelang, / Ke tshwaro e ke e bakang.","Ke ne ke itiretse petso / 'fatsheng le ka go sa feleng; / Modimo o o leng Rraa- rona, / ke ona o o nthatileng. / Ke gona ke itumelang. / Ke tshwaro e ke e bakang.","A ga se tshwaro fa go ntshwela / Morwa-Modimo Golgotha. / Ke tshwaro fa a nthapelela, / a re, mo itshwarele, Rra. / Ke gona ke itumelang. / Ke tshwaro e ke e bakang.","Boitshwarelo jo jwa gago / ke bo dumela mo pelong, / ke bo ikanya, ke le wa ' go / mo bophelong le mo losong. / Ke gona ke itumelang. / Ke tshwaro e ke e bakang.","Ee, tshwaro e e tla nthudisa / fa ke ngatega tlalelong / ya go swa, mme e tla mphitlhisa, / kwa gae kwa mo letshegong. / Ke gona ke itumelang. / Ke tshwaro e ke e bakang."]},{"n":337,"t":"Jaana re a phatlalala","c":"Difela tsa Dilo tsa Bofelo: Ka ga Letsatsi la Bofelo","k":"H175","v":["Jaana re a phatlalala, / re tswa mono kerekeng. / A re neng ba ba tla salang / ba ga Jesu malapeng. / Haleluya, Haleluya! / Bakang Kwana; Gloria!","Jesu o re tlamaganye, / yo o re tshegofatsang, / re se khutle go ratana / ka lorato lo 'tukang. / Haleluya ...","Ee, Morena, re tla batla / go nna ba ba go ratang; / re tla leka go go kgatlha, / re le ba ba ratanang. / Haleluya ...","Le fa jaana re phatlalla / re boela magaeng, / re ipofa fa go sala / ba Morena mo moweng. / Haleluya ... sa khutleng"]},{"n":338,"t":"Ba bantsi jang legodimong","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"K309","v":["Ba bantsi jang legodimong, / ba ba leng mo kgalalelong! / Ba dule teng mo ditšhabeng / tse tsotlhe tse di lefatsheng.","Baitshepi ba ba 'godimong, / ba ba mo boitumelong, / ba ne ba tshwana lefatsheng / le rona ba re mo dibeng.","Ba itshokile dipogong, / go ya ba tsene mo losong; / jaanong ke ba ba kgabileng / ka 'kobo tse di itshekileng.","Ga go na tlala kwa ba teng, / ga go na yo o nyorilweng; / malwetse a re a bonang / ga se a a ka ba amang.","Morena, thusa re ye teng / go phela nao bosasweng, / go go leboga kopanong / ya baitshepi 'godimong."]},{"n":339,"t":"Ba botlhe ba ba tla swelang","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"K310","v":["Ba botlhe ba ba tla swelang / Morena lefatsheng, / ka e le ba ba dumelang, / ba tla ya bosasweng.","Ba tla nna kwa Paradising, / ba le mo leseding. / Mme bone ba ' swelang dibeng, / ba tla ya lefifing.","Ka e le ba ba sa itseng / yo o ba tlamelang / le Jesu yo o ba swetseng, / ke ba ba latlhegang.","Ga ba na sepe lefatsheng / se se ka ikanngwang, / le mo losong ga se yo teng, / se se ba gomotsang.","Go phela jalo mo dibeng / ke mo go boitshegang; / go swela mo dibeng 'fatsheng, / gona go tshosa jang!"]},{"n":340,"t":"O nkise kwa ke tla utlwang","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"K311","v":["O nkise kwa ke tla utlwang / kopelo ya baengele: / Legodimong, kgalalelong, / kwa go leng teng / boitumelo ruri.","Ao motho, tsoga thobalong, / o leke go ka tsena. / Morena ke yo ' go thusang / go tsena teng, / go ya go mmaka gona.","Sebaka sa mo boleong / se fela ka bonako. / Sokologela Modimong, / o le sellong / go kopa boitshwarelo.","Fa o leng teng, o robetseng / 'sigong le motshegare, / kopa go bona thapelong / mo Modimong / boikwatlhao fela.","Ka pelo e e botlhokong / o mo rapele jaana: / \"Rara yo o legodimong, / ke boleong, / ke kopa, o se ntatlhe!\"","Modimo o ' ikanyegang / o tla go itshwarela. / Mme o tsholela bophelong / ' bo sa feleng / yo ' katogang boleo.","O tla nna kwa Paradising / mo gare ga bafenyi, /go bona yo ' go ratileng, / yo ' golotseng / wena ka madi a 'gwe.","O tla leboga Rara teng / mmogo le ene-Morwa / le Mowa o ' itshepileng; / Modimo Mong, / o mo tsisetsa pako."]},{"n":341,"t":"Ke mosepedi bophelong","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"K313","v":["Ke mosepedi bophelong, / mme ke ya kwa legodimong, / kwa go Jerusalem o mošwa; / o ' theilweng koo mo mading / a kgolagano Golgoteng, / kwa Jesu o re swetseng gona. / Ke mosepedi bophelong, / mme ke ya kwa legodimong.","Ee, ke tlogela lefatsheng / tse tsotlhe mo ke phelang teng; / ga nkitla ke boela kwano. / Mme ke ya kwa bosakhutleng, / ao Jesu, mpaakanyetse teng! / A ko o bule matlho a me, / ke nyatse dilo lefatsheng, / ke batle tse di sa feleng.","Tshepelo yotlhe lefatsheng / ke e e thata mo mmeleng; / ga ke sepele ka monate; / ka ke sepela mo direng / ke tse di mphaposang tseleng, / ke kgotšwa gantsi ke matlapa. / Ee, ke sepela mo nageng / e ' timetsang, e bong 'fatsheng.","Le fa ka kwano lefatsheng / ke le yo o sa itsiweng / legodimong go teng ditsala. / Koo ke tla baka masomong / a bone ba ba polokong, / ba go direla, ba ratana. / Ao Jesu, tla, o diegelang? / Ntsholele gona kwa o leng teng."]},{"n":342,"t":"Jerusalem yo o legodimong","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"K314","v":["Jerusalem yo o legodimong, / ke tla go bona leng? / Ke go tlhologeletswe mo pelong, / ka ke le mo boeng. / Ke rata go tlogela / tse tsotlhe lefatsheng / le go fofela gona, / kwa wena o leng teng.","Letsatsi Ie Mo le ke tla gololwang, / le tla bonala leng? / Letsatsi le ka lone ke neelang / mowa mo diatleng / tsa gago, ao Morena, / yo ke go ikanyang? / A o ye kwa go wena / bontleng kwa leseding!","E tla re ke tswa mono lefatsheng, / ke tsena mo losong, / mowa o tla isiwa bosasweng / le kwa kgalalelong / ka tsela ya ' Elia, / e le o ' kukilweng / ke bone baengele, / ba o isa legaeng.","Dumela, motse o o phatsimang! / Dikgoro, ipuleng! / Ke go tlhologeletswe thata jang, / ke sa lelefatsheng, / ke ise ke gololwe / mo boithamakong, / ke ise ke bolole / go tsena boikhutsong.","Mme ke bonang? Ke batho ba ' ntseng jang, / ba ba nkgatlhantshang teng? / Ke batlhaolwi ba ba phatsimang, / ke ba ba sa balweng. / Ba ba neng ba tshwenyega / ke ba baitumelang; / ba ba neng ba nyatsega / jaanong ba kgatlha jang!","Baporofeti, borra tumelong / le ba ba dumetseng, / ba ba kileng ba boga lefatsheng, / e le ba ' tlhoilweng, / e bile ba nyatsega, / jaanong ba mo tlotlong, / ba iketlile botlhe, / ba tshela leseding.","Mme fa ke sena go goroga teng / ka mo Paradising, / ke tla bo ke le boitumelong, / ke le yo o bakang, / ke bitsa Haleluya, / ke letsa harpe teng, / ke boka ka Hosiana / Mong ka bosakhutleng."]},{"n":343,"t":"Ke batla legae mo nka ikhutsang.","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"H132","v":["Ke batla legae mo nka ikhutsang. / Le kae? Ke mang yo ka mpolelelang? / 'Fatsheng ke mojaki yo tshwenyegileng / moeng le moeti yo o lapileng. / Nnyaa, nnyaa, nnyaa, nnyaa, ga le 'fatsheng / legae la motho le mo leseding.","Tlogela lefatshe go fitlha gaeng, / o baakanyeditswe ke Jesu kwa teng. / Jerusalem o le o o phatsimang / ke ona legae kwa legodimong. / Ee, ee, ee, ee, ona 'seding, / ke ona legae kwa re ikhutsang.","Boikhutso bo pila teng mo leseding, / botlhoko le loso ga di yo kwa teng. / Go tshegofaditswe yo o tla tsenang, / go Jesu Morena, yo o re ratang. / Ee le Amen, ke ya 'seding, / ke tla nna k' ikhutsa mo Paradiseng."]},{"n":344,"t":"Kwa kgakala lefatshe le teng","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"H134","v":["Kwa kgakala lefatshe le teng / le le pila le le phatsimang; / ene Jesu o isa kwa teng / batho ba 'gwe ba ba dumelang. Chorus: Ke ka moo / lo thabeng / re tla tsena 'fatsheng lentle jang/ ke ka moo / lo thabeng, lo thabeng, re tla tsena 'fatsheng lentle jang.","Teng koo botlhe ba mo kagisong, / Jesu ke yo ba mo opellang, / go se sepe se se ba tshwenyang, / jalo botlhe ba mo boitumelong. Chorus: Ke ka moo lo thabeng ...","Teng go bontsi jo bo sa balweng, / ba ba bakang yo o mo troneng, / ene Rara yo o romileng, / Morwaa-ona yo ' re ratileng. Chorus: Ke ka moo lo thabeng ..."]},{"n":345,"t":"Gae la me le kwa godimong","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"H136","v":["Gae la me le kwa godimong / kwa go leng boitumelo Jesung, mo Jesung, / kwa baitshepi ba bakang 'seding / ba ba
