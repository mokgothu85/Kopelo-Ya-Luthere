var DA=[["Tsa dipaka tsotlhe", [[1, "Kopang, mme lo tlaa amogela, Haleluya!", "gore boitumelo jwa lona bo tlale. Haleluya!"], [2, "Bitsa Modimo mo 'tsatsing la tlalelo. Hal.!", "O tlaa go golola, mme o tlaa o galaletsa. Haleluya!"], [3, "Thapelo ya baitekanedi e natefela Morena. Haleluya!", "O utlwa thapelo ya mosiami. Haleluya!"], [4, "Morena o gaufi le bona botlhe ba ba mmitsang. Haleluya!", "Bona botlhe ba ba mmitsang ka boammaaruri. Haleluya!"], [5, "A Morena a re gopole, a re tshegofatse!", "A a tshegofatse ba ba boifang Morena, ba bagolo le ba bannye."], [6, "Thuso e bonwa kwa Moreneng. Haleluya!", "Le tshegofatso ya gagwe mo bathong ba gagwe. Haleluya!"]]], ["Tsa Disontaga le tsa Meletlo", [[7, "A Morena a nne le lona!", "A a nne le moya wa gago!"], [8, "Le ke letsatsi le Morena a le dirileng; a re itumeleng, re ipeleng mo go lone!", "Ao Morena, boloka, ao Morena, naya botswelelo-pele!"], [9, "Nayang Jehofa tlotlo ya leina la gagwe! Haleluya!", "Obamelang Jehofa mo mafelong a boitshepo a kgalalelo. Haleluya!"], [10, "Direlang Jehofa ka boitumelo! Haleluya!", "Tlaang fa pele ga sefatlhego sa gagwe ka kopelo! Haleluya!"]]], ["Morago ga Selalelo sa Morena", [[11, "Lebogang Jehofa, gonne o molemo! Haleluya!", "Gonne boitshwarelo jwa gagwe bo ka bosena-bokhutlo. Haleluya!"], [12, "Baka Jehofa, moya wa me. Haleluya!", "Le tsotlhe tse di mo teng ga me, bakang leina la gagwe le le boitshepo. Haleluya!"], [13, "Lekang lo bone, fa Jehofa a le molemo! Haleluya!", "Go sego monna yo o mo ikanyang. Haleluya!"]]], ["Tsa Atfente", [[14, "Baakanyang tsela ya Morena! Haleluya!", "Siamisang ditselana tsa gagwe! Haleluya!"], [15, "Lorato lwa Modimo lo bonetse mo go rona ka sona se, ka o romile Morwaa ona, Haleluya!", "gore re phele ka ene. Haleluya!"]]], ["Tsa Moletlo wa Botsalo jwa Morena", [[16, "Kgalalelo a e nne ya Modimo kwa bogodimodimong! Haleluya!", "Le kagiso mo lefatsheng le natefo mo bathong. Haleluya!"], [17, "Gompieno lo tsaletswe Mmoloki. Haleluya!", "Yo e leng Kriste Morena, mo motsengwa ga David. Haleluya!"], [18, "Ngwana re mo tsaletswe. Haleluya!", "Morwa re mo neilwe. Haleluya!"], [19, "Lefoko la nna nama. Haleluya!", "Mme la aga mo go rona! Haleluya!"], [20, "Bosaitsiweng jwa poifo-Modimo bo bogolo. Haleluya!", "Modimo o bonaditswe mo nameng. Haleluya!"], [21, "Kriste o dule mo go borara kafa nameng. Haleluya!", "Yo e leng Modimo bogolo go botlhe, yo o bakwang ka bosakhutleng. Haleluya!"]]], ["Tsa Ngwaga o Moša", [[22, "Morena, kgabisa ngwaga ka molemo wa gago.", "Mme a ditselana tsa gago di rothe monono."], [23, "Ke bopelonomi jwa ga Jehofa, fa re sa nyelediwa. Haleluya!", "Gonne mautlwelo-botlhoko a gagwe ga a ise a khutle. Haleluya!"], [24, "Ditsela tsotlhe tsa ga Jehofa di bopelonomi le boammaaruri. Haleluya!", "Go bone ba ba bolokang kgolagano le ditshupo tsa gagwe. Haleluya!"], [25, "O tlaa nkgoga ka kgakololo ya gago. Haleluya!", "Mme morago ga moo o tlaa ntshola ka tlotlo. Haleluya!"]]], ["Tsa Moletlo wa Ponatshego", [[26, "Lebogang Rara, yo o re golotseng mo thateng ya lefifi. Haleluya!", "Mme a re tsenya mo bogosing jwa Morwa wa lorato lwa ona. Haleluya!"], [27, "Gonne lo kile lwa bo lo le lefifi, mme jaanong lo lesedi mo Moreneng.", "Tsamayang jaaka bana ba lesedi."]]], ["Tsa Dipogiso", [[28, "Lo tsamae mo loratong jaaka Kriste le ene a lo ratile.", "Mme a ineela ka nosi go supelwa le go tlhabelwa Modimo ka ntlha ya rona."], [29, "Morena, jaanong o naya motlhanka wa gago tsela, gore a ye ka kagiso.", "Ka gonne matlho a me a bonye poloko ya gago."], [30, "Kriste o na a kweneseledlwa ditlolo tsa rona,", "a ketekelwa ditshiamololo tsa rona."], [31, "Petso e e re diretseng kagiso e ne e le mo go ene.", "Mme re fodisitswe ka dingalo tsa gagwe."], [32, "Morena o mo tsiseditse tiro ka maleo a gago.", "O mo lapisitse ka tshiamololo ya gago."], [33, "Modimo ga oa rekegela Morwaa ona ka osi.", "Mme o mo neetse ka ntlha ya rona rotlhe."], [34, "Kriste o belege maleo a rona ka nosi ka mmele wa gagwe mo logonnyeng,", "gore rona, ka re sule ntlheng ya boleo, re phelele tshiamo."], [35, "Kriste o ratile phuthego.", "A ineela ka esi ka ntlha ya yona, gore a e itshepise."], [36, "Kriste o swetse botlhe gore ba ba phelang ba se tlhole ba iphelela.", "Mme ba phelele ene yo o suleng, a ba a tsosiwa ka ntlha ya bona."], [37, "Kriste o bogisitswe ka ntlha ya rona.", "A re tlogelela sekao gore re mo latele mo dikgatong tsa gagwe."], [38, "Ke lefoko la boikanyo le le tshwanetseng kamogelo yotlhe, fa Kriste Jesu a tsile mo lefatsheng.", "Go boloka baleofi."]]], ["Tsa Donertaga wa Selalelo", [[39, "Ka gale fa loo ja senkgwe se, mme loo nwa senwelo se,", "loa bo lo itsise loso lwa Morena."], [40, "O diretse dikgakgamatso tsa gagwe segopodiso.", "Jehofa o boitshwarelo le boutlwelo-botlhoko."]]], ["Tsa Freitaga wa Tidimalo", [[41, "Bonang, Kwana ya Modimo,", "e e tlosang boleo jwa lefatshe!"], [42, "Kwana e e tlhabilweng e na le tshwanelo ya go tshola nonofo le khumo le botlhale le thata –", "le tlotlo le kgalalelo le tebogo."], [43, "Yo o neng a sa itse boleo, Modimo o mo re diretse boleo,", "gore rona re nne tshiamo ya Modimo mo go ene."], [44, "Modimo o re diretse Kriste Jesu botlhale jwa Modimo", "le tshiamo le boitshepiso le kgololo."]]], ["Tsa Moletlo wa Tsogo ya Morena", [[45, "Kriste o neeletswe losong ka ntlha ya ditlolo tsa rona. Haleluya!", "Mme a tsosiwa ka ntlha ya tshiamo ya rona. Haleluya!"], [46, "Loso, lobolela lwa gago lo kae? Loso, phenyo ya gago e kae? Haleluya!", "A Modimo o lebogwe, o o re nayang phenyo ka Morena wa rona, Jesu Kriste! Haleluya!"], [47, "Kriste o nyeleditse loso. Haleluya!", "Mme a baya bophelo le bosasweng mo leseding. Haleluya!"], [48, "Kea itse, fa Morekolodi wa me a phedile. Haleluya!", "O tlaa tsoga morago mo leroleng. Hal.!"], [49, "Ke mang yo o atlholang? Kriste Jesu o sule. Haleluya!", "Ee, bogolo o bile o tsositswe. Haleluya!"]]], ["Tsa sebaka sa difako", [[50, "Jehofa, re supetse bopelonomi jwa gago.", "Mme lefatshe la rona le tlaa ungwa leungo la lone."], [51, "Matlho a tsotlhe a go lebile, Morena. Haleluya!", "Mme o di fa dijo tsa tsona mo motlheng wa tsona. Haleluya!"], [52, "Morena, o nosa dithaba go tswa maagong a a godimo. Haleluya!", "Lefatshe le kgora leungo la ditiro tsa gago. Haleluya!"]]], ["Tsa Moletlo wa Tlhatlogo", [[53, "Modimo o tsositse Kriste mo baswing, mme wa mo naya kgalalelo, Haleluya!", "gore tumelo ya lona le tsholofelo e nne mo Modimong. Haleluya!"], [54, "Legae la rona le mo legodimong. Haleluya!", "kwa ebileng re lebeletse Mmoloki go tswa teng, ebong Jesu Kriste, Morena. Haleluya!"], [55, "Batlang he tse di kwa godimo, kwa Kriste o leng teng, a ntse fa seatleng se se siameng sa Modimo.", "Gopolang dilo tse di kwa godimo, eseng tse di mo lefatsheng."], [56, "Kriste o nonofile go boloka ka botlalo ba ba atamelang Modimo ka ene, Haleluya!", "ka a phela ka gale go ba rapelela. Hal.!"], [57, "Kriste o tsenye mo legodimong, Haleluya!", "gore jaanong a bonale fa pele ga sefatlhego sa Modimo ka ntlha ya rona. Haleluya!"]]], ["Tsa Moletlo wa Kgoromeletso ya Moya o o Boitshepo", [[58, "Modimo, bopa pelo e e boitshepo mo go nna,", "o ntšhafatse moya wa tlhomamo teng ga me."], [59, "Morena, re rute go dira thato ya gago, gonne o Modimo wa rona;", "Moya wa gago o o molemo, a o re gogele mo lefatsheng le le se nang dikgopi."], [60, "Modimo o ratile lefatshe jaana, Haleluya!", "ka o bile wa le neela Morwaa ona yo o tsetsweng a le esi. Haleluya!"], [61, "Gonne botlhe ba ba gogwang ke Moya wa Modimo ke bone bana ba Modimo.", "Mme fa re le bana, foo ebile re barua-boswa, ebong barua-boswa ba Modimo le barua-boswa mmogo le Kriste."], [62, "Modimo ga oa ka wa re naya moya wa poifo,", "mme e le wa thata le wa lorato le wa tekano."], [63, "Se re latlhe fa pele ga sefatlhego sa gago.", "Se tlose Moya o o Boitshepo wa gago mo go rona."], [64, "Boa o re nee boitumelo jwa poloko ya gago", "A Moya wa tlhomamo o re tshegetse."]]], ["Tsa Moletlo wa Trinitate", [[65, "Re baka Modimo Rara le Morwa le Moya o o Boitshepo. Haleluya!", "Mme re o tumisa go ya bosakhutleng. Haleluya!"], [66, "Go boitshepo, go boitshepo, go boitshepo Jehofa wa dintwa. Haleluya!", "Lefatshe lotlhe le tletse kgalalelo ya gagwe. Haleluya!"], [67, "A go bakwe Morena, Modimo wa Israele. Haleluya!", "Gonne o lekotse batho ba gagwe, mme o ba diretse thekololo. Haleluya!"], [68, "Jehofa, ke lebelela poloko ya gago.", "Mme ke diragatsa ditaolo tsa gago."], [69, "Pelo ya me e godisa Morena, Haleluya!", "mme moya wa me o ipela mo Modimong, Mmoloki wa me. Haleluya!"], [70, "Morena yo o thata o re diretse tse dikgolo. Haleluya!", "Leina la gagwe le boitshepo. Haleluya!"], [71, "Boutlwelo-botlhoko jwa Morena bo mo go botlhe. Haleluya!", "Ba ba mmoifang mo ditshikatshikeng. Haleluya!"]]], ["Ka Moletlo wa baengele", [[72, "Morena o laetse baengele ba gagwe kaga gago, Haleluya!", "gore ba go boloke mo 'tseleng tsotlhe tsa gago, Haleluya!"], [73, "Moengele wa ga Jehofa o thibelela mo ntlheng tsotlhe tsa ba ba mmoifang. Haleluya!", "Oa ba golola. Haleluya!"]]], ["Ka malatsi a Boikwatlhao le dipaka tse dingwe. Boitshwarelo jwa dibe.", [[74, "Morena, o se re direle kafa dibeng tsa rona.", "Mme o se re direle kafa ditshiamololong tsa rona."], [75, "Jaaka ke phedile, go bua Jehofa Morena, ga ke kgatlhwe ke loso lwa moikepi.", "Mme gore moikepi a tlhabologe, a phele."], [76, "Morena, re tlhabolose, mme re tlaa bo re tlhabologile.", "Gonne o Jehofa, Modimo wa rona."], [77, "Ntlhotlhomisa, Modimo, mme o itse pelo ya me!", "Nteka, mme o itse megopolo ya me."], [78, "Re thuse, Modimo wa poloko ya rona, ka ntlha ya kgalalelo ya leina la gago.", "Re golole, mme o re itshwarele dibe tsa rona ka ntlha ya leina la gago."], [79, "Morena, o se tsene mo tshekisong le batlhanka le malata a gago.", "Gonne ga go mophedi ope yo o siameng fa pele ga sefatlhego sa gago."], [80, "Modimo, o nne boitshwarelo go rona kafa bopelonoming jwa lorato.", "Tlosa ditlolo tsa rona kafa bogolong jwa boutlwelo-botlhoko jwa gago."]]], ["Dipaka tsa tlalelo", [[81, "Modimo, re nee kagiso mo lefatsheng.", "Boitumelo le tshegofatso bathong botlhe."], [82, "Morena, boloka rona, batho ba gago, mme tshegofatsa boswa jwa gago.", "Re fudise, mme o re tshole ka bosakhutleng."]]], ["Puso ya Modimo", [[83, "Jehofa, nthuta tsela ya gago, gore ke tsamae mo boammaaruring jwa gago.", "Kopanya dipelo tsa rona le poifo ya leina la gago."], [84, "Morena, re etleeletse 'tirong tsotlhe tsa molemo, gore re dire thato ya gago.", "Dira mo go rona se se go kgatlhang ka Jesu Kriste."], [85, "Modimo wa bopelotlhomogi jotlhe a o re dire botlalo le go re tiisa le go re thatafatsa le go re tlhomamisa.", "Thata ke ya ona le kgalalelo go ya bosakhutleng jwa bosakhutleng."]]], ["Tlamelo ya Lefoko la Modimo", [[86, "Rara yo o Boitshepo, re itshepise mo boammaaruring!", "Lefoko la gago ke boammaaruri."], [87, "Morena, boloka Lefoko la gago mo go rona!", "Lefoko la gago ke boitumelo le kgomotso ya dipelo tsa rona."], [88, "Lefoko la gago ke lobone 'naong tsa me, Haleluya!", "le lesedi tseleng ya me. Haleluya!"]]], ["Kereke ya Modimo", [[89, "Morena, femela batho ba 'atla sa gago se se siameng, ba o ba itshenketseng.", "Jalo ga re kitla re go hularela, mme re tlaa bitsa leina la gago."], [90, "Modimo o thusitse Israele, motlhanka wa ona. Haleluya!", "Ka go gakologelwa boutlwelo-botlhoko. Haleluya!"], [91, "Modimo ke botshabelo le thata ya rona. Haleluya!", "O thuso e e gaufi ruri mo tlalelong. Haleluya!"]]], ["Tumelo le Lorato", [[92, "Morena, a Kriste a age mo dipelong tsa rona ka tumelo,", "gore re name medi le go theiwa mo loratong."], [93, "Morena, diragatsa mo go rona natefo yotlhe ya molemo wa gago.", "Le yona tiro ya tumelo ka thata."], [94, "Bonang, go molemo jang, fa bana ba motho ba agisantse!", "Jehofa o laoletse tshegofatso teng le bophelo ka bosena-bokhutlo."], [95, "Morena, o re atisetse le go re totisetsa thatano,", "gore dipelo tsa rona di tlhomame, di se na molato mo boitshepong."], [96, "Tebo ya taolo ke lorato lo lo tswang mo pelong e e itshekileng,", "le mo segakoloding se se molemo le mo tumelong e e se nang boitimokanyo."]]], ["Go lebogela dineo tsa Modimo", [[97, "Ke tlaa baka Jehofa, ka ke sa phedile. Haleluya!", "Ke tlaa opelela Modimo wa me ka dipako, ka ke sa le teng. Haleluya!"], [98, "A re bakeng Jehofa. Haleluya!", "A re godiseng leina la gagwe mmogo. Haleluya!"], [99, "Morena, ba ba go batlang a ba itumele, ba ipele mo go wena. Haleluya!", "Ba ba ratang poloko ya gago a ba bue ka gale ba re: Modimo a o godisiwe! Haleluya!"], [100, "Morena, bula dipounama tsa me,", "gore molomo wa me o bolele pako ya gago."], [101, "Morena, tsotlhe tse di mo legodimong le mo lefatsheng ke tsa gago. Haleluya!", "O busa mo go tsotlhe, mme nonofo le bonatla di mo 'atleng tsa gago. Haleluya!"], [102, "Jehofa, ditiro tsa gago di dikgolo, di dintsi jang! Haleluya!", "O dirile tsotlhe ka botlhale. Lefatshe le tletse mahumo a gago. Haleluya!"], [103, "A go bakwe Morena ka malatsi otlhe! Haleluya!", "O re rwesa merwalo, mme ebile oa e re rwadisa. Haleluya!"], [104, "Modimo ke ona Modimo wa poloko ya rona. Haleluya!", "Le Jehofa Modimo o o ntshang mo losong Haleluya!"], [105, "A poko le kgalalelo le botlhale le tebogo di nne go Modimo wa rona. Haleluya!", "Le tlotlo le nonofo le thata go ya bosakhutleng. Haleluja!"], [106, "Jehofa, bopelonomi jwa gago bo fitlha kwa magodimong. Halejula!", "Boammaaruri jwa gago kwa marung a a godimo, Haleluya!"], [107, "A leina la Morena le bakwe, mme le galalediwe. Haleluya!", "Jaanong le ka bosena-bokhutlo. Haleluya!"]]], ["Mo dipogong", [[108, "Jehofa, ke wena thata ya me le bonatla jwa me. Haleluya!", "Le botshabelo jwa me mo tlalelong. Haleluya!"], [109, "Ntsitsibosa, Jehofa, ka ntlha ya leina la gago.", "Ntsha moya wa me mo tlalelong ka ntlha ya tshiamo ya gago."], [110, "Nna, Morena, ke ikanya bopelonomi jwa gago.", "Pelo ya me e tlaa itumela mo polokong ya gago."], [111, "Mosiami o na le dipogiso tse dintsi.", "Mme Jehofa o mo golola mo go tsona tsotlhe."], [112, "Jehofa, o se thibele boutlwelo-botlhoko jwa gago go nna.", "A tsalano ya lorato le boikanyo jwa gago di mpoloke ka metlha yotlhe."], [113, "O inametseng, wena moya wa me, mme o tlhodiegelang teng ga me?", "Solofela mo Modimong, gonne ke tlaa nama ke o baka, ona o e leng kgololo ya sefatlhego sa me le Modimo wa me."]]], ["Ga loso", [[114, "Ke neela moya wa me mo 'atleng sa gago.", "Jehofa, o nthekolotse, wena Modimo wa boammaaruri."], [115, "Go tloga jaanong go tshegofaditswe baswi ba ba swelang mo Moreneng.", "Moya oa re: Ee, gore ba bone boitapoloso mo matsapeng a bone."], [116, "Morena, re rute go bala malatsi a rona,", "gore re nne le pelo e e tlhalefileng, mme re bolokege."], [117, "Morena o tlaa nkgolola mo tirong nngwe le nngwe e e bosula, mme o tlaa mpoloka go fitlha mo bogosing jwa gagwe jwa legodimo.", "A kgalalelo e nne ya gagwe go ya bosakhutleng jwa bosakhutleng. Amen."], [118, "Lorole lo tlaa boela mo mmung jaaka lo ne lo ntse.", "Mme moya o tlaa boela Modimong o o o neileng."]]], ["Ga Tsogo ya Baswi le Tsheko ya Bofelo", [[119, "Jehofa, ke tlaa leba sefatlhego sa gago mo tshiamong.", "Ke tlaa kgora setshwano sa gago, mogang ke tsogang."], [120, "Modimo o tlaa isa 'tiro tsotlhe mo tshekong,", "le tsotlhe tse di bipilweng, tse di molemo le tse di bosula."]]], ["Ga bophelo jo bo sa khutleng", [[121, "Boitumelo jo bo tletseng bo fa pele ga gago. Haleluya!", "Tse di rategang di mo 'atleng sa gago se se siameng ka bosena-bokhutlo. Haleluya!"], [122, "Gonne mono ga re na motse wa tlhomamo.", "Mme re batla o o tlang."], [123, "Gonne ke kaya, fa dipogiso tsa motlha ono di sa lekana kgalalelo,", "e re tlaa e bontshiwang kwa pele. Haleluya!"], [124, "Moya wa me o nyorelwa Modimong, go Modimo o o phedileng.", "Ke tlaa fitlha leng go bonala fa pele ga sefatlhego sa Modimo?"], [125, "Morena, motswedi wa bophelo o fa go wena. Haleluya!", "Mo leseding la gago re bona lesedi. Haleluya!"]]]];
function ant(q){var o="",any=0;DA.forEach(function(sec){var r=sec[1].filter(function(a){return !q||String(a[0])==q||(a[1]+" "+a[2]+" "+sec[0]).toLowerCase().indexOf(q)>-1});
 if(!r.length)return;any=1;o+="<h2>"+esc(sec[0])+"</h2>"+r.map(function(a){return '<div class="an"><span class="n">'+a[0]+'</span><div><p>'+esc(a[1])+'</p><p><i>'+esc(a[2])+'</i></p></div></div>'}).join("")});
 return any?o:'<p class="emp">Ga go se se bonweng.</p>'}
var DK=[{"t":"Kategisima ya ga Dr. M. Luther","b":[["H","THAPELO YA MAIKETLEETSO"],["p","Morena Modimo, Rara yo o rategang, ke go rapela ka ntlha ya ga Jesu Krisete, Morena wa rona, gore o nthuse ka Moya o o Boitshepo wa gago gore ke ithute Lefoko la gago ka bopelotlhomogi, ke le tlhaloganye, ke le boloke mo pelong ya me, le gore ke le dirise ka tshwanelo mo botshelong jwa me. Amen."],["H","KGAOLO YA NTLHA"],["H2","Ditaolo tse di lesome tse di Boitshepo (The 10 Holy Commandments)"],["h","TAOLO YA NTLHA"],["i","O se ka wa nna le medimo e mengwe fa pele ga me."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata go gaisa dilo tsotlhe, le go o ikanya, le go o ikokobetsa, le go o tshepa ka ntlha ya tsotlhe."],["h","TAOLO YA BOBEDI"],["i","O se ka wa dirisa leina la Morena Modimo wa gago ka leswe."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra dirisa leina la ona ka go ikana ka maaka, gongwe ka go tlhola, gongwe ka go itira ka leswe; mme bogolo re le bitseng mo tlalelong yotlhe, re le rapele, re le bakeng, le go le leboga ka gale."],["h","TAOLO YA BORARO"],["i","Gopola letsatsi la sabata gore o le itshepe."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra nyatsa thero le Lefoko la Modimo, mme bogolo re le tshole, re le reetse ka tlotlo, re le ithute."],["h","TAOLO YA BONE"],["i","Tlotla rraago le mmaago, gore o nne sentle, mme o phele ka boleele mo lefatsheng."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra nyatsa bagolo ba rona, kgotsa go ba tlhaola, mme bogolo re ba tlotle, re ba direle, re ba utlwe, re ba rate le go ba tlotla."],["h","TAOLO YA BOTLHANO"],["i","O se ka wa bolaya."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra senya mmele wa mongwe-ka-rona, le eseng go mo ntsha botshelo, le eseng go mo tlhokomologa; mme bogolo re mo thuse, re mo tshegetse mo tlalelong yotlhe."],["h","TAOLO YA BORATARO"],["i","O se ka wa dira boaka."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra tlola tlhakanelo-mmele e e itshepileng, le eseng go e senya ka dikeletso, mafoko kgotsa ditiro; mme bogolo re e tlhomamise le go e itshepisa."],["h","TAOLO YA BOSUPA"],["i","O se ka wa utswa."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra gapa madi a mongwe-ka-rona, le fa e le dithuo tsa gagwe, le eseng go di itseela ka kananyo ya tsietso, gongwe ka theko e e ntseng jalo; mme bogolo re mo thuse go ntsifatsa dithuo le dijo tsa gagwe le go di tlhokomela."],["h","TAOLO YA BOFERA-BOBEDI"],["i","O se ka wa bua maaka ka ga mongwe-ka-wena."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra pateletsa mongwe-ka-rona ka bolotsana, le eseng go mo eka, le eseng go mo seba, le eseng go mo senya leina; mme bogolo re mmuelele, re bue tse di siameng ka ga gagwe, re mo tlhatswe mo go tsotlhe."],["h","TAOLO YA BOFERA-BONGWE"],["i","O se ka wa eletsa ntlo ya mongwe-ka-wena."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra itshenkela boswa jwa mongwe-ka-rona, le fa e le ntlo ya gagwe ka boferefere, le eseng go di itseela ka go ipaya tshiamo; mme bogolo re mo thuse gore a boloke boswa le ntlo ya gagwe."],["h","TAOLO YA LESOME"],["i","O se ka wa eletsa mosadi wa mongwe-ka-wena, le fa e le badiredi ba gagwe le diruiwa tsa gagwe, le eseng sepe sa mongwe-ka-wena."],["q","Ke go reng?"],["p","Re tshwanetse go boifa Modimo le go o rata gore re se ka ra ithatisa mosadi wa mongwe-ka-rona, le fa e le badiredi ba gagwe, le eseng go ba iphetlhela, le eseng go fepa diruiwa tsa gagwe; mme bogolo re kaele ba gagwe gore ba sale mo go ene, ba dire ka fa tshwanelong ya bone."],["h","TLHAGISO YA MODIMO NTLHENG YA DITAOLO TSE SOME"],["i","Jaanong Modimo o a reng ka ga ditaolo tsotlhe tse? O bua jaana wa re:"],["p","Nna, MORENA Modimo wa gago, ke Modimo o o lefufa. Ba ba nkganang ke itebaganya le bana ba bone go ya tshikeng ya boraro le ya bone ka ntlha ya tshiamololo ya borraabo. Mme bone ba ba nthatang, ba tshegetsa ditaolo tsa me, ke ba direla ka bopelotlhomogi go ya tshikeng ya dikete."],["q","Ke go reng?"],["p","Modimo o bolelela petso pele mo go botlhe ba ba tlolang ditaolo tse. Ke ka moo re tshwanetseng go boifa bogale jwa ona gore re se ka ra dira sepe se se kgatlhanong le ditaolo tse. Mme botlhe ba ba tshegetsang ditaolo tse, o ba solofetsa boitshwarelo le molemo otlhe. Ke ka moo re tshwanetseng go o rata le go o ikanya gore re dire ka fa ditaolong tsa ona ka boitumelo."],["H","KGAOLO YA BOBEDI"],["H2","Tumelo ya Bokrisete (The Creed)"],["h","ARTIKELE YA NTLHA"],["i","Ka ga Tlholego"],["p","Ke dumela mo go Modimo Rara, mong-wa-thata-yotlhe, Motlhodi wa legodimo le lefatshe."],["q","Ke go reng?"],["p","Ke dumela gore Modimo o ntlhodile le dilo tsotlhe; o nneile mmele le mowa le matlho le ditsebe le ditokololo tsotlhe, le tlhaloganyo le maikutlo otlhe, ebile o sa ntse o di boloka. Gape o nneile diaparo le ditlhako le dijo le dino le ntlo le lelapa le mosadi le bana le masimo le diruiwa le dithoto tsotlhe."],["p","O ntlamela thata ka malatsi otlhe ka tsotlhe tse di batlegang mo bophelong jono, o ntshireletsa ruri mo ditlalelong tsotlhe, o bile o mphemela mo masuleng otlhe."],["p","Tsotlhe tseo o di ntirela fela ka ntlha ya bopelontle jwa gagwe le boutlwelobotlhoko jwa gagwe, ka e le Rre le Modimo wa me, nna ke se na tshiamo, le fa e le tshwanelo epe. Ke ka moo ke tshwanetseng go mo leboga le go mo tumisa le go mo direla le go mo utlwa. Tseo ke nnete ruri."],["h","ARTIKELE YA BOBEDI"],["i","Ka ga Kgololo"],["p","Ke dumela mo go Jesu Krisete, Morwa esi wa Modimo, Morena wa rona, yo o amogetsweng mo go Moya o o Boitshepo, a tsalwa ke Maria wa lekgarebe, a bogisiwa metlheng ya ga Pontio Pilato, a bapolelwa mo sefapaanong, a swa, a fitlhwa, a fologela kwa bobipong, a tsoga mo baswing ka letsatsi la boraro, a tlhatlogela kwa legodimong, o ntse kafa letsogong le le jang la Modimo Rara, Mong-wa-thata-yotlhe, mme o tlaa ba a tla go atlhola batshedi le baswi."],["q","Ke go reng?"],["p","Ke dumela gore Jesu Krisete ke Morena wa me. Ke Modimo ruri, o tsetswe ke Rara ka bosena-tshimologo, ebile ke motho ruri, o tsetswe ke Maria wa lekgarebe. O mpholositse mo maleong otlhe le mo losong le mo thateng ya ga Satane, ke le motho wa timelo le tatlhego, a nkgolola mo go tsona, eseng ka gouta gongwe selefera, mme e le ka madi a a boitshepotshepo a botlhôkwa a gagwe le ka go boga le go swa ga gagwe, a se na molato ope; a dira jalo gore ke nne wa gagwe, ke phele nae mo pusong ya gagwe, ke mo direle, ke le mo tshiamong le mo boitshepong, ke phologile ka bosakhutleng; jaaka le ene a tsogile mo losong, á phela, á busa ka bosena-bokhutlo. Tseo ke nnete ruri."],["h","ARTIKELE YA BORARO"],["i","Ka ga Boitshepiso"],["p","Ke dumela mo go Moya o o Boitshepo, le Kereke e e gotlhe e e boitshepo ya bokrisete, le kabelano ya baitshepi, le boitshwarelo jwa dibe, le tsogo ya mmele le botshelo jwa bosakhutleng. Amen."],["q","Ke go reng?"],["p","Ke dumela gore ke palelwa ke go dumela mo go Jesu Krisete, Morena wa me, ka tlhaloganyo ya me, le fa e le ka thata ya me, le eseng go ikisa go ene ka tsona. Mme Moya o o Boitshepo o mpiditse ka Efangele, o ntshedifaditse ka dineo tsa ona, o intshepisitse mo tumelong e e siameng, o bile o mpolokile mo go yona; jaaka o ntse o bitsa bakrisete botlhe mo lefatsheng, o ba phutha, o ba sedifatsa, o ba itshepisa, o ba bolokela fa go Jesu Krisete mo tumelong e le nngwe fela e e siameng."],["p","Mme nna le badumedi botlhe o ntse o re itshwarela dibe tsa rona tsotlhe ka malatsi otlhe mo phuthegong e ya bokrisete. O bile o tlaa ntsosa le baswi botlhe ka letsatsi la bofelo; mme nna le botlhe ba ba dumelang mo go Krisete o tlaa re naya botshelo jwa bosakhutleng. Tseo ke nnete ruri."],["H","KGAOLO YA BORARO"],["H2","Thapelo ya Morena (The Lord’s Prayer)"],["h","PITSO"],["i","Rraarona yo o kwa magodimong."],["q","Ke go reng?"],["p","Modimo o rata go re tiisa moko ka mafoko a gore re dumele, fa e le ona Rraarona ruri, le rona re le bana ba ona ruri, re tle re kope mo go ona re phuthologile, jaaka bana baa tle ba kope mo go rraabo yo o ba ratang."],["h","KOPO YA NTLHA"],["i","Leina la gago a le itshepisiwe."],["q","Ke go reng?"],["p","Leina la Modimo le itshepile ka bolona ka gale; mme re kopa ka thapelo e gore le kaiwe le le boitshepo le mo go rona."],["q","Go dirafala jang?"],["p","Go dirafala fa Lefoko la Modimo le rutwa ka tshwanelo, mme rona, re le bana ba Modimo, re phela ka boitshepo ka fa Lefokong leo. Re thuse jalo, Rraarona yo o rategang wa legodimo!"],["p","Mme yo o rutang ka mokgwa o sele le go phela jalo, e se ka fa Lefoko la Modimo le rutang ka teng, ke ene yo o itshepololang leina la Modimo mo go rona. Tseo di thibele mo go rona, Rraarona yo o rategang wa legodimo!"],["h","KOPO YA BOBEDI"],["i","Puso ya gago a e tle."],["q","Ke go reng?"],["p","Puso ya Modimo e tla ka boyona, le fa re sa rapele; mme re kopa ka thapelo e gore e tle le mo go rona."],["q","Go dirafala jang?"],["p","Puso ya Modimo e tla, fa Rraarona wa legodimo a re naya Moya o o Boitshepo wa gagwe, gore re dumele Lefoko le le boitshepo la gagwe ka bopelotlhomogi jwa gagwe, re phelele Modimo kajeno le ka bosakhutleng."],["h","KOPO YA BORARO"],["i","Thato ya gago a e dirafale mo lefatsheng jaaka kwa legodimong."],["q","Ke go reng?"],["p","Thato ya Modimo e e molemo, e e bopelotlhomogi, ea dirafala, le fa re sa rapele; mme re kopa ka thapelo e gore e dirafale le mo go rona."],["q","E dirafala jang?"],["p","Ea dirafala, fa Modimo o senya gongwe o kgoreletsa maano le maikaelelo otlhe a a bosula, a a re iletsang go itshepisa leina la Modimo, a a bileng a thibela puso ya Modimo go tla go rona, ebong a ga Satane le a lefatshe le a nama ya rona."],["p","Gape, e a dirafala, fa o re tiisa, o be o re tlhomamisa mo Lefokong la ona le mo tumelong go ya losong. Ke yona thato ya ona e e molemo, e e bopelotlhomogi."],["h","KOPO YA BONE"],["i","O re fe kajeno sejo sa rona sa letsatsi."],["q","Ke go reng?"],["p","Modimo o fa batho botlhe ba ba bosula sejo sa letsatsi, le fa re sa rapele; mme re kopa ka thapelo e gore o re lemose dithuso tsa ona, re tle re amogele sejo sa rona sa letsatsi ka tebogo."],["q","Sejo sa letsatsi ke eng?"],["p","Ke tsotlhe tse re phelang ka tsona, ebong dijo le dino le diaparo le ditlhako, le lelapa le masimo le diruiwa le madi le dithoto, le mogatsa-motho yo o siameng le bana le badiredi ba ba siameng, le balaodi ba ba boikanyo le mmuso o o siameng, le pula le kagiso le boitekanelo le tekano le tlotlo, le ditsala tse di siameng le baagi-mmogo ba ba boikanyo, le tse di ntseng jalo."],["h","KOPO YA BOTLHANO"],["i","O re itshwarele melato ya rona, jaaka le rona re itshwarela ba ba melato le rona."],["q","Ke go reng?"],["p","Re kopa ka thapelo e gore Rraarona wa legodimo a se lebe maleo a rona, le fa e le go gana thapelo e ka ntlha ya ona; gonne ga re a tshwanelwa ke sepe sa tse re di kopang, le eseng tuelo epe. Mme a a re fe tsotlhe ka bopelotlhomogi; gonne re leofa thata ka malatsi otlhe, mo ibileng re tshwanetswe ke petso fela. Le rona re tlaa itshwarela jalo ka bopelontle ba ba re leofelang, re be re ba direla molemo ka bopelotshweu."],["h","KOPO YA BORATARO"],["i","O se re gogele mo thaelong."],["q","Ke go reng?"],["p","Modimo ga o raele ope; mme re kopa ka thapelo e gore Modimo o re femele le go re boloka gore Satane le lefatshe le nama ya rona di se ka tsa re timetsa, le eseng go re gogela mo tumelong ya boithamako, le eseng mo tsholofologong, gongwe mo makgapheng a maleo a magolo a mangwe. Mme le fa re ka raelwa ka tsona, re di kgone, re di fenyetse ruri mo bofelong."],["h","KOPO YA BOSUPA"],["i","Mme o re golole mo bosuleng."],["q","Ke go reng?"],["p","Re kopa ka thapelo e ka go akaretsa dikopo tsotlhe gore Rraarona wa legodimo a re golole mo masuleng a methalethale a a amang mmele le mowa le thoto le tlotlo; mme mo bofelong, fa nako ya loso lwa rona e tla a re thuse go swa ka kagiso, a re ntshe mo lefatsheng leno la ditlalelo ka bopelotlhomogi, a re itseele kwa legodimong."],["h","BOKHUTLO JWA THAPELO"],["i","Gonne bogosi ke jwa gago le thata le kgalalelo ka bosena-bokhutlo. Amen."],["q","Ke go reng?"],["p","Ke go re, ke na le go ikanya ruri gore dikopo tseo Rraarona wa legodimo o di amogetse, o di utlwile; gonne ene ka esi o re laetse go rapela jalo, o bile o re solofeditse gore o tlaa re utlwa. Amen, Amen, ke go re: Ee, Ee, go tlaa dirafala jalo."],["H","KGAOLO YA BONE"],["H2","Sakramente sa Kolobetso e e boitshepo (Holy Baptism)"],["h","POTSO YA NTLHA"],["q","Kolobetso ke eng?"],["p","Kolobetso ga se metsi fela, mme ke metsi a a nang le taolo ya Modimo, a kopantswe le Lefoko la ona."],["q","Lefoko leo la Modimo ke lefe?"],["p","Ke le Krisete, Morena wa rona, o le buang mo go Mathaio kgaolo ya bofelo a re:"],["p","“Yang lo dire merafe yotlhe barutwa, lo ba kolobetse mo leineng la Rara le la Morwa le la Moya o o Boitshepo”."],["h","POTSO YA BOBEDI"],["q","Kolobetso e nayang gongwe e thusang?"],["p","Kolobetso e naya boitshwarelo jwa dibe, ebile e golola mo losong le mo go Satane; mme botlhe ba ba dumelang se mafoko le ditsholofetso tsa Modimo di se buang, e ba naya phologo ya bosakhutleng."],["q","Mafoko ao le ditsholofetso tseo tsa Modimo ke dife?"],["p","Ke tse Krisete, Morena wa rona, o di buang mo go Mareko kgaolo ya bofelo a re:"],["p","“Yo o dumelang, a ba a kolobediwa, o tlaa pholosiwa, yo o sa dumeleng ene o tlaa atlholwa”."],["h","POTSO YA BORARO"],["q","Metsi a ka dira jang dilo tse dikgolo tseo?"],["p","Ga se metsi a a di dirang, mme ke Lefoko la Modimo le le mo metsing le tumelo e re ikanyang Lefoko leo la Modimo mo metsing ka yona; gonne fa Lefoko la Modimo le se yo mo go ona, e ntse e le metsi fela, mme eseng kolobetso. Mme fa Lefoko la Modimo le le mo metsing, metsi ao ke kolobetso, ke go re, ke metsi a bophelo a a nang le pholoso, le gona ke thapiso ya go tsalwa seša ka Moya o o Boitshepo, jaaka Moapostolo Paulo a kwaletse Tito mo kgaolong ya boraro a re:"],["p","Modimo o re pholositse ka tlhapo ya go tsalwa gape le ka ntšhafatso ya Moya o o Boitshepo o Modimo o o goromeditseng mo go rona ka Jesu Krisete Morepholosi, gore e tle e re fa re sena go siamisiwa ka bopelotlhomogi jwa ona, re nne barua-boswa ba botshelo jo bo sa khutleng jo re bo solofelang. Lefoko leo ke le le ikanyegang."],["h","POTSO YA BONE"],["q","Go kolobediwa ka metsi go kayang?"],["p","Go kaya gore Atame yo mogologolo yo o mo teng ga rona a nwediwe ka boikwatlhao le tlhabologo ka malatsi otlhe, gore a swe, mme maleo otlhe le dikeletso tsotlhe tse di bosula di swe nae; mme jaanong go tswe go be go tsoge motho yo moša ka gale, yo o phelang fa pele ga Modimo, a le mo tshiamong le mo boitshekong ka bosena-bokhutlo."],["q","Go kwadilwe kae?"],["p","Go kwadilwe mo lokwalong lwa Baroma kgaolo ya borataro; teng moapostolo Paulo a re:"],["p","Re fitlhilwe le Krisete ka kolobetso gore re swe (ntlheng ya boleo), re tle re tsamae mo bophelong jo boša, jaaka Krisete le ene a tsositswe mo baswing ka kgalalelo ya ga Rara."],["H","KGAOLO YA BOTLHANO"],["H2","Sakramente sa Selalelo se se boitshepo (The Sacrament of the Altar / Holy Communion)"],["h","POTSO YA NTLHA"],["q","Selalelo se se boitshepo ke eng?"],["p","Selalelo se se boitshepo ke mmele ruri wa ga Jesu Krisete, Morena wa rona, le madi ruri a gagwe. Se tlhomamisitswe ke Krisete ka esi gore rona bakrisete re je mmele wa gagwe mo senkgweng, re nwe madi a gagwe mo weineng."],["q","Go kwadile bomang jalo?"],["p","Go kwadile jalo baefangele Mathaio le Mareko le Luka le moapostolo Paulo ba re:"],["p","Jesu Krisete, Morena wa rona, o ne a tsaya senkgwe mo bosigong jo o tshwarisitsweng ka jona, a se lebogela, a se nathoganya, a se fa barutwa ba gagwe a re:"],["p","Tsayang lo je! Se ke mmele wa me o o neelwang losong boemong jwa lona. Dirang jalo go nkgopola."],["p","A ba a tsaya senwelo jalo morago ga selalelo, a se lebogela, a se ba neela a re:"],["p","Nwang lotlhe ka senwelo se! Ke kgolagano e ntšha ka madi a me a lo a tshololelwang go itshwarelwa dibe. E ne e re fa lo a a nwa, lo dira jalo go nkgopola."],["h","POTSO YA BOBEDI"],["q","Go ja le go nwa jalo go thusang?"],["p","Re supediwa thuso ka mafoko a a reng:"],["p","Ke mmele wa me o o neelwang losong boemong jwa lona, ke madi a me a lo a tshololelwang go itshwarelwa dibe."],["p","Ke go re, mo Selalelong re newa boitshwarelo jwa dibe le bophelo le phologo ka mafoko ao; gonne yo o nang le boitshwarelo jwa dibe, ebile o na le bophelo le phologo e e sa khutleng."],["h","POTSO YA BORARO"],["q","Go ja le go nwa ka molomo go ka dira jang dilo tse dikgolo tseo?"],["p","Ga se go ja le go nwa mo go di dirang, mme ke mafoko a a reng:"],["p","Ke mmele wa me o o neelwang losong boemong jwa lona, ke madi a me a lo a tshololelwang go itshwarelwa dibe."],["p","Mafoko ao ke sona se segolo mo Sakramenteng, a ntse a na le go ja le go nwa ka molomo. Mme yo o dumelang mafoko ao, o na le se mafoko ao a se bolelang, ebong boitshwarelo jwa dibe."],["h","POTSO YA BONE"],["q","Jaanong ke mang yo o ka amogelang Sakramente seo ka tshwanelo?"],["p","Go itima go ja le go ipaakanya mmele ke mokgwa o montle wa ka fa ntle; mme yo o dumelang mafoko a a reng:"],["p","Ke mmele wa me o o neelwang losong boemong jwa lona, ke madi a me a lo a tshololelwang go itshwarelwa dibe,"],["p","ke ene yo o tshwanetseng ruri, ke yo o ipaakantseng sentle. Mme yo o sa dumeleng mafoko ao, gongwe a a belaela, ga a tshwanela, ga a ipaakanya ka gope; gonne mafoko a a reng: Ke mmele wa me o o neelwang losong boemong jwa lona, ke madi a me a lo a tshololelwang, a batla dipelo tse di dumelang ruri."]]},{"t":"Melao ya Bokrisete","b":[["p","ke go re, ditemana tsa Lefoko la Modimo tse di tlhaoletsweng mefutafuta ya dikemo tsa batho, tse mongwe le mongwe o tshwanetseng go ithuta kaelo ya tiro le tirelo ya gagwe ka tsona."],["q","Melao ya Bokrisete e rutang?"],["h","E RUTA BARUTI LE BARERI LE BAGOLO BA PHUTHEGO JAANA:"],["i","Modisa wa phuthego o tshwanetse a bo a se na molato, e le monna wa mosadi a le mongwe fela, a le tekano, a na le tlhaloganyo, a na le mekgwa e mentle, a tshola baeng, a nonofile mo go ruteng; e se letagwa, a se borumolano, e se mmatli wa mahumo ka mokgwa o o maswe, mme a le tsalano, e se motho wa kgang, e se morati wa madi; e le yo o laolang lelapa la gagwe sentle, a na le bana ba ba utlwang ka tlotlego yotlhe. Fa motho a sa itse go laola lelapa le e leng la gagwe, o ka babalela jang phuthego ya Modimo? A e se nne motho yo moša tumelong, e se re gongwe a ikgogomosa, a wela mo tshekisong ya ga Diabolo."],["ref","(1 Tim. 3, 1-6; Leba Tito 1, 6-9 le 1. Petr. 5, 1-4.)"],["h","E RUTA BATHO BA PHUTHEGO KAFA BA TSHWANETSENG GO DIRELA BARUTI BA BONE KA TENG, KA GO RE:"],["i","Le Morena o laetse jalo gore ba ba rerang Efangele ba tshele ka Efangele."],["ref","(1 Bakor. 9, 14.)"],["i","Yo o rutwang Lefoko a a fe yo o mo rutang kabelo ya dilo tsotlhe tse di molemo."],["ref","(Bagal. 6, 6.)"],["i","Bagolo (ba phuthego) ba ba tshwereng tiro sentle, a ba kaiwe ba tshwanetswe ke tlotlo e e menaganyeng, bogolo bone ba ba dirang ka lefoko le ka thuto; gonne Lokwalo loa re: Modiri o tshwanetswe ke tuelo ya gagwe."],["ref","(1. Tim. 5, 17-18.)"],["i","Bakaulengwe, re lo rapela gore lo tlotle bone ba ba itapisang ka lona, ba ba lo okameng mo Moreneng, ba ba lo layang, lo ba kae segolo bogolo ka lorato ka ntlha ya tiro ya bone. Agisanyang nabo."],["ref","(1. Bathes. 5, 12-13.)"],["i","Utlwang baruti ba lona, lo ba ikokobeletse; gonne ba disitse mewa ya lona e le ba ba tlaa ikarabelang, gore ba tle ba dire jalo ka boitumelo, eseng ka phegelo; gonne moo go kabo go se molemo mo go lona."],["ref","(Baheb. 13, 17.)"],["h","E RUTA KAGA MEBUSO YA LEFATSHE JAANA:"],["i","A motho mongwe le mongwe a ikokobeletse balaodi ba ba busang; gonne ga go na mmuso fa e se o o tswang Modimong. Mebuso e e le yong e beilwe ke Modimo. Ka moo, yo o ganang mmuso o emelana le puso ya Modimo; mme ba ba o ganang ba tlaa itlisetsa katlholo."],["ref","(Baroma 13, 1-2.)"],["i","Mmuso ke modiredi wa Modimo mo go wena gore o bone molemo. Mme fa o dira bosula, o boife; gonne ga oa tsholela tšhaka lefela, ka gonne ke modiredi wa Modimo, ke mmusolosi yo o dirafatsang bogale (jwa Modimo) mo go ene yo o dirang bosula."],["ref","(Baroma 13, 4.)"],["h","E RUTA DIKGOSI JAANA:"],["i","Yo o direlang a a tlhokomele tirelo."],["ref","(Baroma 12, 7.)"],["i","Lona barena, ba direleng tsona tseo, lo lese go bôpa, ka lo itse gore yo e leng Morena wa bone mo magodimong ebile ke wa lona, mme go gobelela ga go teng mo go ene."],["ref","(Baef. 6, 9.)"],["i","Lona beng ba batho, nayang batlhanka (ba lona) se se siameng, se se ba tshwanetseng, ka lo itse gore le lona lo na le Morena mo legodimong."],["ref","(Bakol. 4,1.)"],["h","E RUTA BATHO JAANA:"],["i","Ntshetsang Kaisara tse e leng tsa Kaisara, le Modimo tse e leng tsa Modimo."],["ref","(Math. 22, 21.)"],["i","Ke tshwanelo go ikokobetsa, eseng fela ka ntlha yo petso, mme ebile e le ka ntlha ya segakolodi. Ke ka ntlha ya moo lo ntshang lekgetho, gonne ke batlhanka ba Modimo ba ba ineetseng tiro eo ya bone ka metlha. Jaanong neelang mongwe le mongwe se se mo tshwanetseng: lo neele lekgetho ene yo o tshwanetsweng ke lekgetho, pula-tsela ene yo o tshwanetsweng ke pula-tsela, poifo ene yo o tshwanetsweng ke poifo, tlotlo ene yo o tshwanetsweng ke tlotlo."],["ref","(Baroma 13, 5-7.)"],["i","Jaanong ke kaela pele ga tsotlhe gore dikopo le dithapelo le dithapelelo le ditebogo di direlwe batho botlhe, le dikgosi le botlhe ba ba leng bagolo, gore re nne le bophelo jwa boiketlo le jwa tidimalo ka poifo-Modimo yotlhe le ka tlotlego. Go dira jalo go molemo, go bile go natefela Modimo Morepholosi."],["ref","(1 Tim. 2, 1-3.)"],["i","O ba gakolole gore ba ikokobeletse mebuso e e laolang, ba e utlwe, ba etleetsegele tiro nngwe le nngwe e e molemo."],["ref","(Tito 3, 1.)"],["i","Ikokobeletseng melao yotlhe ya batho ka ntlha ya Morena, le fa e le kgosi, ka e le molaodi yo mogolo, kampo dikgosana, ka e le tse di romilweng ke yona go betsa badira-dibe le go tlotla ba ba dirang molemo."],["ref","(1 Petr. 2, 13-14.)"],["h","E RUTA BANNA JAANA:"],["i","Lona banna, agang le basadi ka tlhaloganyo, ka mosadi a bopegile bokoa, mme lo ba neele tlotlo, ka ebile e le ba ba ruang bopelotlhomogi jwa botshelo mmogo le lona, gore merapelo ya lona e se ka ya kgoreletsega."],["ref","(1. Petr. 3, 7.)"],["i","Lona banna, ratang basadi ba lona, mme lo se ka lwa ba gakalela."],["ref","(Bakol. 3, 19.)"],["h","E RUTA BASADI JAANA:"],["i","Lona basadi, ikokobeletseng banna ba e leng ba lona, jaaka lo ikokobeletsa Morena."],["ref","(Baefeso 5, 22.)"],["i","Jaaka Sara a ne a utlwa Aborahame, a mmitsa morena, yo lo leng bana ba gagwe, fa lo dira molemo, mme lo sa boife sepe se se tshosang."],["ref","(1. Petr. 3, 6.)"],["h","E RUTA BATSADI JAANA:"],["p","Lona borra-bana, se rumoleng bana ba lona, mme ba godisetseng mo thutong le mo kaelong ya Morena."],["p","(Baefeso 6, 4; Leba Bakol. 3, 21)."],["h","E RUTA BANA JAANA:"],["i","Lona bana, utlwang bagolo ba lona mo Moreneng; gonne moo go siame. Taolo ya ntlha e e nang le tsholofetso ke e: Tlotla rraago le mmaago, gore o nne sentle, mme o phele ka boleele mo lefatsheng."],["ref","(Baefeso 6, 1-3.)"],["h","E RUTA BADIREDI JAANA:"],["i","Lona batlhanka, utlwang beng ba lona ba lefatshe ka poifo le ka thoromo le ka bopelophepa, jaaka lo utlwa Krisete, e seng ka go dira fela, fa lo bonwa, jaaka bakgatlhi ba batho ba dira, mme lo dire ka fa thatong ya Modimo ka pelo yotlhe jaaka batlhanka ba ga Krisete; le gona e nne ka boitumelo jaaka ba ba direlang Morena, e seng batho. Lo itse gore mongwe le mongwe, fa a dirile se se molemo, o tlaa se amogela gape mo Moreneng, le fa e le motlhanka gongwe yo e seng motlhanka."],["ref","(Baefeso 6, 5-8.)"],["h","E RUTA MAKAU LE MAKGAREBE JAANA:"],["i","Lona ba baša, utlwang bagolo, mme lotlhe direlanang ka boikokobetso; gonne Modimo o ganetsa ba ba ikgogomosang, mme ba ba ikokobetsang o ba naya boitshwarelo. Ka moo ikokobeletsang letsogo le le thata la Modimo, gore o tle o lo godise ka nako e e leng yona."],["ref","(1. Petr. 5, 5-6.)"],["h","E RUTA BATLHOLAGADI JAANA:"],["i","Yo e leng motlholagadi tota, a tlogetswe a le esi, o solofetse mo Modimong, o tswelela pele ka mekokotlelo le ka merapelo bosigo le motshegare. Mme yo o phelelang dikgatlhego tsa gagwe ene o sule, le fa a ntse a phela."],["ref","(1 Tim. 5, 5-6.)"],["h","E RUTA PHUTHEGO JAANA:"],["i","Ditaolo di akareditswe ka lefoko le le reng: O rate mongwe-ka-wena jaaka o ithata. Lorato ga lo direle motho bosula; ke ka moo lorato e leng tiragatso ya molao."],["ref","(Baroma 13, 9-10.)"],["i","A dikopo le dithapelo le dithapelelo le ditebogo di direlwe batho botlhe."],["ref","(1 Tim. 2,1.)"]]},{"t":"Tumelo ya Bokrisete (Nitsea)","b":[["sub","Maipolelo a Nitsea – The Nicene Creed"],["i","Ke dumela mo go Modimo Rara o o esi, Mong-wa-thata-yotlhe, yo o tlhodileng legodimo le lefatshe, tsotlhe tse di bonwang le tse di sa bonweng."],["i","Ke dumela mo go Morena yo o esi Jesu Krisete, Morwa esi wa Modimo, yo o tsetsweng ke Rara pele ga tlholego. Ke Modimo, o tswa Modimong. Ke lesedi, o tswa Leseding. Ke Modimo wa boammaaruri, o tswa Modimong wa boammaaruri. O tsetswe, ga a tlholwa; o bongwefela le Rara, mme dilo tsotlhe di tlhodilwe ka ene. O fologile kwa magodimong ka ntlha ya rona batho le ka ntlha ya pholoso ya rona, a tlholega mmele ka Moya o o Boitshepo mo go Maria wa lekgarebe, a nna motho. A bapolelwa sefapaanong ka ntlha ya rona metlheng ya ga Pontio Pilato, a boga, a ba a fitlhwa. Mme o tsogile ka letsatsi la boraro ka fa dikwalong, o bile o tlhatlogetse kwa magodimong, o ntse ka fa letsogong le le jang la ga Rara. O tlaa boa ka kgalalelo, a tlela go atlhola batshedi le baswi, mme bogosi jwa gagwe bo tlaa bo bo se na bokhutlo."],["i","Ke dumela mo go Moya o o Boitshepo o e leng Morena, o o tshedisang; o tswa mo go Rara le mo go Morwa, o a obamelwa, o tlotlwa mmogo le Rara le Morwa, o buile ka baporofeti. Ke dumela gore go na le Kereke e le nngwe fela e e boitshepo e e gotlhe ya baapostolo. Ke ipolela Kolobetso e le nngwe fela ya go itshwarelwa dibe, ke lebeletse tsogo ya baswi le botshelo jwa tlholego e ntšha. Amen."]]},{"t":"Dithapelo","b":[["sub","Tiriso ya Thapelo ya Bokrisete (Daily Christian Prayers)"],["h","Thapelo ya mo mosong"],["p","A go thuse Modimo Rara le Morwa le Moya o o Boitshepo. Amen."],["p","Ke dumela mo go Modimo Rara, Mong-wa-thata-yotlhe, Motlhodi wa legodimo le lefatshe."],["p","Ke dumela mo go Jesu Krisete, Morwa esi wa Modimo, Morena wa rona, yo o amogetsweng mo go Moya o o Boitshepo, a tsalwa ke Maria wa lekgarebe, a bogisiwa metlheng ya ga Pontio Pilato, a bapolelwa mo sefapaanong, a swa, a fitlhwa, a fologela kwa bobipong, a tsoga mo baswing ka letsatsi la boraro, a tlhatlogela kwa legodimong, o ntse ka fa letsogong le le jang la Modimo Rara, Mong-wa-thata-yotlhe, mme o tlaa ba a tla go atlhola batshedi le baswi."],["p","Ke dumela mo go Moya o o Boitshepo, le Kereke e e gotlhe e e boitshepo ya bokrisete, le kabelano ya baitshepi, le boitshwarelo jwa dibe, le tsogo ya mmele le botshelo jwa bosakhutleng. Amen."],["p","Rraarona yo o kwa magodimong. Leina la gago a le itshepisiwe. Puso ya gago a e tle. Thato ya gago a e dirafale mo lefatsheng jaaka kwa legodimong. O re fe kajeno sejo sa rona sa letsatsi. O re itshwarele melato ya rona, jaaka le rona re itshwarela ba ba melato le rona. O se re gogele mo thaelong, mme o re golole mo bosuleng. Gonne bogosi ke jwa gago le thata le kgalalelo ka bosena-bokhutlo. Amen."],["p","Rara wa legodimo, ke a go leboga ka Jesu Krisete, Morwao yo o rategang, ka gonne mo bosigong jo bo fetileng o mphemetse mo ditlalelong le mo ditsietsing tsotlhe. Mme ke go rapela gore, le mo letsatsing leno o mphemele mo maleong le mo masuleng otlhe, gore o kgatlhwe ke ditiro tsotlhe tsa me le bophelo jwa me. Ke ineela ka mmele le ka mowa le ka tsotlhe tsa me mo diatleng tsa gago; a moengele yo o boitshepo wa gago a nne le nna gore mmaba yo o bosula a se nne le thata epe mo go nna. Amen."],["h","Thapelo ya Mantsiboa"],["p","A go thuse Modimo Rara le Morwa le Moya o o Boitshepo. Amen."],["p","Re tswelele ka Tumelo ya Bokrisete le Thapelo ya Morena."],["p","Rara wa legodimo, ke a go leboga ka Jesu Krisete, Morwao yo o rategang, ka gonne o mphemetse mo letsatsing le le fetileng ka bopelotlhomogi jwa gago. Mme ke go rapela gore o intshwarele dibe tsotlhe tsa me tse ke go leofetseng ka tsona. O mphemele mo bosigong jono ka bopelotlhomogi jwa gago. Ke ineela mo diatleng tsa gago ka mmele le mowa le tsotlhe tsa me. A moengele wa gago o o boitshepo a nne le nna, gore mmaba yo o bosula a se nne le thata epe mo go nna. Amen."],["h","TSHIPI – Mo Mosong"],["p","Tlaang, a re obameleng, re iname, re khubame fa pele ga Morena, Mmopi wa rona. Gonne ke ene Modimo wa rona; rona re batho ba bofulo jwa gagwe. Morena, ke rata boago jwa Ntlo ya gago, ebong felo fa kgalalelo ya gago e agileng teng. A re atameleng sefatlhego sa gagwe ka boitumelo, a re mo ipeleleng ka dikopelo tsa pako. Morena, utlwa lentswe la me mogang ke bitsang, o nkutlwele botlhoko."],["p","Morena a re: Batlang sefatlhego sa me. E kete o kabo lo utlwa lentswe la me kajeno! Se thatafatseng dipelo tsa lona. Morena, nthute tsela ya gago, o nkgogele mo tseleng ya tshiamo ka ntlha ya leina la gago. Dinku tsa gago di utlwa lentswe la gago, o a di itse, mme di go sala morago. Go sego bogolo ba ba utlwang Lefoko la Modimo, ba le boloka. Amen."],["h","TSHIPI – Mantsiboa"],["p","Morena ke Modisa wa me, ga nkitla ke tlhoka sepe. O mphudisa mo mafulong a matalana, o nkgogela kwa metsing a tapoloso. O lapolosa moya wa me, o ntsamaisa mo ditseleng tsa tshiamo ka ntlha ya leina la gagwe. Le fa ke tsamaya mo mogorogorong wa moriti wa loso, ga nkitla ke boifa bosula bope; gonne o na le nna. Tsamma ya gago le seikokotlelo sa gago dia nkgomotsa. O baakanya bojelo fa pele ga me go lebagana le baba ba me; o ntlotsa tlhogo ka lookwane; senwelo sa me se tletse, se a tshologa. Ruri molemo le boitshwarelo di tlaa ntshala morago ka malatsi otlhe a bophelo jwa me; ke tlaa nna mo Tlung ya Morena go ya bosakhutleng. Amen."],["h","MOSUPOLOGO – Mo Mosong"],["p","Rara wa legodimo, ke go lebogela phemelo yotlhe e o mphemetseng ka yona mo ditsietsing tsotlhe tsa bosigo jo bo fetileng le mo dibolaing tsa jona ka Jesu Kriste Morwao yo o rategang."],["p","Jaanong ke go rapela gore o ntise kajeno ke se leofe, ke se raelwe ke bosula, mme o kgatlhwe ke ditiro tsa me le botshelo jotlhe jwa me. Ke ineela mo diatleng tsa gago ka mmele le mowa le ka tsotlhe tsa me. A moengele yo o boitshepo wa gago a nne le nna gore mmaba yo o bosula a se bone lobaka lwa go ntshwenya. Amen."],["h","MOSUPOLOGO – Mantsiboa"],["p","Rara wa legodimo, ke go leboga ka Jesu Kriste Morwao yo o rategang, ka o mphemetse mo letsatsing leno ka bopelotlhomogi jwa gago. Mme ke go rapela gore o intshwarele dibe tsotlhe tsa me tse ke siamolotseng ka tsona. O mphemele le mo bosigong jono ka kutlwelobotlhoko jwa gago. Ke ineela mo diatleng tsa gago ka mmele le moya le ka tsotlhe tsa me. A moengele wa gago yo o boitshepo a nne le nna gore mmaba yo o bosula a se nne le thata epe mo go nna. Amen."],["h","LABOBEDI – Mo Mosong"],["p","Modimo, o Modimo wa me, ke go batla mo phepafalong ya moso (mo mosong ono), moya wa me o go nyoretswe, nama ya me e go tlhologeletswe mo lefatsheng la komelelo le le nyorilweng, le le se nang metsi. Ke go lebile kwa Felong ga Boitshepo ka maikutlo a a ntseng jalo, go bona thata ya gago le kgalalelo ya gago, gonne bopelotlhomogi jwa gago bo molemo go gaisa bophelo. Molomo wa me o tlaa go baka. Ke tlaa go tumisa jalo mo botshelong jotlhe jwa me, ke tsholetsa mabogo mo leineng la gago. Ke ne ka go gopola mo bolaong jwa me, ka akanya ka ga gago ka dinako tsa tebelelo ya bosigo; gonne o ne o le thuso ya me. Ke tlaa duduetsa mo moriting wa diphuka tsa gago. Moya wa me o go setse morago, o go kgomaretse, letsogo le le jang la gago le ntshegeditse. Ntise, o mphemele ka ntlha ya ga Jesu Kriste, Morena wa me. Amen."],["h","LABOBEDI – Mantsiboa"],["p","Morena, o thata ya me, ke go rata ka pelo yotlhe. O lefika la me le botshabelo jwa me le mogolodi wa me. Modimo wa me, o lefika la me, ke a go ikanya. O thebe ya me le kago ya me ya phemelo. Morena, ke go ikanya ke re: O Modimo wa me, sebaka sa me sa botshelo se mo diatleng tsa gago. Mphatsimisetse sefatlhego sa gago, ke le motlhanka wa gago, o mpoloke ka ntlha ya boitshwarelo jwa gago. Ke tlaa rapama, ke robala mo kagisong, gonne wena wesi o a ntisa. Ke neela mmele le moya le tsotlhe tsa me mo diatleng tsa gago. Mpoloke, Morena wa me, gore Satane le batlhanka ba gagwe ba se ka ba bona sebaka sa go ka mpolaya. Amen."],["h","LABORARO – Mo Mosong"],["p","Modimo, o nne boitshwarelo le rona, o re tshegofatse, o re phatsimisetse sefatlhego sa gago, gore tsela ya gago e lemogiwe mo lefatsheng, le pholoso ya gago mo ditšhabeng tsotlhe. Merafe e tlaa go baka, Modimo, ditšhaba tsotlhe di tlaa go baka. Merafe e tlaa itumela, e ipela, ka gonne o atlhola ditšhaba ka tshiamo, o goga merafe mo lefatsheng."],["p","Ke a go leboga, Morena Modimo, ka o mphemetse mo bosigong jo bo fetileng. Mme ke go rapela gore o nkutlwele botlhoko ka ntlha ya ga Jesu Kriste, Mopholosi wa me, o ntise, o mphemele ka moengele yo o boitshepo wa gago, gore ditiro tse ke tlaa di dirang gompieno di go kgatlhe. Amen."],["h","LABORARO – Mantsiboa"],["p","Lebogang Morena, gonne o molemo, mme bopelotlhomogi jwa gagwe ke jo bo sa khutleng. Modimo, matlho a gago a mponye ke simolola go utlwelelwa, mme malatsi a me a a sa leng a rulaganngwa go ise go nne lepe la ona, a kwadilwe otlhe mo lokwalong lwa gago."],["p","Jesu Morena, le nna ke tlaa ema fa pele ga setulo sa katlholo sa gago, gore ditiro tsa me di senoge fa pele ga gago, tse di molemo gongwe tsa bosula. Ke ka moo ke go rapelang gore nthuse, ke kgone go tshaba boleo, ke go dire ke batle pholoso ya me ka poifo le thoromo. Mpoloke, o mphemele mo bosuleng mo bosigong jono. Amen."],["h","LABONE – Mo Mosong"],["p","Baka Morena, moya wa me, le tsotlhe tse di mo teng ga me, bakang leina la gagwe le le boitshepo! Baka Morena, moya wa me, se lebale sepe sa ditiro tse di molemo tsa gagwe! Morena o kutlwelo-botlhoko le boitshwarelo; o bopelotelele, o bopelontle jo bogolo. Ga a nke a nna bogale ka metlha, le e seng go galefela ruri. Morena o utlwela ba ba mmoifang botlhoko, jaaka rra-bana a utlwela bana ba gagwe botlhoko."],["p","Morena, tshegetsa metsamao ya me mo metlhaleng ya gago kajeno gore dikgato tsa me di se ntimetse. Mpoloke jaaka thaka ya leitlho, o mphemele mo moriting wa diphuka tsa gago. Ke kopa jalo ka ntlha ya ga Jesu Kriste, Morena wa me. Amen."],["h","LABONE – Mantsiboa"],["p","Ke tsholeletsa matlho a me kwa dithabeng; thuso ya me e tlaa tswa kae? Thuso ya me e tswa Moreneng yo o dirileng legodimo le lefatshe. Ga a kake a leseletsa lonao lwa gago go relela. Motlamedi wa gago ga a kake a otsela, e bile ga a robale. Morena ke Mmaballi wa gago, Morena ke moriti wa gago fa letsogong la gago le le jang. Letsatsi ga le kitla le go tlhaba motshegare, le fa e le ngwedi bosigo. Morena o tlaa go sireletsa mo masuleng otlhe, o tlaa boloka moya wa gago. Morena o tlaa femela go bolola ga gago le go goroga ga gago go tloga jaanong go fitlha bosakhutleng. Jesu, Morena le Mmoloki wa me, nkutlwele botlhoko, o nthobatse ka kagiso ka ntlha ya lorato lo logolo lwa gago. Amen."],["h","LABOTLHANO – Mo Mosong"],["p","Jesu Kriste, Kwana ya Modimo, yo o ntshang lefatshe dibeng, re tlhomogele pelo, o re fe kagiso. Morena, ke wena yo o re swetseng ka loso lwa sefapaano, wa swela melato yotlhe ya rona. O ne wa rwala malwetse a rona, wa phololelwa ka ntlha ya maleo a rona, wa teketelwa melato ya rona. Petso e ne ya go wela gore rona re bone kagiso. Re fodisitswe ka dintho tsa gago."],["p","Ke go lebogela tsotlhe tse o di re diretseng gore re bone pholoso le boitshwarelo le botshelo jo bo sa khutleng. Nthuse, Jesu Morena, gore le nna ke pholosiwe ka madi a a boitshepo a gago le ka loso lwa gago. Amen."],["h","LABOTLHANO – Mantsiboa"],["p","Morena Jesu, Mopholosi yo o rategang wa rona, ke go leboga ka pelo yotlhe ka gonne o nkgolotse, ke le motho wa timelo le tatlhego, wa nkgolola mo maleong otlhe le mo losong le mo thateng ya ga Satane, e seng ka gouta gongwe selefera; o nthuantse le Modimo ka madi a a boitshepotshepo a botlhokwa a gago le ka go boga le go swa gago. O dirile jalo gore ke nne wa gago, ke phele nao mo pusong ya gago, ke go direle, ke le mo tshiamong le mo boitshepong, ke phologile ka bosakhutleng; jaaka wena o tsogile mo losong, wa phela, wa busa ka bosena-bokhutlo. Le nna o tlaa ntsosa gore ke tshele le wena ka bosafeleng. Amen."],["h","LAMATLHATSO – Mo Mosong"],["p","Ke tsholeletsa moya wa me koo go wena, Morena. Modimo wa me, ke a go ikanya; a ke se tlhajwe ke ditlhong. Morena, nkitsise ditsela tsa gago, o nthute ditselana tsa gago. Ntsamaisa mo boammaaruring jwa gago, o nthute, gonne ke wena Modimo wa pholoso ya me. Ke tlaa go lebelela ka gale. Morena, gopola mautlwelo-botlhoko a gago le maitshwarelo a gago. O se ka wa gopola maleo a boša jwa me le ditlolo tsa me. Nkgopole ka fa boitshwarelong jwa gago ka ntlha ya molemo wa gago. Leba tlalelo ya me le thekisego ya me, mme maleo a me o a intshwarele otlhe ka ntlha ya madi a ga Jesu, Morena wa me. Amen."],["h","LAMATLHATSO – Mantsiboa"],["p","Morena, o ntse o le botshabelo jwa rona mo ditshikatshikeng. Pele dithaba di ise di tsalwe, o ise o tlhole lefatshe le lobopo, wena o ntse o le Modimo go tswa bosenang-tshimologo go ya bosakhutleng. O busetsa batho loroleng lwa mmu wa re: Boang, bana ba batho. O ba gogotse jaaka ka morwalela; ba ntse jaaka ba robetse. Nthute go bala malatsi a me gore ke tle ke tlhalefe mo pelong. Nkutlwele bothoko, Morena wa me, o intshwarele."],["p","Ke go lebogela molemo otlhe o O o mphileng beke yotlhe e e felang. A ko o mpoloke mo bosigong le botlhe ba gaetsho. Tshegofatsa Kereke e e boitshepo ya gago. A puso ya gago e tle mo go nna le mo phuthegong ya ga etsho le mo bathong botlhe. Modimo wa me, nkutlwe ka ntlha ya ga Jesu, Morena wa me. Amen."],["h","THAPELO YA GO KOPA BOITSHWARELO"],["p","Modimo, intshwarele ka fa bopelotlhomoging jwa gago, o phimole ditlolo tsa me ka fa boutlwelong-botlhoko jo bogolo jwa gago. Ntlhapise sentle, o tlose tshiamololo ya me, o intshekise boleo. Gonne ditlolo tsa me ke a di itse, boleo jwa me bo fa pele ga me ka gale."],["p","Ke wena o le nosi fela yo ke go leofetseng, ka dira se mo matlhong a gago se leng bosula. Bona, ke tsaletswe mo tshiamololong, mme mmê o nkamogetse mo boleong. Fitlhela maleo a me sefatlhego sa gago, o phimole ditshiamololo tsa me tsotlhe."],["p","Modimo, mpopele pelo e e itshekileng, o ntšhafatse moya o o tlhomameng mo teng ga me. O se ka wa ntatlha fa pele ga sefatlhego sa gago, o se tlose Moya o o boitshepo wa gago mo go nna. Nkgolola mo melatong yotlhe, Modimo wa pholoso ya me, mme loleme lwa me lo tlaa dudueletsa tshiamo ya gago. Ditlhabelo tsa Modimo ke moya o o kgobegileng. Wena Modimo, ga o kitla o nyatsa pelo e e kgobegileng, e e phatlogileng. Jesu Morena yo o tsileng go batla le go pholosa ba ba latlhegileng, nkutlwele botlhoko. Amen."],["h","THAPELO YA BA BA RATANG GO JA SELALELO"],["p","Morena Jesu, Mopholosi wa me, o mpoleletse ka Lefoko la gago gore, ke wena senkgwe sa botshelo, mme yo o jang nama ya gago, a ba a nwa madi a gago, o na le botshelo jo bo sa khutleng, mme o tlaa mo tsosa ka letsatsi la bofelo. Ke tla go wena, ke go rapela gore o njese mmele wa gago, o nnose madi a a boitshepo a gago. Ke itse gore ga ke na tshwanelo ya go amogela dineo tse dikgolo tseo, mme ke kopa gore o nthuse, o mphe tumelo e e siameng, ke tle ke tshware Lefoko la gago ka yona. O nkapese madi a gago le tshiamo ya gago, gore Selalelo sa gago ke se jele tshegofatso, e seng molato. Jesu Morena, ntlhomogele pelo. Amen."],["h","THAPELO YA BA BA JELENG SELALELO"],["p","Jesu, Morena yo o rategang, ke go leboga ka pelo yotlhe, ka o ntapolositse gompieno ka dineo tse dikgolo, ebong ka mmele wa gago le madi a gago. Ke go lebogela dipogo tsa gago le loso lo o ntshwetseng ka lone mo sefapaanong gore ke gololwe mo maleong otlhe a me le mo losong lo lo sa khutleng. Ke go lebogela tsogo ya gago le tsholofetso ya gago ya gore le nna ke tlaa tsoga, gonne ke jele dijo tsa botshelo."],["p","Morena Jesu, ke go rapela gore o ntshware, ke tle ke nne le wena. Nthuse gore ke tshabe boleo le tenego. Wena o setlhare sa moweine, nna ke le kala fela. Mpolokele mo go sona gore ke nne kala e e ungwang maungo a a go kgatlhang. Mopholosi wa me, o nne le nna ka letsatsi la loso lwa me gore ke tle ke swe ka kagiso. Ke kopa jalo ka ntlha ya lorato lo logolo lwa gago. Amen."],["h","THAPELO YA TLALELO YA BOLWETSE"],["p","Morena Modimo, Rara yo o rategang, Lefoko la gago ke le le reng: Mpitse ka letsatsi la tlalelo; ke tlaa go namolela, mme o tlaa nkgalaletsa. Morena, ke go rapela gore o nkutlwele botlhoko, ke le mo tlalelong ya bolwetse. Ke itse gore ke bonye tefo ya maleo a me, a ke go leofetseng ka ona. Mme leba Jesu, Morena wa me, yo o ntiretseng pholoso e e sa khutleng ka madi a a boitshepo a gagwe, a o a ntshololetseng go intshwarela dibe. Jesu Morena, mphodise, o nthuse, fa e le go rata ga gago. Ke baya botshelo jwa me mo diatleng tsa gago. A go dirafale go rata ga gago. Ntapolose ka gonne ke lapile; o nkgomotse, ke le yo o tshogileng. Mme fa o rata go mpitsa, o mphe botshelo jo bo sa khutleng. Ke kopa jalo ka ntlha ya madi a a boitshepo a gago. Amen."],["h","THAPELO YA TLALELO YA LOSO"],["p","Morena Modimo, Rraarona yo o rategang, o re file Morwao Jesu Kriste gore mongwe le mongwe yo o dumelang mo go ene a se ka a latlhega, mme a nne le botshelo jo bo sa khutleng. A ko o ntlhomogele pelo. Amen."],["p","Kriste, Morwa Modimo, Morena wa me yo o rategang, yo o ntshitseng lefatshe mo dibeng, intshwarele ka ntlha ya madi a a boitshepo a gago. Amen."],["p","Morena, nkgolole mo ditirong tsotlhe tse di bosula tsa me, o mpolokele pusong ya gago ya legodimo. Amen."],["p","Ke neela moya wa me mo diatleng tsa gago, ka gonne o nkgolotse, Modimo wa me wa boammaaruri. Amen."],["p","Jesu Morena, ke wa gago mo botshelong le mo losong, tshola moya wa me. Amen."],["h","THAPELO YA FA GO LE TUMO YA MARU LE DIKGADIMA"],["p","Morena Modimo, Mong-wa-thata-yotlhe, motlhodi wa legodimo le lefatshe, Rra yo o rategang, o botshabelo jwa me le lorako lwa me lo lo femelang, o Modimo wa me o ke o ikanyang. Ammaaruri o tlaa nkgolola mo tlalelong e e tlileng mo go nna. O tlaa mpipa ka diphuka tsa gago, boammaaruri jwa gago ke thebe ya me. Nkutlwele botlhoko ka ntlha ya ga Jesu Morena, o intshwarele dibe tsa me tsotlhe. O mphemele gore bosula bo se ka jwa nkwela, le petso e se ka ya atamela ntlo ya me. Laola baengele ba gago gore ba re sireletse mo gae le mo ditseleng. O se mpetse o le mo bogaleng jwa gago. O beye seatla sa gago godimo ga ntlo le masimo le tsotlhe tse re nang natso. Ke kopa jalo ka Jesu, Morena wa me yo o rategang. Amen."],["h","MARUMO A LEFOKO LA MODIMO GO FENYA DITHAELO KA ONA"],["i","Morena Jesu a re: Disang lo rapele gore lo se tsene mo thaelong; moya ona o tlhaga, mme nama e bokoa."],["ref","(Math. 26, 41)"],["i","Nnang tekano lo itise; gonne Diabolo, moganetsi wa lona, o kgarakgatshega jaaka tau e e dumang, a batla yo a ka mo metsang."],["ref","(1 Pet. 5, 8)"],["i","A ga lo itse gore mebele ya lona ke Tempele ya Moya o o Boitshepo o o mo teng ga lona, o lo o amogetseng mo Modimong, e bile ga lo ba lona? Lo rekilwe ka tlhwatlhwa e kgolo; galaletsang he Modimo ka mebele ya lona e e leng ya Modimo!"],["ref","(1 Bakor. 6, 19-20)"],["q","Nka dira jang bosula jo bogolo jo, ka leofela Modimo?"],["ref","(Gen. 39, 9)"],["i","Ntlogela, Satane! Gonne go kwadilwe ga twe: O tshwanetse go obamela Morena, Modimo wa gago, le go direla ene a le esi fela."],["ref","(Math. 4, 10)"],["h","Dithapelo tsa dijo"],["h","Pele ga dijo:"],["p","Matlho a botlhe a go lebile, Morena, mme o ba fa dijo tsa bone mo motlheng o o lebanyeng, o huporolola seatla sa gago, o kgorisa diphedi tsotlhe ka natefo. Amen."],["p","Morena Modimo, Rraarona wa legodimo, re tshegofatse le dineo tse tsa gago, tse re di amogelang, di tswa loratong lwa gago, ka Jesu Kriste, Morena wa rona. Amen."],["h","Morago ga dijo:"],["p","Lebogang Morena, gonne o molemo, mme boutlwelo-botlhoko jwa gagwe bo nnetse ruri. Yo o nayang ditshedi tsotlhe dijo, o fa dikgomo mafulo a tsona, le magakajane a a lelang o a fa dijo. Re a go leboga, Morena, gonne o molemo, mme boutlwelo-botlhoko jwa gago bo nnetse ruri. Amen."],["p","Morena Modimo, Rraarona wa legodimo, re go leboga ka Jesu Kriste, Morena wa rona, ka ntlha ya masego otlhe a gago, wena yo o phelang, yo o busang ka bosena-bokhutlo. Amen."],["h","Dithapelo tsa mo kerekeng"],["h","E re o tsenye mo kerekeng, o rapele jaana o re:"],["p","Modimo, Rra-batho botlhe ba khumanego le tlalelo, re tshegofatse rotlhe, o bonese dipelo tsa rona ka boammaaruri jwa Lefoko la gago. A pako le tlotlo le tebogo di nne tsa gago ka bosena-bokhutlo. Amen."],["h","Gongwe:"],["p","Ke fano, Jesu, yo ’ mpitsang, / ke tla go wena yo ’ nthatang,"],["p","ke tsisa pelo e e leng / ya gago, wena yo’ ntshwetseng. Amen."],["h","Fa Kereke e tswa, o rapele jaana o re:"],["p","O re thuse pololong, / le mo kgorogong ya rona;"],["p","Re tlamele leetong / le mo ditirong tsa rona."],["p","Re fe boswa jwa godimo, / go nna bana ba Modimo. Amen."],["h","Thapelo ya fa motho a atamela go amogela selalelo sa Morena"],["p","Modimo, nkutlwele botlhoko, ke moleofi!"],["p","Morena Jesu, wena yo o bakwang segolo, nkutlwele botlhoko!"],["p","Morena Jesu, Kwana ya Modimo, yo o rweleng maleo a lefatshe, nkutlwele botlhoko!"],["p","Morena Jesu, nthuse gore ke amogele Selalelo sa gago ka tshwanelo, ke amogele bopelotlhomogi jwa gago. Amen."],["h","Fa motho a amogetse Selalelo, a a rapele a re:"],["p","Morena Jesu Krisete, mmele o o boitshepo wa gago ke o jele, madi a gago a a molemolemo ke a nole, le dipogo tsa gago le loso lo lo botlhoko lwa gago di ntiisitse. Morena Jesu Krisete, ke a go leboga mmogo le bakrisete botlhe ba gago. Amen."],["H","Boipobolo (Confession)"],["q","Go ipobola ke go reng?"],["p","Sa ntlha ke go ipobola dibe, sa bobedi ke go amogela boitshwarelo ka molomo wa moruti jaaka mo Modimong ka osi, motho a sa belaele sepe, mme a dumela ka tlhomamo gore dibe tsa gagwe o di itshwaretswe fa pele ga Modimo."],["q","Motho o tshwanetse go ipobola maleo afe?"],["p","Fa pele ga Modimo re ipobola maleo otlhe, le ona a re sa a itseng, jaaka re dira mo Thapelong ya Morena. Mme fa pele ga Moruti re ipobola ona fela a re a itseng."],["q","Maleo ao ke afe?"],["p","O tlaa a lemoga ka nosi, fa o ipotsisa ka fa Ditaolong tse di lesome; o tlaa bona ka tsona gore, a o kile wa kgopisa motho ka mafoko le ditiro, a o kile wa utswa gongwe wa tlhokomologa se e neng e le tshwanelo ya gago go se dira, gongwe a o sentse ka mokgwa o mongwe."],["q","O ka ipobola ka mafoko afe?"],["p","Ka mafoko a, gongwe ka a a tshwanang le ona:"],["i","Modimo Mong-wa-thata-yotlhe, Rara yo o kutlwelobotlhoko, nna motho wa boleo yo o tlhomolang pelo ke go ipobolela maleo otlhe le ditshiamololo tsa me, tse ke go galefisitseng ka tsona. Ke tshwanetswe ruri ke petso ya gago ka ntlha ya tsona. Mme tsotlhe tseo di nkutlwisa botlhoko mo pelong, ke a di ikwatlhaela, le go inyatsa ka ntlha ya tsona. Jaanong ke go rapela ka ntlha ya boutlwelobotlhoko jo bogolo jwa gago gore o ntlhomogele pelo, o be o intshwarele maleo otlhe. Ke kopa jalo ka ntlha ya dipogo tse di botlhoko tsa ga Morwao Jesu Krisete, Morena wa rona, le ka ntlha ya loso lwa gagwe lo lo boitshepo, a se na molato ope. Ke eletsa ruri go tlhabologa. Nthuse jalo! Amen."],["ref","(Hymn reference: 162, 1: Jesu ke yo o tsholang baleofi go ba thusa! ’Foko le le gomotsang lone le lo le bolelle botlhe ba ba timetseng, ba tshabele kwa Kristeng.)"]]},{"t":"Maina a Disontaga le a Meletlo ya Kereke le Tlhaloso ya Ona","b":[["sub","Names of Sundays and Church Festivals with explanations"],["n","1. Disontaga di le nne tsa sebaka sa ATFENTE. Atfente ke go re: Go tla. Ke sebaka sa go gopola go tla ga Jesu Krisete go rona."],["n","2. MOLETLO WA BOTSALO JWA MORENA (25 December)."],["n","3. Sontaga sa MORAGO GA BOTSALO JWA MORENA."],["n","4. Letsatsi la NGWAGA O MOŠA."],["n","5. MOLETLO WA EPIFANIA (6 January). Epifania ke go re: Ponatshego. Re gopola go bonala ga bopelotlhomogi jwa Modimo ka Jesu Krisete, e le jo bo tshwanetseng go bonwa ke batho botlhe ba lefatshe (Tito 2, 11). Batlhalefi ba Mathaio 2, 1 ke baheitane ba ntlha ba ba bonyeng bopelotlhomogi joo. Go ka na disontaga di le 6 moraga ga Epifania."],["n","6. Disontaga di le 3 di fa gare ga sebaka sa Epifania le sa dipogo tsa Morena. Maina a tsona ke a:"],["n","(a) SEPTUAGESIME, ke go re: Malatsi a a masome a supa pele ga moletlo wa Tsogo ya Morena."],["n","(b) SEKSAGESIME, ke go re: Malatsi a a masome a marataro pele ga Tsogo."],["n","(c) KWINKWAGESIME, ke go re: Malatsi a a masome a matlhano pele ga Tsogo."],["n","Leina la bobedi la sontaga se ke ESTOMIHI ka mafoko a ntlha a Pesalome 31,3 ka puo ya Selatine."],["n","7. Disontaga tsa sebaka sa dipogo tsa Morena ke tse:"],["n","(a) INFOKAFITE, ke go re: O tlaa mpitsa, Pes. 91, 15."],["n","(b) REMINISERE, ke go re: Gopola, Pes. 25,6."],["n","(c) OKULI, ke go re: Matlho, Pes. 25, 15."],["n","(d) LETARE, ke go re: Itumeleng, Jesaya. 66, 10."],["n","(e) JUDIKA, ke go re: Nkatlholele, Pes. 43, 1."],["n","(f) PALMARUM, ke gore: Letsatsi la dipalema (mokolane), Joh. 12, 13."],["n","8. DONERTAGA WA SELALELO. Ke letsatsi la go gopola tlhomamiso ya Selalelo sa Morena."],["n","9. FREITAGA WA TIDIMALO. Ke letsatsi la loso lwa Morena."],["n","10. MOLETLO WA TSOGO YA MORENA."],["n","11. Disontaga tsa morago ga Tsogo ke tse:"],["n","(a) KWASIMODOGENITI, ke go re: Jaaka bana ba e leng gona ba tsalwang, 1 Petoro 2,2."],["n","(b) MISERIKORDIA DOMINI, ke go re: Bopelotlhomogi jwa Morena, Pes. 33,5."],["n","(c) JUBILATE, ke go re: Duduetsang, Pes. 66,1."],["n","(d) KANTATE, ke go re: Opelang, Pes. 98, 1."],["n","(e) ROGATE, ke go re: Rapelang, Math. 7, 7."],["n","12. MOLETLO WA TLHATLOGO YA MORENA, e le letsatsi la masome a mane morago ga Tsogo."],["n","13. EKSAUDI; ke go re UTLWA (Pesalome 27, 7-8). Sontaga sa go rapela go tla ga Moya o o Boitshepo."],["n","14. BOITSHEPO, gongwe: PENTEKOSTE, ke go re: Letsatsi la masome a matlhano morago ga Tsogo."],["n","15. MOLETLO WA TRINITATE, ke go re: Boraro jo bo bongwefela, ebong Modimo Rara le Modimo Morwa le Modimo Moya o o Boitshepo."],["n","16. Go ka na Disontaga di le 27 morago ga Trinitate."],["n","17. LETSATSI LA OCTOBER A LE 31 ke la go gopola tshimologo ya Ntšhafatso ya Kereke ka Martinus Luthere."]]}];
