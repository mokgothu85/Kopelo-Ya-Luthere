 'godimong, / yo o leng mongwe borarong, / yo o tshwanetsweng ke tlotlo, / Jesu Kriste."]},{"n":1230,"d":"K230","o":248.5,"t":"Jehofa, go monate jang","c":"Difela tsa Bophelo ka Tumelo: Ka ga Kereke","k":"K230","v":["Jehofa, go monate jang / mo phuthegong e e utlwang / Lefoko la Modimo! / Ka moo ke yo 'tlhologellwang / kwa leina la 'go le bakwang / ke batho ba 'go botlhe. / Mme ke eletsa mo pelong / go utlwa wena Lefokong / le go nna yo o dumelang.","Dithaga di mo setlhareng, / dipeolwane leboteng, / di aga mo go tsona: / Ke rata jalo mo pelong / legae la me mo kerkeng, / go nna le wena gona. / Go sego ba ba kopanang / le wena gona mo kerkeng / ka pelo e e lebogang.","Go nna letsatsi Tempeleng / ya gago go gaisa jang / malatsi a sekete! / Le fa nka nna serepoding, / ke le yo monnye phuthegong, / ke itumela thata; / gona go phala go nna teng / matlong a ba ba humileng, / e le ba ba ikepileng.","Jehofa, 'tsatsi mo bontshong / le thebe mo ditlhabanong, / o tlaa re tlhabanela. / Ke wena o re abelang / boitshwarelo Lefokong / le tlotlo fa go wena. / Ke wena yo 're tlamelang / ka tsotlhe tse di batlegang; / o re fitlhisa botshelong."]},{"n":1253,"d":"K253","o":270.5,"t":"Thanyang lo tsoge thobalong","c":"Difela tsa Bophelo ka Tumelo: Sa Tsosoloso","k":"K253","v":["Thanyang lo tsoge thobalong, / morafe wa Morena! / Utlwang mokgosi o o reng: / Kgosi e bitsa lotlhe! / Akanyang tse lo di filweng / ke ene yo 'lo rometseng / masego a magolo.","Tse ene o di lo fileng / ke 'Foko la bophelo, / ke 'sedi le le bonisang / ka Moya wa Modimo. / Lo bileditswe mo pusong / e e leng ya Modimo, Rra / wa rona le wa botlhe.","Ke ka o ntshitse Krisete / yo 'leng boammaaruri, / yo 'leng bophelo lefatsheng / le tsela ya pholoso. / Ke ona o o laotseng: / Re pholosiwe lefatsheng / ke Jesu Kriste fela.","Ka moo lo lebogele tlhe / lorato lwa Modimo. / Se nyatseng pitso e 'tsileng / ka 'Foko la Modimo, / lo le tumise mo bathong / go thusa jalo mo kagong / ya puso ya Morena.","Fa lo dumela Moreneng / lo tlaa ungwela ene / maungo a a tswang Moeng, / a a supang lorato / le thata e 'gakgamatsang. / Morena ke yo o tsosang / pelong bopelokgale.","Bontsi ke 'bo sa diriseng / bonnete jwa Modimo. / Mme ke ba ba tlhomamisang / maaka ka maikano. / Morena ke yo 'sotliwang; / Lefoko la 'gwe lefatsheng / le gatwa ka dinao.","Sebaka se lo se filweng / a se se fete fela! / Petso ke e 'atametseng, / le fa e sa fitlhegile. / Selepe se se tlaa remang / ga se se se ka lo fosang. / Morena oa lo bitsa.","Tlhagiso e tswa Moreneng / ka 'tshupo di le dintsi. / Petso ke e e fitlhileng, / kabologang ditsebe. / Lo tsoge ruri thobalong, / Morena ke yo 'lo bitsang, / tshwarang seatla sa 'gwe.","Morena, o re thuse tlhe, / re latlhe tse di maswe. / Re tsene jalo mo pusong, / re tle re amogelwe. / Morena Jesu Kriste, Mong, / thusa ka Moya mo bathong, / tlhagiso ba e utlwe!"]},{"n":1254,"d":"K254","o":270.51,"t":"Legodimong le lefatsheng","c":"Difela tsa Bophelo ka Tumelo: Ka ga Boitshwarelo jwa Dibe","k":"K254","v":["Legodimong le lefatsheng / kgomotso ya me tota / ke wena Jesu yo 'ntshwetseng; / ke a go solofela! / Ga go na ope mo bathong, / ga go moengele 'godimong, / yo o ka ntshang mo maleong! / Mo tlalelong / ke go ikanya gotlhe, Mong.","Maleo a me 'mantsi jang! / Ee, ruri aa nkimela. / Ke wena yo o nkimollang / ka madi a 'go fela. / A ko o mpege mo Rareng, / fa ke le yo o golotsweng / mo maleong le mo khutsong / le mo losong. / A ke se wele talhegong.","A ko 'nkabele loratong / tumelo ya mannete; / ke itumelle mo pelong / boitshwarelo jwa 'go. / Ke rate wena yo 'ntshwetseng / le mongwe-ka-nna lefatsheng. / O se ntlogele mo losong, / leleka teng / Satane yo o ntlhaselang.","A go tlotliwe 'godimong / Rraarona yo 'lorato / le Jesu yo 're bolokang, / Morwa Modimo ruri, / le Moya o 're gogelang / go Jesu yo o re swetseng. / Re tle re phele Modimong / mo lefatsheng / le gona kwa legodimong."]},{"n":1257,"d":"K257","o":275.5,"t":"Re sego, fa re phela","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K257","v":["Re sego, fa re phela / mo boitshepisong, / fa pele ga Morena / yo o legodimong; / go sego ruri yo 'mmatlang / mo Lefokong la gagwe, / yo o mo direlang.","Ka pelo yotlhe ya me / ke nna 'ke lebogang; / Morena, o nthutile / tsela e 'siameng. / O se nne yo o nkatogang, / o nthute go tsamaya / kafa ditaolong.","Ke itshwarella ruri / ka se o se nthutang, / o ntshware ka seatla, / ke se nne yo o wang. / Fa tota o le yo 'nkgogang, / ke tlaa tsamaya sentle / tsela e 'laetsweng.","Lefoko la Modimo / ke le le sa khutleng, / ebile le rometswe / go rerwa lefatsheng; / se o se ikaeletseng / o ntse o dira sona / le ka bosakhutleng."]},{"n":1267,"d":"K267","o":284.5,"t":"Ke a go rata, Jesu Mong","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K267","v":["Ke a go rata, Jesu Mong, / o nne mo go nna mo pelong / ka bopelontle jwa 'go. / 'Fatsheng ga go se se nkgatlhang, / se pelo e ka se ratang, / e batla wena fela. / Fa ke le yo 'kgobegileng / marapo, ke le botlhokong, / ke wena yo o nkgothatsang, / ka o le yo o nkgolotseng. / Ee, Jesu Mong, / yo o ntshwetseng sefapaanong; / a ke se tlhajwe ke ditlhong.","Ke wena yo o nneileng / moa le mmele lefatsheng / le 'thoto tsa me tsotlhe, / go di dirisa tshwanelong, / go thusa batho tlalelong, / go baka wena jalo. / A ko 'nkhumise tumelong, / go se nne tse di nkgolegang; / thibela Satan yo 'akang / le 'thuto tse di sokameng. / Ee, Jesu Mong, / yo o laolang, o mphemelang, / o nthuse go ya bofelong.","A baengele bokhutlong / ba nkise kwa legodimong, / kwa o leng teng, Morena. / Boloka mmele mo phupung, / o lale sentle teng mo mmung, / go tle go boe wena. / Ka 'tsatsi leo ntsose teng, / Morena wa me, mo phupung; / mme ke go bone lethabong, / o le yo o nkatlholelang. / Ee, Jesu Mong, / mo phuthegong, kgalalelong / ke tlaa go baka 'godimong."]},{"n":1269,"d":"K269","o":285.5,"t":"Bophelo le lesedi la me","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tsamao ya Bokeresete","k":"K269","v":["Bophelo le lesedi la me, / Modisa yo 'ikanyegang, / ke wa 'go, nna ka pelo ya me, / Mothusi le Imanuel. / Nna ga ke rate go ikgoga, / ka ke sa kake ka goroga. / Nketelle pele mo tseleng, / o ntshware thata ka mabogo; / mme jalo re tle re ye mmogo / kwa wena o go ratileng.","Ke ngwana wa 'go yo 'bokoa, / ke eng se nna ke se kgonang? / Ke kopa gore o nkgakolle, / ke dire tse o di ratang. / Ga o tlhajwe ke ditlhong go nthata, / o tlhokomela le tse dinnye, / tse di ka ntirafalelang. / Ke kopa gore 'tiro tsa me / o di simolle le nna tsotlhe, / mme o nne yo o di fetsang.","A ke nne wa 'go ka tlhomamo, / yo ke go latelang tseleng; / a ke tlogele tsa tshokamo, / tse wena o sa di rateng. / Ke dire fela thato ya 'go, / e 'bolelwang 'Fokong la gago / go tlotla jalo wena, Mong; / ke tlhoafale go tumisa / leina la 'go la Modisa, / ka ke le wa 'go tumelong.","A ke nne ngwana wa Modimo / ka wena yo o nkgolotseng; / a Moya wa 'go o mponise, / ke bone yo o nthatileng. / Ke bone Rara mo go wena, / ke bue nae jaaka ngwana, / mme ke nne yo o mo utlwang. / Lorato lwa 'gwe lo nthatise, / ke rate ene jaaka wena, / ke mmake yo o nthatileng.","Nna ke ntse ke iketla sentle, / ka pelo e le kagisong, / ke boka wena, kea go rata, / o nnosa metsi a 'phelang. / Ke mongwe wa phuthego ya 'go, / e 'bidiwang monyalwa wa 'go, / a ke nne yo 'go kgabetseng. / Mokgabo ke go tlhapisiwa / mading a gago, ke nne phepa, / ke tsene jalo 'godimong."]},{"n":1279,"d":"K279","o":303.5,"t":"Phuthego ya 'go, Jesu Mong","c":"Difela tsa Bophelo ka Tumelo: Ka ga Tlhabano ya Tumelo","k":"K279","v":["Phuthego ya 'go, Jesu Mong, / e o e rekileng ka madi, / e erileng Kolobetsong / ya itatola Satan, mmaba, / e bona kafa e pallwang ka teng, / e kopa thuso ya 'go tlhabanong.","O gataketse leroleng / tlhogo ya noga, phenyong ya 'go, / wa ba wa tsoga mo losong / go re golola mo go lone. / Satan jaanong o ka re dira eng? / Molato ke o o itshwaretsweng.","Mme ka re sa le lefatsheng / la dithaelo le diteko, / re sa le ba ba apereng / nama le madi tsa ga Atam; / ke ka moo Satan a re raelang. / Bakriste, lo se lape, mo fenyeng!","Re ba ba dikanyeditsweng / ke baba 'bantsi 'fatsheng leno, / yo mongwe o re bitsa fa, / yo mongwe o re tshwenya fale, / mme botlhe tota ke ba ba lekang / go re busetsa rotlhe kgolegong.","E ka nna mang yo o fenyang / keletso le poifo tsa 'gwe? / Ene ga se yo 'ikanyang / nonofo e e mo go ene; / ka gonne baba ba 're tlhaselang / ke bone ruri ba ba re pallang.","Ao Kwana, yo o tlhabilweng, / re kopa thuso mo go wena! / Fa o le yo 're femelang, / re ka se senngwe ke Satane. / O re fa thata e 'gakgamatsang / go fenya botlhe ba ba re tshwenyang.","Thusa, re se nne ba 'lapang, / ba ba bayang marumo fatshe. / Re thatafatse dipelong / go ema ka bopelokgale / mo tlhabanong e re e laetsweng, / mme re se tshabe re le dipogong.","Ke gona re tlaa opellang / Morena yo e leng mofenyi / difela tse di mo tlotlang, / re sena go ya kwa go ene, / fa baba botlhe e le ba 'wetseng / fa dinaong tsa yo o ba fentseng."]},{"n":1312,"d":"K312","o":340.5,"t":"Boikhutso ruri bo kwa pele","c":"Difela tsa Dilo tsa Bofelo: Ka ga Bophelo jo bo sa khutleng","k":"K312","v":["Boikhutso ruri bo kwa pele, / itiise, motho, maketeng; / le fa 'phegelo di sa fele, / se itlhoboge leetong. / Mme leba Kwana ya Modimo, / ka gonne e tlaa go fudisa / kwa metsweding legodimong. / Tlhabano ya 'go e tlaa fela, / le gona e le ka bonako, / o be o fitlhe boikhutsong.","Boikhutso joo re bo batletswe / ke Rara wa bosakhutleng; / re ne re setse re bo beetswe / go ise go nne motho teng. / Boikhutso joo re bo reketswe / ke Kwana; gonne e re swetse. / Jaanong e bitsa e re: Tlaang, / ba lo imelwang ke merwalo, / tsenang jaanong ka boitumelo / go ikhutsa ka bosakhutleng.","Tlaang kwano he, baitlhobogi, / ba lo ikgogang dipogong! / Itlhaganneng, bahutsafadi, / lo nne ba ba namediwang! / Matsapa lona lo a tsere, / jaanong Morena oa lo raya: / Tlaang go nna mo boikhutsong! / Lo ba me, ka lo tsetswe seša, / le fa Satane a gaketse; / gomotsegang, mme lo tseneng.","Moeti o a lapologa, / fa a ikhutsa sedibeng. / Molwetsi o a gomotsega, / fa a fitlhile kwa ngakeng. / Boikhutso jo, bo bokhutshwane, / bo feta jaaka mouwane, / go tlaa tla jo bo tlhomameng! / Bolwetse ga bo mo go jona, / matsapa ga a dirwe gona, / kwa Kwana e re ikhutsisang.","Teng re tlaa roba re thabile / tse di jwetsweng re le sellong. / Re tlaa ipela re ruile / bophelo jo bo sa feleng. / Botlhoko, sello le phegelo / di tlaa sutela boitumelo / pusong ya Kwana leseding. / Koo dikeledi di phimolwe / matlhong a rona, re fetolwe, / re nne ba ba itshekileng.","Teng re tlaa phela re fodile, / ka go se tlala bosasweng; / go tsile Sabat yo mogolo, / ga go matsapa ape teng. / Ee, Kwana e tlaa nna le rona, / mme re tlaa aga teng le yona / tlotlong le mo kgalalelong; / boikhutso ga bo ne bo khutla, / Jesu o tlaa bo a re ntshitse / ditirong tse di lapisang.","Re tlaa lapolosega gona / mo kagisong e 'sa feleng. / Ba lo lapileng, utlwang jalo, / ke Kwana e 'lo gomotsang! / Tsisang diphuka, re fofele / kwa gae, re itlhaganele / go ya kwa re lapologang! / Ba ba fentseng ba re letile, / re tle re duduetse nabo. / Ke Kwana e re e lebogang."]},{"n":1319,"d":"K319","o":350.5,"t":"Fa ke le poifong","c":"Difela tsa Thapelo: Tsa Metlha yotlhe","k":"K319","v":["Fa ke le poifong / le mo ditlalelong, / Modimo oa mphemela; / o itse go nnamola / le go thibosa kotsi, / ka o laola tsotlhe.","Fa ke le molatong, / ga ke yo 'tlhobogang; / ke tlaa ikanya Jesu / le go ineela ene; / ke wa 'gwe, fa ke phela, / le gona fa ke sule.","Fa ke ya mo losong, / ke swela tumelong, / ga nkitla ke nyelela. / Ka Jesu ke tlaa phela, / ka a tlaa nkamogela / ka nako ya bofelo.","Jesu yo o swetseng / basenyi Golgoteng, / o re golotse gotlhe / mo maleong a rona. / A ko 're ise rotlhe / pusong ya legodimo.","Amen! Ke go re: Ee, / nna ke dumetse tse! / Morena, o re buse, / le gona o re goge, / re fitlhe koo go wena. / A go nne jalo! Amen."]},{"n":1324,"d":"K324","o":354.5,"t":"Go maru a 'dumang","c":"Difela tsa Thapelo: Sa Motlha wa Dikgadima","k":"K324","v":["Go maru a 'dumang, / ao ba ga etsho, tlaang / re rapeleng Morena, / Mong wa dithata tsotlhe, / re kope boitshwarelo / le go femelwa gotlhe.","Modimo o 'thusang, / ke yo 'go ikanyang; / o ntlhomogele pelo, / ka ke tla ka tumelo. / A ko o itshwarele / ka ntlha ya 'Jesu Kriste.","Nkgolole poifong, / ka ke le ledimong; / a ke ikanye wena / ka Krisete Morena. / Ka ke le ngwana wa 'go, / ke ikanya thuso ya 'go.","Ke yo 'go ineetseng / ka tse ke di tshotseng. / Ke diphukeng tsa gago, / poifo e ntlogetse; / o tlaa fetisa gape / ditladi le molelo.","Se re tlogele, Mong, / jaanong mo tlalelong. / Ee, Rara, bana ba 'go / ba thuse gompieno. / Re tlaa leboga thata, / re tlaa nna re go baka."]},{"n":1331,"d":"K331","o":360.5,"t":"Re lema le go jwala","c":"Difela tsa Thapelo: Tsa Moletlo wa Tebogo","k":"K331","v":["Re lema le go jwala / dipeo masimong; / go tlhoga le go butswa / go tswa kwa Modimong. / O re romela maru / re le ba 'robetseng, / o re nesetsa pula / e re e tlhokileng. / Tse di leng molemo / di tswa kwa Moreneng, / mo lebogeng, mo lebogeng, / lo mo solofeleng!","Masego a Morena / ke a 'fitlhegileng, / o re romela ona / ka go sa itsiweng; / mme o a tsenya jalo / mo mmung le bogobeng; / bo tshwarwa ka diatla, / mme bo tswa Moreneng. / Tse di leng molemo / di tswa kwa Moreneng, / mo lebogeng, mo lebogeng, / lo mo solofeleng!","Tse e leng tse dikgolo / di tswa kwa Moreneng: / lewatle le lesedi / le tse di fetang tse. / Le tsona tse dinnyane / le tse di gagabang: / o di dirile tsotlhe / mo go gakgamatsang. / Tse di leng molemo / di tswa kwa Moreneng, / mo lebogeng, mo lebogeng, / lo mo solofeleng!","Modimo o tlamela / tse o di tlhodileng, / ka e le Mong wa tsona / yo o di ratileng. / Diphedi di jesiwa / ka tse di di tlhokang, / di lebogela ona / tlamelo mo tlaleng. / Tse di leng molemo / di tswa kwa Moreneng, / mo lebogeng, mo lebogeng, / lo mo solofeleng!","Morena o femela / ba ba mo ikanyang, / o itse go gomotsa / ba ba mo selelong. / O itse le go kgona / tse re sa di boneng: / dikotsi tsa bosigo, / monang le tau sekgweng. / Tse di leng molemo / di tswa kwa Moreneng, / mo lebogeng, mo lebogeng, / lo mo solofeleng!","Letsatsi le a tlhaba, / ngwedi o mo tseleng / ya ona, jaaka phefo / le maru loaping. / Di rulaganyeditswe / ba ba mo lefatsheng, / gore ba opelele / Morena tebogong. / Tse di leng molemo / di tswa kwa Moreneng, / mo lebogeng, mo lebogeng, / lo mo solofeleng!"]},{"n":1332,"d":"K332","o":360.51,"t":"Mo masimong teng mmopo o budule","c":"Difela tsa Thapelo: Tsa Moletlo wa Tebogo","k":"K332","v":["Mo masimong teng mmopo o budule, / ke gona o obamelang Morena, / o bitsa o re: \"Tlaang jaanong lo robe, / lo se lebale go leboga ene!\"","Morena o na a nesa dipula, / di tlhogisitse peo ya mabele, / a ba a butswa, ra ya go a roba, / dineo tsotlhe di tswa mo go Rara.","Fa ene a bua: \"A go nne jalo!\" / lefatshe le tlaa tlala tshegofatso; / mme fa Morena a re hularela, / ke gona re tlaa fetogang lerole.","Rona ba gago re tlaa itshokela / matsapa a ditiro tsa mabogo. / Rara, re kopa: o di tshegofatse, / re okeletse pholo le dithata.","Re tlaa nna re mo solofela gape / le go abela ba e leng batlhoki. / Re amogetse thobo ka tebogo, / le fa e 'kgolo kampo e potlana.","Dithoto tsotlhe ke tsa gagwe fela, / o re laetse go di lebelela; / o tlaa re bitsa go ikarabela / mogang o loso lo tlang go re roba.","Mo bofelong, Jesu, o re tsholele / mo difaleng, re nne thobo ya gago. / Botlhe ba 'jwalang mono ka 'keledi, / koo ba tlaa roba ka boitumelo."]},{"n":1366,"d":"K366","o":398.5,"t":"Rara, re lebogela","c":"Difela tsa Dipaka: Tsa Dijo","k":"K366","v":["Rara, re lebogela / dijo fa bojelong! / O ntse o re tlamela / ka tsona bophelong. / Ao, thusa, re lemoge / dineo, re leboge / le ka bosakhutleng.","A 'ko o re tlamele / ka dijo bophelong / tsa moa le tsa mmele, / ba re leng phuthegong. / Re thuse go dumela, / re ise la bofelo / teng kwa legodimong. Amen."]},{"n":1376,"d":"K376","o":407.5,"t":"Ka ke ya go robala","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K376","v":["Ka ke ya go robala / jaanong mo bosigong, / moa o tlhoafalla / go baka Jesu Krist', / a nkutlwe thapelong.","Modimo, o ntisitse / kajeno tsamaong, / mme o nthiboseditse / mathata bophelong, / tseleng le mo tirong.","O intshwaretse gotlhe / ka Jesu yo 'ntshwetseng; / mme o nneile tsotlhe / tse ke di tlhokileng / mmeleng le mo moeng.","O mphemeletse bone / baetsho, kwa ke teng; / wa ba wa mpolokela / dithoto lefatsheng, / tse o di nneileng.","Lesego ke le bonye / kajeno ditirong, / ka ke di kgonne tsotlhe; / ke yo o go bakang / jaanong mo bosigong.","Ee, ke a go tumisa, / Modimo 'godimong; / mme ke tlaa go godisa / le mo ditlalelong, / 'phelong le mo losong.","Ke go rapela jaana: / Mpoloke bosigong; / fa Satan a nthaela, / mphemele thaelong, / ke ikhutse thagamong.","Mo lefatsheng go thata, / re mo matshwenyegong; / mme Jesu o a rata / go re isa boikhutsong / teng kwa kgalalelong.","Jaanong ke tlaa robala, / o ntsose mo mosong; / mme ere o tla gape, / o ntsose mo losong, / o nkise 'godimong."]},{"n":1378,"d":"K378","o":408.5,"t":"Letsatsi, ao, jaanong le phirimile","c":"Difela tsa Dipaka: Tsa Maabanyane","k":"K378","v":["Letsatsi, ao, jaanong le phirimile, / le emisitse 'tiro tsa diatla; / bosigo jona ke jo bo tsileng, / lefatshe lotlhe le mo boikhutsong.","Mong wa bosigo, Mong wa motshegare, / ke a go baka, ka o ntlhokometse, / wa ntshireletsa mo ditlalelong; / ke tlhotse sentle, ke le phemelong.","O intshwarele, fa ke eleditse / go dira tsa lefifi gompieno, / phimola dibe 'ke di dirileng / ka ntlha ya 'Jesu ka bosakhutleng.","O thuse moa wa me go go bona, / fa ke ya go robala jaanong jaana. / A mmele e nne o 'lapologang, / o be o tie sentle borokong.","Fa 'sigo jwa me jwa bofelo bo tla, / fa ke tlaa fitlhwa lefifing la phupu, / o ntebe, o nkgopole mo bontshong; / foo ke na le lesedi mo losong.","Modimo, nkise le ba gago botlhe / kwa botshelong jo boša jwa lesedi, / kwa go se nang bosigo bope teng; / mme go lesedi le le sa khutleng."]}];

{s:"Sebaka sa Tsogo ya Morena",n:"Moletlo wa Tsogo ya Morena II",t:"Keresete o tsogile! O iponatsha barutwa ba gagwe! Tota o a tshela!",p:"",f:"",r:"EF Luka 24:13-35|EP 1 Bakor. 15:12-20|3 Luka 24:36-45|4 1 Bakor. 15:50-58|5 Jes. 25:8-9|6 Dit. 10:34a,36-43"},
{s:"Sebaka sa Tsogo ya Morena",n:"Kwasimodogeniti (\"Jaaka bana ba e leng gona ba tsalwang\", 1 Pet. 2:2)",t:"Keresete yo o tsogileng o re neela botshelo jo bošwa ka kolobetso.",p:"116:1-9",f:"127",r:"EF Joh. 20:19-29|EP 1 Pet. 1:3-9|3 Joh. 21:1-14|4 Bakol. 2:12-15|5 Mar. 16:9-20|6 Jes. 40:26-31"},
{s:"Sebaka sa Tsogo ya Morena",n:"Miserikordia Domini (\"Bopelotlhomogi jwa Morena\", Pes. 33:5)",t:"Keresete yo o tsogileng ke Modisa yo o molemo.",p:"23",f:"219",r:"EF Joh. 10:11-16,27-30|EP 1 Pet. 2:21b-25|3 Hes. 34:1-16,31|4 1 Pet. 5:1-4|5 Joh. 21:15-19|6 Baheb. 13:20-21"},
{s:"Sebaka sa Tsogo ya Morena",n:"Jubilate (\"Duduetsang!\", Pes. 66:1)",t:"Keresete yo o tsogileng o dira ba e leng ba gagwe dibopiwa tse dintšhwa.",p:"66:1-9",f:"227",r:"EF Joh. 15:1-8|EP 1 Joh. 5:1-4|3 Joh. 16:16-23a|4 2 Bakor. 4:16-18|5 Gen. 1:1-4a,26-31; 2:1-3|6 Dit. 17:22-34"},
{s:"Sebaka sa Tsogo ya Morena",n:"Kantate (\"Opelang!\", Pes. 98:1)",t:"A re opeleng re galaletse Keresete yo o tsogileng!",p:"98",f:"183",r:"EF Math. 11:25-30|EP Bakol. 3:12-17|3 Math. 21:14-22|4 Dit. 16:23-34|5 Jes. 12:1-6|6 Tshen. 15:2-4"},
{s:"Sebaka sa Tsogo ya Morena",n:"Rokate (\"Kopang!\", Math. 7:7)",t:"A re rapeleng mo leineng la ga Keresete yo o tsogileng!",p:"95:1-7b",f:"348",r:"EF Joh. 16:23b-33|EP 1 Tim. 2:1-6a|3 Luka 11:5-13|4 Bakol. 4:2-6|5 Math. 6:5-15|6 Ekes. 32:7-14"},
{s:"Sebaka sa Tsogo ya Morena",n:"Moletlo wa Tlhatlogo ya Morena (Labone morago ga Rokate)",t:"Keresete yo o tsogileng o ntse ka fa letsogong le le jang la Modimo Rara e le Kgosi ya dilo tsotlhe.",p:"47",f:"143",r:"EF Luka 24:44-53|EP Dit. 1:3-11|3 1 Dikg. 8:22-24,26-28|4 Tshen. 1:4-8|5 Joh. 17:20-26|6 Baef. 1:20b-23"},
{s:"Sebaka sa Tsogo ya Morena",n:"Eksaudi (\"Utlwa!\", Pes. 27:7)",t:"Ba ba dumelang ba lebelela Mowa o Keresete yo o tsogileng o o ba solofeditseng.",p:"27:1,7-14",f:"34",r:"EF Joh. 15:26-16:4|EP Baef. 3:14-21|3 Joh. 7:37-39|4 Jer. 31:31-34|5 Joh. 14:15-19|6 Barom. 8:26-30"},
{s:"Moletlo wa Pentekoste",n:"Moletlo wa Pentekoste I (kgoromeletso ya Mowa o o Boitshepo)",t:"Keresete yo o tsogileng o tshela Mowa o o Boitshepo mo barutweng ka fa a solofeditseng ka teng.",p:"118:24-29",f:"147",r:"EF Joh. 14:23-27|EP Dit. 2:1-18|3 Joh. 16:5-15|4 1 Bakor. 2:12-16|5 Num. 11:11-12,14-17,24-25|6 Barom. 8:1-11"},
{s:"Moletlo wa Pentekoste",n:"Moletlo wa Pentekoste II",t:"Keresete yo o tsogileng o tshela Mowa o o Boitshepo o o nayang Kereke ya gagwe botshelo.",p:"100",f:"147",r:"EF Math. 16:13-19|EP 1 Bakor. 12:4-11|3 Gen. 11:1-9|4 Baef. 4:11-16|5 Joh. 4:19-26|6 Dit. 2:22-23,32-33,36-39"},
{s:"Sebaka sa Trinitate",n:"Moletlo wa Trinitate (\"Boraro jo bo bongwefela\")",t:"Modimo o itshenolela motho e le Rara le Morwa le Mowa o o Boitshepo ka tsela e e fetang tlhaloganyo.",p:"145",f:"162",r:"EF Joh. 3:1-15|EP Barom. 11:33-36|3 Jes. 6:1-13|4 Baef. 1:3-14|5 Num. 6:22-27|6 2 Bakor. 13:11-13"},
{s:"Sebaka sa Trinitate",n:"Sontaga wa ntlha morago ga Trinitate",t:"Modimo o batla kutlo le lorato.",p:"34:2-11",f:"148",r:"EF Luka 16:19-31|EP 1 Joh. 4:16b-21|3 Joh. 5:39-47|4 Jer. 23:16-29|5 Math. 9:35-10:7|6 Doit. 6:4-9"},
{s:"Sebaka sa Trinitate",n:"Sontaga wa bobedi morago ga Trinitate",t:"Modimo o laletsa mongwe le mongwe go tsena mo bogosing jwa ona.",p:"36:6-11",f:"224",r:"EF Luka 14:15-24|EP Baef. 2:17-22|3 Math. 22:1-14|4 1 Bakor. 14:1-3,20-25|5 Jes. 55:1-5|6 1 Bakor. 9:16-23"},
{s:"Sebaka sa Trinitate",n:"Sontaga wa boraro morago ga Trinitate",t:"Modimo o batla ba ba latlhegileng.",p:"103:1-5,8-13",f:"255",r:"EF Luka 15:1-10|EP 1 Tim. 1:12-17|3 Luka 15:1-3,11b-32|4 1 Joh. 1:5-2:6|5 Luka 19:1-10|6 Hes. 18:1-4,21-24,30-32"},
{s:"Sebaka sa Trinitate",n:"Sontaga 4 morago ga Trinitate",t:"Modimo o rata gore re thusane re be re itshwarelane.",p:"42",f:"155",r:"EF Luka 6:36-42|EP Barom. 14:10-13|3 Gen. 50:15-21|4 1 Pet. 3:8-17|5 Joh. 8:3-11|6 Barom. 12:17-21"},
{s:"Sebaka sa Trinitate",n:"Sontaga 5 morago ga Trinitate",t:"Modimo o neela motho pholoso jaaka neo e e sa lefiweng.",p:"73:14,23-26,28",f:"244",r:"EF Luka 5:1-11|EP 1 Bakor. 1:18-25|3 Joh. 1:35-42|4 Gen. 12:1-4a|5 Luka 14:25-33|6 2 Bathes. 3:1-5"},
{s:"Sebaka sa Trinitate",n:"Sontaga 6 morago ga Trinitate",t:"Modimo o re tshedisa ka boitshwarelo jo bo tswang kolobetsong.",p:"139:1-16,23-24",f:"371",r:"EF Math. 28:16-20|EP Barom. 6:3-11|3 Doit. 7:6-12|4 Dit. 8:26-39|5 Jes. 43:1-7|6 1 Pet. 2:2-10"},
{s:"Sebaka sa Trinitate",n:"Sontaga 7 morago ga Trinitate",t:"Modimo o re biletsa go nna tafoleng ya ona.",p:"107:1-9",f:"5",r:"EF Joh. 6:1-15|EP Dit. 2:41a,42-47|3 Joh. 6:30-35|4 Bafil. 2:1-4|5 Luka 9:10-17|6 Ekes. 16:2-3,11-18"},
{s:"Sebaka sa Trinitate",n:"Sontaga 8 morago ga Trinitate",t:"Modimo o re bitsa gore re sepele jaaka bana ba lesedi.",p:"48:2-3a,9-11",f:"18",r:"EF Math. 5:13-16|EP Baef. 5:8b-14|3 Jes. 2:1-5|4 1 Bakor. 6:9-14,18-20|5 Joh. 9:1-7|6 Barom. 6:19-23"},
{s:"Sebaka sa Trinitate",n:"Sontaga 9 morago ga Trinitate",t:"Modimo o re bitsa gore mongwe le mongwe wa rona a dirise dineo tse o di filweng ke Mowa.",p:"40:9-12",f:"284",r:"EF Math. 25:14-30|EP Bafil. 3:7-14|3 Math. 7:24-27|4 Jer. 1:4-10|5 Math. 13:44-46|6 1 Pet. 4:7-11"},
{s:"Sebaka sa Trinitate",n:"Sontaga 10 morago ga Trinitate",t:"Modimo o batla gore le Baiseraele, e bong ba morafe ba Kgolagano e Kgologolo, ba amogele kgololo ka Keresete.",p:"74:1-3,8-11,20-21",f:"269",r:"EF Luka 19:41-48|EP Barom. 11:25-32|3 Joh. 2:13-22|4 Barom. 9:1-5,31-10:4|5 Jer. 7:1-15|6 2 Dikg. 25:8-12"},
{s:"Sebaka sa Trinitate",n:"Sontaga 11 morago ga Trinitate",t:"Modimo o itshwarela ba ba ipobolang dibe tsa bone ka boikokobetso.",p:"113:1-8",f:"176",r:"EF Luka 18:9-14|EP Baef. 2:4-10|3 Math. 21:28-32|4 Bagal. 2:16-21|5 Luka 7:36-50|6 2 Sam. 12:1-10,13-15a"},
{s:"Sebaka sa Trinitate",n:"Sontaga 12 morago ga Trinitate",t:"Modimo o tlhomogela ba ba bokoa pelo, o ba fodisa.",p:"147:3-6,11-14a",f:"21",r:"EF Mar. 7:31-37|EP Dit. 9:1-20|3 Jes. 29:17-24|4 Dit. 3:1-10|5 Mar. 8:22-26|6 1 Bakor. 3:9-15"},
{s:"Sebaka sa Trinitate",n:"Sontaga 13 morago ga Trinitate",t:"Modimo o batla gore re rate bangwe-ka-rona.",p:"112:5-9",f:"299",r:"EF Luka 10:25-37|EP 1 Joh. 4:7-12|3 Mar. 3:31-35|4 Gen. 4:1-16a|5 Math. 6:1-4|6 Dit. 6:1-7"},
{s:"Sebaka sa Trinitate",n:"Sontaga 14 morago ga Trinitate",t:"Modimo o batla gore re gakologelwe ditshegofatso tsa ona re leboge.",p:"146",f:"187",r:"EF Luka 17:11-19|EP Barom. 8:12-17|3 Mar. 1:40-45|4 1 Bathes. 1:2-10|5 Gen. 28:10-19a|6 1 Bathes. 5:14-24"},
{s:"Sebaka sa Trinitate",n:"Sontaga 15 morago ga Trinitate",t:"Modimo o batla gore re se ka ra tshwenyegela dilo tsa lefatshe leno.",p:"127:1-2",f:"202",r:"EF Math. 6:25-34|EP 1 Pet. 5:5c-11|3 Luka 18:28-30|4 Bagal. 5:25-6:3,7-10|5 Luka 17:5-6|6 Gen. 2:4-15"},
{s:"Sebaka sa Trinitate",n:"Sontaga 16 morago ga Trinitate",t:"Modimo o senola thata ya ona e e fenyang loso ka Jesu Keresete.",p:"68:4-7a,20-21",f:"133",r:"EF Joh. 11:1-3,17-27,41-45|EP 2 Tim. 1:7-10|3 Dilelo 3:22-26,31-32|4 Dit. 12:1-11|5 Luka 7:11-16|6 Baheb. 10:35-39"},
{s:"Sebaka sa Trinitate",n:"Sontaga 17 morago ga Trinitate",t:"Mongwe le mongwe yo o dumelang mo Modimong o fenya lefatshe.",m:"Tumelo ya rona ke yona phenyo e e fentseng lefatshe. [1 Joh. 5:4]",p:"25:8-15",f:"279",r:"EF Math. 15:21-28|EP Barom. 10:9-18|3 Mar. 9:17-27|4 Jes. 49:1-6|5 Joh. 9:35-41|6 Baef. 4:1-6"},
{s:"Sebaka sa Trinitate",n:"Sontaga 18 morago ga Trinitate",t:"Modimo o batla gore re o rate bogolo go dilo tsotlhe le mongwe-ka-rona jaaka re ithata.",m:"Taolo e re e amogetse mo go ona e e reng: Yo o ratang Modimo a a rate le morwa-Rraagwe. [1 Joh. 4:21]",p:"1",f:"286",r:"EF Mar. 12:28-34|EP Barom. 14:17-19|3 Mar. 10:17-27|4 Jak. 2:1-13|5 Ekes. 20:1-17|6 Baef. 5:15-21"},
{s:"Sebaka sa Trinitate",n:"Sontaga 19 morago ga Trinitate",t:"Modimo o fodisa mmele le mowa.",m:"Mphodise, Morena, foo ke tla fola! Mpholose, foo ke tla phologa! [Jer. 17:14]",p:"32:1-5,10-11",f:"13",r:"EF Mar. 2:1-12|EP Baef. 4:22-32|3 Mar. 1:32-39|4 Jak. 5:13-16|5 Joh. 5:1-16|6 Ekes. 34:4-10"},
{s:"Sebaka sa Trinitate",n:"Sontaga 20 morago ga Trinitate",t:"Modimo o tlhomile lenyalo gore le nne sekao sa thulaganyo le sa lorato lwa ona.",m:"Wena motho, Morena o go itsisitse tse di leng molemo le tse a di batlang mo go wena: O batla gore o dire tse di siameng, o rate bopelotlhomogi, o tsamaya le Modimo wa gago ka boikokobetso! [Miga 6:8]",p:"119:101-108",f:"184",r:"EF Mar. 10:2-16|EP 1 Bathes. 4:1-8|3 Gen. 8:18-22|4 1 Bakor. 7:29-31|5 Mar. 2:23-28|6 2 Bakor. 3:3-9"},
{s:"Sebaka sa Trinitate",n:"Sontaga 21 morago ga Trinitate",t:"Modimo o re tlamela ka dibolai tsa semowa gore re tie mo ntweng ya tumelo.",m:"O se ka wa fenngwa ke bosula, mme fenya bosula ka molemo. [Barom. 12:21]",p:"19:10-15",f:"200",r:"EF Math. 5:38-48|EP Baef. 6:10-17|3 Math. 10:34-39|4 Jer. 29:1,4-7,10-14|5 Joh. 15:9-17|6 1 Bakor. 12:12-14,26-27"},
{s:"Sebaka sa Trinitate",n:"Sontaga 22 morago ga Trinitate",t:"Modimo o re itshwarela maleo a rona; o batla gore le rona re itshwarele bangwe-ka-rona.",m:"Boitshwarelo bo fa go wena gore o tle o boifiwe. [Pes. 130:4]",p:"143:1-10",f:"178",r:"EF Math. 18:21-35|EP Bafil. 1:3-11|3 Math. 18:15-20|4 Barom. 7:14-25a|5 Miga 6:6-8|6 1 Joh. 2:7-17"},
{s:"Sebaka sa Trinitate",n:"Sontaga 23 morago ga Trinitate",t:"Modimo o e leng Kgosi ya rona mo legodimong o batla gore re utlwe babusi ba lefatshe leno.",m:"Kgosi ya dikgosi le Morena wa barena ke ene fela yo o nang le bosasweng, yo o agileng mo leseding le le sa ka keng la atamelwa. Ke ene yo o tshwanetsweng ke tlotlo le puso e e sa khutleng. [1 Tim. 6:15-16]",p:"33:13-22",f:"236",r:"EF Math. 22:15-22|EP Bafil. 3:17-21|3 Joh. 15:18-21|4 Barom. 13:1-7|5 Math. 5:33-37|6 Gen. 18:20-21,22b-33"},
{s:"Sebaka sa Trinitate",n:"Sontaga 24 morago ga Trinitate",t:"Modimo o re baakanyeditse boswa jo bo sa khutleng mo legodimong.",m:"Lo leboge Rara ka boitumelo yo o re nonotshitseng go nna le kabelo mo bosweng jwa baitshepi mo leseding. [Bakol. 1:12]",p:"39:5-8",f:"234",r:"EF Math. 9:18-26|EP Bakol. 1:9-20|3 Moreri 3:1-14"},
{s:"Sebaka sa Bokhutlo jwa Ngwaga wa Kereke",n:"Sontaga wa ntlha wa Bokhutlo",t:"Modimo o o sa khutleng o fa ditshupo tse di supang bofelo jwa lefatshe.",m:"Bonang he, jaanong ke nako ya go ka amogelwa sentle; bonang, jaanong ke letsatsi la pholoso! [2 Bakor. 6:2]",p:"90",f:"315",r:"EF Luka 17:20-30|EP Barom. 14:7-9|3 Luka 11:14-23|4 Jobe 14:1-6|5 Luka 18:1-8|6 1 Bathes. 5:1-11"},
{s:"Sebaka sa Bokhutlo jwa Ngwaga wa Kereke",n:"Sontaga wa bobedi wa Bokhutlo",t:"Modimo o o sa khutleng o tla senolela batho botlhe katlholo ya bofelo.",m:"Rona rotlhe re na le go bonala fa pele ga sedulo sa tshekelo sa ga Keresete. [2 Bakor. 5:10]",p:"50:1,4-6,14-15,23",f:"332",r:"EF Math. 25:31-46|EP Barom. 8:18-25|3 Luka 16:1-9|4 Tshen. 2:8-11|5 Jer. 8:4-7|6 2 Bakor. 5:1-10"},
{s:"Sebaka sa Bokhutlo jwa Ngwaga wa Kereke",n:"Sontaga wa boraro (bofelo) wa Bokhutlo",t:"A re lebeleleng boipelo jo bo se nang bokhutlo jo Modimo o o sa khutleng o bo re baakanyeditseng!",m:"A matheka a lona a nne a tlamilwe, le dipone tsa lona di tuke. [Luka 12:35]",p:"126",f:"330",r:"EF Math. 25:1-13|EP Tshen. 21:1-7|3 Luka 12:42-48|4 Jes. 65:17-25|5 Mar. 13:31-37|6 2 Pet. 3:3-13"},
{s:"Meletlo e e kgethegileng",n:"Moletlo wa Baengele (29 Lwetse)",t:"Modimo o re fenyetsa Satane ka baengele ba ba boitshepo ba ona.",m:"Moengele wa Morena o thibelela tikologong ya bona ba ba mmoifang, a ba golola. [Pes. 34:8]",p:"103:19-22",f:"21",r:"EF Luka 10:17-20|EP Tshen. 12:7-12|3 Još. 5:13-15|4 Dit. 5:17-29"},
{s:"Meletlo e e kgethegileng",n:"Moletlo wa Ntšhwafatso ya Kereke (Reformation, 31 Diphalane)",t:"Kgololo ya rona e tla fela ka boitshwarelo jwa Modimo le ka tumelo; Martin Luthere o ntšhwafaditse kereke ka go gatelela boammaaruri jo.",m:"Ga go ope yo o ka thayang mothao o sele, fa e se ona fela o o thailweng, e bong Jesu Keresete. [1 Bakor. 3:11]",p:"46:2-8",f:"186",r:"EF Math. 5:2-12|EP Barom. 3:21-28|3 Math. 10:26b-33|4 Bagal. 5:1-6|5 Jes. 62:6-7,10-12|6 Bafil. 2:12-13"},
{s:"Meletlo e e kgethegileng",n:"Moletlo wa Thomo",t:"Modimo o batla gore kereke ya ona e rerele batho botlhe kgololo ya ga Jesu Keresete.",m:"Keresete a re: Ga ke rapelele bone fela, mme ke rapelela le ba ba tla dumelang mo go nna ka lefoko la bone, gore ba nne bongwefela. [Joh. 17:20-21]",p:"96",f:"265",r:"EF Math. 9:35-38|EP Jes. 42:1-8|Gongwe Math. 5:13-16; Barom. 11:25-32; Joh. 4:32-42; Jes. 49:8-13"},
{s:"Meletlo e e kgethegileng",n:"Moletlo wa Tebogo (Thobo)",t:"A re lebogeleng Modimo dijo le dilo tsotlhe tse o re tlamelang ka tsona!",m:"Matlho a ba botlhe a lebile wena, mme o ba naya dijo tsa bona ka nako e e lebanyeng. [Pes. 145:15]",p:"104:10-15,27-30",f:"360",r:"EF Luka 12:13-21|EP 2 Bakor. 9:6-15|3 Jes. 58:7-12|4 1 Tim. 4:4-5|5 Math. 6:19-23|6 Baheb. 13:15-16"},
{s:"Meletlo e e kgethegileng",n:"Letsatsi la Boikwatlhao le la go rapelela Pula",t:"A re ikwatlhaeleng maleo a rona mme re rapele Modimo gore o re nesetse pula.",m:"Tshiamo e godisa setšhaba, mme boleo ke ditlhong tsa merafe. [Diane 14:34]",p:"51:3-14",f:"173",r:"EF Luka 13:1-9|EP Barom. 2:1-11|3 Math. 12:33-37|4 Tshen. 3:14-22|5 Luka 13:22-30|6 Jes. 1:10-17"},
{s:"Meletlo e e kgethegileng",n:"Tlhomamiso",t:"",m:"Jesu Keresete a re: Ga se lona lo intlhaoletseng, ke nna ke itlhaoletseng lona. [Joh. 15:16a]",p:"67",f:"188",r:"EF Math. 7:13-16a|EP 1 Tim. 6:12-16|3 Joh. 6:66-69|4 1 Bakor. 3:21b-23|5 Doit. 30:11-20a|6 Diane 3:1-8"},
{s:"Meletlo e e kgethegileng",n:"Letsatsi la ga Setefane yo o kgobotleditsweng ka majwe (26 Sedimonthole)",t:"",m:"Loso lwa baratwa ba Morena ke selo sa botlhokwa mo matlhong a gagwe. Ke tla go tsisetsa setlhabelo sa tebogo, ke bitsa leina la Morena. [Pes. 116:15,17]",p:"119:81-82,84-86",f:"52",r:"EF Math. 10:16-22|EP Dit. 6:8-15; 7:55-60|3 Math. 23:34-37|4 Tshen. 7:9-17|5 2 Ditiraf. 24:19-21|6 Baheb. 10:32-34,39"},
{s:"Meletlo e e kgethegileng",n:"Letsatsi la Botsalo jwa ga Johane Mokolobetsi (24 la Seetebosigo)",t:"",m:"Johane Mokolobetsi o ipolela ka ga Jesu a re: Ene o tshwanetse go gola, mme nna ka ngotlafala. [Joh. 3:30]",p:"92:2-11",f:"259",r:"EF Luka 1:57-80|EP Dit. 19:1-7|3 Joh. 3:22-30|4 1 Pet. 1:8-12|5 Math. 11:11-15|6 Jes. 40:1-8"}
];
var TM=[
["Atfente ya ntlha","Itumele thata, morwadia Sione, o duduetse, morwadia Jerusalema; bona, Kgosi ya gago e e tla kwa go wena. [Sag. 9:9]"],
["Atfente ya bobedi","Lo inamologe, lo tsholetse ditlhogo, ka gonne kgololo ya lona e a atamela. [Luka 21:28]"],
["Atfente ya boraro","Baakanyang tsela ya Morena! Bonang, Morena Modimo o e tla a le thata. [Jes. 40:3,10]"],
["Atfente ya bone","Itumeleng mo Moreneng ka gale, ke a boela ka re, itumeleng! Morena o gaufi. [Bafil. 4:4,5]"],
["Bosigo jwa Botsalo","Lefoko la nna nama, la aga mo go rona. [Joh. 1:14]"],
["Moletlo wa Botsalo jwa Morena I (","Lefoko la nna nama, la aga mo go rona. [Joh. 1:14]"],
["Moletlo wa Botsalo jwa Morena II (","Lefoko la nna nama, la aga mo go rona, ra ba ra bona kgalalelo ya lone, e le kgalalelo e e lebanyeng yo o tsetsweng a le esi, e tswa mo go Rara, a tletse bopelotlhomogi le boammaaruri. [Joh. 1:14]"],
["Sontaga morago ga Botsalo","Morena, jaanong o naya motlhanka wa gago tsela, ka fa lefokong la gago, go ya ka kagiso; ka gonne matlho a me a bonye pholoso ya gago. [Luka 2:29-30]"],
["Bosigo jwa Bofelo","Morena o kutlwelobotlhoko le boitshwarelo; o bopelotelele, o bopelontle jo bogolo. [Pes. 103:8]"],
["Letsatsi la Ngwaga","Mme le fa e le eng se lo se dirang ka puo gongwe ka tiro, dirang tsotlhe mo leineng la Morena Jesu, lo ntse lo leboga Modimo Rara ka ene. [Bakol. 3:17]"],
["Moletlo wa Ponatshego","Lefifi le a apoga, mme lesedi la boammaaruri le setse le phatsima. [1 Joh. 2:8]"],
["Sontaga wa ntlha morago ga Ponatshego","Botlhe ba ba gogwang ke Mowa wa Modimo ke bone bana ba Modimo. [Barom. 8:14]"],
["Sontaga wa bobedi morago ga Ponatshego","Molao o neilwe ka Moše, mme bopelotlhomogi le boammaaruri di tsile ka Jesu Keresete. [Joh. 1:17]"],
["Sontaga wa boraro morago ga Ponatshego","Ba tla tswa kwa botlhabatsatsi le kwa bophirimatsatsi le kwa bokone le kwa borwa, ba nna fa dijong mo pusong ya Modimo. [Luka 13:29]"],
["Sontaga 4 morago ga Ponatshego","Tlayang, lo lebe ditiro tsa Modimo; o boitshega ka ditiro mo baneng ba batho. [Pes. 66:5]"],
["Sontaga 5 morago ga Ponatshego","Morena o tla ntshetsa leseding tse di fitlhilweng tsa lefifi, a senola maikaelelo a dipelo. [1 Bakor. 4:5]"],
["Sontaga wa bofelo morago ga Ponatshego","Morena o tla go tlhabela jaaka letsatsi; kgalalelo ya gagwe e tla bonala mo go wena. [Jes. 60:2]"],
["Septuagesime","Ga re ikanye ditiro tse di siameng tsa rona, fa re baya mekokotlelo ya rona fa pele ga gago; mme re ikanya mautlwelo-botlhoko a magolo a gago. [Dan. 9:18]"],
["Seksagesime","Kajeno, fa lo utlwa lentswe la ona, se thatafatseng dipelo tsa lona. [Baheb. 3:15]"],
["Kwinkwagesime","Bonang, re tlhatlogela kwa Jerusalema, mme tsotlhe tse di kwadilweng ka ga Morwa-Motho ke baporofeti, di tla dirafala. [Luka 18:31]"],
["Infokafite","Se Morwa Modimo o se bonatshegetseng ke go senya ditiro tsa ga Diabolo. [1 Joh. 3:8]"],
["Reminiskere","Modimo o supile lorato lo o re ratang ka lone, ka Keresete a re swetse, re ntse re le baleofi. [Barom. 5:8]"],
["Okuli","Ga go ope yo o ka nonofelang puso ya Modimo, fa e ka re a tshwere mogoma, a gadima kwa morago. [Luka 9:62]"],
["Letare","Fa tlhaka ya mabele e sa wele mo mmung ya swa, e tla nna e le yosi; mme fa e swa, e ungwa leungo le legolo. [Joh. 12:24]"],
["Judika","Morwa-Motho a sa tla go direlwa, mme e le go direla le go neela botshelo jwa gagwe losong go nna kgololo ya ba bantsi. [Math. 20:28]"],
["Palmarum","Morwa-Motho o tshwanetse go tlhatlosiwa, gore mongwe le mongwe yo o dumelang mo go ene a se latlhege, mme a nne le bophelo jo bo sa khutleng. [Joh. 3:14-15]"],
["Labone la Selalelo","O dirile segopotso sa dikgakgamatso tsa gagwe. Morena o boitshwarelo le boutlwelo-botlhoko. [Pes. 111:4]"],
["Freitaga wa Tidimalo, mo Mosong","Gonne Modimo o ratile lefatshe mo go kalo, mo o bileng wa le neela Morwaa-ona yo o tsetsweng a le esi, gore mongwe le mongwe yo o dumelang mo go ene a se ka a latlhega, mme a nne le bophelo jo bo sa khutleng. [Joh. 3:16]"],
["Moletlo wa Tsogo ya Morena I","Keresete a re: Ke ne ke sule, mme ke phela ka bosakhutleng; ke tshotse dilotlele tsa loso le tsa felo ga baswi. [Tshen. 1:18]"],
["Kwasimodogeniti","A go bakwe Modimo, Rra Jesu Keresete, Morena wa rona, o o re tsetseng gape ka fa boutlwelong-botlhoko jo bogolo jwa ona, gore re nne le tsholofelo e e tshelang ka go tsoga ga Jesu Keresete mo baswing. [1 Pet. 1:3]"],
["Miserikordia","Keresete a re: Ke nna Modisa yo o molemo. Dinku tsa me di utlwa lentswe la me, ke a di itse, mme di ntshala morago. Ke di naya bophelo jo bo sa khutleng. [Joh. 10:11,27-28]"],
["Jubilate","Fa motho a le mo go Keresete, o a bo a le sebopiwa se sešwa; dilo tsa bogologolo di fetile, bonang, di ntšhwafetse tsotlhe! [2 Bakor. 5:17]"],
["Kantate","Opelelang Morena sefela se sešwa; gonne o dirile dilo tse di gakgamatsang. [Pes. 98:1]"],
["Rokate","A go bakwe Modimo o o se kang wa latlha thapelo ya me, le e seng go ntima bopelotlhomogi jwa ona. [Pes. 66:20]"],
["Moletlo wa Tlhatlogo","Keresete a re: E tla re fa ke sena go tlhatlosiwa mo lefatsheng, ke ikgogele batho botlhe. [Joh. 12:32]"],
["Eksaudi","Keresete a re: E tla re fa ke sena go tlhatlosiwa mo lefatsheng, ke ikgogele batho botlhe. [Joh. 12:32]"],
["Moletlo wa Pentekoste I","Ga se ka bonatla le e seng ka thata, mme ke ka Mowa wa me, go bua Morena wa masomosomo. [Sag. 4:6]"],
["Moletlo wa Trinitate","Go boitshepo, go boitshepo, go boitshepo Morena wa masomosomo; lefatshe lotlhe le tletse kgalalelo ya gagwe. [Jes. 6:3]"],
["Sontaga wa ntlha morago ga Trinitate","Keresete a re: Yo o lo utlwang o utlwa nna; yo o lo nyatsang o nyatsa nna, mme yo o nnyatsang o nyatsa ene yo o nthomileng. [Luka 10:16]"],
["Sontaga wa bobedi morago ga Trinitate","Keresete a re: Tlaang kwano go nna lotlhe ba lo lapileng, ba lo imelwang; nna ke tla lo lapolosa. [Math. 11:28]"],
["Sontaga wa boraro morago ga Trinitate","Morwa-Motho o tsile go batla le go pholosa se se latlhegileng. [Luka 19:10]"],
["Sontaga 4 morago ga Trinitate","Rwadisanyang merwalo, ke gone lo tla bong lo dirafatsa molao wa ga Keresete. [Bagal. 6:2]"],
["Sontaga 5 morago ga Trinitate","Lo pholositswe ka boitshwarelo ka tumelo; mme ga go tswe mo go lona, ke neo ya Modimo. [Baef. 2:8]"],
["Sontaga 6 morago ga Trinitate","Jaanong Morena yo o go tlhodileng o bua jaana a re: Se boife, gonne ke go golotse, ke go biditse ka leina la gago! O wa me. [Jes. 43:1]"],
["Sontaga 7 morago ga Trinitate","Ga lo tlhole lo le baeng le bajaki, mme lo ba morafe mmogo le baitshepi, lo ba ntlo ya Modimo. [Baef. 2:19]"],
["Sontaga 8 morago ga Trinitate","Tsamayang jaaka bana ba lesedi - gonne leungo la lesedi ke molemo otlhe le tshiamo le boammaaruri. [Baef. 5:8,9]"],
["Sontaga 9 morago ga Trinitate","Mongwe le mongwe yo o neetsweng tse dintsi, go tla batlwa tse dintsi mo go ene; yo o filweng taolo mo go tse dintsi, go tla batlwa tse di fetisang mo go ene. [Luka 12:48]"],
["Sontaga 10 morago ga Trinitate","Go sego morafe o Morena e leng Modimo wa ona, batho ba a ba itlhaoletseng go nna boswa jwa gagwe. [Pes. 33:12]"],
["Sontaga 11 morago ga Trinitate","Modimo o ganetsa ba ba ikgogomosang, mme ba ba ikokobetsang o ba naya boitshwarelo. [1 Pet. 5:5]"],
["Sontaga 12 morago ga Trinitate","Ga a kitla a roba lotlhaka lo lo pšhwetlegileng; ga a kitla a tima mogala wa lobone o o takatakang. [Jes. 42:3]"],
["Sontaga 13 morago ga Trinitate","Keresete a re: Tsotlhe tse lo di diretseng mongwe wa bonnake ba babotlana ba, lo di ntiretse. [Math. 25:40]"],
["Sontaga 14 morago ga Trinitate","Baka Morena, mowa wa me; se lebale sepe sa ditiro tse di molemo tsa gagwe! [Pes. 103:2]"],
["Sontaga 15 morago ga Trinitate","Latlhelang matshwenyego otlhe a lona mo go one, gonne lo tlamelwa ke one. [1 Pet. 5:7]"],
["Sontaga 16 morago ga Trinitate","Keresete Jesu o nyeleditse loso a baya bophelo le bosasweng mo leseding ka Efangele. [2 Tim. 1:10]"]
];
