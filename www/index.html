{n:169,t:"Tlaa, motho yo o leofang",c:"Difela tsa Boikwatlhao",v:["Tlaa, motho yo o leofang, / go tsena mo kgorong / e e pitlaganyeng, e e yang / go Jesu pholosong.","Tlaa, motho yo o leofang, / go ntshiwa maleong. / Mothusi yo o go thusang / ke Jesu 'godimong.","Tlaa, motho yo o leofang, / go batla tumelong / boitshwarelo jo bo tswang / go Jesu loratong.","Tlaa, motho yo o leofang, / go tsena lesegong; / o se nne yo o diegang, / tlaa kwano phologong.","Morena yo o kwa bontleng, / re tiise tumelong, / re se diege mo tseleng / e e yang legodimong.","Re tla bo re golotswe teng / dibeng tse di senyang; / ke kwa re tla gomotsegang, / ka re le Modimong."]},
{n:170,t:"Morwa-mmotlana, ao bonang",c:"Difela tsa Boikwatlhao",v:["Morwa-mmotlana, ao bonang, / o na a senya thata jang! / A latlha rraagwe boikgantshong, / a ineelela boleong.","A senya boswa ditšhabeng, / mme foo a tsena lehumeng; / mme ya re a le tatlhegong, / a bua jaana mo pelong:","Ke latlhegile! Ke yo o swang / ka tlala e e tshabegang! / Etswe batlhanka legaeng / ba na le dijo dintsi teng.","Ke tla boela kwa rareng, / mme ke mo wela mangoleng; / ke tla inyatsa mo pelong, / ka ke le yo o ikepileng.","Ke tla re: Ntate yo o nthatang, / ke fano, yo o go tlogetseng, / mme ke tlhabiwa ke ditlhong. / A ke nne batlhankeng lapeng.","Jaanong a boa leetong, / a hutsafetse mo pelong. / Mme rraagwe yo o sa lebaleng / a mo kgatlhantsha mo tseleng:","Mme ngwana a boela teng, / fa a le yo o sa tshwanelang; / mme rraagwe a nna boipelong, / a itshwarela yo o llang.","A atla yo o ikwatlhayang, / a ba a tlhaba e nonneng; / a mo apesa mo mmeleng / diaparo tse di tshwanetseng.","A ba a re: A re ipeleng! / Morwaake yo o gorogileng, / ke yo o neng a le losong, / mme o boetse bophelong!","Rraarona ga se yo o latlhang / bomorwa ba ba timetseng; / fa ba tla ba le maketeng, / a ba busetse bongwaneng!"]},
{n:171,t:"Ke mo dibeng, ke tla dirang?",c:"Difela tsa Boikwatlhao",v:["Ke mo dibeng, ke tla dirang? / Ke tla ya Moreneng! / Ke ene Jesu yo o nntshang / dibeng le molatong.","Melato e e sa balweng, / ke mang yo o e tlosang? / Ke ene Jesu yo o tsileng, / yo o e lefileng.","Ke madi a 'gwe a o nnayang / kagiso mo pelong; / e bile ke a o ntlhapisang, / a ntsenya pholosong."]},
{n:172,t:"Ka batho ba ya tenegong",c:"Difela tsa Boikwatlhao",v:["Ka batho ba ya tenegong, / ba wela moleteng; / ke boifa thata mo pelong, / go ya le bona teng.","Morena yo o rategang, / o mpotsa Lokwalong: / A o tla etsa ba ba yang / go tsena tenegong?","Ao Jesu yo o rategang, / o nkutlwe thapelong, / ke tshabe ba ba tenegang, / mphemele thaelong!","Ga ke na thata mo pelong, / botlhale ga bo teng; / fa ke sa tswelle thapelong, / ke tla ya moleteng.","Ga go na ope lefatsheng / le kwa legodimong, / yo o ka mphenyisang mo ntweng, / fa e se Jesu, Mong.","Fa o mphemela mo tseleng / e ke e sepelang, / le go nnonotsha mo moweng, / ke tla nna yo o fenyang."]},
{n:173,t:"Ke tenegile, mme ke boa",c:"Difela tsa Boikwatlhao",v:["Ke tenegile, mme ke boa / ka pelo e e phatlogileng. / Mme ke ntse ke le yo o bokoa, / ke tletse tse di sokameng. / Ke leba fela s'fapaanong / sa 'Jesu Kriste yo o ntshwetseng.","Ke itatlhela 'naong tsa 'go, / ke obamela mo pelong; / ao Jesu, nka tla ka nyelela, / fa o ntlhoboga mo dibeng. / Ke bua ke le selelong: / Se ntatlhe nna yo o maleong!","O kgona go mpusetsa gona, / kwa boitshwarelo bo bonwang, / le go nkgogela kwa go ona / Modimo o o obamelwang. / A ko o mphodise mo moweng, / o nthuse ke tswe mo dibeng.","Mme ke boifa go latlhega, / fa ke sa ntshiwe melatong; / o intshwarele dibe tsa me, / mpofolle yo ke bofilweng! / O dire bonno mo pelong, / o mpate go ya phologong."]},
{n:174,t:"O se diege, sokologa",c:"Difela tsa Boikwatlhao",v:["O se diege, sokologa, / akofa o ye phologong! / Kajeno Mowa o go goga / ka lentswe le le mo 'Kwalong. / Se nyatse lentswe le le reng: / Tlhabologang, tswang mo dibeng!","Malatsi a 'go a tla fela / ka loso lo lo go tsomang. / Morago o ya go atlholwa / ke Jesu Kriste yo o tlang. / Ka motlha o o tla dirang? / Tshaba bogale jo bo tlang!","Fa dibe o sa di tlhabantshe, / di tla ntsifala botshelong. / Ke 'noga tse di tsalang bana, / ke tse di tla go bolayang. / O di tsogele kgatlhanong, / go di bolaya mo pelong.","Kajeno go sa le sebaka, / ao, tlhabologa, yo o sentseng! / O se diege, tsaya tšhaka, / o reme Satan yo o tshwenyang, / mme utlwa Jesu yo o bitsang, / yo o ka go falodisang.","O se re, ke tla tlhabologa / isago, mme e seng jaanong. / Ka yona puo e o loga / leano le o tsenyang mollong. / Isago o ka nna losong, / wa tsena fela mo petsong.","Mme batla thuso go Morena, / o gaufi nao Lefokong. / Mo utlwe, o rapele ena, / o tla go golla molatong. / O se diege maleong, / mme tswaa o tsene phologong."]},
{n:175,t:"Joo! ke tla bona kae",c:"Difela tsa Boikwatlhao",v:["Joo! ke tla bona kae / kgololo molatong? / Ke tshwerwe ke serai / sa 'Satan maleong.","Ke leofile thata / tirong le mafokong; / diipato ga di thuse, / ke tshwerwe melatong.","Jaanong ke tla latlhega, / ke wela tshenyegong, / mme loso lo tla nkgapa, / ka moo ke mo poifong.","Morena o tla mpetsa / ka fa go ntshwanetseng / ka ntlha ya dibe tsa me / tse ke di dirileng.","Molete o ntshwanetse, / ka ke le maleong. / Ga k' itse nka femelwa / ke mang mo tshenyegong.","Ke wena Jesu fela, / ka o le yo o ntshwetseng! / O bile o lesedi la rona lefifing."]},
{n:176,t:"Ke bitsa ke le tlalelong",c:"Difela tsa Boikwatlhao",v:["Ke bitsa ke le tlalelong, / Morena, a ko o ntheetse! / O ntshekegele tsebe, Mong, / o nthuse, ka o ntshwetse! / Fa o le yo o tlhotlhomisang / maleo a a dirilweng, / go kgona mang go ema?","Modimo, se o se ratang / ke go re itshwarela. / Ditiro tse re di dirang / ga di re siamise. / Ga go na yo o ka ipokang, / ka moo re ba o go boifang, / re llela boitshwarelo.","Ke solofela Modimong, / ga ke ikanye tsa me; / ke itshwarella mo Kristeng / le go ikanya ene. / O bua le nna Lefokong, / ke ene yo o nkgomotsang / kajeno le ka gale.","Le fa ke le yo o imelwang / malatsi a maleele, / ga ke yo o belaelang / dithuso tsa Modimo. / Moisraele yo o tsetsweng / ke Mowa, a le mo Kristeng, / o lebeletse jalo.","Maleo a a atileng / a kana ka dithaba, / Modimo o o itshwarelang / o a okame otlhe. / Ke ona osi o o disang, / ke ona o o re gololang / dibeng tsa rona tsotlhe."]},
{n:177,t:"Modimo, Kgosi e o busang",c:"Difela tsa Boikwatlhao",v:["Modimo, Kgosi e o busang, / o okameng tse tsotlhe. / Ke wena yo o laolang / lefatshe le lewatle. / Ke wena yo o apereng / lesedi le le phatsimang, / o a re gakgamatsa. / Nna ke seboko leroleng, / ke bitsa ke le mo dibeng: / O ntlhomogele pelo!","Ke eme fano thapelong, / tshwanong ya mokgethisi. / Morena se ke se kopang / ke boitshwarelo jwa 'go. / Se nkgane, ke le molatong, / e bile ke yo o tshwanetsweng / ke petso ya molelo. / Ke itigela dinaong / tsa gago yo ke go kopang: / O ntlhomogele pelo!","Melato e ke e iponang / e tshosa pelo ya me; / ka moo ke yo o itsholang, / yo o ithweleng megono. / Ao Rra, ga ke yo o tshwanetseng / go tshela mono lefatsheng, / mme wena o a mpitsa. / Ke gona ke go rapelang / ka pelo e e phatlogileng: / O ntlhomogele pelo!","Ke bile kea go kopa, Rra: / A ko o lebe Jesu: / ke ene yo o re ruantseng / le wena losong lwa 'gwe. / Ke ene ke mo ikanyang, / ka ene ke mo kagisong, / ke ngwana wa Modimo. / Ke yo ke sa mo tlogeleng / go ya o ntebe loratong: / O ntlhomogele pelo!","A ko o mpuse mo pelong / botshelo jwa me jotlhe, / Modimo wa me, o ke leng / wa gago le ka gale. / Fa go tla nako bofelong, / e bong ya go swa lefatsheng, / foo, Jesu, o nne le nna! / Mme fa ke pallwa mo puong, / o nkutlwe ke le phegelong: / O ntlhomogele pelo!"]},
{n:178,t:"O se mpetse bogaleng",c:"Difela tsa Boikwatlhao",v:["O se mpetse bogaleng, / Rara, nthekegele! / Se ntuele tshwanelong, / a ke se latlhege! / Rra yo o galefang, / leba Jesu Kriste, / khutla go galefa.","O nkgomotse bokoeng / ka borara jwa 'go; / o nne yo o mphodisang, / o nne pelotelle. / Yo ke leng / tlalelong / a ko o intshwarele; / o se ka wa ntatlha.","Ao marapo a a thunyang, / a ko o a lebe! / Pelo e e reregileng / yona e a lapa, / ke le teng / thapelong / ka malatsi otlhe, / e le ka 'keledi.","Ruri, nna yo o tshogileng, / Jesu oa nkemela; / le tse ke di kopileng / Rara oa di nnaya. / Mme Satan / o batlang? / Dibe di tlositswe, / ka di itshwaretswe.","Ke ikutlwa mo pelong, / fa ke amogetswe. / Ke boetse kgomotsong, / ka ke itshwaretswe. / Mo puong / le tirong / ke leboga Rara / leineng la 'Jesu."]},
{n:179,t:"Jesu ke yo o tsholang",c:"Difela tsa Boikwatlhao",v:["Jesu ke yo o tsholang / baleofi go ba thusa! / 'Foko le le gomotsang / lone le lo le bolelle / botlhe ba ba timetseng, / ba tshabele kwa Kristeng.","Rona ba re maleong / re tshwanetswe ke go latlhwa; / mme o ikana Lefokong / go re tshola ka kagiso. / Kgoro ke e e butsweng, / ka a bua a re: Tlaang!","Kwana e e timetseng / ea tle e batlwe ke Modisa. / Jesu yo o ikanyegang / o re batla ka tlhoafalo / kwa re timeletseng teng, / re boele lesakeng.","Baleofi ba lo llang, / tlaang go Jesu, lona lotlhe! / Ene ke yo o lo bitsang, / lo nne bana ba Modimo. / Mo utlweng, lo dumeleng: / Jesu ke yo o lo tsholang.","Nna yo ke hutsafetseng, / ke tla ka go ipobola. / Gape ke yo o go kopang / boitshwarelo le kgololo. / 'Foko le o le buang / le nkgomotse mo pelong.","Ga ke yo o tlhobogang, / le fa dibe di hubitse / jaaka madi a a tshollwang, / ke ikanya madi a 'go; / ke a a di swefatsang: / Jesu, o yo o ntsholang.","Ga go se se ka ntatlhang / tota le e seng molao. / Jesu yo o intshwarelang / o lefetse dibe tsotlhe. / Ga go se se nkatlholang, / Jesu ke yo o nkemelang.","Jesu yo o re tletseng, / ee, le nna o nkamogetse. / Tsela e e yang 'godimong / yona o e re buletse. / Ke tla swela kgomotsong: / Ke itshwaretswe mo Kristeng."]},
{n:180,t:"Re a dumela Modimong",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Re a dumela Modimong / Rara, Mong wa thata yotlhe. / Ke ene yo o tlhodileng / rona le diphedi tsotlhe. / Ke ene yo o phedisang / ka 'rato lo gakgamatsang. / O re femela dikotsing, / o sireletsa masuleng. / O re tlamela lefatsheng / ka tsotlhe tse di batlegang.","Re a dumela mo Kristeng, / Morwa esi wa Modimo. / Ke Mong wa rona yo o busang, / Kgosi ruri ya dikgosi. / Ke Maria yo o mo tshotseng / ka nako e e beilweng. / Ke Jesu yo o re swetseng, / e bile ke yo o tsogileng, / a tlhatlogela 'godimong, / go busa ka bosakhutleng.","Re a dumela Moreneng, / Mowa o o Boitshepo. / O isa batho Kerekeng / go kopanngwa teng le Jesu. / Ke ona o re sokollang, / ke o o re tsosang losong, / mogang o Jesu a boang / go isa rotlhe bophelong / jo bošwa jo bo sa khutleng / legodimong mo legaeng. / Amen."]},
{n:181,t:"Tumelo e e dumelang",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Tumelo e e dumelang / mafoko Lokwalong, / ke thata e gakgamatsang, / e tswa mo Modimong.","Ke yona e e fenyisang / ba ba mo thaelong; / ke yona e e totisang / kagiso mo pelong.","Ke yona e e thabisang / dipelo maketeng; / ke yona e di ntlafatsang, / e di ntsha mo masweng.","Ke yona 'sedi lefifing, / botlhale bosilong; / ke yona khumo bodiding / le phenyo mo losong."]},
{n:182,t:"Go lora ba ba gopolang",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Go lora ba ba gopolang, / fa e le ba ba ratiwang / ke Rara, etswe lefatsheng / ba phela fela mo dibeng.","Ga go kagiso mo pelong, / fa ba tswelela maleong, / le boitumelo ga bo teng / jwa nnete jo bo sa feleng.","Fa re le ruri tumelong, / re fetogile mo pelong / ka Mowa o re tsositseng / le Jesu yo o tsogileng.","Tumelo e e siameng / ke e e re siamisang, / e re nonotsha dipelong, / go fenya tse di re tshosang losong.","Re rata tse o di ratang, / re ila tse o di ilang, / mme re latela mo tseleng / Moregolodi mo dibeng."]},
{n:183,t:"Itumeleng mo Modimong",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Itumeleng mo Modimong, / lona bakriste lotlhe; / re gomotsege mo pelong, / a re opeleng mmogo / tse one o di dirileng, / tse di re gakgamaditseng, / di a natefa thata.","Ke ne ke le mo tatlhegong, / ke tshwerwe ke Satane; / o ne a nkisa mo losong, / maleo a ntaola; / mme ka nna ka tsenella teng, / tse di molemo di se teng; / mme ka tlhomola pelo.","Ditiro tse di siameng / di ne di se yo gotlhe; / tshiamo e e batlegang / e ne e ntimeletse; / ka wela tsholofologong, / ka pitlaganngwa theregong / ya molete wa mollo.","Ke fa Modimo 'godimong / o ntlhomogela pelo; / o nteba ke le dipogong, / tse di se nang tekanyo; / wa nthata ruri mo pelong, / wa nnaya se se batlegang, / se se phalang tse tsotlhe:","Ke Morwaa-one Jesu Krist', / wa mo laela wa re: / \"Ya kwa bathong kwa lefatsheng, / ba ba tlhomolang pelo. / O ba golole maleong / ka go ba swela s'fapaanong, / gore ba tshele nao.\"","Ka Jesu e le yo o utlwang, / a dira fela jalo; / a fologela lefatsheng, / mme a nna motho-ka-nna; / ka thata e e fitlhegileng / a tsoma Satan yo o tshwenyang; / ka nnete a mo tshwara.","A nthaya a re: \"Leba nna, / o itshwarelle ka nna; / ke tla ineela mo losong / gore o gololege. / O wa me, yo ke go batlang, / o tla nna le nna kwa ke teng; / ga re na go kgaoganngwa.","Mme mmaba yo o ntlhaselang / o tsholla madi a me; / ke wena ke go bogelang, / dumela ka tlhomamo. / Ke fenya loso mo losong, / ke go golola maleong; / o phologile jalo.","Ke tla boela 'godimong, / ke ya go ene Ntate; / ke ya go tsena mo tirong / go ikgogela batho; / ke ba fa Mowa dipelong, / ke ba gogela mo nneteng / gore ba nkitse sentle.","Tse ke di dirileng 'fatsheng, / le wena o di dire; / le wena o nne yo o agang / bogosi jwa Modimo. / O tshabe tse di timetsang: / Dithuto tse di sokameng; / di senya Efangele.\""]},
{n:184,t:"Ka boitshwarelo oa phologa!",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Ka boitshwarelo oa phologa! / Dumela jalo mo pelong. / Fa seo se go belaetsa, / o batle nnete Dikwalong. / Ke Beibele yotlhe e e reng: / Go phela yo o itshwaretsweng.","Ka boitshwarelo oa phologa, / e seng ka tse o di dirang. / Fa o itewa ke letswalo, / fa o imetswe mo pelong, / tshabela kwa go Jesu, Mong, / ke ene yo o go imollang.","Ka boitshwarelo oa phologa, / ke sona se se tlhomameng. / Modimo o buile jalo / ka borraarona Beibeleng. / Pholoso e tswa mo mading / a Jesu o a tsholotseng.","Ka boitshwarelo oa phologa, / ikanye tlhe lefoko le, / o tlhabologe ka bonnete, / o se nne yo o ikaketsang. / Ipone o le molatong, / o lebe yo o go swetseng.","Ka boitshwarelo oa phologa, / ke 'foko le le nonofileng. / Le fa o ka solofologa / le go tlhoboga tlalelong, / ke lone le le gomotsang, / le a go isa kagisong.","Ka boitshwarelo kea phologa, / ke se se nkgomotsang losong. / Tshenyego ya me kea e itse / le ene yo o ntshiamisang. / Se ke se itumelelang / ke go itshwarelwa mo Kristeng."]},
{n:185,t:"Motheo wa tumelo",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Motheo wa tumelo / ke Jesu yo o re ratileng, / ke tshola 'Foko la 'gwe, / ke le ke le ipolelang. / Se botse tlhaloganyo / e e ka tsietsang. / Se botse maikutlo / a a ka timetsang; / ka gonne tsa tumelo / di rutwa Beibeleng; / ke di ikanya tota, / ke tse di tlhomameng.","Morena, o ntiisetse / tumelo e e koafalang, / ka Satan a ntalela, / go e ntlosetsa mo pelong. / Fa wena o ka nkgoga, / ke tswella mo tseleng; / fa Mowa o ntaola, / ke sego botshelong. / O ikopanye le nna / go ya bosakhutleng. / Mme foo ga ke boife / yo o ka ntshenyetsang.","Mphedise ka tumelo, / le fa ke le mo pogisong; / fa batho ba mphaposa, / ke ikanyege tumelong. / Ka nako ya bofelo / ke swele tumelong; / bophelo ke bo rue / ka fa tsholofetsong. / O ntshware ka letsogo / 'tshelong le mo losong, / ke tle ke nne wa gago / le ka bosakhutleng."]},
{n:186,t:"Pholoso e tswa Modimong",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Pholoso e tswa Modimong / ka tlhomogelo-pelo, / e seng ka gope ditirong / tse di dirwang ke rona. / Tumelo ke e e lebileng / Morena Jesu yo o swetseng / dibe tsa batho botlhe.","Modimo, tse o di batlang / di re paletse gotlhe, / ra tsena jalo molatong, / ra ba ra galefelwa. / Molao se o se batlang / ke pelo e e go ratang, / re e tlhoka, ra latlhega.","Molao ke o o tshwanetseng / go tshegediwa otlhe. / Ka moo go tsile lefatsheng / Morena Jesu Kriste. / Ke yo o o tshegeditseng, / e bile ke yo o timileng / bogale jwa ga Rara.","Ka moo he a re dumeleng / go Jesu Krist', Morena; / ke ene yo o re swetseng, / a re golola gotlhe / mo maleong le mo losong / le tatlhegong e e sa khutleng; / tumelo ea pholosa.","Ke Rara yo o re balelang / tshiamo ya ga Jesu, / fa re le ba ba dumelang / le go ineela ene. / Ka moo he a re dumeleng, / re bone yona mo Kristeng / le go e apesiwa.","Go bakwe Rara 'godimong / le Jesu, Morwaa-ona, / le Mowa o o itshepileng, / Modimo wa mannete. / O bongwefela borarong, / o busa ka bosakhutleng, / o fetsa dilo tsotlhe."]},
{n:187,t:"Ke ngaparela ka tumelo",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Ke ngaparela ka tumelo / pholoso e e mo Kristeng; / ka gonne ga go botshabelo, / fa e se mo go Jesu Krist'. / Ke batla ka fa Dikwalong / pholoso ya me mo Jesung.","Ke mo latela ka lorato, / Morena yo o nthatileng; / o ntshwetse yo ke leng molato, / mme a ntshwatola mo dibeng. / Lorato lwa 'gwe lo ntse jang! / Ka moo a re mo lebogeng!","Ke ntse ke ipatlela jalo / masego a a tswang Jesung, / mme le fa ke ntse ke ka lela / le go tshwenyega tshepelong, / ke nametsega mo Jesung, / ka ene ke mo kgomotsong.","Mo pogisong ke a ipela / le go itshoka botlhokong. / Jaanong ke ikopela jaana: / A ke se kgaolwe mo Jesung! / Ga ke boife pogisong, / ka ke dumela mo Jesung.","Ka tsholofelo ke tswelela / go lebelela tse di tlang. / Legae le baakanyeditswe / ba botlhe ba ba dumelang. / Mme ke lelala 'godimong / ka gale mo tsholofelong.","Le fa ke tshela gongwe ke swa, / ke ngaparela Jesu Krist'; / ka ene ruri go bophelo, / ga go poifo bofelong. / Mme ke tla tsoga mo phupung, / go mo kgatlhantsha mo marung.","Ke tla tsamaya ka tumelo, / ke be ke swela tumelong; / mme ke tla bona la bofelo / Morena yo o mpholositseng. / Ke tla nna nae 'godimong, / ka e le yo o impatletseng."]},
{n:188,t:"O ntiisetse tlhe tumelo",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["O ntiisetse tlhe tumelo, / Jesu yo o nthatileng, / gore ke busetse pelo / kwa go wena yo o ntshwetseng. / 'Foko la 'go Beibeleng / lone le le tlhomameng, / a le nthute go dumela / le go go ikanya fela.","Mme fa ke le wa tumelo, / gona ke boifelang? / Satan, 'fatshe, dithaelo / tsona di ka ntira eng? / Gonne wena yo o ntshwetseng / o na le nna fa ke teng. / Jesu, ke ikanya wena, / kana kea go ngaparela.","Mowa wa 'go a o nkgoge / ka Lefoko la 'go, Mong, / mme ke se fapoge gope / tsela e e yang 'godimong. / Jesu, o yo o ntiisang / tumelong e e pholosang. / Gape baganetsi botlhe / o ba fenya ruri gotlhe.","O abele badumedi / boswa mo kgalalelong. / Bone botlhe ba bulele / kgoro kwa legodimong. / Foo ke tla go baka jang! / Le nna yo ke dumelang, / o tla nnaya la bofelo / boswa le boitumelo."]},
{n:189,t:"Jerusalem, Jerusalem",c:"Difela tsa Tumelo: Ka ga Tumelo",v:["Jerusalem, Jerusalem, / o re neng ra go bona / kgalalelong, ka go le teng / Modimo mo go wena. / Jaanong o mo ditlalelong, / o tshwenyegile jang! / Jerusalem, Jerusalem, / re go lelela jang!","Kwa go neng go direlwa teng / Jehofa, Kgosi ya 'go, / kajeno go selelo teng / tempele ga e bonwe, / mme o ntse o tlhoiwa jang / ke ba go dikanyang. / Jerusalem, Jerusalem, / re go lelela jang!","Jerusalem, Jerusalem, / o tla mo tshola leng? / Ene yo o mo atlhotseng, / yo o mo latlhileng? / Fa o sa tsene tumelong, / o a ineela Jesu, Mong? / Jerusalem, Jerusalem, / re go lelela jang!"]},
{n:190,t:"Ditiro tsa Mothatayotlhe",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Ditiro tsa Mothatayotlhe / ke tse dikgolo thata jang! / Fa motho a sa mo leboge, / ke ene yo o sa siamang. / Tshwanelo ke go mo leboga / ka fa a re ratang ka teng. / Modimo ka o sa ntebale, / le nna nka o lebala jang!","Ke mang ne yo o neng a mpopa? / Ke ona ke sa o thuseng. / Wa nkgoga ka bopelotelele / ke le yo o sa o utlweng. / Ke mang yo o nnayang kagiso, / a nthatafatsa mo moweng, / yo o ntlamelang ka metlha yotlhe? / Ke ona o o sa pallweng.","Ao motho, leba tlhe bophelo, / e bong jo o bo bopetsweng, / jo bo tletseng ka kgalalelo, / Morena o tla mmona teng. / Masego a, a go lebanye, / ke ona a o a ruang. / Ke ka ntlha ya moo, fa a go swetse, / o tle o tsene phologong.","Morena o mogolo jalo, / go mmaka nka go lesa jang! / A o ka bitsa, ke sa utlwe? / A nka fapoga mo tseleng? / Nnyaa, thato ya 'gwe e ntshwanetse, / ke e gakollwa Lefokong: / Modimo ke o rate gotlhe / le mongwe-ka-nna bophelong.","Nna ke setshwano sa Modimo / ka go tshegetsa taolo e. / Tumelo ya me ke ya gore / ke tla nna nao botlalong. / Ka o mphedisa ka lorato, / o mpontsha tse di tshwanetseng; / ga ke laolwe ke boleo, / le fa nka fosa bokoeng.","Modimo, a lorato lwa 'go / ke nne yo o lo lemogang; / lo tiise maikaelelo / a go go ineela bophelong. / Mo botlhokong a lo nkgomotse, / lo nkgoge boitumelong; / lo tlose mo pelong poifo, / fa ke ya go swa bofelong."]},
{n:191,t:"Modimo o o boitshegang",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Modimo o o boitshegang, / ke mang yo o go tlhaloganyang? / O busa ka fa o ratang / legodimong le lefatsheng.","Re atamela fa bonnong / jwa gago ka poifo, Mong, / ka o agile mo bontleng, / felong fa go sa itsiweng.","O n' o le teng tshimologong, / mme rona re tswa tlholegong; / o tla nna ka bosakhutleng, / mme re tla fela sebakeng.","Yo o tshwanang nao ga a teng, / ke Jesu fela yo o tsileng, / Morwao yo o re ratileng, / a re golola mo dibeng.","Mme re lelala kwa bonnong / jwa gago kwa legodimong, / re go rapela leineng / la 'Jesu yo o re swetseng.","A go tlotliwe mo bathong / Modimo Rara yo o busang / le Jesu yo o re pholosang / le Mowa o o re phedisang."]},
{n:192,t:"Morena, ka fa o ratang",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Morena, ka fa o ratang, / o dire ka nna tsotlhe; / ke wena ke go eletsang, / ga nka ke ka latlhega. / O ntebe ka lorato, Mong, / laola tsotlhe bophelong, / o nthute go itshoka.","Ditiro tse di go kgatlhang, / a ke di dire tsotlhe. / Lefoko le le phedisang a ko o le mpolokele. / Mme 'thuto tse di sokameng, / fa di bonala mo kerkeng, / Morena, o di senye.","Mme mo tseleng e e siameng / mpoloke mo go yona; / ke se nne yo o fapogang, / ke fitlhe kwa go wena; / sebaka sotlhe lefatsheng / ke se nne tshiamololong, / ke go phelele ruri.","Fa ke tshwanetse bofelong / go tloga 'fatsheng leno, / o nnee go swela tumelong / le ka boitumelo. / Mpoloke gona mo phupung, / o ntshole boitshwarelong / ka Jesu Kriste. Amen."]},
{n:193,t:"Ke mang yo o ka ganelang",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Ke mang yo o ka ganelang / le Kgosi e e busang? / Ke mang yo o tlhaloganyang, / ka fa e atlholang?","Gape ke mang yo o ka fenyang / 'fatsheng le 'godimong / Mothatayotlhe yo o laolang / tse tsotlhe bophelong?","Ga go na thata mo bathong, / ba tshwana le bojang / jo bo swabang mo mogoteng, / jo bo omelelang.","A ke nne yo o boifang / Modimo o o busang, / ka e le o o nonofileng / go ntsenya moleteng."]},
{n:194,t:"Jehofa o mogolo jang",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Jehofa o mogolo jang / 'fatsheng le 'godimong! / Ke ena re mo ikanyang / go ya le kwa losong.","Ke ena yo re bopileng, / yo o re phedisang; / ke ena yo o re jesang, / yo o re bolokang.","Ke ena yo re tlamelang / ka gale bophelong; / ke ena yo re femelang, / o re ntsha tatlhegong.","Re tshwana fela le bojang / jo bo thunyang mosong, / jo bo segwang, jo bo swabang; / ke jo bo nyelelang."]},
{n:195,t:"Modimo, o kgalalelong",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Modimo, o kgalalelong / bonnong jwa gago 'godimong; / o dira ka fa o ratang, / ke mang yo o ka go botsang?","Ke wena yo re thusitseng / ka metlha e e fetileng; / ka moo re ba go ikanyang / ka metlha yotlhe e e tlang.","O re femela ledimong, / o botshabelo poitshegong; / ga go na ope yo o senyang / ba gago ba o ba disang."]},
{n:196,t:"Jehofa ke Morena",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Jehofa ke Morena / yo o re bopileng; / re dule mo go ena, / a re mo lebogeng! / Ke Rara wa bophelo / jo re bo neilweng. / Melomo le dipelo, / mo itumeleleng.","Ke ena yo mogolo / yo o re rometseng / Lefoko la botshelo, / go re ntsha mo dibeng. / Tlaang, batho, lo dumele, / lo tsene phologong. / Amogelang ka pele / tse di tswang Modimong.","Morena wa lorato / yo o re ratileng, / yo o tlosang melato, / a re mo ineeleng! / Ke ena yo o thata, / yo o re thusitseng. / Tlaang lo mo atamele, / a re tlhabologeng!"]},
{n:197,t:"Tswang, bagaetsho, malapeng",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Tswang, bagaetsho, malapeng / go ya go bona kwa nageng / dithunya tsa Modimo; / ke tsona tse di kgabileng, / mme a re di itumelleng, / ka di le dintle thata.","Ditlhare ke tse di tlhogang, / mme mmu ke o o aparang / botala fela gotlhe; / dišeše di ntse dintle jang, / go phala ene Salomo / kgalalelong ya gagwe!","Lephoi le tswa sentlhageng, / le sianela kwa sekgweng / go batla dijo gona; / dibota tse di mo thabong / di tlatsa di le kopelong / dinaga ka difela.","Dikgomo tse di mafulong / a matalana fa nokeng / di thusegile ruri; / di lela di le kopanong / le dinku tse di thabileng, / di a leboga jalo.","Dijwalo tse di masimong / di gola thata teng jaanong, / di lebogisa batho: / go lebogela lobokong / Morena yo o legodimong / dithuso tsa 'gwe tsotlhe.","Ditiro tsa Motlhodi, Mong, / di ntlhotlheletsa mo pelong / go mmaka ka difela; / di tsoga gona mo pelong, / ke mo opelela tebogong / ga mmogo le tse tsotlhe.","Fa ke gopola mo pelong / dineo tse re di filweng, / re sa le 'fatsheng leno — / go tla nna jang legodimong, / mo 'tlung e e galalelang / ya Morwa wa Modimo!","Ee, go utlwala pila jang / difela tse di opelwang / kwa tshimong ya ga Kriste, / kwa baengele ba isang / go ene Haleluya teng / ka mantswe a le mantsi!","Ao, ke ntse ke eletsa jang / go ya go ema fa troneng, / fa pele ga 'go, Jesu: / go nna yo o go opellang / dipsalome tse di kgatlhang / ka mantswe a baengele!","Mme ka ke sa le lefatsheng, / ke ise ke goroge teng, / ke tla go baka mono: / ke tla go baka fa ke teng / le kwa ke yang go dira teng / ka pelo le molomo.","O ntire yo o go ratang, / o ntire yo o go ungwelang / maungo a tshwanelo; / o ntlhome gona mo tshimong / ya gago, mme ke nnele teng / sethunya sa 'go ruri."]},
{n:198,t:"Modimo, ka o le 'seding",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Modimo, ka o le 'seding, / bosigo ga bo teng; / o bona tsotlhe tse di teng, / le tse di lefifing.","O bona tsotlhe lefatsheng, / le tse re di dirang; / o itse tse re di buang, / le tse di akanngwang.","Ditiro tse re di dirang / di kwalwa mo bukeng. / Di tla senolwa tshekisong, / mogang o tla boang.","Morena, ke tla kwa o teng, / o ntebe loratong; / phimola dibe mo bukeng, / ntshwatole melatong.","A ko o nkgopole mo Kristeng, / o nkutlwe selelong; / a ko o nkgolole maketeng, / ke tsene kagisong."]},
{n:199,t:"Modimo ke o ratileng",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Modimo ke o ratileng / lefatshe le le mo dibeng: / Wa roma Jesu kwa bathong, / go ba golola mo losong.","Mme botlhe ba ba dumelang, / ga ba latlhege mo dibeng; / ke bona ba ba tla phelang / bophelo jo bo sa khutleng.","Tlotlang Modimo o o teng, / ga o tlhaele boreneng; / o intshetsa batho maleong, / ba tla nna nao mo pusong."]},
{n:200,t:"Yo o lebellang Modimo tota",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Yo o lebellang Modimo tota, / a o ikanya bophelong, / ka nnete o tla phela sentle, / le fa a le ditlalelong, / ka a agile lefikeng, / e seng ka gope motlhabeng.","Go thusa eng go ngongorega, / go thuso efe selelong? / A o ka kgona go belega / ka nosi tsotlhe bophelong? / Go rialo o godisa jang / tlalelo e e go tshwenyang!","Itshoke ka bopelotelele, / o thethebale mo pelong; / Modimo o pelotlhomogi, / ga go tse o sa di itseng. / Modimo o o re ratang / o itse tse re di tlhokang.","Ona o re itumedisa, / ka fa go batlegang kateng. / Fa rona re le boikanyo, / re se boitimokanyong, / re sa le ba o lebellang, / o thusa mo go makatsang.","Ditlalelong o se ka wa re: / \"Modimo o ntlogeletseng?\" / Se re: \"Modimo o na nabo / ba ba mo letlhogonolong!\" / Ga go itsiwe tse di tlang, / tse di ka ba dirafallang.","Ke tiro e botlhofo thata / mo Modimong o sa pallweng, / go diga yo e leng mohumi, / go tsenya yo tlhokang khumong. / Modimo o gakgamatsang / ke o digang, o godisang.","Rapela o o opelele, / tsamaya nao mo tseleng; / o dire o ntse o ikanya / lesego le tswang Modimong; / one ga se o tlogelang / motho yo o o ikanyang."]},
{n:201,t:"Modimo, se o se dirang",c:"Difela tsa Tumelo: Ka ga Modimo Rara",v:["Modimo, se o se dirang / se pila fela sotlhe. / O dira ka fa o ratang, / ke lebogela tsotlhe. / Mo theregong / le tlalelong / o itse go mphemela. / Ke tla go lebelela.","Modimo, se o se dirang / se siame, se ntshwanetse; / o ntsamaisa mo tseleng, / ga ke timele gope. / Yo o nthatang, / yo o nkgogang, / ke seatleng sa gago, / o tlosa ditlalelo.","Modimo, se o se dirang / le nna sea natefela, / o ngaka e e siameng, / e fa o ka ntshelela / tse di babang, / di galakang, / nka di nwa, mme ke tla re: / Di a thusa, ke setlhare.","Modimo, se o se dirang / ka sona oa mphedisa; / o ntshireletsa bosuleng, / ka moo kea go ineela; / mo lethabong / le botlhokong / go tla tla, go bonala / lorato lwa 'go sentle:","Modimo, se o se dirang / se tla nkgomotsa pila, / le fa go le ba ba ntshwenyang, / le gona fa ba nkila. / Mo bofelong / le mo losong, / tlalelo fa e khutla, / o tla mpha nametsego.","Modimo, se o se dirang / se pila, kea se rata. / Le fa ke tsena tlalelong, / ke atamela loso, / ke mo tiisong / le mabogong / a gago, wena Rara; / ke a go solofela."]},
{n:12,t:"Haleluya! A re bakeng",c:"Difela tsa Pako",v:["Haleluya! A re bakeng / Modimo o o sa khutleng / ka 'fela se se o tlotlang, / ka mowa o o lebogang:","Ke ona Kgosi e busang / le Rara yo o re ratang. / A tsotlhe tse di botshelong / di tsise pako Moreneng.","Leina le le boitshegang / ke lone le le opellwang / ke baengele kwa troneng / le baitshepi lefatsheng.","O busa kwa legodimong, / mme fela jalo mo bathong. / O gakgamisa ba ba humileng, / o thusa ba ba bodiding.","Balala ba ba palelwang / ke bone ba o ba tiisang. / E bile ba ba ikobang / ke bone o ba godisang.","Haleluya! A re bakeng / Modimo o o sa khutleng / ka 'fela se se lebogang / Morena yo o re busang."]}
];
var L=[{"t": "Thulaganyo ya Tirelo-Modimo", "b": [["r", "Ka Atfente / Ka Gale / Ka Dipogiso."]], "p": 1}, {"t": "(A) MAIKETLEETSO", "b": [], "p": 1}, {"t": "1. Matseno a Tirelo", "b": [["r", "Go ka opela khwaere gongwe go ka lediwa diletso, phuthego e ntse e didimetse ka mowa wa kobamelo. Ka go lela ga tshipi modiri o atamela aletara, a le nosi, gongwe ka \"procession\" ya ba ba tsayang karolo mo tirelong."], ["r", "Moruti o atamela aletara a ba a khubama fa pele ga yona, mme mothusi o baya thapelo. A ntse a lebile phuthego mothusi o bua a re:"], ["M", "Mo leineng la Rara le la Morwa le Moya o o Boitshepo. Amen."], ["M", "A re rapeleng:"], ["r", "Mothusi o fularela phuthego, a ba a khubama kwa ntle ga aletara. -- Phuthego yona e ka khubama gongwe e ka ema ka dinao gongwe e ka nna e ntse mo monnong."]]}, {"t": "2. Thapelo", "b": [["M", "Morena, ke tsene mo tempeleng ya gago e e itshepileng, gore ke tle ke reetse se O tla se buang le nna, Rara, wa me le Motlhodi wa me, Jesu Morena Morepholosi le Moya o o Boitshepo Moregomotsi bophelong le mo losong."], ["t", "Morena bula pelo ya me ka Moya o o Boitshepo wa Gago gore ke tle ke ithute ka lefoko la Gago la boitshepo go kopa boitshwarelo jwa maleo a me le go dumela mo go Jesu Kriste ke ntse ke sa phedile le ka ona motsi wa me wa go swa ke tle ke tswelele pele ka letsatsi le letsatsi mo boitshepisong. Utlwa thapelo ya me MORENA, o be o ntirele ka fa kopong eo ya me, ka Jesu Kriste. Amen."]]}, {"t": "3. Sefela", "b": [["r", "Phuthego e opela sefela e ntse mo mannong lefa e ka nna go ema ka dinao. Moruti ene a nanoge a ya go ema fa pele ga aletara a fularetse phuthego e ntse e opela."]]}, {"t": "(B) MATSENO", "b": [], "p": 1}, {"t": "1. Pesalome ya Matseno (Introitus)", "b": [["r", "Moruti o fularela aletara a lebile phuthego e eme ka dinao. Moruti o itsese pesalema ya letsatsi kana sebaka, mme e opelwe, phuthego e ntse e eme."], ["r", "a) Atfente"], ["P", "Ke tsholeletsa mowa wa me go wena, Morena, - Modimo wa me, ke a go ikanya. / O se ntese ka tlhajwa ke ditlhong, - a dira tsa me di se ntudueletse. / Ee, botlhe ba ba go lebelelang - ga ba kitla ba tlhajwa ke ditlhong. / Morena, o nkitsise tsela ya gago, - o nthute 'tselana tsa gago. [Pes. 25:1-4]"], ["r", "b) Moletlo wa Botsalo jwa Morena"], ["P", "Ngwana re mo tsaletswe, Morwa re mo neilwe; mme mo legetleng la gagwe go teng puso. - Mme o bidiwa Kgakgamalo / le Mogakolodi - le Modimo o bonatla / le Rara wa bosakhutleng, - Kgosi ya kagiso. [Jes. 9:6]"], ["r", "c) Ponatshego"], ["P", "Mafatshe a otlhe a go obamele, a go opelele, - a opelele leina la gago, wena Modimo! / Dudueletsang Modimo ka boitumelo, lona mafatshe otlhe! - Opelang segolo go tlotla leina la ona! [Pes. 66:4,1,2]"], ["r", "d) Dipogiso"], ["P", "Matlho a me a lebile Morena ka gale, - gonne o tla ntsha dinao tsa me mo letloeng. / Itshokololele go nna, o nkutlwele botlhoko, - gonne ke nosi, mme ke mohumanegi. / Ke tsholeletsa mowa wa me go wena, Morena. - Modimo wa me, ke a go ikanya. / O se ntese ka tlhajwa ke ditlhong, - a dira tsa me di se ntudueletse. [Pes. 25:15,16,1,2]"], ["r", "e) Beke ya Tidimalo"], ["P", "Morena, o se nne kgakala, wena thata ya me, - o akofele thusong ya me. / Nkgolole mo leganong la tau - le mo 'nakeng tsa ditshukudu! / Modimo wa me, Modimo wa me, - o ntlogeletseng? [Pes. 22:20,22,2]"], ["r", "f) Moletlo wa Tsogo ya Morena"], ["P", "Keresete o tsogile; lo batlelang yo phelang mo go ba ba suleng? Haleluya! - Gopolang se o n'a se lo bolella. Haleluya! / A re: Morwa-Motho o tshwanetse go bapolwa, Haleluya! - le go tsoga ka 'tsatsi la boraro. Haleluya! / O mo rwesitse tlhogo ka kgalalelo le tlotlo, - wa mo laodisa 'tiro tsa 'atla tsa gago. [Luka 24:5-7; Pes. 8:6,7]"], ["r", "g) Moletlo wa Tlhatlogo"], ["P", "Lona banna ba Galelea, lo emetseng lo leletse kwa legodimong? - Haleluya! / Jesu o tla boa fela jaaka lo mmonye a ya kwa legodimong. - Haleluya, Haleluya, Haleluya! / Lona merafe yotlhe, opang diatla! - Dudueletsang Modimo ka kopelo ya maipelo! [Dit. 1:11; Pes. 47:2]"], ["r", "h) Moletlo wa Pentekoste"], ["P", "Mme e tla re Mogomotsi a sena go tla, Haleluya! - yo ke tla lo mo romelang, a tswa go Rara, o tla supa ga me. Haleluya! / Mowa wa boammaaruri o tla lo gogela mo boammaaruring jotlhe. - O tla nkgalaletsa; gonne o tla tsaya ga me, a go lo bolella. [Joh. 15:26; 16:13,14]"], ["r", "i) Moletlo wa Trinitate"], ["P", "A go tlotlwe boraro jo bo boitshepo - le bongwefela jo bo sa kgaoganngweng. / A re bakeng re lebogeng Modimo wa magodimodimo ka gale - ka o bontshitse boitshwarelo jwa ona go rona."], ["r", "j) Disontaga 1-8 morago ga Trinitate"], ["P", "Morena, o Kgosi le Mothatayotlhe. - Tsotlhe di mo thateng ya gago. / Ga go ope yo ka ganelang le go rata ga gago; - gonne wena o dirile legodimo le lefatshe / le tsotlhe tse di mo go lona. - O Morena wa tse tsotlhe. / Go tshegofaditswe ba e leng ba tsamao ya tshiamo, - ba ba tsamayang mo molaong wa Morena. [Neh. 9:6; Pes. 119:1]"], ["r", "k) Disontaga 9-16 morago ga Trinitate"], ["P", "Tlaang a re obameleng re iname, - a re khubameng fa pele ga Morena, / Mmopi wa rona; - gonne ke ene Modimo wa rona. / Tlaang a re opeleleng Morena - a re dudueletseng ka boitumelo 'fika la poloko ya rona! [Pes. 95:6,7,1]"], ["r", "l) Disontaga 17-24 morago ga Trinitate"], ["P", "Morena, utlwa lentswe la me, mogang ke bitsang! Haleluya! - E re fa Morena a re: Batlang sefatlhego sa me; Haleluya! / pelo ya me e a re: Ke batla sefatlhego sa gago. Haleluya! - O se ntshubele sefatlhego sa gago! Haleluya! / Morena ke lesedi la me le poloko ya me. - Ke tla boifa mang? [Pes. 27:7-9,1]"], ["r", "m) Disontaga tsa Bokhutlo jwa Ngwaga wa Kereke"], ["P", "Morena ke thata ya batho ba gagwe, - mme ena ke thata e e bolokang Motlodiwa wa gagwe. / Morena, boloka batho ba gago, - o tshegofatse boswa jwa gago. / O ba fudise, - mme o ba godise ka bosenabokhutlo. / Ke goela go wena, Morena! - 'Fika la me, o se ntidimalele, / gore e se re fa o ntidimaletse, - ka tshwana le bona ba ba fologelang mo bobipong. [Pes. 28:8,9,1]"]]}, {"t": "2. Gloria Patri", "b": [["P", "A go tlotlwe Rara le Morwa\nle Moya o Boitshepo,\njaaka go le mo tshimologong\nle jaanong la ka gale le ka\nbosena-bokhutlo jotlhe. Amen."]]}, {"t": "3. Go kopa boitshwarelo", "b": [["r", "Moruti o tla raya phuthego a re:"], ["M", "Baratwi, mo Moreneng, a re atameleng ka pelo ya mmannete, re ipobolela Modimo, Rraarona, maleo a rona, re be re mo rapele ka leina la ga Jesu Kriste, MORENA, go re naya boitshwarelo."], ["r", "Moruti o khubama fa pele ga aletara, phuthego yona e ka nna e eme ka dinao gongwe e ka nna e khubame le fa e le go nna mo mannong."], ["r", "Moruti le phuthego ba tswelela ka go rapela nngwe ya dithapelo tse di latelang:"], ["M", "Morena, Mong-wa-thata-yotlhe, Motlhodi wa rona le morepholosi, re le baleofi ba ba tlhomolang pelo, re a ipobola re re: Re batho ba boleo, re tletse sebe, mme re go leofetse ka megopolo le ka mafoko le ka ditiro. Ga re itse botshabelo bope fa e se bopelotlhomogi jwa gago jo bo se nang bokhutlo; re kopa gore o re tshole ka boitshwarelo ka ntlha ya ga Jesu Kriste, Morena wa rona. Amen."], ["M", "Modimo, o ntlhomogele pelo ka ntlha ya lorato lwa gago lo lo sa feleng, mme o phimole ditlolo tsa me ka fa boutlwelongbotlhoko jo bogolo jwa gago. Ntlhapise sentle, o tlose tshiamololo ya me. Ditlolo tsa me ke a di itse, boleo jwa me bo fa pele ga me ka kgale.\nKe leofetse wena o le nosi, ka dira se mo matlhong a gago se leng bosula. Bophelo jotlhe jwa me bo tletse boleo go tloga ka go tsalwa ga me, go tloga ka bonyana jwa me. O natefelwa ke boammaaruri le nnete.\nTlosa boleo jwa me gore ke itsheke; ntlhapise ke nne mosweu jaaka semathana. Mpusetse boitumelo le thabo, mme marapo a o a robileng a tla duduetsa. Modimo, mpopele pelo e e itshekileng, o ntšhafatse mowa wa tlhomamo mo teng ga me. O se ke wa ntatlha fa pele ga sefatlhego sa gago; se tlose Moya oo boitshepo wa gago mo go nna. Mpusetse boitumelo jwa pholoso ya gago, o be o nthatise thato ya gago. Amen."], ["M", "Morena, Mong-wa-thata-yotlhe, Motlhodi wa rona le Morepholosi, re le baleofi ba ba tlhomolang pelo, re ipobola re a re: Re batho ba boleo, re go leofetse, e seng ka megopolo le ka mafoko le ka ditiro fela, mme bogolo re setse re amogetswe mo dibeng ra ba ra tsalelwa mo go tsona. Ka moo popego yotlhe ya rona e latlhegile fa pele ga tshiamo ya gago. Mme re tshabela boitshwarelong jwa gago jo bo se nang tekano le go iphitlha mo go jona. Morena, re itshwarele, re tshole ka bopelotlhomogi, ka ntlha ya ga Jesu Keresete, Morena wa rona. Amen."], ["M", "Modimo, Mong-wa-thata-yotlhe o o bopelonomi o lo tlhomogetse pelo, o lo neile Morwa-ona yo o esi gore a swele dibe tsa lona, o lo itshwaretse mo leineng la gagwe. Bona botlhe ba ba dumelang mo leineng la gagwe o ba neile maatla gore ba nne bana ba Modimo, o ba solofeditse Mowa o o Boitshepo. Yo o dumelang a ba a kolobediwa o tla pholosiwa. [Mar. 16:16] Re thuse jalo Morena. Amen."]]}, {"t": "4. Kyrie eleison", "b": [["r", "Thapelo e khutlisiwe ka go opela jaana:"], ["M", "Morena,"], ["P", "re tlhomogele pelo."], ["M", "Kriste,"], ["P", "re tlhomogele pelo."], ["M", "Morena,"], ["P", "re tlhomogele pelo."]]}, {"t": "5. Go gololwa", "b": [["r", "Moruti o ya mo aletareng, a retologe a lebe phuthego, a tsholeditse mabogo a gagwe ka bobedi jwa ona. A be a itsise mongwe wa melaetsa ya boitshwarelo e e latelang, mme a simolole molaetsa ka go bua a re:"], ["M", "Ba ba ipobolang ka tumelo le ka pelo e e kgobegileng ke ba lebisa Lefoko la Boitshwarelo ka re: (a tlhophe nngwe ya tse di latelang)."], ["M", "(a) A Modimo Mothatayotlhe, wa mautlwelobotlhoko o lo neele boitshwarelo le kgololo mo maleong a otlhe a lona, o be o lo neele sebaka sa go tlhabologa le kgomotso ka Moya o o Boitshepo."], ["M", "(b) Fa re ipobola maleo a rona, Modimo o boikanyo le tshiamo go re itshwarela maleo le go re itshekisa tshiamololo yotlhe."], ["M", "(c) Nanogang ka kagiso; maleo a lona a itshwaretswe, mme lo se tlhole lo leofa."], ["r", "Phuthego e opela e eme ka dinao e re: Amen."]]}, {"t": "6. Gloria in excelsis", "b": [["r", "Fa phuthego e sa ntse e eme ka dinao Moruti o tla retologela aletareng, a tsholeditse mabogo a gagwe, a opele jaana:"], ["r", "Ka meletlo wa Atfente le Botsala jwa Morena e opelwa ka mokgwa o o latelang."], ["M", "Kajeno a re opeleng,"], ["P", "'ga Jesu Kriste yo tsileng,"], ["M", "nameng ya rona le mading,"], ["P", "go re ntsha rotlhe mo dibeng."], ["M", "Jesu Moratwi tsena teng,"], ["P", "pelong tsa rona tse di reng,"], ["P", "ao Jesu, Jesu tsena!"], ["M", "Bakang Morena godimong!"], ["P", "Go boitshepo Rara,\ngo boitshepo Morwa,\ngo boitshepo Mowa.\nGo bakwe Ene yo o tlang,\n'ineng la Morena.\nHosiana kwa godimong."], ["r", "Ka gale e opelwa jaana:"], ["M", "Tlotlo a e nne ya Modimo kwa godimo"], ["P", "Kagiso e 'nne mo fatsheng le natefo mo bathong"], ["P", "A go tlotliwe godimong\nModimo o' le nosi\nO re lebile tsalanong,\no a re itshwarela.\nModimo ke o re ratang.\nKagiso e re e bonang\ne tlosa ditlhabano."], ["r", "ka sebaka sa dipogiso;"], ["M", "Kriste ruri o ratile phuthego!"], ["P", "Ao, Kwana ya Modimo,\nyo o se nang molato;\no itshokile gotlhe,\nmme o tlhabetswe batho.\nO rwele dibe tsotlhe,\nre tle re phele rothe.\nO re fe kagiso, ao Jesu."]]}, {"t": "7. Tumedisanyo", "b": [["r", "Moruti o tla ema a lebile phuthego, a tsholeditse mabogo ka tsela ya tshegofatso, a opela a re:"], ["M", "A Morena a nne le lona"], ["P", "A nne le moya wa gago"]]}, {"t": "8. Thapelo ya Sebaka (Collect)", "b": [["M", "A re rapeleng"], ["r", "M a lebe aletare a be a rapele thapelo ya sebaka."], ["r", "a) Ka gale, o ka e opela kana a e bua jaana:"], ["t", "Modimo wa bosakhutleng Mong wa thata yotlhe,\no busa gotlhe mo legodimong le mo lefatsheng.\nUtlwa dithapelo tsa phuthego ya gago e go obametse.\nO neele phuthego ya gago tsotlhe tsa botlhokwa tsa semowa\nO tiise badumedi le go oketsa palo ya bona\nO lekole balwetsi, o be o ba fodise\nTsosa ba ba sa kgathaleng le ba ba ikepileng\nBusa ba ba ikwatlhayang le ba ba weleng\nTlosa tse di kgoreletsang boammaruri\nNeela badumedi botlhe go nna pelo e le nngwe fela\ne le letsomane le le lengwe fela,\ngo tlotla le go galaletsa leina la gago la boitshepo\nka Jesu Kriste Morena wa rona. Amen"], ["r", "b) Sebaka sa Atfente le Botsalo jwa Morena"], ["M", "Morena, Modimo, Rara wa legodimo, re go lebogela boitshwarelo jwa gago le boutlwelo-botlhoko jo bogolo, ka o rometse Morwao yo o esi go tsena mo nameng ya rona, le ka o re thusitse ka ena mo maleong le mo losong lo lo sa khutleng. Mme re a go rapela, sedifatsa dipelo tsa rona ka Mowa o o Boitshepo, gore re go lebogele boitshwarelo jo jwa gago, re ikgomotse ka jona mo dithaelong tsotlhe, mme la bofelo re pholosiwe, ka ena Morwao Jesu Keresete, Morena wa rona. Amen."], ["r", "c) Sebaka sa Ponatshego"], ["M", "Modimo, Rraarona yo o kutlwelo-botlhoko, re a go leboga, ka o tlhabiseditse letsatsi la tshiamo ba ba agileng mo lefifing. Re go rapela ka ntlha ya molemo wa gago, a o ko o senye thata yotlhe ya lefifi mo dipelong tsa rona, gore re nne re gole kitsong ya boammaaruri jwa gago, re go direle mo tshiamong le mo boitshepong, ka Jesu Keresete Morwao yo o rategang, Morena wa rona. Amen."], ["r", "d) Sebaka sa Dipogiso"], ["M", "Modimo o o boitshwarelo, o o pelontle, wena yo o rwesitseng Morwao yo o esi maleo a lefatshe, wa mo tlhaba mo legonnye la sefapaano go nna tefo ya molato wa rona. Thusa gore re se tlhole re lebala se re se diretsweng ka bopelontle jwa gago, ka ena Morwao Jesu Keresete, Morena wa rona. Amen."], ["r", "e) Sebaka sa Tsogo ya Morena"], ["M", "Modimo, Mothatayotlhe, wena yo o nyeleditseng boleo le loso ka loso lwa ga Morwao, wa ba wa busa bosenamolato le botshelo jo bo sa khutleng ka tsogo ya gagwe, gore re tshele mo pusong ya gago, re sena go gololwa mo thateng ya ga Satane, re thuse gore re dumele jalo ka pelo yotlhe, re go bake ka metlha yotlhe ka tumelo e e ntseng jalo ya tlhomamo, re go leboge ka Jesu Keresete, Morena wa rona. Amen."], ["r", "f) Sebaka sa Trinitate"], ["M", "Morena, Mothatayotlhe, Modimo, wena yo o leng Mofemedi wa botlhe ba ba go solofetseng, yo go se nang motho ope yo o ka dirang sengwe kwa ntle ga boitshwarelo jwa gago, re nee boutlwelo-botlhoko jwa gago segolo, gore ka thuso ya gago re gopole se se siameng re be re se dire ka thata ya gago, ka ntlha ya ga Jesu Keresete, Morena wa rona. Amen."]]}, {"t": "(C) GO UTLWATSA LEFOKO LA MODIMO", "b": [], "p": 1}, {"t": "1. Epistole", "b": [["r", "Phuthego e ka nna mo mannong gongwe e eme ka dinao."], ["r", "Go buisa yo o tlhophilweng ka letsatsi leo, ebile a ipaakanyeditse go bala."], ["r", "Mmuisi a simolle jaana: Epistole e e laoletsweng letsatsi le ...(leina la Sontaga) e kwadilwe mo .... (Go bolelwe lekwalo le kgaolo le ditemana), mme e balega jaana:\nFa a fetsa a re: Amen."], ["r", "M a khutlise puiso a re:"], ["M", "Go sego ba ba utlwang Lefoko la Modimo ba le boloke."], ["P", "Amen. [Luka 11:28]"]]}, {"t": "2. Halejuja", "b": [["M", "Re a go leboga Morena"], ["r", "(a) Ka sebaka sa Atfente e opelwa jaana:"], ["P", "Atlhamisang dikgoro,\nLe godiseng mejako\nmo lefatsheng, Haleluya\nGore Kgosi ya tlotlo e tsene. Haleluya..\nHaleluya, Haleluya, Haleluya...."], ["r", "(b) Ka gale e opelwa jaana:"], ["P", "Bakang Jehofa, merafe yotlhe,\nMmakeng lona batho botlhe,\nGonne boitshwarelo, le boammaaruri jwa gagwe,\nDi ka bosena-bokhutlo.\nHaleluya, Haleluya, Haleluya! [Pes. 117]"], ["r", "(c) Ka sebaka sa Dipogiso e opelwa jaana:"], ["P", "Kriste o na a utlwa, go ya mo losong,\nee loso lwa sefapaano.\nKe gona Modimo o mo godisitseng,\nwa mo naya leina le le fetang maina a otlhe.\nAmen, Amen."]]}, {"t": "3. Sefela sa beke", "b": [["r", "(se opelwa phuthego e ntse fatshe)."]]}, {"t": "4. Efangele", "b": [["r", "Phuthego e eme ka dinao. Mmuisi o itsise Efangele ka gore: [Efangele e e laoletsweng (leina la Sontaga) e bonwa mo (lekwalo, kgaolo, le ditemana)..\nMme fa a fetsa a re: Amen]"]]}, {"t": "5. Tebogo gongwe Poko", "b": [["r", "Moruti le phuthego (ba opela ka bonya):"], ["M+P", "Re a go baka Kriste. Amen."], ["n", "Morago ka opelwa jaana:"], ["P", "E monate Efangele,\nE monate!\nE monate Efangele,\nE monate!\nKe kgale ke go raya kere e monate!\nKe kgale ke go raya kere e monate!\n\nPowerful is the Gospel,\nVery powerful!\nPowerful is the Gospel,\nVery powerful!\nI have already told you that it is very powerful!\nI have already told you that it is very powerful!"]]}, {"t": "6. Tumelo ya baaposetolo", "b": [["r", "Phuthego e tla ipolela tumelo ka go bua gongwe ka go opela , e eme ka dinao."], ["r", "Ka sebaka sa Atfente go ka opelwa sefela 165 mo kopelong."], ["r", "(a) Ka gale e ka opelwa jaana"], ["P", "Ke a dumela mo Modimong Rara, Mothata yotlhe.\nMotlhodi wa legodimo le wa lefatshe."], ["P", "Ke a dumela mo go Jesu Krisete,\nMorwa Modimo yo o tsetsweng a le esi, Morena wa rona\nyo amogetsweng mo go Mowa wa Boitshepo\nyo o tsetsweng ke Maria wa lekgarebe\nyo bogisitsweng ke Pontio Pilato\nyo bapotsweng mo sefapaanong\na swa, a fitlhwa, a fologela kwa bobipong\nyo tsogileng mo baswing ka tsatsi la boraro\na tlhatlogela kwa legodimong\nyo o ntseng ka fa seatleng se se siameng sa Modimo Rara Mothata-yotlhe\nyo tla beng a tla go atlhola batshedi le baswi"], ["P", "Ke a dumela mo go Mowa o o Boitshepo\nLe Ekelesia e boitshepo, le phuthego ya baitshepi,\nLe boitshwarelo jwa dibe\nLe tsogo ya mmele le botshelo jo bo sa khutleng, Amen."], ["r", "(b) Ka molodi wa bašha e opelwa jaana:"], ["ch", "M: Ke a dumela.\nP: Ke a dumela mo go Rara, Morwa le Moya o o Boitshepo\nM: Ke a dumela\nP: Ke a dumela o nthuse tumelong ya me e tlhaelang."], ["M", "Ke dumela mo go Modimo Rara,"], ["P", "Ke a dumela"], ["M", "Mong wa thata yotlhe."], ["P", "Ke a dumela"], ["M", "Motlhodi wa legodimo le lefatshe."], ["P", "Ke a dumela"], ["r", "Chorus..."], ["M", "Ke dumela mo go Jesu Kriste"], ["P", "Ke a dumela"], ["M", "Morwa esi wa Modimo"], ["P", "Ke a dumela"], ["M", "Morena wa rona"], ["P", "Ke a dumela"], ["M", "Yoo amogetsweng mo go mowa o Boitshepo"], ["P", "Ke a dumela"], ["M", "A tsalwa ke Maria wa lekgarebe"], ["P", "Ke a dumela"], ["M", "A bogisiwa metlheng ya ga Pontio Pilato"], ["P", "Ke a dumela"], ["M", "A bapolelwa mo sefapaanong"], ["P", "Ke a dumela"], ["M", "A swa, a fitlhwa, a fologela kwa bobipong"], ["P", "Ke a dumela"], ["M", "A tsoga mo baswing ka tsatsi la boraro"], ["P", "Ke a dumela"], ["M", "A tlhatlogela kwa legodimong"], ["P", "Ke a dumela"], ["M", "O ntse ka fa letsogong le le jang la Modimo Rara Mong wa thata yotlhe"], ["P", "Ke a dumela"], ["M", "Mme o tla ba a tla go atlhola batshedi le baswi"], ["P", "Ke a dumela"], ["r", "Chorus..."], ["M", "Ke dumela mo go Mowa o o Boitshepo"], ["P", "Ke a dumela"], ["M", "Le kereke ya gotlhe ya boitshepo ya bakriste"], ["P", "Ke a dumela"], ["M", "Le kabelano ya baitshepi"], ["P", "Ke a dumela"], ["M", "Le boitshwarelo jwa dibe"], ["P", "Ke a dumela"], ["M", "Le tsogo ya mmele le botshelo jo bo sa khutleng"], ["P", "Ke a dumela"], ["ch", "M: Ke a dumela.\nP: Ke a dumela mo go Rara, Morwa le Moya o o Boitshepo\nM: Ke a dumela\nP: Ke a dumela o nthuse tumelong ya me e tlhaelang."], ["r", "(c) Ka sebaka sa dipogiso e ipolelwa ka go bua jaana:"], ["P", "Ke dumela mo go Modimo Rara,\nMong wa thata yotlhe,\nMotlhodi wa legodimo le lefatshe."], ["P", "Ke dumela mo go Jesu Kreste,\nMorwa esi wa Modimo,\nMorena wa rona.\nYoo amogetsweng mo go mowa o Boitshepo ,\nA tsalwa ke Maria wa lekgarebe,\nA bogisiwa metlheng ya ga Pontio Pilato,\nA bapolelwa mo sefapaanong,\nA swa, a fitlhwa, a fologela kwa bobipong,\nA tsoga mo baswing ka tsatsi la boraro,\nA tlhatlogela kwa legodimong.\nO ntse ka fa letsogong le le jang la Modimo Rara Mong wa thata yotlhe,\nMme o tla ba a tla go atlhola batshedi le baswi."], ["P", "Ke dumela mo go Mowa o o Boitshepo\nLe kereke ya gotlhe ya boitshepo ya bakriste,\nLe kabelano ya baitshepi,\nLe boitshwarelo jwa dibe,\nLe tsogo ya mmele le botshelo jo bo sa khutleng. Amen."]]}, {"t": "Maipolelo a Nitsea (Nicene Creed)", "b": [["P", "Ke dumela mo go Modimo Rara o o esi, Mong-wa-thata-yotlhe, yo o tlhodileng legodimo le lefatshe, tsotlhe tse di bonwang le tse di sa bonweng."], ["P", "Ke dumela mo go Morena yo o esi Jesu Keresete, Morwa esi wa Modimo, yo o tsetsweng ke Rara pele ga tlholego. Ke Modimo, o tswa Modimong. Ke Lesedi, o tswa Leseding. Ke Modimo wa boammaaruri. O tsetswe, ga a tlholwa; o bongwefela le Rara, mme dilo tsotlhe di tlhodilwe ka ene. O fologile kwa magodimong ka ntlha ya rona batho le ka ntlha ya pholoso ya rona, a tlholega mmele ka Mowa o o Boitshepo mo go Maria wa lekgarebe, a nna motho. A bapolelwa sefapaanong ka ntlha ya rona metlheng ya ga Pontio Pilato, a boga, a ba a fitlhwa. Mme o tsogile ka letsatsi la boraro ka fa Dikwalong, o bile o tlhatlogetse kwa magodimong, o ntse ka fa letsogong le le jang la ga Rara. O tla boa ka kgalalelo, a tlela go atlhola batshedi le baswi, mme bogosi jwa gagwe bo tla bo bosenabokhutlo."], ["P", "Ke dumela mo go Mowa o o Boitshepo o e leng Morena, o o tshedisang; o tswa mo go Rara le mo go Morwa, o obamelwa, o tlotliwa mmogo le Rara le Morwa, o buile ka baporofeti. Ke dumela gore go na le kereke e le nngwe fela e e boitshepo e e gotlhe ya baapostolo. Ke ipolela kolobetso e le nngwe fela ya go itshwarelwa dibe, ke lebeletse tsogo ya baswi le botshelo jwa tlholego e ntšhwa. Amen."]]}, {"t": "7. Dikitsiso", "b": [["r", "(Go buisiwe tse di kwadilweng mo bukeng ya dikitsiso)"], ["r", "8. Dikhwaere (Fa di le dintsi, tse dingwe di ka tswelela go opela morago ga thero)"]]}, {"t": "9. Sefela sa thero", "b": [["r", "Phuthego e ntse fa fatshe gongwe e eme ka dinao."]]}, {"t": "10. Thero", "b": [["r", "M o ka dumedisa phuthego ka lengwe la mafoko a a latelang, a ise a buise lefoko le thero."], ["M", "Bopelotlhomogi jwa Morena Jesu Keresete le lorato lwa Modimo le kabelanyo ya Mowa o o Boitshepo a di nne le lona lotlhe! Amen. [2 Bakor. 13:13]"], ["M", "A bopelotlhomogi bo nne le lona le kagiso tse di tswang go Modimo Rraaetsho le mo go Morena Jesu! Amen. [Baroma 1:7]"], ["r", "Ka letsatsi la Selalelo a thero e lebise phuthego go ikwatlhaya e latelwa ke thapelo e e lebanyeng boitshwarelo le lefoko la kgololo. Moreri a khutlise thero ka go re:"], ["M", "A kagiso ya Modimo e e fetang tlhaloganyo yotlhe e boloke dipelo tsa lona le maikutlo a lona ka Kriste Jesu. Amen. [Bafil. 4:7]"]]}, {"t": "11. Sefela sa Dikabelo (dineo)", "b": [["r", "Sefela seo se khutlisiwe ka go amogela sejana sa dineo. Moruti a be a fularela phuthego le go rapela thapelo e e khutshwane, a eme a tsholeditse sejana sa dineo."], ["r", "gongwe"], ["r", "Moruti le phuthego ba lebogela dikabelo ka go opela temana e e lebanyeng, moruti a ntse a tsholeditse sejana sa dineo."]]}, {"t": "12. Thapelo ya Kereke", "b": [["r", "Phuthego e eme. M o ka rapela ka mafoko a gagwe, a rapelela kereke (badiredi, diphuthego, thero ya Efangele, tiro ya thomo), lefatshe (mebuso, bagolo ba lefatshe, kagiso, dikole, dipatela), ba ba leng mo ditlalelong (balwetsi, bakeresete ba ba bogisediwang tumelo, ba ba mo khutsafalong, ba ba swang). Gongwe M o ka buisa thapelo e e latelang:"], ["M", "Modimo Mong-wa-thata yotlhe, o o leng teng ka dinako tsotlhe, Rara wa Morena wa rona Jesu Keresete, re lebogela Lefoko la gago le le boitshepo. Tsosa dipelo tsa rona ka lona, gore re le rate ka gale, re le utlwe re tsamae ka lone. Re bolokele Lefoko le Disakaramente tsa gago, gore phuthego ya gago e agiwe, e phuthiwe e be e tlhomamisiwe. Romela ka gale badiredi ba ba ikanyegang mo tirong ya gago gore ba rere Lefoko la gago ka bophepa le mokgwa o o utlwalang, disakaramente tsa gago di tsamaisiwe ka fa Morwao Jesu Keresete a di tlhomamisitseng ka teng, le gore ba nne le motsamao o o montle fa pele ga phuthego ya gago."], ["M", "Tshegofatsa Bišopo wa rona, baruti-bagolo le Khuduthamaga ya Kereke, o ba goge ka Mowa o o Boitshepo wa gago. Tshegofatsa le Seminare sa rona, barutisi le baithuti, gore go tswe mo go sone badiredi ba ba ikanyegang ba kereke ya gago. Boloka barongwa ba gago ba ba rerang Efangele fa gare ga merafe ya mafatshe otlhe, kgothatsa phuthego ya gago gore e tsweletse ditiro tsotlhe tse di molemo tsa lorato, e otle badiredi ba yone, e kgothalele go tshegetsa ditiro tsotlhe tsa kereke."], ["M", "Tshegofatsa thulaganyo ya lenyalo, boloka malapa a rona, go godisiwe bana ba ba utlwang mo go one. Tiisa ba ba ithutelang go kolobediwa gore ba iphaphe mo go tsotlhe tse di emalaneng le Lefoko la gago, ba ithute go itse wena Modimo o o esi le Jesu Keresete yo o mo romileng. Gopola bašha ba rona ba ba ithutelang tlhomamiso gore ba baakanyediwe go tsena mo selalelong se se boitshepo sa gago."], ["M", "Thusa bakaulengwe ba rona ba ba bogisediwang tumelo, ba tiise gore ba itshwarelele mo go wena go fitlha losong. Boloka lefatshe la rona, o le sireletse ka gale, re neele ka gale babusi ba ba go boifang, a go rene kagiso mo lefatsheng le gore merafe ya rona e agisanye sentle. Tshegofatsa ditiro tsa rona, re neele tse re di tlhokang mo bophelong jwa rona ka bopelotlhomogi jwa gago. Thusa, o gomotse botlhe ba ba lapileng le ba ba imelwang, baswelwa, batlholagadi le dikhutsana. Re utlwele botlhoko rotlhe, o re boloke le go re sireletsa mo go tsotlhe tse di bosula, dintwa, malwetse, tlala, loso lwa tshoganyetso, molelo, boemo jwa bosa jo bo maswe, le tse di ntseng jalo."], ["M", "Tshegofatsa ba ba atamelang mo selalelong se se boitshepo sa gago, o ba tiise mo tumelong, loratong le mo tsholofelong ya bophelo jo bo sa khutleng. Morena, re tlatse ka Mowa o o Boitshepo wa gago gore re dumele mo go wena. Mo bofelong fa nako ya loso lwa rona e tla, re utlwele botlhoko, o re tiise gore re tsene mo pusong ya gago e e sa khutleng ka Jesu Keresete, Morena wa rona. Re a go kopa, re re, \"Utlwa thapelo ya rona ka bopelotlhomogi jwa gago jo bo sa khutleng\". Amen."]]}, {"t": "(D) SELALELO SE SE BOITSHEPO", "b": [], "p": 1}, {"t": "1. Sefela sa Selalelo", "b": [["r", "Phuthego e ka nna mo mannong gongwe e ka ema ka dinao, moruti a ntse a baakanya di-tsa-selalelo fa aletareng."]]}, {"t": "2. Tumediso", "b": [["r", "Moruti o tla fularela aletara, a lebile phuthego. Phuthego e tla nanoga e eme ka dinao mme moruti le phuthego ba opele a a latelang ka thulaganyo ya teng."], ["M", "A Morena a nne le lona"], ["P", "A nne le Mowa wa gago"]]}, {"t": "3. Sursum Corda", "b": [["r", "Moruti a tsholetse mabogo go-sennyane, mme a opele, a lebile phuthego."], ["M", "Tlhatlosang dipelo!"], ["P", "Di gona kwa Moreneng"]]}, {"t": "4. Gratias", "b": [["M", "A re lebogeng Morena Modimo wa rona"], ["P", "Gonne go molemo, mme go siame"]]}, {"t": "5. Praefatio", "b": [["r", "Moruti a fularele phuthego, e lebile aletara mme e opela thapelo e tsholeditse mabogo go-sennyane:"], ["M", "E ruri ke tshwanelo le tshiamo go go leboga ka gale le ntlheng tsotlhe re be re go tumise, Morena, Rara yo o boitshepo, Mong wa thata yotlhe, Modimo wa gale. Ka Jesu Kreste Morena wa rona yo o tliseditseng batho thekololo ka go pegwa mo sefapaanong mme dithata tsotlhe di ka boifa ka ene. Ke gona re tumisang, re godisa leina la gago mmogo le baengele le balaodi ba bona mmogo le baagi botlhe ba legodimo, re opela re re:"]]}, {"t": "6. Sanctus", "b": [["P", "Go boitshepo, go boitshepo, go boitshepo Jehofa wa dintwa.\nLegodimo le lefatshe di tletse kgalalelo ya gagwe.\nHosiana kwa godimo.\nA go bakwe yo o tlang mo 'ineng la Morena.\nHosiana kwa godimo."]]}, {"t": "7. Thapelo ya Morena", "b": [["r", "Phuthego e ka khubama gongwe e ka nna mo mannong gongwe e ka ema ka dinao. Moruti o tla opela thapelo ya Morena a lebile kwa aletareng. Phuthego e araba ka Amen."], ["M", "Rraarona yo o kwa legodimong,\nleina la Gago a le itshepisiwe;\npuso ya Gago a e tle;\nthato ya Gago e diragale mo lefatsheng jaaka kwa legodimong;\nO re fe kajeno sejo sa rona sa letsatsi;\nO re itshwarele melato ya rona jaaka re itshwarele ba ba melato le rona;\nO se re gogele mo thaelong;\nmme O re golole mo bosuleng."], ["P", "Gonne bogosi ke jwa Gago le thata le kgalalelo ka bosakhutleng. Amen."]]}, {"t": "8. Mafoko a tlhomamiso", "b": [["r", "Phuthego e tla ema ka dinao. Moruti a tsholeletse mabogo godimonyana ga di-tsa-selalelo:"], ["M", "Jesu Kreste Morena wa rona o na tsaya senkgwe mo 'sigong jo a tshwarisitsweng ka jona, a se lebogela a se nathoganya, a se naya barutwa ba gagwe a re:\nTsayang, lo je! Se ke mmele wa me o o neelwang losong boemong jwa lona. Dirang jalo go nkgopola. A ba a tsaya senwelo jalo morago ga Selalelo, a se lebogela, a se ba neela a re:\nNwang lotlhe ka senwelo se; Ke kgolagano e ntšha mo mading a me, a a lo tshololelwang go itshwarela dibe. E ne e re fa lo a nwa lo dire jalo go nkgopola."], ["r", "(Mo mafelong \"mmele\" le \"mading\" moruti a dire sesupo sa sefapaano, a be a tsholetse senkgwe, le fa e ka nna senwelo.)"]]}, {"t": "9. Agnus Dei", "b": [["r", "Phuthego e tla opela e ntse e eme ka dinao:"], ["P", "Kreste Kwana ya Modimo yo o ntshang lefatshe dibeng, re tlhomogele pelo. (x2)\nKreste Kwana ya Modimo yo o ntshang lefatshe dibeng, o re fe kagiso. Amen."]]}, {"t": "10. Pax", "b": [["r", "Moruti a lebe phuthego a tshotse sejana sa senkgwe, a be a laletse phuthego ka go opela a re:"], ["M", "A kagiso ya Morena e nne le lona ka gale."]]}, {"t": "11. Go abelwa Selalelo", "b": [["r", "Bakopi ba atamele mme ba khubama fa aletareng ka ditlhophana. Phuthego e ba felegetsa ka go opela sefela se se lebanyeng. Moruti o tla abela senkgwe ka go re:"], ["M", "Tsayang lo je, se ke mmele ruri wa ga Jesu Keresete, o o neetsweng mo losong boemong jwa lona."], ["r", "E re setlhophana sotlhe se amogetse senkgwe o tla abela senwelo ka gore:"], ["M", "Tsholang lo nwe, se ke madi ruri a ga Jesu Keresete, Morena le Mogolodi wa rona, a lo a tshololetsweng go itshwarelwa dibe."], ["r", "E re setlhophana sotlhe se se na go amogela senkgwe le senwelo moruti o tla naya ba ba khubameng tsela ka go re:"], ["M", "Mmele le madi a ga Jesu Keresete, a di lo tiise, di lo boloke mo tumelong e e siameng go isa bophelong jo bo sa khutleng. Amen. Nanogang, lo tsamaye ka kagiso ya Morena. (Sesupo sa Sefapaano)."]]}, {"t": "(E) KHUTLISO", "b": [], "p": 1}, {"t": "1. Antifone", "b": [["r", "Moruti o tla tlhaola Antifone ya Sontaga."], ["M", "Lebogang Morena gonne o molemo. Haleluya."], ["P", "Gonne molemo wa gagwe o nna ka bosena bokhutlo. Haleluya."], ["r", "(Go ka opelwa le diantifone tse dingwe ka tsela eo.)"]]}, {"t": "2. Thapelo", "b": [["t", "(E rapelwa fela fa go ne go le Selalelo. Ka malatsi a sele, go tswelelwe ka tshegofatso.)\nKa thapelo e, phuthego e ka nna ya khubama gongwe e ka nna mo mannong gongwe e eme ka dinao."], ["M", "A re rapeleng"], ["t", "Re a go leboga Morena, Modimo, Mong-wa-dithata tsotlhe, ka o re lapolositse ka neo tse di pholosang. Re a go rapela ka ntlha ya mautlwelobotlhoko a magolo a gago gore di re tiise mo tumelong le go re tukisa mo go rataneng; ka Jesu Keresete, Morwa yo o rategang, Morena wa rona, yo o busang mmogo le Wena le Moya oo Boitshepo ka bosakhutleng. Amen."]]}, {"t": "3. Tumedisanyo", "b": [["M", "A Morena a nne le lona"], ["P", "A nne le moya wa gago"]]}, {"t": "4. Tshegofatso", "b": [["r", "Phuthego e eme ka dinao, mme Moruti a lebe phuthego a ba tsholeletse mabogo ka tsela ya go tshegofatsa, a be a bue gongwe a opele, a re:"], ["M", "A Morena a go tshegofatse a go boloke.\nA Morena a go phatsimisetse sefatlhego sa gagwe, a go itshwarele.\nA Morena a go tsholeletse sefatlhego sa gagwe, a go neele kagiso."], ["P", "Amen. Amen. Amen."]]}, {"t": "5. Sefela sa Khutliso", "b": [["r", "Phuthego e opela e eme ka dinao, le fa e ka nna ka go nna mo mannong. Ka temana ya bofelo Moruti o tla tlogela aletara ka iketlo, mme a khubama fa pele ga yona, a be a ithapelele ka setu, mme a ye kwa \"vestry\". Phuthego yona e inamise difatlhego, e rapele ka tidimalo, e be e tswe mo kerekeng ka iketlo."]]}, {"t": "Boipobolo: Thapelo ya Boipobolo", "b": [["r", "Tirelo ya Boipobolo e ka tshwarwa pele ga tirelo-Modimo ya Sontaga gongwe mo teng ga yone pele ga Selalelo sa Morena."], ["M", "A re khubameng re be re ipobole maleo a rona mo Modimong."], ["P", "Modimo Mong-wa-thata-yotlhe, Rara yo o kutlwelo-botlhoko, nna motho wa boleo yo o tlhomolang pelo ke go ipobolela maleo otlhe le ditshiamololo tsa me, tse ke go galefisitseng ka tsona. Ke tshwanetswe ruri ke petso ya gago ka ntlha ya tsona. Mme tsotlhe tseo di nkutlwisa botlhoko mo pelong, ke a di ikwatlhaela, le go inyatsa ka ntlha ya tsona. Jaanong ke go rapela ka ntlha ya boutlwelo-botlhoko jo bogolo jwa gago gore o ntlhomogele pelo, o be o intshwarele maleo otlhe. Ke kopa jalo ka ntlha ya dipogo tse di botlhoko tsa ga Morwao Jesu Keresete, Morena wa rona, le ka ntlha ya loso lwa gagwe lo lo boitshepo, a se na molato ope. Ke eletsa ruri go tlhabologa. Nthuse jalo! Amen."]]}, {"t": "Boipobolo: Dipotso le Kgololo", "b": [["M", "Ipoboleng, lo arabe fa pele ga Modimo: A lo a lemoga gore lo baleofi ba ba tlhomolang pelo ba ba latlhegileng le gore ga lo na tshiamo le molemo le tshwanelo? Fa go le jalo, arabang lo re: Ee."], ["P", "Ee."], ["M", "A lo ikwatlhaela maleo a lona, a lo eletsa go itshwarelwa ke Jesu Keresete yo o lo swetseng? Fa go le jalo, arabang lo re: Ee."], ["P", "Ee."], ["M", "A lo rata go siamisa botshelo jwa lona ka thata ya Mowa o o Boitshepo, go phela ka fa thatong ya Modimo? Fa go le jalo arabang lo re: Ee."], ["P", "Ee."], ["M", "A lo dumela fa boitshwarelo jwa dibe jo ke lo itshwarelang ka jona e le boitshwarelo jwa Modimo? Fa go le jalo arabang lo re: Ee."], ["P", "Ee."], ["M", "A go lo dirafalele ka fa lo dumelang ka teng. Mme ka lo ipobola jalo gore lo tletse boleo, le gore lo galefisitse Modimo ka maleo a lona, ka e bile lo eletsa kgomotso mo dithaelong tsa ga Satane, nna motlhanka wa Modimo, ke tlhomilwe go gomotsa baleofi, nna yo Keresete a ntaetseng a re, \"Le fa e bomang ba lo itshwarelang dibe tsa bone, ba di itshwaretswe, mme se lo se gololang mo lefatsheng se golotswe le kwa legodimong\". Ka tsholofetso e ya Modimo le ka taolo le mo boemong jwa one, 'Ke lo golola mo maleong otlhe a lona, mo leineng la Rara, le la Morwa, le la Mowa o o Boitshepo'. Amen."], ["r", "M a beye diatla mo go mongwe le mongwe a re:"], ["M", "Ke go golola mo maleong otlhe a gago mo leineng la Modimo Rara le la Morwa le la Mowa o o Boitshepo. Amen. Nanogang, lo tsamaeng ka kagiso, mme lo se tlhole lo leofa."]]}, {"t": "Boipobolo: Tebogo", "b": [["M", "Baka Morena, mowa wa me; le tsotlhe tse di mo teng ga me, bakang leina la gagwe le le boitshepo! Baka Morena, mowa wa me; se lebale sepe sa ditiro tse di molemo tsa gagwe! O itshwarela maleo a gago otlhe, o fodisa makoa a gago otlhe. O golola bophelo jwa gago mo tshenyegong, o go rwesa bopelotlhomogi le mautlwelo-botlhoko mo tlhogong. [Pes. 103:1-4]"], ["M", "A go tlotlwe Rara le Morwa le Mowa o o Boitshepo, jaaka go le mo tshimologong le jaanong le ka gale le ka bosena-bokhutlo. Amen."]]}, {"t": "Phitlho: Tirelo kwa gae gongwe mo kerekeng", "b": [["r", "Thulaganyo e, e dirisiwe mo mophutheging yo o tletseng. Moikepi ga a fitlhwe ka fa thulaganyong e. Go simololwe ka sefela."], ["M", "Mo leineng la Modimo Rara le la Morwa le la Mowa o o Boitshepo. Amen."], ["r", "M a tswelele ka nngwe ya ditemana tse di latelang:"], ["M", "a) Motho, ngwana wa mosadi, ke wa malatsi a se kae o kgora matshwenyego. O tlhoga jaaka sethunya, a ba a swaba; o tshaba jaaka moriti, ga a na tlhomamo. [Jobe 14:1-2]"], ["M", "b) Ga re a ka ra tsisa sepe mo lefatsheng, mme go bonala gore ga re ka ke ra ntsha sepe mo go lone. [1 Tim. 6:7]"], ["M", "c) Mono ga re na motse wa tlhomamo, mme re batla o o tlang. [Baheb. 13:14]"], ["M", "A re ikobeng fa tlase ga seatla se se maatla sa Modimo, re ikgopotseng fa lekesing gore loso ke eng, le gore le tlholegile jang, re rapele ka Lefoko la Modimo re re:"]]}, {"t": "Phitlho: Dipesalome", "b": [["r", "M a tswelele ka nngwe ya dipesalome tse di latelang."], ["M", "a) Morena, nkitsise bokhutlo jwa me, le selekanyo sa malatsi a me gore ke sefe, ke tle ke lemoge ka fa ke felang ka teng. Bona, o lekantse malatsi a me ka dikatlhamo tsa seatla; sebaka sa bophelo jwa me ga se sa sepe fa pele ga gago. Ee, motho mongwe le mongwe yo o leng teng ke wa lefelafela la mmatota. Ruri, motho o tsamaya jaaka moriti, ruri ba itlhobaeletsa boithamako; o kgobela mahumo, mme ga a itse gore a tla jewa ke mang. Mme jaanong, Morena, ke lebeletse eng? Tsholofelo ya me e mo go wena. Ke didimetse, ga ke tswe molomo; gonne go dirile wena. Tlosa petso ya gago mo go nna; ke nyelediwa ke titeo ya seatla sa gago. Fa o otlhaya motho ka dipetso ka ntlha ya tshiamololo, o nyeletse bontle jwa gagwe jaaka motoutwana; ee, motho mongwe le mongwe ke pudulo fela. Morena, utlwa thapelo ya me, o reetse go tlhaeletsa ga me; se didimalele dikeledi tsa me; gonne ke moeng fa go wena, ke mojaki jaaka borre botlhe. [Pes. 39:5-8,10-13]"], ["M", "A go tlotlwe Rara le Morwa le Mowa o o Boitshepo, jaaka go le mo tshimologong le jaanong le ka gale le ka bosena-bokhutlo. Amen."], ["M", "b) Morena, o ntse o le botshabelo jwa rona mo ditshikatshikeng. Pele dithaba di ise di tsalwe, o ise o tlhole lefatshe le lebopo, wena o ntse o le Modimo go tswa bosenang-tshimologo go ya bosakhutleng. O busetsa batho loroleng lwa mmu wa re: \"Boang, bana ba batho.\" Gonne dinyaga di le sekete, mo matlhong a gago di tshwana le letsatsi le le fetileng la maabane, di tshwana le tiso ya bosigo. O ba gogotse jaaka ka morwalela; ba ntse jaaka ba robetse. Mo mosong ba nne jaaka bojang jo bo tlhogang, jo bo thunyang mo mosong, bo gole, mme maitseboa bo segwe, bo omelele. Gonne re nyelela ka bogale jwa gago, re fediwa ka tshoganyetso ka kgakalo ya gago. O beile melato ya rona fa pele ga gago, le maleo a rona a a fitlhegileng o a beile mo leseding la sefatlhego sa gago. Gonne malatsi a rona otlhe a fetisiwa ke bogale jwa gago, dinyaga tsa rona di feta jaaka kgopolo. Bophelo jwa rona ke dinyaga di le masome a a supang, mme fa thata e le teng, bo ka nna dinyaga tse di masome a robedi; mme se segolo sa tsona ke tapisego le tshwenyego; gonne bo feta ka bonako, mme re fofela koo. Ke mang yo o lemogang bogolo jwa bogale jwa gago, le kgakalo ya gago, ka fa poitshegong ya gago? Re rute go bala malatsi a rona gore re tle re tlhalefe mo dipelong. [Pes. 90:1b-12]"], ["M", "A go tlotlwe Rara le Morwa le Mowa o o Boitshepo, jaaka go le mo tshimologong le jaanong le ka gale le ka bosena-bokhutlo. Amen."]]}, {"t": "Phitlho: Tshenolo, Thero le Thapelo", "b": [["M", "A re utlweng ditsholofetso tsa yo e leng tshimologo le bokhutlo."], ["M", "Ke ne ka bona legodimo le lešwa le lefatshe le lešwa gonne legodimo la ntlha le lefatshe la ntlha di fetile, le lewatle ga le tlhole le le teng. Ka ba ka bona motse o o boitshepo wa Jerusalema o mošwa o fologa kwa legodimong, o tswa kwa Modimong, o etleetsegile jaaka monyadwi yo o kgabetseng monna wa gagwe. Jaanong ka utlwa lentswe le legolo le tswa sedulong sa bogosi le re: \"Bona, boago jwa Modimo bo mo bathong! O tla aga nabo; bona ba tla nna batho ba one; mme Modimo ka osi o tla nna nabo. Modimo o tla phimola dikeledi tsotlhe mo matlhong a bone; loso ga lo ne lo tlhola lo nna teng, le bohutsana le selelo le botlhoko ga di ne di tlhola di nna teng; gonne dilo tsa ntlha di fetile.\" Yo o ntseng mo sedulong a bua a re: \"Bona, dilo tsotlhe ke a di ntšhwafatsa!\" Gape a re: \"Kwala! Gonne mafoko ao ke a boikanyo le boammaaruri.\" A ba a nthaya a re: \"Go diragetse. Ke nna Alefa le Omega, tshimologo le bokhutlo. Yo o nyorilweng ke tla mo nosa mo motsweding wa metsi a botshelo, e se ka sepe. Yo o fenyang o tla rua dilo tseo; ke tla nna Modimo wa gagwe, mme o tla nna morwaake. Mme fa e le ba ba boi le ba ba sa dumeleng le ba ba maswe le babolai le diaka le baloi le ba ba direlang medimo e sele le baaki botlhe, bone kabelo ya bone e mo letsheng le le tukang molelo le sebabole; gona moo ke loso lwa bobedi.\" [Tshen. 21:1-8]"], ["r", "Go opelwe sefela. M a rere. Thero e khutle ka thapelo."], ["M", "Morena Jesu Keresete, wena Modimo le Mogolodi wa rona, re go leboga ka o nyeleditse thata ya loso mme o re tlhagiseditse botshelo le bosasweng mo leseding. Re ntse re le mo kgolegong ya poifo ya loso mo botshelong jotlhe jwa rona, mme o re golotse mo go yona le mo dibeng ka e le wena Mofenyi wa loso, e bile o motswedi wa botshelo. Re thuse gore re ikopanye le wena mo tumelong gore mo losong re se nne nosi, mme re nne le wena. Gonne fa re na le wena, ga re boife loso le fa e le Satane. Re thuse mo malatsing a botshelo jwa rona gore re tshelele wena, re nne le wena le mo losong. Re go rapela gore o nne Mothusi wa rona mo tlhabanong ya rona ya bofelo gore re se latlhegelwe ke tumelo le poloko e e mo go wena. Mme fa re setse re palelwa ke go rapela, o re thuse ka Mowa wa gago o o Boitshepo gore e nne ona o o rapelelang mo bokoeng jwa rona. Ga re a tshwanelwa ke sepe fa e se ke petso fela. Mme le fa go ntse jalo re go kopa ka ntlha ya lorato lwa gago lo logolo le ka ntlha ya dipogo tse di botlhoko tsa Morena Jesu gore o re tsholele mo legodimong la gago gore re tle re bone boitumelo jo bo sa khutleng. Re go ikanya fa o tla re baakanya mo botshelong jwa rona gore ka letsatsi la loso lwa rona re tshwanele go tsena mo bogosing jwa legodimo mmogo le badumedi botlhe. Re go rapetse Modimo wa rona, o re utlwe ka ntlha ya lorato lo o re ratileng ka lona, mme o re thuse go gopola loso lwa rona gore re ipaakanye nako e sa le kwa pele. Amen."], ["r", "Go opelwe sefela."], ["M", "Jaanong a re iseng mmele wa moswi kwa boikhutsong ka tsholofelo ya tsogo e e itumedisang! Modimo Rra Jesu Keresete, Morena wa rona, Rara yo o mautlwelo-botlhoko, Modimo wa kgomotso yotlhe, o o re gomotsang mo dipitlaganong tsotlhe tsa rona, a o re gomotse ka thata ka Jesu Keresete. Amen. [2 Bakor. 1:3-4]"], ["r", "Go opelwe sefela 313."]]}, {"t": "Phitlho: Tirelo fa mabitleng", "b": [["M", "A go thuse Modimo Rara le Morwa le Mowa o o Boitshepo. Amen."], ["r", "Go opelwe sefela moswi a ntse a folosediwa mo lebitleng."], ["M", "Mmele o tshwanetse go boela mo mmung o o ntshitsweng mo go ona, mme mowa o boela mo Modimong o o o neileng. [Moreri 12:7] Morena wa rona Jesu Keresete a re: Ke nna tsogo le bophelo; yo o dumelang mo go nna o tla phela le fa a ka swa. [Joh. 11:25]"], ["M", "Go kgatlhile Modimo, Mong-wa-thata-yotlhe, go tlosa tsala ya rona mo bophelong jwa sebaka seno le go mmiletsa go ona kwa bosakhutleng. Ke gona re bayang mmele wa gagwe mo lebitleng ka tsholofelo ya gore Modimo o tla o tsosa."], ["r", "M a tshele mmu mo lebitleng ka seatla a re:"], ["M", "Mmu mo mmung! Molora mo moloreng! Lerole mo leroleng!"], ["r", "M a bue nngwe ya ditemana tse di latelang:"], ["M", "a) Morena Jesu Keresete o tla fetola mebele e e seng ya sepe ya rona gore e tshwane le mmele wa gagwe wa kgalalelo ka fa thateng e a nonofileng go ka tsenya tsotlhe mo taolong ya gagwe ka yona. Amen. [Bafil. 3:21]"], ["M", "b) Go jwalwa se se bolang, go tsosiwa se se sa boleng; go jwalwa se se tlotlologang, go tsosiwa se se galalelang; go jwalwa se se bokoa, go tsosiwa se se thata; go jwalwa mmele wa nama, go tsosiwa mmele wa mowa. Amen. [1 Bakor. 15:42-44]"], ["r", "Lebitla le tshelwe. Go opelwe difela lebitla le ntse le tshelelwa."], ["M", "Utlwang kgomotso ya Modimo."], ["M", "a) Jesu Keresete a re: Ke nna tsogo le bophelo; yo o dumelang mo go nna o tla phela, le fa a ka swa. Mongwe le mongwe yo o phelang, a dumela mo go nna, ga a ka ke a swa ka motlha ope. [Joh. 11:25-26]"], ["M", "b) Moaposetolo Paulo o kwadile a re: Ga go ope wa rona yo o itshelelang, e bile ga go ope yo o itshwelang; gonne fa re tshela, re tshelela Morena; fa re swa, re swela Morena; ka moo, le fa re tshela gongwe re swa, re ba Morena. [Baroma 14:7-9]"], ["M", "c) Jesu Keresete a re: Nako e e tla e botlhe ba ba mo diphupung ba tla utlwang lentswe la ga Morwa-Motho ka yona. Ba tla tswa, ba ba dirileng tse di molemo go ya tsogong ya bophelo, ba ba dirileng tse di bosula bone go ya tsogong ya katlholo. [Joh. 5:28-29]"], ["M", "d) Moaposetolo Paulo o kwadile a re: Go jwalwa se se bolang, go tsosiwa se se sa boleng; go jwalwa se se tlotlologang, go tsosiwa se se galalelang; go jwalwa se se bokoa, go tsosiwa se se thata; go jwalwa mmele wa nama, go tsosiwa mmele wa mowa. ... \"Loso lo meditswe ke phenyo. Loso, lobolela lo lo botlhole lwa gago lo kae? Felo ga baswi, phenyo ya gago e kae?\" ... Mme a Modimo o lebogwe o o re nayang phenyo ka Morena wa rona Jesu Keresete! [1 Bakor. 15:42-44,54-55,57]"], ["r", "Go ka rapelwa."], ["M", "A re rapeleng Thapelo ya Morena. (Bona Thapelo ya Morena mo Tirelong-Modimo.)"], ["M", "Amogelang tshegofatso ya Modimo. A Morena a go tshegofatse a go boloke. A Morena a go phatsimisetse sefatlhego sa gagwe a go itshwarele. A Morena a go tsholeletse sefatlhego sa gagwe a go neele kagiso. Amen. [Num. 6:24-26]"]]}, {"t": "Kolobetso ya Tlalelo", "b": [["r", "Fa motho yo o tlhabologang gongwe ngwana wa mophuthegi a le mo kotsing ya loso, go molemo fa moruti gongwe modiredi yo mongwe wa phuthego a bidiwa ka potlako gore a kolobetse motho yoo a ise a tlhokafale. Fa moruti gongwe modiredi yo mongwe a se teng, a kolobetso e dirwe ke mokeresete mongwe le mongwe, e ka nna mogolo wa ngwana gongwe mophuthegi yo mongwe. Go tlhokega go itsisiwe moruti wa phuthego kolobetso e."], ["r", "Ela tlhoko: Mo tlalelong e kgolo thata go lekanye fa mokolobetsi a tshela metsi gararo mo tlhogong ya mokolobediwa yo o leng gaufi le go neela mowa, a bua a re:"], ["M", "Mang mang [leina la mokolobediwa], ke go kolobetsa mo leineng la Modimo Rara le la Morwa le la Mowa o o Boitshepo. Amen."], ["r", "Kwa ntle ga moo a go latelwe thulaganyo e e latelang."], ["M", "Mokolobetsi: Barategi mo Moreneng wa rona Jesu Keresete! Ene Morena wa rona o laetse barutwa ba gagwe a re: \"Thata yotlhe ke e neilwe kwa legodimong le mo lefatsheng. Ka moo he, yang lo dire merafe yotlhe barutwa, lo ba kolobetse mo leineng la Rara le la Morwa le la Mowa o o Boitshepo, lo ba rute go tlhokomela tsotlhe tse ke di lo laetseng.\" [Math. 28:18-20] Mme o solofeditse a re: \"Yo o dumelang, a ba a kolobediwa, o tla pholosiwa; yo o sa dumeleng, ene o tla atlholwa.\" [Mar. 16:16] A re rapeleng Thapelo ya Morena!"], ["r", "a) Fa mokolobediwa e le ngwana"], ["M", "Mokolobetsi: Morena Modimo, Rara yo o kwa legodimong, o re laetse ka Morwao yo o rategang Jesu Keresete, gore re tsise bana ba rona kwa go wena, gore o ba tshegofatse, a o ko o re tlhomogele pelo rotlhe mo khutsafalong e, bogolo o tlhomogele ngwana yo pelo! A o ko o mo amogele ka bopelotlhomogi jwa gago, e nne wa gago, a feleletse a le wa gago, o mo itshwarele maleo otlhe, o mo dire ngwana wa bophelo jo bo sa khutleng ka ene Jesu Keresete, Morena wa rona. Amen."], ["r", "b) Fa mokolobediwa e le mogolo"], ["M", "Mokolobetsi: A o itatola Satane le ditiro tsa gagwe le mekgwa ya gagwe yotlhe? Fa go le jalo, araba o re: Ee."], ["P", "Mokolobediwa: Ee."], ["M", "Mokolobetsi: A o rata go kolobediwa mo tumelong ya bokeresete? Fa go le jalo, araba o re: Ee."], ["P", "Mokolobediwa: Ee."], ["M", "Mokolobetsi: A re ipoleleng tumelo ya bokeresete!"], ["P", "Ke dumela mo go Modimo Rara, Mong wa thata yotlhe, Motlhodi wa legodimo le lefatshe. Ke dumela mo go Jesu Keresete, Morwa esi wa Modimo, Morena wa rona, yo o amogetsweng mo go Mowa o o Boitshepo, a tsalwa ke Maria wa lekgarebe, a bogisiwa metlheng ya ga Pontio Pilato, a bapolelwa mo sefapaanong, a swa, a fitlhwa, a fologela kwa bobipong, a tsoga mo baswing ka letsatsi la boraro, a tlhatlogela kwa legodimong. O ntse ka fa letsogong le le jang la Modimo Rara, Mong wa thata yotlhe. Mme o tla ba a tla go atlhola batshedi le baswi. Ke dumela mo go Mowa o o Boitshepo, le kereke e e gotlhe e e boitshepo ya Bokeresete, le kabelano ya baitshepi, le boitshwarelo jwa dibe, le tsogo ya mmele, le botshelo jwa bosakhutleng. Amen."], ["r", "Mokolobetsi o tshela metsi gararo mo tlhogong ya mokolobediwa a re:"], ["M", "Mang mang [leina la mokolobediwa], ke go kolobetsa mo leineng la Modimo Rara le la Morwa le la Mowa o o Boitshepo. A kagiso e nne le wena! Amen."], ["r", "Mokolobetsi a rapele, a lebogele neo
